version: 1
status: target_architecture
program: CHLOM Open Infrastructure
principles:
  - local_first
  - open_first
  - provider_portable
  - proof_not_private_payload_on_public_anchors
  - paid_services_after_evidence
stages:
  - id: L0
    name: Workstation Laboratory
    phase: 3
    state: planned
    exit:
      - deterministic_event_canonicalization
      - sha256_digest
      - signature_verification
      - merkle_root_generation
      - evidence_bundle_roundtrip
      - local_postgres_persistence
  - id: L1
    name: Local Development Network
    phase: 3
    state: planned
    exit:
      - local_polkadot_sdk_node
      - anchor_adapter_contract_tests
      - no_paid_provider_required
  - id: L2
    name: Controlled Test Environment
    phase: 3
    state: planned
    exit:
      - encrypted_backups
      - secrets_management
      - observability
      - restore_drill
      - rate_limits
      - incident_runbook
  - id: L3
    name: External Anchor Pilots
    phase: 3
    state: planned
    exit:
      - polkadot_anchor_pilot
      - evm_anchor_pilot
      - portability_benchmark
      - cost_reliability_measurement
  - id: L4
    name: Redundant Production Infrastructure
    phase: 4
    state: future
    exit:
      - multi_provider_redundancy
      - provider_exit_test
      - multi_region_evidence
      - production_slo
  - id: L5
    name: Advanced CHLOM Runtime
    phase: 5
    state: future
    candidates:
      - chlom_assets
      - chlom_rights
      - chlom_licenses
      - chlom_provenance
      - chlom_authority
      - chlom_evidence
      - chlom_attestations
      - chlom_remedies
commercialization:
  lanes:
    - managed_chlom
    - verification_api
    - evidence_tooling
    - licensing_automation
    - compliance_workflows
    - developer_toolkit
    - deployment_templates
    - education_certification
    - support_services
    - sponsor_inventory
    - voluntary_project_support
  rule: upstream_license_obligations_must_be_preserved
