contract_id: ct.agent-f.chlom-doc-vote-packet.v1
originator:
  agent_id: ct.agent.f
  voting_status: non_voting
signer_rule:
  explicit_human_signer_required_for_override: true
  missing_signer_question: "Who is signing their name to this override?"
review:
  constitution: current_accepted_constitution
  exact_head_required: true
  originator_self_vote_allowed: false
  framework_subagent_transport_identities_non_voting: true
required_fields:
  - canonical_main_sha
  - exact_pr_head
  - source_ids
  - sources_read
  - sources_unavailable
  - factory_state
  - child_repo_federation_state
  - ip_classification
  - public_projection_state
  - fingerprint_did_vc_attestation_state
  - commercial_state
  - changed_records
  - unresolved_items
  - tests
  - risk
  - rollback_or_reopen
  - next_packet
results:
  supported_change: docs_updated
  no_safe_change: docs_no_change
  unresolved_change: docs_delta_opened
