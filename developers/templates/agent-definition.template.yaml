template_id: ct.template.agent-definition.v1
template_version: 1.0.0
record_type: scheduled_agent_definition

agent_id: ct.specialist.example
version: 1.0.0
name: Example Scheduled Specialist
owner: CrownThrive Operations
status: DESIGN
execution_form: scheduled
vote_eligible: false
canonical_roadmap_generation: ten_phase_v1
canonical_phase: "2.99"
phase_gate_scope: []
mission: "Replace with one bounded institutional mission."

parent_roles:
  - ct.relay.agent-a

execution:
  cadence: hourly
  minute_offset: null
  collision_key: null
  scheduler_slot_required: true
  next_handoff: ct.relay.agent-b
  current_truth_sources:
    - canonical_main
    - github_98_99_100
    - mintlify
    - phase_2_99_hard_exit

# This is an authority ceiling, not a grant to use every listed capability.
authority:
  maximum_class: D1
  production_read: true
  production_write: false
  destructive_action: false
  credential_rotation: false
  purchase_or_terms_acceptance: false
  phase_transition_authority: false

allowed_data_classes:
  - PUBLIC
  - INTERNAL
allowed_tools: []
allowed_actions:
  - inspect_current_state
  - prepare_evidence_packet
prohibited_actions:
  - sovereign_vote
  - expose_secret_or_credential_fingerprint
  - autonomous_provider_write
  - autonomous_credential_rotation
  - unknown_to_pass_without_evidence
  - waive_hard_gate

source_precedence:
  - current_runtime_evidence
  - accepted_machine_registry
  - adopted_policy_or_adr
  - current_first_party_documentation
  - historical_source
  - research_or_proposal

evidence_requirements:
  - exact_source_or_runtime_reference
  - current_vs_historical_state_separation
  - explicit_unknowns
  - affected_gate_mapping

stop_conditions:
  - evidence_missing_for_material_promotion
  - requested_action_exceeds_authority
  - secret_or_restricted_data_exposure_risk
  - unresolved_d3_decision

escalation_targets:
  - ct.relay.agent-b
  - ct.relay.agent-d
  - ct.relay.agent-s

evaluations:
  - source_fidelity
  - authority_boundary
  - secret_handling
  - unknown_state_preservation
  - refusal_and_escalation

output_contract: ct.contract.specialist-evidence-packet.v1
rollback_contract: "Revert bounded D0/D1 changes; preserve evidence and prior versions."
docs_impact: required
changelog_id: null
supersedes: null
effective_at: null

# Template files are public-safe source. Never place production credentials,
# provider secret material, restricted evidence bodies, private customer data,
# or reusable credential fingerprints in this definition.