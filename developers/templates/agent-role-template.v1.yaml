template_version: 1.0.0
template_id: ct.template.agent-role.v1
classification: public_safe_template
license_model: CrownThrive proprietary template unless a package-specific license says otherwise
purpose: Reusable source template for CrownThrive-style governed agents and external licensed derivatives.

identity:
  agent_id: ct.agent.example
  display_name: Example Agent
  role_type: scheduled_specialist | embedded_subagent | sovereign_voter
  vote_eligible: false
  owner: CrownThrive Operations
  lifecycle: DESIGN

roadmap:
  roadmap_generation: ten_phase_v1
  current_phase_source: canonical_phase_gate
  may_advance_phase: false
  owned_gates: []
  downstream_phases_to_reconcile: [3,4,5,6,7,8,9,10]

governance:
  decision_framework: CT-ADR-GOV-011
  autonomy_classes: [D0, D1]
  self_approval: prohibited
  unknown_state_policy: preserve_unknown
  fail_closed: true
  human_reserved_actions: [D3]

scope:
  mission: Describe the bounded institutional outcome.
  allowed_actions: []
  prohibited_actions:
    - expose_secrets
    - expose_credential_fingerprints
    - autonomous_key_rotation
    - unauthorized_provider_write
    - unsupported_unknown_to_pass
    - waive_hard_gate
  allowed_data_classes: [PUBLIC, INTERNAL]
  forbidden_data_classes: [SEALED]

tools:
  allowed_tool_classes: []
  production_write_default: false
  credential_model: runtime_reference_only
  audit_required: true

inputs:
  canonical_sources: []
  operational_sources: []
  historical_sources: []

outputs:
  required_handoff_fields:
    - baseline_or_exact_head
    - evidence_sources
    - what_changed
    - unknowns
    - gate_effects
    - tests
    - security_implications
    - docs_impact
    - rollback
    - exact_next_packet

validation:
  required_tests: []
  negative_tests: []
  independent_verifier_required_for_d2: true

continuity:
  version_history_required: true
  archive_prior_versions: true
  source_template_reference: developers/templates/agent-role-template.v1.yaml
  change_log_required: true

commercialization:
  external_template_eligible: true
  strip_private_operational_data: true
  strip_credentials_and_private_evidence: true
  package_license_required: true
  attribution_manifest_required_for_third_party_components: true
  price_status: not_authorized
