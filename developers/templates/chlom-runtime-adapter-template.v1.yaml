template_version: 1.0.0
template_id: ct.template.chlom-runtime-adapter.v1
classification: public_safe_research_template
purpose: Define a future decentralized, cryptographic or protocol-runtime adapter for a governed CHLOM capability without implying that the adapter, chain, token or runtime is deployed.

identity:
  adapter_id: ct.chlom.runtime-adapter.example
  name: Example Runtime Adapter
  version: 0.1.0
  lifecycle: RESEARCH
  production_deployed: false

relationship:
  capability_pallet_id: null
  component_ids: []
  institutional_contracts_preserved: []
  replaces_cloud_core: false

runtime:
  family: unselected
  network_or_runtime_id: null
  public_network: false
  testnet_or_sandbox: true
  token_required: false
  wallet_required: false
  smart_contract_or_runtime_module: null

security:
  threat_model_status: required
  key_custody_model: unresolved
  key_recovery_model: unresolved
  bridge_or_oracle_risk_review: required_if_applicable
  independent_security_review: required
  production_secret_in_public_code: prohibited

privacy:
  pii_on_public_immutable_ledger: prohibited
  restricted_evidence_on_public_immutable_ledger: prohibited
  public_anchor_content: hash_or_attestation_only_when_authorized
  erasure_and_correction_model: required

legal_and_economic:
  legal_review: required_before_controlled_pilot
  sanctions_kyc_aml_review: required_if_economic_or_transferable
  securities_analysis: required_if_token_or_investment_like
  tax_accounting_review: required_if_value_moves
  production_token_sale: prohibited_by_template
  money_transmission_authority_assumed: false

interoperability:
  api_contracts: []
  mcp_contracts: []
  event_contracts: []
  attestation_or_oracle_contracts: []
  portability_and_exit_plan: required

validation:
  testnet_or_sandbox_tests: []
  adversarial_tests: []
  rollback_or_disable_switch: required
  off_chain_reconstruction_test: required
  no_single_external_network_dependency: true

third_party_rights:
  attribution_manifest_required: true
  license_compatibility_required: true
  upstream_components: []

commercialization:
  licensable: research_candidate
  pricing_status: not_authorized
  stripe_product_id: null
  stripe_price_id: null
  checkout_enabled: false

phase_gates:
  earliest_activation_phase: 9
  phase_3_dependency: none_required_for_core_operation
  may_inherit_production_authority_from_research: false
  required_before_activation:
    - validated_problem_and_measurable_advantage
    - threat_model
    - legal_privacy_security_review
    - key_custody_and_recovery
    - rollback_and_provider_exit
    - interoperability_contract_certification
    - explicit_governed_activation_decision

continuity:
  archive_prior_versions: true
  changelog_required: true
  predecessor: null
  successor: null

rule: A runtime-adapter template is architecture only. It never proves a CrownThrive blockchain, token, wallet, DAO, smart contract, decentralized network, public anchor, money-transmission authority or compliant offering exists.
