name: ct.surface.shopmelaninmagic.production Surface Update Package Verify

on: push

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deno check
        run: deno check supabase/functions

