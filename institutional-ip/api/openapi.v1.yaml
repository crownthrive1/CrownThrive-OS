openapi: 3.1.0
info:
  title: CrownThrive Institutional IP Diligence API
  version: 1.0.0-preactivation
  description: Read-only and dry-run candidate API. It does not grant rights, determine patentability, issue an appraisal, activate commerce, write providers/databases, or create sovereign authority.
servers: []
paths:
  /v1/ip/assets/{asset_id}:
    get:
      operationId: getIpAssetCandidate
      x-crownthrive-authority-max: D1
      responses: {"200": {description: Public-safe candidate state}, "409": {description: HOLD}}
  /v1/ip/framework-factory/intake:preflight:
    post:
      operationId: preflightFrameworkFactoryIntake
      x-crownthrive-authority-max: D1
      x-crownthrive-write-effect: false
      responses: {"200": {description: Candidate intake result}, "409": {description: HOLD}}
  /v1/ip/chlom/rights:preflight:
    post:
      operationId: preflightChlomRightsReference
      x-crownthrive-authority-max: D2
      x-crownthrive-rights-grant-effect: false
      responses: {"200": {description: Rights-reference result}, "409": {description: HOLD}}
  /v1/ip/thriveevergreen/offer:preflight:
    post:
      operationId: preflightThriveEvergreenOffer
      x-crownthrive-authority-max: D2
      x-crownthrive-ecac-effect: false
      x-crownthrive-price-effect: false
      x-crownthrive-checkout-effect: false
      responses: {"200": {description: Eligibility for independent ThriveEvergreen review}, "409": {description: HOLD}}
  /v1/ip/valuation:scenario:
    post:
      operationId: runValuationScenario
      x-crownthrive-appraisal-effect: false
      responses: {"200": {description: Scenario only}, "409": {description: Missing or invalid evidence}}
  /v1/ip/release:preflight:
    post:
      operationId: preflightReleaseEvidence
      x-crownthrive-certification-effect: false
      responses: {"200": {description: Release evidence status}, "409": {description: HOLD}}
  /v1/ip/commercial-proof:classify:
    post:
      operationId: classifyCommercialProof
      x-crownthrive-price-effect: false
      x-crownthrive-revenue-invention: false
      responses: {"200": {description: Verified external proof stage}, "409": {description: HOLD}}
security: []
