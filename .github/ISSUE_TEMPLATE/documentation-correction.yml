name: Documentation correction 📚
description: Report a public-safe documentation error, stale statement, broken link, or evidence-backed correction.
title: "[Docs] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping keep CrownThrive's public institutional record accurate. Do not include credentials, private customer data, protected evidence, private contracts, payment details, or security-sensitive information.

  - type: input
    id: location
    attributes:
      label: Page or repository path
      description: Provide the public URL or repository path where the issue appears.
      placeholder: e.g. technology/phase-3-readiness-gate.mdx
    validations:
      required: true

  - type: dropdown
    id: correction_type
    attributes:
      label: Correction type
      options:
        - Current-state or status correction
        - Historical/source-context correction
        - Naming or terminology correction
        - Broken link or navigation issue
        - Accessibility or readability issue
        - Metric or evidence wording issue
        - Other public-safe documentation issue
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: What is wrong or stale?
      description: Quote only the minimum public-safe text needed to identify the issue.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Public-safe evidence or source
      description: Identify the current public source, commit, provider documentation, governing record, or other evidence that supports the correction. Do not paste secrets or restricted evidence.
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed correction
      description: Optional. Explain the correction or desired outcome without manufacturing unresolved facts.
    validations:
      required: false

  - type: checkboxes
    id: safety
    attributes:
      label: Public-safety confirmation
      options:
        - label: I confirm this issue contains no credentials, private personal data, protected evidence, private contracts, payment details, or exploit-enabling security information.
          required: true
        - label: I understand that a documentation correction does not independently establish production, legal, rights, economic, provider, or governance state.
          required: true
