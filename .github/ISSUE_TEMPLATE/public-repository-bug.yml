name: Public repository bug 🛠️
description: Report a reproducible public-safe repository, validator, navigation, or documentation-tooling defect.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Use this form only for public-safe defects. Security, privacy, credential, payment-integrity, or protected-evidence issues must follow SECURITY.md and must not be posted publicly.

  - type: input
    id: component
    attributes:
      label: Affected component
      description: Identify the public repository path, script, workflow, validator, docs route, or other component.
      placeholder: e.g. scripts/validate_docs.py
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Explain what happened using public-safe information.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Explain what you expected the public-safe repository behavior to be.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide the minimum safe steps needed to reproduce the defect. Never include secrets, private URLs, customer data, or exploit-enabling instructions.
    validations:
      required: true

  - type: input
    id: snapshot
    attributes:
      label: Commit or snapshot
      description: If known, provide the public commit SHA or branch where you observed the issue.
      placeholder: e.g. 038d2eb9ca86745dd425afa941e1318175f08382
    validations:
      required: false

  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I confirm this is appropriate for public disclosure and contains no credentials, private data, protected evidence, private contracts, payment details, or exploit-enabling security information.
          required: true
        - label: I have checked SECURITY.md and this is not a private security or privacy report.
          required: true
