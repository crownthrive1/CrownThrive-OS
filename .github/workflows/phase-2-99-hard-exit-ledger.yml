name: Phase 2.99 Hard Exit Ledger

on:
  pull_request:
    paths:
      - "developers/manifests/phase-2-99-hard-exit-ledger.v1.json"
      - "scripts/validate_phase_2_99_hard_exit_ledger.py"
      - "changelog/phase-2-99-hard-exit-closure-ledger.md"
      - ".github/workflows/phase-2-99-hard-exit-ledger.yml"
  push:
    branches:
      - main
    paths:
      - "developers/manifests/phase-2-99-hard-exit-ledger.v1.json"
      - "scripts/validate_phase_2_99_hard_exit_ledger.py"
      - "changelog/phase-2-99-hard-exit-closure-ledger.md"
      - ".github/workflows/phase-2-99-hard-exit-ledger.yml"

permissions:
  contents: read

jobs:
  validate-hard-exit-ledger:
    name: Validate Phase 2.99 hard-exit ledger
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Compile ledger validator
        run: python -m py_compile scripts/validate_phase_2_99_hard_exit_ledger.py
      - name: Run fail-closed ledger self-test
        run: python scripts/validate_phase_2_99_hard_exit_ledger.py --self-test
      - name: Validate current hard-exit ledger
        run: python scripts/validate_phase_2_99_hard_exit_ledger.py
      - name: Re-run documentation governance
        run: python scripts/validate_docs.py
      - name: Check whitespace and conflict markers
        run: |
          git diff --check
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!THIRD_PARTY_NOTICES.md'; then
            echo "Unresolved merge-conflict markers detected."
            exit 1
          fi
