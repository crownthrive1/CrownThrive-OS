name: Penta Deterministic Memory Release Candidate Certification

on:
  push:
    branches:
      - admin-mcp/pentadocs-pentacensus-deterministic-memory

permissions:
  contents: read

concurrency:
  group: penta-memory-release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify-release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Verify deterministic source and census
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            runtime/penta_deterministic_memory.py \
            tests/test_penta_deterministic_memory.py \
            tests/test_penta_sql_contract.py \
            tests/test_penta_family_reconciliation.py \
            tests/test_penta_provider_family_aliases.py
          python runtime/penta_deterministic_memory.py validate
          python runtime/penta_deterministic_memory.py reconcile --check
          git diff --check

      - name: Run independent focused certification suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/release-package
          python -m unittest \
            tests.test_penta_deterministic_memory \
            tests.test_penta_sql_contract \
            tests.test_penta_family_reconciliation \
            tests.test_penta_provider_family_aliases \
            -v 2>&1 | tee evidence/release-package/test-report.txt

      - name: Build hash-bound release evidence
        shell: bash
        env:
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          cp config/penta_deterministic_memory.v1.json evidence/release-package/
          cp data/penta/deterministic-memory-census.v1.json evidence/release-package/
          cp schemas/penta/deterministic-memory-census.schema.json evidence/release-package/
          cp supabase/migrations/20260831094500_penta_deterministic_memory_v1.sql evidence/release-package/
          cp supabase/rollbacks/20260831094500_penta_deterministic_memory_v1.rollback.sql evidence/release-package/
          cp docs/phase3/PENTA_DETERMINISTIC_MEMORY_PRODUCTION_CONTRACT_v1.0.md evidence/release-package/
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path('.')
          package = root / 'evidence' / 'release-package'
          census = json.loads((root / 'data/penta/deterministic-memory-census.v1.json').read_text(encoding='utf-8'))
          tracked = [
              root / 'runtime/penta_deterministic_memory.py',
              root / 'config/penta_deterministic_memory.v1.json',
              root / 'data/penta/deterministic-memory-census.v1.json',
              root / 'schemas/penta/deterministic-memory-census.schema.json',
              root / 'supabase/migrations/20260831094500_penta_deterministic_memory_v1.sql',
              root / 'supabase/rollbacks/20260831094500_penta_deterministic_memory_v1.rollback.sql',
              root / 'tests/test_penta_deterministic_memory.py',
              root / 'tests/test_penta_sql_contract.py',
              root / 'tests/test_penta_family_reconciliation.py',
              root / 'tests/test_penta_provider_family_aliases.py',
          ]
          digests = {
              path.as_posix(): hashlib.sha256(path.read_bytes()).hexdigest()
              for path in tracked
          }
          evidence = {
              'schema': 'ct.penta.deterministic-memory.release-candidate-certificate.v1',
              'decision': 'SOURCE_CERTIFIED_PENDING_PRODUCTION_READBACK',
              'head_sha': os.environ['HEAD_SHA'],
              'github_run_id': os.environ['RUN_ID'],
              'github_run_attempt': int(os.environ['RUN_ATTEMPT']),
              'manifest_sha256': census['manifest_sha256'],
              'counts': census['counts'],
              'canonicalization_profile': census['canonicalization_profile'],
              'production_project_ref': census['production_database']['project_ref'],
              'authority_expansion': False,
              'independent_production_certification_required': True,
              'source_sha256': dict(sorted(digests.items())),
          }
          payload = json.dumps(evidence, indent=2, sort_keys=True) + '\n'
          (package / 'release-candidate-certificate.json').write_text(payload, encoding='utf-8')
          (package / 'release-candidate-certificate.sha256').write_text(
              hashlib.sha256(payload.encode('utf-8')).hexdigest() + '  release-candidate-certificate.json\n',
              encoding='utf-8',
          )
          PY
          (cd evidence/release-package && sha256sum * | sort > PACKAGE_SHA256SUMS)

      - name: Upload exact release candidate package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: penta-deterministic-memory-${{ github.sha }}
          path: evidence/release-package
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
