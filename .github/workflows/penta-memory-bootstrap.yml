name: PentaCensus Deterministic Memory Corpus Materialization

on:
  push:
    branches:
      - admin-mcp/pentadocs-pentacensus-deterministic-memory

permissions:
  contents: write

concurrency:
  group: penta-memory-census-materialization-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize-canonical-corpus:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Validate PentaCensus implementation and policy
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile penta_census/*.py scripts/penta_census.py scripts/pentacensus_reconcile.py
          python scripts/penta_census.py --root . --validate
          python scripts/penta_census.py --root . --validate-structure
          python scripts/penta_census.py --root . --validate-contract
          pytest -q tests/pentacensus
          python scripts/penta_census.py --root . --check

      - name: Materialize exact reconciled corpus
        shell: bash
        run: |
          set -euo pipefail
          python scripts/penta_census.py --root . --write --emit-evidence --evidence-dir evidence/audits/penta-census
          git diff --check
          python scripts/penta_census.py --root . --validate
          python scripts/penta_census.py --root . --validate-structure
          python scripts/penta_census.py --root . --validate-contract
          python scripts/penta_census.py --root . --check

      - name: Revalidate deterministic memory projection
        shell: bash
        run: |
          set -euo pipefail
          python runtime/penta_deterministic_memory.py reconcile --write
          python runtime/penta_deterministic_memory.py validate
          python runtime/penta_deterministic_memory.py reconcile --check
          python -m unittest \
            tests.test_penta_deterministic_memory \
            tests.test_penta_sql_contract \
            tests.test_penta_family_reconciliation \
            tests.test_penta_provider_family_aliases \
            -v

      - name: Commit generator-owned corpus
        shell: bash
        run: |
          set -euo pipefail
          find penta_census runtime tests -type d -name __pycache__ -prune -exec rm -rf '{}' +
          git config user.name "CrownThrive PentaCensus"
          git config user.email "contact@crownthrive.com"
          git add data/penta/namespace-census.v1.json data/penta/deterministic-memory-census.v1.json
          if test -d evidence/audits/penta-census; then
            git add -f evidence/audits/penta-census
          fi
          git diff --cached --check
          git status --short
          if git diff --cached --quiet; then
            echo "Canonical corpus already converged."
            exit 0
          fi
          git commit -m "fix(pentacensus): materialize deterministic memory control-plane identities"
          git push origin HEAD:${GITHUB_REF_NAME}
