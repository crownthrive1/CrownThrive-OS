name: Penta Deterministic Memory Branch Bootstrap

on:
  push:
    branches:
      - admin-mcp/pentadocs-pentacensus-deterministic-memory

permissions:
  contents: write

concurrency:
  group: penta-memory-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unpack-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify source parent and payload custody
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "89eb1e65131d6d5b3655c23da63646429451829d"
          test "$(find .bootstrap -maxdepth 1 -type f -name 'payload.part*' | wc -l)" -eq 8
          cat .bootstrap/payload.part* > /tmp/penta_memory_payload.b64
          echo "6550b336036b12de9d3be41b6296df450afd8a2a6f9bf48601800e25106fe781  /tmp/penta_memory_payload.b64" | sha256sum -c -
          base64 --decode /tmp/penta_memory_payload.b64 > /tmp/penta_memory_payload.tgz
          echo "cdbed34972cde1ac1083d6e4c667188d61b5a45304623e90051ead34bcd6ade1  /tmp/penta_memory_payload.tgz" | sha256sum -c -
          python - <<'PY'
          import pathlib
          import tarfile

          archive = pathlib.Path('/tmp/penta_memory_payload.tgz')
          with tarfile.open(archive, 'r:gz') as tf:
              members = tf.getmembers()
              if not members:
                  raise SystemExit('empty payload')
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe archive member: {member.name}')
          PY

      - name: Expand governed source payload
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/penta_memory_payload.tgz
          rm -rf .bootstrap
          rm -f .github/workflows/penta-memory-bootstrap.yml

      - name: Compile, test, reconcile, and validate
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile runtime/penta_deterministic_memory.py tests/test_penta_deterministic_memory.py tests/test_penta_sql_contract.py
          python -m unittest discover -s tests -p 'test_penta_*' -v
          python runtime/penta_deterministic_memory.py reconcile --write
          python runtime/penta_deterministic_memory.py validate
          python -m unittest discover -s tests -p 'test_penta_*' -v
          git diff --check

      - name: Commit verified branch source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CrownThrive Penta Runtime"
          git config user.email "contact@crownthrive.com"
          git add -A
          git status --short
          git commit -m "feat(penta): institutionalize deterministic memory fabric"
          git push origin HEAD:${GITHUB_REF_NAME}
