name: Penta Deterministic Memory Branch Bootstrap

on:
  push:
    branches:
      - admin-mcp/pentadocs-pentacensus-deterministic-memory

permissions:
  contents: write

concurrency:
  group: penta-memory-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unpack-verify-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Verify source ancestry and payload custody
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "89eb1e65131d6d5b3655c23da63646429451829d" HEAD
          git merge-base --is-ancestor "885f9b8b0b0fbd48b46c6a67b97ea866ddf8ed24" HEAD
          test "$(find .bootstrap -maxdepth 1 -type f -name 'payload.part*' | wc -l)" -eq 8
          cat .bootstrap/payload.part* > /tmp/penta_memory_payload.b64
          echo "6550b336036b12de9d3be41b6296df450afd8a2a6f9bf48601800e25106fe781  /tmp/penta_memory_payload.b64" | sha256sum -c -
          base64 --decode /tmp/penta_memory_payload.b64 > /tmp/penta_memory_payload.tgz
          echo "cdbed34972cde1ac1083d6e4c667188d61b5a45304623e90051ead34bcd6ade1  /tmp/penta_memory_payload.tgz" | sha256sum -c -
          python - <<'PY'
          import pathlib
          import tarfile

          archive = pathlib.Path('/tmp/penta_memory_payload.tgz')
          with tarfile.open(archive, 'r:gz') as tf:
              members = tf.getmembers()
              if not members:
                  raise SystemExit('empty payload')
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe archive member: {member.name}')
          PY

      - name: Expand governed source payload
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/penta_memory_payload.tgz
          rm -rf .bootstrap
          rm -f .github/workflows/penta-memory-bootstrap.yml

      - name: Compile deterministic memory source
        run: python -m py_compile runtime/penta_deterministic_memory.py tests/test_penta_deterministic_memory.py tests/test_penta_sql_contract.py

      - name: Run focused deterministic memory tests before reconciliation
        run: python -m unittest tests.test_penta_deterministic_memory tests.test_penta_sql_contract -v

      - name: Generate deterministic memory census
        shell: bash
        run: |
          set +e
          python runtime/penta_deterministic_memory.py reconcile --write > .penta-memory-reconcile-error.txt 2>&1
          status=$?
          cat .penta-memory-reconcile-error.txt
          if [ "$status" -eq 0 ]; then
            rm -f .penta-memory-reconcile-error.txt
          fi
          exit "$status"

      - name: Persist materialized source and reconcile evidence
        if: failure() && hashFiles('.penta-memory-reconcile-error.txt') != ''
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CrownThrive Penta Runtime"
          git config user.email "contact@crownthrive.com"
          mkdir -p .penta-staging
          if test -f .github/workflows/penta-deterministic-memory.yml; then
            mv .github/workflows/penta-deterministic-memory.yml .penta-staging/penta-deterministic-memory.workflow.yml
          fi
          git checkout HEAD -- .github/workflows/penta-memory-bootstrap.yml
          find runtime tests -type d -name __pycache__ -prune -exec rm -rf '{}' +
          git add -A
          git status --short
          git commit -m "chore(penta): materialize governed memory source for reconciliation"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Validate deterministic memory census
        run: python runtime/penta_deterministic_memory.py validate

      - name: Run focused deterministic memory tests after reconciliation
        run: python -m unittest tests.test_penta_deterministic_memory tests.test_penta_sql_contract -v

      - name: Verify clean patch semantics
        run: git diff --check

      - name: Commit verified branch source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CrownThrive Penta Runtime"
          git config user.email "contact@crownthrive.com"
          git add -A
          git status --short
          git commit -m "feat(penta): institutionalize deterministic memory fabric"
          git push origin HEAD:${GITHUB_REF_NAME}
