name: Penta Repository Convergence Contract

on:
  pull_request:
    paths:
      - '.crownthrive/**'
      - 'penta/repository_fabric/**'
      - 'penta/organic/**'
      - 'developers/manifests/repository-*.json'
      - 'schemas/penta/repository-*.json'
      - 'data/penta/**'
      - 'federation/**'
      - 'scripts/run_repository_convergence.py'
      - 'scripts/validate_repository_federation.py'
      - 'tests/test_penta_repository_fabric.py'
      - 'tests/test_penta_organic_control_plane.py'
      - '.github/workflows/penta-repository-convergence-contract.yml'
      - '.github/workflows/penta-repository-convergence.yml'

permissions:
  contents: read

jobs:
  contract-and-adversarial-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Validate repository federation contracts
        run: python3 scripts/validate_repository_federation.py
      - name: Test hot cold silent and organic runtime
        run: python3 -m unittest -v tests.test_penta_repository_fabric tests.test_penta_organic_control_plane
      - name: Validate Penta Family integration
        run: python3 tests/test_penta_family.py
