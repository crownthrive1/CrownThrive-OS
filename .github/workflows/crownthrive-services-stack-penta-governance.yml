name: CrownThrive Services Stack Penta Governance

on:
  pull_request:
    paths:
      - frameworks/crownthrive-services-stack.mdx
      - frameworks/pentafactory-parallel-precompile.mdx
      - developers/manifests/crownthrive-services-stack.v2.json
      - developers/manifests/pentafactory-parallel-precompile.v2.json
      - skills/crownthrive-services-stack/SKILL.md
      - scripts/validate_crownthrive_services_stack_penta.py
      - .github/workflows/crownthrive-services-stack-penta-governance.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: css-penta-governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate CSS substrate and PentaFactory precompile boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Validate source syntax
        run: |
          python -m py_compile scripts/validate_crownthrive_services_stack_penta.py
          python -m json.tool developers/manifests/crownthrive-services-stack.v2.json >/dev/null
          python -m json.tool developers/manifests/pentafactory-parallel-precompile.v2.json >/dev/null
      - name: Validate Penta compatibility
        run: python scripts/validate_crownthrive_services_stack_penta.py
      - name: Validate repository documentation
        run: python scripts/validate_docs.py
      - name: Check whitespace
        run: git diff --check
