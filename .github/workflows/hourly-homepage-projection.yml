name: Hourly Homepage Projection

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: hourly-homepage-projection
  cancel-in-progress: true

jobs:
  reconcile:
    name: Render and reconcile governed homepage
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Bind run to exact current main
        id: canonical
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          canonical_sha="$(git rev-parse origin/main)"
          if [ "$canonical_sha" != "$GITHUB_SHA" ]; then
            echo "main moved after this run was queued; fail closed and let the next run reconcile"
            exit 1
          fi
          echo "sha=$canonical_sha" >> "$GITHUB_OUTPUT"

      - name: Render and validate candidate
        run: |
          python scripts/render_homepage_projection.py --write
          python scripts/render_homepage_projection.py --check
          python scripts/validate_homepage_control_plane.py
          python scripts/validate_docs.py
          python scripts/validate_github_actions_runtime_policy.py
          python scripts/validate_security_governance.py
          git diff --check

      - name: Detect semantic homepage change
        id: change
        shell: bash
        run: |
          if git diff --quiet -- index.mdx; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No canonical homepage input changed; workflow run is the hourly heartbeat."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish non-force automation branch and draft pull request
        if: steps.change.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CANONICAL_SHA: ${{ steps.canonical.outputs.sha }}
          CT_BRANCH: automation/hourly-homepage-projection
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "crownthrive-homepage-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The first render only decides whether reconciliation is needed. Do
          # not carry that dirty worktree across the branch switch.
          git restore -- index.mdx
          git fetch --no-tags origin main
          if [ "$(git rev-parse origin/main)" != "$CANONICAL_SHA" ]; then
            echo "main changed during reconciliation; refusing a stale projection"
            exit 1
          fi

          prior_remote_head="absent"
          if git ls-remote --exit-code --heads origin "$CT_BRANCH" >/dev/null 2>&1; then
            git fetch --no-tags origin "$CT_BRANCH"
            prior_remote_head="$(git rev-parse "origin/$CT_BRANCH")"
            lineage_base="$(git merge-base origin/main "origin/$CT_BRANCH")"
            preexisting_paths="$(git diff --name-only "$lineage_base...origin/$CT_BRANCH")"
            if [ "$preexisting_paths" != "index.mdx" ]; then
              echo "automation branch has a non-homepage or empty pre-existing diff; refusing to preserve it"
              printf '%s\n' "$preexisting_paths"
              exit 1
            fi
            invalid_authors="$(git log --format='%ae' "$lineage_base..origin/$CT_BRANCH" | grep -vFx '41898282+github-actions[bot]@users.noreply.github.com' || true)"
            if [ -n "$invalid_authors" ]; then
              echo "automation branch contains commits outside the registered bot lineage"
              printf '%s\n' "$invalid_authors"
              exit 1
            fi
            git switch --create homepage-projection-work "origin/$CT_BRANCH"
            git merge --no-edit origin/main
          else
            git switch --create homepage-projection-work origin/main
          fi

          python scripts/render_homepage_projection.py --write
          python scripts/render_homepage_projection.py --check
          python scripts/validate_homepage_control_plane.py
          python scripts/validate_docs.py
          python scripts/validate_github_actions_runtime_policy.py
          python scripts/validate_security_governance.py
          git diff --check

          worktree_paths="$(git status --short | sed -E 's/^...//')"
          if [ -n "$worktree_paths" ] && [ "$worktree_paths" != "index.mdx" ]; then
            echo "renderer changed a path outside index.mdx"
            printf '%s\n' "$worktree_paths"
            exit 1
          fi

          if ! git diff --quiet -- index.mdx; then
            git add -- index.mdx
            staged_paths="$(git diff --cached --name-only)"
            if [ "$staged_paths" != "index.mdx" ]; then
              echo "staged projection delta is not exactly index.mdx"
              printf '%s\n' "$staged_paths"
              exit 1
            fi
            git commit -m "docs(homepage): reconcile governed projection"
          fi

          pr_paths="$(git diff --name-only origin/main...HEAD)"
          if [ "$pr_paths" != "index.mdx" ]; then
            echo "candidate pull-request diff is not exactly index.mdx"
            printf '%s\n' "$pr_paths"
            exit 1
          fi

          candidate_sha="$(git rev-parse HEAD)"
          rollback_sha="$CANONICAL_SHA"
          rollback_digest="$(git show "$rollback_sha:index.mdx" | sha256sum | cut -d' ' -f1)"
          candidate_digest="$(sha256sum index.mdx | cut -d' ' -f1)"
          main_protected="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.protected')"
          if [ "$main_protected" != "true" ]; then
            echo "provider does not report main as protected; refusing mutation"
            exit 1
          fi

          if [ "$prior_remote_head" != "absent" ] && ! git merge-base --is-ancestor "$prior_remote_head" "$candidate_sha"; then
            echo "candidate would require a non-fast-forward update; refusing"
            exit 1
          fi
          git push origin "HEAD:$CT_BRANCH"
          git fetch --no-tags origin "$CT_BRANCH"
          remote_sha="$(git rev-parse "origin/$CT_BRANCH")"
          if [ "$remote_sha" != "$candidate_sha" ]; then
            echo "branch read-after-write head mismatch"
            exit 1
          fi
          remote_paths="$(git diff --name-only origin/main..."origin/$CT_BRANCH")"
          if [ "$remote_paths" != "index.mdx" ]; then
            echo "branch read-after-write diff is not exactly index.mdx"
            printf '%s\n' "$remote_paths"
            exit 1
          fi

          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$CT_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            pr_url="$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$CT_BRANCH" \
              --draft \
              --title "DRAFT/HOLD — hourly governed homepage projection" \
              --body "Deterministic hourly-on-change homepage reconciliation. Direct main writes, self-merge, public-deployment claims and commerce activation remain prohibited. CI is evidence, not governance acceptance.")"
            existing="${pr_url##*/}"
          fi

          readback_head="$(gh pr view "$existing" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          if [ "$readback_head" != "$candidate_sha" ]; then
            echo "pull-request read-after-write head mismatch"
            exit 1
          fi
          readback_paths="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$existing/files" --jq '.[].filename')"
          if [ "$readback_paths" != "index.mdx" ]; then
            echo "pull-request read-after-write diff is not exactly index.mdx"
            printf '%s\n' "$readback_paths"
            exit 1
          fi

          gh pr comment "$existing" \
            --repo "$GITHUB_REPOSITORY" \
            --body "Hourly projection evidence receipt: actor \`$GITHUB_ACTOR\`; canonical main \`$CANONICAL_SHA\`; prior automation head \`$prior_remote_head\`; exact head \`$candidate_sha\`; complete PR diff \`index.mdx\` only; candidate digest \`sha256:$candidate_digest\`; rollback target \`$rollback_sha\` with prior homepage digest \`sha256:$rollback_digest\`; provider main protected flag \`$main_protected\`. Branch and PR read-after-write checks passed. The protected flag is not a substitute for independent required-check/ruleset evidence. Review current CI; no automatic merge, deployment acceptance or commerce authority is created."
