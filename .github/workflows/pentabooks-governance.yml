name: PentaBooks Governance

on:
  pull_request:
    paths:
      - 'governance/pentabooks/**'
      - 'scripts/pentabooks/**'
      - '.github/workflows/pentabooks-governance.yml'
  push:
    paths:
      - 'governance/pentabooks/**'
      - 'scripts/pentabooks/**'
      - '.github/workflows/pentabooks-governance.yml'

permissions:
  contents: read

jobs:
  validate-rotation-receipts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Rotation 003 Wave 002 narrative receipt
        run: >-
          python scripts/pentabooks/verify_rotation_receipt.py
          governance/pentabooks/PB-R03-W02-NARRATIVE-RECEIPT.json
