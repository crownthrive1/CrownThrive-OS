name: CIE Post-Activation Link Assurance Governance

on:
  pull_request:
    paths:
      - "supabase/migrations/20260824070356_cie_post_activation_link_assurance_v1.sql"
      - "developers/manifests/cie-post-activation-link-assurance.v1.json"
      - "standards/cie-post-activation-link-assurance.md"
      - "scripts/validate_cie_post_activation_link_assurance.py"
      - ".github/workflows/cie-post-activation-link-assurance-governance.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/20260824070356_cie_post_activation_link_assurance_v1.sql"
      - "developers/manifests/cie-post-activation-link-assurance.v1.json"
      - "standards/cie-post-activation-link-assurance.md"
      - "scripts/validate_cie_post_activation_link_assurance.py"
      - ".github/workflows/cie-post-activation-link-assurance-governance.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate CIE post-activation current-link assurance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Compile validator
        run: python -m py_compile scripts/validate_cie_post_activation_link_assurance.py
      - name: Validate assurance invariants
        run: python scripts/validate_cie_post_activation_link_assurance.py
      - name: Check whitespace and conflict markers
        run: |
          git diff --check
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!THIRD_PARTY_NOTICES.md'; then
            echo "Unresolved merge-conflict markers detected."
            exit 1
          fi
