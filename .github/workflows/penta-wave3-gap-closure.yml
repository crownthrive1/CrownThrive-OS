name: Penta Wave 3 Gap Closure

on:
  push:
    branches:
      - penta-production-promotion-wave3-restack-20260826-v2
    paths:
      - ".github/workflows/penta-wave3-gap-closure.yml"

permissions:
  contents: write

concurrency:
  group: penta-wave3-gap-closure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  close-gaps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: penta-production-promotion-wave3-restack-20260826-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Bind convergence utility to governed security route
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/penta_wave3_gap_closure.py")
          lines = path.read_text(encoding="utf-8").splitlines()
          output: list[str] = []
          write_found = False
          check_found = False
          insert_after_raise = False
          check_indent = ""

          for line in lines:
              stripped = line.strip()
              indent = line[: len(line) - len(line.lstrip())]

              if stripped == 'mesh = mesh.replace("../SECURITY.md", "/SECURITY").replace("/SECURITY.md", "/SECURITY")':
                  output.append(
                      indent
                      + 'mesh = mesh.replace("../SECURITY.md", "/technology/security-privacy-continuity").replace("/SECURITY.md", "/technology/security-privacy-continuity").replace("/SECURITY", "/technology/security-privacy-continuity")'
                  )
                  write_found = True
                  continue

              if stripped == 'if "../SECURITY.md" in mesh or "/SECURITY.md" in mesh:':
                  output.append(
                      indent
                      + 'if any(value in mesh for value in ("../SECURITY.md", "/SECURITY.md", "/SECURITY")):'
                  )
                  check_found = True
                  insert_after_raise = True
                  check_indent = indent
                  continue

              output.append(line)
              if insert_after_raise and stripped == 'raise GapClosureError("noncanonical security documentation link remains")':
                  output.append(
                      check_indent
                      + 'if "/technology/security-privacy-continuity" not in mesh:'
                  )
                  output.append(
                      check_indent
                      + '    raise GapClosureError("governed security documentation route is missing")'
                  )
                  insert_after_raise = False

          if not write_found:
              raise SystemExit("security-route write line was not found")
          if not check_found or insert_after_raise:
              raise SystemExit("security-route validation block was not repaired")

          path.write_text("\n".join(output) + "\n", encoding="utf-8")
          PY

      - name: Produce bounded runtime and reconcile canonical state
        run: python scripts/penta_wave3_gap_closure.py --apply

      - name: Apply deterministic PentaDocs migration
        run: |
          python scripts/pentadocs_quality.py --apply
          python scripts/pentadocs_quality.py --check
          python scripts/penta_wave3_gap_closure.py --check
          grep -F '/technology/security-privacy-continuity' virality-music/system-mesh.mdx >/dev/null

      - name: Compile repaired production software
        run: |
          python -m py_compile \
            runtime/penta_exec.py \
            runtime/penta_family.py \
            runtime/penta_interop.py \
            runtime/penta_promoted_operations.py \
            runtime/penta_evi_builder.py \
            runtime/penta_immune.py \
            scripts/penta_wave3_gap_closure.py

      - name: Validate repaired production contracts and governed links
        run: |
          python -m json.tool data/penta/family.registry.json >/dev/null
          python -m json.tool data/penta/institutional-services.registry.json >/dev/null
          python -m json.tool data/penta/execution-adapters.registry.json >/dev/null
          python -m json.tool data/penta/member-runtime.contract.json >/dev/null
          python -m json.tool developers/manifests/pentadocs-unlisted-page-dispositions.v1.json >/dev/null
          python -m json.tool developers/manifests/supabase-production-convergence-state.v1.json >/dev/null
          python -m unittest -v tests.test_penta_evi_builder tests.test_penta_immune
          python tests/test_penta_family.py
          python tests/test_penta_exec.py
          python -m unittest -v tests/test_penta_runtime_suite.py
          python -m unittest -v tests/test_penta_interop.py
          python -m unittest -v tests/test_penta_observability.py
          python runtime/penta_families.py --root . --portal-index >/dev/null
          python scripts/validate_docs.py
          python scripts/validate_supabase_production_convergence_state.py

      - name: Commit governed repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/penta-wave3-gap-closure.yml
          git add -A
          git diff --cached --check
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No governed repair changes were generated."
            exit 1
          fi
          git commit -m "fix(penta): close Wave 3 production convergence gaps"
          git push origin "HEAD:${GITHUB_REF_NAME}"
