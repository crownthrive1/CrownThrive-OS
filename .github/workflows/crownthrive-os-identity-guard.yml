name: CrownThrive OS Canonical Identity Guard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CROWNTHRIVE_OS_REPOSITORY: crownthrive1/CrownThrive-OS
  CROWNTHRIVE_OS_URL: https://github.com/crownthrive1/CrownThrive-OS

jobs:
  enforce-canonical-identity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Enforce CrownThrive OS identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          identity_path = Path('.crownthrive/canonical-os.json')
          if not identity_path.exists():
              raise SystemExit('Missing required .crownthrive/canonical-os.json binding')

          identity = json.loads(identity_path.read_text(encoding='utf-8'))
          expected_repo = 'crownthrive1/CrownThrive-OS'
          expected_url = 'https://github.com/crownthrive1/CrownThrive-OS'
          if identity.get('canonical_control_repository') != expected_repo:
              raise SystemExit(f'Canonical repository mismatch: expected {expected_repo}')
          if identity.get('canonical_url') != expected_url:
              raise SystemExit(f'Canonical URL mismatch: expected {expected_url}')

          # Historical, changelog, legal, test-vector, generated-evidence, and migration
          # references remain immutable evidence. The identity guard enforces only live
          # execution/configuration surfaces where an obsolete repository target could run.
          live_prefixes = (
              '.github/workflows/',
              '.github/ISSUE_TEMPLATE/',
              'infra/github-runners/',
              'supabase/functions/',
              'software-factory-v3/supabase/functions/',
          )
          excluded = {'.github/workflows/crownthrive-os-identity-guard.yml'}
          legacy_repo = 'crownthrive1/' + 'CrownThrive-' + 'Support'
          legacy_url = 'https://github.com/' + legacy_repo

          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode('utf-8').split('\0')
          hits = []
          for filename in tracked:
              if not filename or filename in excluded or not filename.startswith(live_prefixes):
                  continue
              path = Path(filename)
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              lines = [
                  i for i, line in enumerate(text.splitlines(), 1)
                  if legacy_repo in line or legacy_url in line
              ]
              if lines:
                  hits.append((filename, lines[:20]))

          if hits:
              print('Legacy repository target detected on a live execution/configuration surface:')
              for filename, lines in hits:
                  print(f'  {filename}: lines {lines}')
              print(f'Replace live targets with {expected_url}; preserve historical evidence outside the live perimeter.')
              raise SystemExit(1)

          print(f'Canonical CrownThrive OS live identity verified: {expected_url}')
          print('Historical references remain preserved outside the live execution perimeter.')
          PY
