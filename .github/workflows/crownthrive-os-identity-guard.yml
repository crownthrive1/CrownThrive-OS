name: CrownThrive OS Canonical Identity Guard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CROWNTHRIVE_OS_REPOSITORY: crownthrive1/CrownThrive-OS
  CROWNTHRIVE_OS_URL: https://github.com/crownthrive1/CrownThrive-OS

jobs:
  enforce-canonical-identity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enforce CrownThrive OS identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          identity_path = Path('.crownthrive/canonical-os.json')
          if not identity_path.exists():
              raise SystemExit('Missing required .crownthrive/canonical-os.json binding')

          identity = json.loads(identity_path.read_text(encoding='utf-8'))
          expected_repo = 'crownthrive1/CrownThrive-OS'
          expected_url = 'https://github.com/crownthrive1/CrownThrive-OS'
          if identity.get('canonical_control_repository') != expected_repo:
              raise SystemExit(f'Canonical repository mismatch: expected {expected_repo}')
          if identity.get('canonical_url') != expected_url:
              raise SystemExit(f'Canonical URL mismatch: expected {expected_url}')

          # Enforce live operational identity without falsifying historical records.
          # Changelogs, archives, release evidence and migration records may retain
          # former repository names as provenance. Live routing/control surfaces may not.
          legacy_slug = 'CrownThrive-' + 'Support'
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode('utf-8').split('\0')
          hits = []
          for filename in tracked:
              if not filename or filename == '.github/workflows/crownthrive-os-identity-guard.yml':
                  continue
              if not (filename.startswith('.github/') or filename.startswith('.crownthrive/')):
                  continue
              path = Path(filename)
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if legacy_slug in text:
                  lines = [i for i, line in enumerate(text.splitlines(), 1) if legacy_slug in line]
                  hits.append((filename, lines[:20]))

          if hits:
              print('Legacy repository identity detected in live control surfaces:')
              for filename, lines in hits:
                  print(f'  {filename}: lines {lines}')
              print(f'Route live control references through {expected_url}; preserve history only in archival/evidence surfaces.')
              raise SystemExit(1)

          print(f'Canonical CrownThrive OS live-control identity verified: {expected_url}')
          PY
