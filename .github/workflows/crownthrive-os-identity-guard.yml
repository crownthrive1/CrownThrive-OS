name: CrownThrive OS Canonical Identity Guard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CROWNTHRIVE_OS_REPOSITORY: crownthrive1/CrownThrive-OS
  CROWNTHRIVE_OS_URL: https://github.com/crownthrive1/CrownThrive-OS

jobs:
  enforce-canonical-identity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enforce CrownThrive OS identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          identity_path = Path('.crownthrive/canonical-os.json')
          archive_path = Path('config/retired_identity_archive.json')
          if not identity_path.exists():
              raise SystemExit('Missing required .crownthrive/canonical-os.json binding')
          if not archive_path.exists():
              raise SystemExit('Missing governed retired-identity archive boundary')

          identity = json.loads(identity_path.read_text(encoding='utf-8'))
          archive = json.loads(archive_path.read_text(encoding='utf-8'))
          expected_repo = 'crownthrive1/CrownThrive-OS'
          expected_url = 'https://github.com/crownthrive1/CrownThrive-OS'
          if identity.get('canonical_control_repository') != expected_repo:
              raise SystemExit(f'Canonical repository mismatch: expected {expected_repo}')
          if identity.get('canonical_url') != expected_url:
              raise SystemExit(f'Canonical URL mismatch: expected {expected_url}')
          if archive.get('schema') != 'ct.archive.retired-identity-boundary.20260827.v1':
              raise SystemExit('Retired-identity archive schema mismatch')

          legacy_slug = 'CrownThrive-' + 'Support'
          pattern = re.compile(re.escape(legacy_slug), re.IGNORECASE)
          tracked = [v for v in subprocess.check_output(['git', 'ls-files', '-z']).decode('utf-8').split('\0') if v]
          tracked_set = set(tracked)
          allowed_migrations = set(map(str, archive.get('allowed_paths') or []))
          allowed_evidence = set(map(str, archive.get('allowed_evidence_paths') or []))
          allowed = allowed_migrations | allowed_evidence
          if not allowed_migrations:
              raise SystemExit('Retired-identity historical migration allowlist may not be empty')

          def verify_allowed_path(filename: str, prefix: str, label: str) -> None:
              path = Path(filename)
              if not filename.startswith(prefix) or filename not in tracked_set or not path.is_file():
                  raise SystemExit(f'Invalid retired-identity {label} path: {filename}')
              try:
                  historical_text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError) as exc:
                  raise SystemExit(f'Unreadable retired-identity {label} path: {filename}: {exc}')
              if not pattern.search(historical_text):
                  raise SystemExit(f'Stale retired-identity {label} path no longer contains historical identity: {filename}')

          for filename in sorted(allowed_migrations):
              verify_allowed_path(filename, 'supabase/migrations/', 'migration')
          for filename in sorted(allowed_evidence):
              verify_allowed_path(filename, 'supabase/migration_lineage/replay_diagnostics/', 'replay-evidence')

          hits = []
          for filename in tracked:
              if filename == '.github/workflows/crownthrive-os-identity-guard.yml' or filename in allowed:
                  continue
              path = Path(filename)
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if pattern.search(text):
                  lines = [i for i, line in enumerate(text.splitlines(), 1) if pattern.search(line)]
                  hits.append((filename, lines[:20]))

          if hits:
              print('Retired CrownThrive repository identity detected on a live surface:')
              for filename, lines in hits:
                  print(f'  {filename}: lines {lines}')
              print(f'Replace live references with {expected_url}; historical exceptions require an explicit governed archive receipt.')
              raise SystemExit(1)

          print(
              f'Canonical CrownThrive OS identity verified: {expected_url}; '
              f'{len(allowed_migrations)} historical migrations and '
              f'{len(allowed_evidence)} sanitized replay-evidence paths preserved under exact archive boundaries.'
          )
          PY
