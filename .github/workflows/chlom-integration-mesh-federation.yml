name: CHLOM Integration Mesh Federation

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "federation/CHLOM_INTEGRATION_MESH.md"
      - "federation/penta-mesh.v1.json"
      - "federation/penta-mesh-node.v1.json"
      - ".github/workflows/chlom-integration-mesh-federation.yml"
  push:
    branches: [main]
    paths:
      - "federation/CHLOM_INTEGRATION_MESH.md"
      - "federation/penta-mesh.v1.json"
      - "federation/penta-mesh-node.v1.json"
      - ".github/workflows/chlom-integration-mesh-federation.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify local Penta mesh node contract
        shell: python
        run: |
          import json
          from pathlib import Path

          mesh = json.loads(Path("federation/penta-mesh.v1.json").read_text())
          node = json.loads(Path("federation/penta-mesh-node.v1.json").read_text())
          assert mesh.get("schema") == "ct.penta.repository-mesh.v1"
          assert mesh.get("version") == "1.1.0"
          assert node.get("schema") == "ct.penta.repository-mesh-node.v1"
          assert mesh.get("canonical_hub") == "crownthrive1/CrownThrive-Support"
          assert mesh.get("protocol_registry") == "crownthrive1/chlom-protocol"
          inventory = mesh.get("inventory", {})
          assert inventory.get("expected_physical_repository_count") == 13
          assert inventory.get("public_contract_detail_count") == 3
          assert inventory.get("restricted_repository_count") == 10
          assert inventory.get("restricted_coordinates") == "restricted_ref_only"
          assert mesh.get("interoperability", {}).get("information_flow") == [
              "afferent", "efferent", "lateral"
          ]
          assert node.get("repository") == "crownthrive1/CrownThrive-Support"
          assert mesh.get("interoperability", {}).get("node_contract") == ".crownthrive/penta-node.v1.json"
          assert node.get("capabilities", {}).get("pentamail_transport") is True
          assert node.get("capabilities", {}).get("exact_provider_readback") is True
          print("Support Penta mesh node contract verified")

      - name: Verify canonical CHLOM integration mesh
        shell: python
        run: |
          import json, urllib.request
          url = "https://raw.githubusercontent.com/crownthrive1/chlom-protocol/main/registry/integrations.json"
          req = urllib.request.Request(url, headers={"User-Agent":"CrownThrive-Mesh-Federation/2.0"})
          with urllib.request.urlopen(req, timeout=30) as r:
              data = json.load(r)
          assert data.get("registry_id") == "ct.mesh.integrations.v1"
          integrations = {x["integration_id"]: x for x in data.get("integrations", [])}
          io = integrations["ct.integration.crownthrive.io.mcp"]
          ad = integrations["ct.integration.adserver.online"]
          assert io.get("declared_limits", {}).get("usage_limit") == "UNLIMITED"
          assert io.get("declared_limits", {}).get("hardcoded") is True
          assert ad.get("declared_limits", {}).get("usage_limit") == 3000000
          assert ad.get("declared_limits", {}).get("hardcoded") is True
          assert data.get("integration_policy", {}).get("vault_only_credentials") is True
          assert data.get("integration_policy", {}).get("bypass_provider_controls") is False
          print("Canonical CHLOM integration mesh federation verified")
