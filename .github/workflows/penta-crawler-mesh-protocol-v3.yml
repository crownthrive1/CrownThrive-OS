name: PentaCrawler Mesh Protocol v3

on:
  pull_request:
    paths:
      - "supabase/migrations/20260829032500_penta_crawler_mesh_protocol_v3.sql"
      - "supabase/migrations/20260829032600_penta_discovery_packet_normalization_v3.sql"
      - "supabase/migrations/20260829032700_penta_protocol_pgcrypto_resolution_v3.sql"
      - "supabase/functions/penta-crawler/**"
      - "schemas/penta/penta-cookie-v1.schema.json"
      - "schemas/penta/pentas-packet-v1.schema.json"
      - "penta/crawler/**"
      - "tests/test_penta_crawler_mesh_protocol_v3.py"
      - ".github/workflows/penta-crawler-mesh-protocol-v3.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: penta-crawler-mesh-v3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Protocol contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Run PentaCrawler mesh contract tests
        run: python -m unittest tests.test_penta_crawler_mesh_protocol_v3
      - name: Confirm Supabase pgcrypto schema binding
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'extensions.digest' supabase/migrations/20260829032700_penta_protocol_pgcrypto_resolution_v3.sql
          grep -Fq 'set search_path = pg_catalog, public, extensions' supabase/migrations/20260829032700_penta_protocol_pgcrypto_resolution_v3.sql

  public-safe-source:
    name: Public-safe source checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Reject obvious credential literals in changed runtime surfaces
        shell: bash
        run: |
          set -euo pipefail
          files=(
            supabase/functions/penta-crawler/index.ts
            supabase/migrations/20260829032500_penta_crawler_mesh_protocol_v3.sql
            supabase/migrations/20260829032600_penta_discovery_packet_normalization_v3.sql
            supabase/migrations/20260829032700_penta_protocol_pgcrypto_resolution_v3.sql
            penta/crawler/README.md
          )
          if grep -Ein '(sk_live_[A-Za-z0-9]+|sk_test_[A-Za-z0-9]+|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' "${files[@]}"; then
            echo "Potential credential material detected in PentaCrawler v3 source." >&2
            exit 1
          fi
      - name: Confirm no new cron clock in PentaCrawler v3
        shell: bash
        run: |
          set -euo pipefail
          if grep -Ein '(cron\.schedule|pg_cron)' \
            supabase/migrations/20260829032500_penta_crawler_mesh_protocol_v3.sql \
            supabase/migrations/20260829032600_penta_discovery_packet_normalization_v3.sql \
            supabase/migrations/20260829032700_penta_protocol_pgcrypto_resolution_v3.sql \
            supabase/functions/penta-crawler/index.ts; then
            echo "PentaCrawler v3 must reuse existing temporal fabric; duplicate clock found." >&2
            exit 1
          fi
