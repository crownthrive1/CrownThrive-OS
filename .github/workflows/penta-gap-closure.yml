name: PENTA Gap Closure

on:
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.mdx'
      - '**/*.json'
      - '**/*.yml'
      - '**/*.yaml'
      - 'scripts/penta_gap_closure.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Scan PENTA phase drift
        run: python scripts/penta_gap_closure.py . --json
