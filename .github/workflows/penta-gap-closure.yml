name: PENTA Gap Closure

on:
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.mdx'
      - '**/*.json'
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.py'
      - '**/*.sql'
      - 'scripts/penta_gap_closure.py'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '**/*.mdx'
      - '**/*.json'
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.py'
      - '**/*.sql'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Scan PENTA phase drift
        run: python scripts/penta_gap_closure.py . --json
