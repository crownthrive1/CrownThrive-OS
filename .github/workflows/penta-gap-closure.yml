name: PENTA Gap Closure

on:
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.mdx'
      - '**/*.json'
      - '**/*.yml'
      - '**/*.yaml'
      - 'scripts/penta_gap_closure.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan PENTA phase drift
        run: python scripts/penta_gap_closure.py . --json
