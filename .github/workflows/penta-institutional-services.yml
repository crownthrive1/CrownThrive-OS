name: PENTA Institutional Services + Family

on:
  pull_request:
    paths:
      - "data/penta/**"
      - "schemas/penta/**"
      - "runtime/penta_institutional_services.py"
      - "runtime/penta_institutional_controls.py"
      - "runtime/penta_compliance_license.py"
      - "runtime/penta_self_build.py"
      - "runtime/penta_family.py"
      - "runtime/penta_interop.py"
      - "runtime/penta_runtime_suite.py"
      - "tests/test_penta_institutional_services.py"
      - "tests/test_penta_institutional_controls.py"
      - "tests/test_penta_institutional_controls_family.py"
      - "tests/test_penta_compliance_license.py"
      - "tests/test_penta_self_build.py"
      - "scripts/stress_penta_compliance_license.py"
      - "scripts/run_function_tests.py"
      - "tests/test_penta_family.py"
      - "tests/test_penta_interop.py"
      - "automation/penta-family*.mdx"
      - "automation/penta-interoperability-fabric.mdx"
      - "docs/phase3/PENTA_INSTITUTIONAL_OPERATING_FABRIC_v1.2.md"
      - "docs/phase3/PENTA_FAMILY_PRODUCTION_CONTRACT_v*.md"
      - ".github/workflows/penta-institutional-services.yml"
      - ".github/workflows/penta-interoperability-production.yml"
  push:
    branches: [main]
    paths:
      - "data/penta/**"
      - "schemas/penta/**"
      - "runtime/penta_institutional_services.py"
      - "runtime/penta_institutional_controls.py"
      - "runtime/penta_compliance_license.py"
      - "runtime/penta_self_build.py"
      - "runtime/penta_family.py"
      - "runtime/penta_interop.py"
      - "runtime/penta_runtime_suite.py"
      - "tests/test_penta_institutional_services.py"
      - "tests/test_penta_institutional_controls.py"
      - "tests/test_penta_institutional_controls_family.py"
      - "tests/test_penta_compliance_license.py"
      - "tests/test_penta_self_build.py"
      - "scripts/stress_penta_compliance_license.py"
      - "scripts/run_function_tests.py"
      - "tests/test_penta_family.py"
      - "tests/test_penta_interop.py"
      - "automation/penta-family*.mdx"
      - "automation/penta-interoperability-fabric.mdx"
      - "docs/phase3/PENTA_FAMILY_PRODUCTION_CONTRACT_v*.md"
      - ".github/workflows/penta-institutional-services.yml"
      - ".github/workflows/penta-interoperability-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: penta-institutional-services-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify institutional services, controls, census and Penta Family
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Validate JSON artifacts
        run: |
          python -m json.tool data/penta/institutional-services.registry.json >/dev/null
          python -m json.tool data/penta/family.registry.json >/dev/null
          python -m json.tool data/penta/interoperability.registry.json >/dev/null
          python -m json.tool data/penta/systems.registry.json >/dev/null
          python -m json.tool data/penta/systems.extensions.pentascribe-marketer.json >/dev/null
          python -m json.tool data/penta/systems.extensions.operations-workforce.json >/dev/null
          python -m json.tool data/penta/systems.extensions.institutional-controls.json >/dev/null
          python -m json.tool data/penta/systems.extensions.observability.json >/dev/null
          python -m json.tool data/penta/compliance-license.catalog.json >/dev/null
          python -m json.tool data/penta/self-build.contract.json >/dev/null
          python -m json.tool schemas/penta/decision-packet.schema.json >/dev/null
          python -m json.tool schemas/penta/family-registry.schema.json >/dev/null
          python -m json.tool schemas/penta/interoperability-envelope.schema.json >/dev/null
          python -m json.tool schemas/penta/compliance-license.schema.json >/dev/null
          python -m json.tool schemas/penta/self-build-candidate.schema.json >/dev/null

      - name: Compile governance runtimes
        run: |
          python -m py_compile scripts/run_function_tests.py
          python -m py_compile runtime/penta_institutional_services.py
          python -m py_compile runtime/penta_institutional_controls.py
          python -m py_compile runtime/penta_compliance_license.py
          python -m py_compile runtime/penta_self_build.py
          python -m py_compile runtime/penta_family.py
          python -m py_compile runtime/penta_runtime_suite.py
          python -m py_compile runtime/penta_interop.py

      - name: Smoke test institutional controls runtime
        run: |
          python runtime/penta_institutional_controls.py >/dev/null
          python runtime/penta_compliance_license.py >/dev/null
          python runtime/penta_self_build.py >/dev/null

      - name: Verify Penta Family census snapshot
        run: python runtime/penta_family.py --root .

      - name: Verify portal index
        run: python runtime/penta_family.py --root . --portal >/dev/null

      - name: Verify representative service portals
        run: |
          python runtime/penta_family.py --root . --member penta.mail --portal >/dev/null
          python runtime/penta_family.py --root . --member penta.compliance --portal >/dev/null
          python runtime/penta_family.py --root . --member penta.license --portal >/dev/null
          python runtime/penta_family.py --root . --member penta.identity --portal >/dev/null
          python runtime/penta_family.py --root . --member penta.procure --portal >/dev/null
          python runtime/penta_family.py --root . --member penta.error --portal >/dev/null

      - name: Run institutional service authority-boundary tests
        run: python tests/test_penta_institutional_services.py

      - name: Run institutional control authority-boundary tests
        run: python tests/test_penta_institutional_controls.py

      - name: Run institutional control family-integration tests
        run: python tests/test_penta_institutional_controls_family.py

      - name: Run PentaCompliance and PentaLicense negative-control tests
        run: python scripts/run_function_tests.py tests/test_penta_compliance_license.py

      - name: Run governed self-build coverage tests
        run: python scripts/run_function_tests.py tests/test_penta_self_build.py

      - name: Stress PentaCompliance and PentaLicense determinism
        run: python scripts/stress_penta_compliance_license.py --cases 5000 --workers 16

      - name: Run Penta Family production-contract tests
        run: python tests/test_penta_family.py

      - name: Run family-wide interoperability certification
        run: |
          python -m unittest -v tests/test_penta_interop.py
          python runtime/penta_interop.py --root . --certify --output penta-interoperability-certification.json
