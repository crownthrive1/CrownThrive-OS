name: Penta PR Lifecycle Reusable

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      number:
        description: Optional pull request number
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      mode:
        description: pr, merge, or closer
        required: true
        default: pr
      number:
        description: Optional pull request number
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  statuses: read
  actions: read

env:
  PENTA_MODE: ${{ inputs.mode || github.event.inputs.mode }}
  PENTA_NUMBER: ${{ inputs.number || github.event.inputs.number }}
  # PentaTagger averages about five provider calls per entity when labels drift.
  # Keep each five-minute sweep comfortably below its 180-request safety budget;
  # untagged entities sort first, so repeated bounded sweeps converge the backlog.
  PENTA_TAGGER_SWEEP_MAX_ITEMS: '24'

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: penta-pr-lifecycle-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Checkout canonical Penta control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: crownthrive1/CrownThrive-OS
          ref: main
          persist-credentials: false
          path: penta-control

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: PentaGate and PentaHeal preflight
        shell: bash
        run: |
          set -euo pipefail
          gate_status=0
          python penta-control/scripts/penta_gate.py --root penta-control --output "$RUNNER_TEMP/pentagate-pr-lifecycle.json" || gate_status=$?
          python penta-control/scripts/penta_heal.py --root penta-control --gate-report "$RUNNER_TEMP/pentaheal-pr-lifecycle.json" --output "$RUNNER_TEMP/pentaheal-pr-lifecycle.json" || true
          if [[ "$gate_status" -ne 0 ]]; then
            echo 'PentaGate blocked terminal PR authority.'
            cat "$RUNNER_TEMP/pentagate-pr-lifecycle.json"
            exit "$gate_status"
          fi

      - name: Preflight PentaTagger before terminal authority
        if: ${{ env.PENTA_MODE == 'merge' || env.PENTA_MODE == 'closer' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          args=(verify --repo "$GITHUB_REPOSITORY" --kind pr --max-items "$PENTA_TAGGER_SWEEP_MAX_ITEMS" --no-comment)
          if [[ -n "${PENTA_NUMBER:-}" ]]; then
            args+=(--number "$PENTA_NUMBER")
          fi
          args+=(--receipt-path "$RUNNER_TEMP/penta-pr-lifecycle-tagger-preflight.json")
          args+=(--summary-path "$RUNNER_TEMP/penta-pr-lifecycle-tagger-preflight.md")
          python penta-control/scripts/penta_github_tagger.py "${args[@]}"

      - name: Run PentaPR, PentaMerge, or PentaCloser
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          args=("$PENTA_MODE" --repo "$GITHUB_REPOSITORY")
          if [[ -n "${PENTA_NUMBER:-}" ]]; then
            args+=(--number "$PENTA_NUMBER")
          fi
          python penta-control/scripts/penta_pr_lifecycle.py "${args[@]}"

      - name: Project final lifecycle through PentaTagger and verify provider readback
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          args=(verify --repo "$GITHUB_REPOSITORY" --kind pr --max-items "$PENTA_TAGGER_SWEEP_MAX_ITEMS" --no-comment)
          if [[ -n "${PENTA_NUMBER:-}" ]]; then
            args+=(--number "$PENTA_NUMBER")
          fi
          args+=(--receipt-path "$RUNNER_TEMP/penta-pr-lifecycle-tagger-receipt.json")
          args+=(--summary-path "$RUNNER_TEMP/penta-pr-lifecycle-tagger-summary.md")
          python penta-control/scripts/penta_github_tagger.py "${args[@]}"

      - name: Publish lifecycle and tagger receipts
        if: always()
        shell: bash
        run: |
          {
            echo '## Penta PR Lifecycle'
            echo
            echo "- Authority invoked: **${PENTA_MODE:-unknown}**"
            echo "- Target PR: **${PENTA_NUMBER:-repository sweep}**"
            echo "- PentaTagger bounded sweep size: **${PENTA_TAGGER_SWEEP_MAX_ITEMS}**"
            echo '- Preflight chain: PentaGate → PentaHeal packet (if needed) → PentaTagger'
            echo '- Terminal chain: PentaMerge/PentaCloser → PentaTagger terminal readback'
            echo
            if [[ -f "$RUNNER_TEMP/pentagate-pr-lifecycle.json" ]]; then
              echo '### PentaGate'
              echo '```json'
              cat "$RUNNER_TEMP/pentagate-pr-lifecycle.json"
              echo '```'
            fi
            if [[ -f "$RUNNER_TEMP/pentaheal-pr-lifecycle.json" ]]; then
              echo '### PentaHeal'
              echo '```json'
              cat "$RUNNER_TEMP/pentaheal-pr-lifecycle.json"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -f "$RUNNER_TEMP/penta-pr-lifecycle-tagger-preflight.md" ]]; then
            echo '### Preflight readback' >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/penta-pr-lifecycle-tagger-preflight.md" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "${PENTA_MODE:-}" == "merge" || "${PENTA_MODE:-}" == "closer" ]]; then
            echo '- PentaTagger preflight: **FAIL — receipt missing**' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo '- PentaTagger preflight: not required for classification-only mode' >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ -f "$RUNNER_TEMP/penta-pr-lifecycle-tagger-summary.md" ]]; then
            echo '### Final readback' >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/penta-pr-lifecycle-tagger-summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '- PentaTagger final readback: **FAIL — receipt missing**' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
