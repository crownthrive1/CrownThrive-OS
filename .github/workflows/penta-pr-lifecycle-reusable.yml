name: Penta PR Lifecycle Reusable — Classification & Projection

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      number:
        description: Optional pull request number
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      mode:
        description: pr, merge, or closer compatibility request; all modes are classification-only
        required: true
        default: pr
      number:
        description: Optional pull request number
        required: false
        default: ''

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read
  statuses: read
  actions: read

env:
  PENTA_MODE: ${{ inputs.mode || github.event.inputs.mode }}
  PENTA_NUMBER: ${{ inputs.number || github.event.inputs.number }}
  PENTA_TAGGER_SWEEP_MAX_ITEMS: '24'
  PENTA_TAGGER_REQUEST_BUDGET: '180'

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: penta-pr-lifecycle-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Checkout canonical Penta control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: crownthrive1/CrownThrive-OS
          ref: main
          persist-credentials: false
          path: penta-control

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: PentaGate and PentaHeal preflight
        shell: bash
        run: |
          set -euo pipefail
          gate_status=0
          python penta-control/scripts/penta_gate.py --root penta-control --output "$RUNNER_TEMP/pentagate-pr-lifecycle.json" || gate_status=$?
          python penta-control/scripts/penta_heal.py --root penta-control --gate-report "$RUNNER_TEMP/pentagate-pr-lifecycle.json" --output "$RUNNER_TEMP/pentaheal-pr-lifecycle.json" || true
          if [[ "$gate_status" -ne 0 ]]; then
            echo 'PentaGate blocked PR lifecycle projection.'
            cat "$RUNNER_TEMP/pentagate-pr-lifecycle.json"
            exit "$gate_status"
          fi

      - name: Preflight PentaTagger before terminal classification
        id: tagger-preflight
        if: ${{ env.PENTA_MODE == 'merge' || env.PENTA_MODE == 'closer' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            verify
            --repo "$GITHUB_REPOSITORY"
            --kind pr
            --max-items "$PENTA_TAGGER_SWEEP_MAX_ITEMS"
            --request-budget "$PENTA_TAGGER_REQUEST_BUDGET"
            --no-comment
          )
          if [[ -n "${PENTA_NUMBER:-}" ]]; then
            args+=(--number "$PENTA_NUMBER")
          fi
          args+=(--receipt-path "$RUNNER_TEMP/penta-pr-lifecycle-tagger-preflight.json")
          args+=(--summary-path "$RUNNER_TEMP/penta-pr-lifecycle-tagger-preflight.md")

          set +e
          python penta-control/scripts/penta_github_tagger.py "${args[@]}"
          status=$?
          set -e

          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if [[ "$status" -eq 75 ]]; then
            python - "$RUNNER_TEMP/penta-pr-lifecycle-tagger-preflight.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if payload.get("status") != "DEFERRED":
              raise SystemExit("exit 75 requires a DEFERRED PentaTagger receipt")
          print("PASS: lifecycle classification remains deferred without provider mutation")
          PY
            echo "deferred=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=PentaTagger lifecycle preflight deferred::Provider request budget was preserved. No terminal provider write is available to this workflow."
            exit 0
          fi
          echo "deferred=false" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Run PentaPR classification and projection compatibility
        if: ${{ success() && steps.tagger-preflight.outputs.deferred != 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          args=("$PENTA_MODE" --repo "$GITHUB_REPOSITORY")
          if [[ -n "${PENTA_NUMBER:-}" ]]; then
            args+=(--number "$PENTA_NUMBER")
          fi
          python penta-control/scripts/penta_pr_lifecycle_v4.py "${args[@]}"

      - name: Project final lifecycle through PentaTagger and verify provider readback
        id: tagger-final
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            verify
            --repo "$GITHUB_REPOSITORY"
            --kind pr
            --max-items "$PENTA_TAGGER_SWEEP_MAX_ITEMS"
            --request-budget "$PENTA_TAGGER_REQUEST_BUDGET"
            --no-comment
          )
          if [[ -n "${PENTA_NUMBER:-}" ]]; then
            args+=(--number "$PENTA_NUMBER")
          fi
          args+=(--receipt-path "$RUNNER_TEMP/penta-pr-lifecycle-tagger-receipt.json")
          args+=(--summary-path "$RUNNER_TEMP/penta-pr-lifecycle-tagger-summary.md")

          set +e
          python penta-control/scripts/penta_github_tagger.py "${args[@]}"
          status=$?
          set -e

          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if [[ "$status" -eq 75 ]]; then
            python - "$RUNNER_TEMP/penta-pr-lifecycle-tagger-receipt.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if payload.get("status") != "DEFERRED":
              raise SystemExit("exit 75 requires a DEFERRED PentaTagger receipt")
          print("PASS: bounded final projection deferred without workflow crash")
          PY
            echo "deferred=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=PentaTagger final projection deferred::Provider request budget was preserved and the deferred receipt remains available for the next sweep."
            exit 0
          fi
          echo "deferred=false" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Publish lifecycle and tagger receipts
        if: always()
        shell: bash
        run: |
          {
            echo '## Penta PR Lifecycle v4'
            echo
            echo "- Compatibility request: **${PENTA_MODE:-unknown}**"
            echo "- Target PR: **${PENTA_NUMBER:-repository sweep}**"
            echo "- Workflow authority: **classification, labels, comments, and evidence projection only**"
            echo "- Provider merge/close authority: **ct.penta.pr-terminalization.v4 only**"
            echo "- Required provider-write gate: **completed exact-head assignment + three DAIL + PentaDocs + Drive Human/Hybrid/Machine + independent certification + OS readback + current DAIL chain PASS**"
            echo "- Bounded PentaTagger sweep: **${PENTA_TAGGER_SWEEP_MAX_ITEMS} entities / ${PENTA_TAGGER_REQUEST_BUDGET} requests**"
            echo "- Terminal preflight state: **${{ steps.tagger-preflight.outputs.deferred == 'true' && 'DEFERRED' || 'COMPLETE_OR_NOT_REQUIRED' }}**"
            echo "- Final projection state: **${{ steps.tagger-final.outputs.deferred == 'true' && 'DEFERRED' || 'COMPLETE' }}**"
            echo '- Native terminal chain: Assignment Fabric → PentaDocs/Drive/three-DAIL → PentaCertify → OS/chain readback → PentaPR terminal provider → provider readback'
            echo
            if [[ -f "$RUNNER_TEMP/pentagate-pr-lifecycle.json" ]]; then
              echo '### PentaGate'
              echo '```json'
              cat "$RUNNER_TEMP/pentagate-pr-lifecycle.json"
              echo '```'
            fi
            if [[ -f "$RUNNER_TEMP/pentaheal-pr-lifecycle.json" ]]; then
              echo '### PentaHeal'
              echo '```json'
              cat "$RUNNER_TEMP/pentaheal-pr-lifecycle.json"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -f "$RUNNER_TEMP/penta-pr-lifecycle-tagger-preflight.md" ]]; then
            echo '### Preflight readback' >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/penta-pr-lifecycle-tagger-preflight.md" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "${PENTA_MODE:-}" == "merge" || "${PENTA_MODE:-}" == "closer" ]]; then
            echo '- PentaTagger preflight: **FAIL — receipt missing**' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo '- PentaTagger preflight: not required for classification-only mode' >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ -f "$RUNNER_TEMP/penta-pr-lifecycle-tagger-summary.md" ]]; then
            echo '### Final readback' >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/penta-pr-lifecycle-tagger-summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '- PentaTagger final readback: **FAIL — receipt missing**' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
