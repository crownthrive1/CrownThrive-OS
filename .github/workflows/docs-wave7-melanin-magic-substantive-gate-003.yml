name: Wave 7 Melanin Magic Substantive Gate 003

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/qualify_wave7_melanin_magic_substantive_gate_003.py'
      - '.github/workflows/docs-wave7-melanin-magic-substantive-gate-003.yml'
      - 'developers/manifests/docs-rebuild-quad-lane-batch-003.v1.json'
      - 'developers/manifests/docs-wave7-melanin-magic-substantive-gate-003.v1.json'
      - 'platforms/melanin-magic-institutional-registry.mdx'
      - 'scripts/build_substantive_rebuild_wave*.py'
      - 'scripts/build_help_center_*crosswalk.py'
  push:
    branches: [main]
    paths:
      - 'scripts/qualify_wave7_melanin_magic_substantive_gate_003.py'
      - '.github/workflows/docs-wave7-melanin-magic-substantive-gate-003.yml'
      - 'developers/manifests/docs-rebuild-quad-lane-batch-003.v1.json'
      - 'developers/manifests/docs-wave7-melanin-magic-substantive-gate-003.v1.json'
      - 'platforms/melanin-magic-institutional-registry.mdx'
      - 'scripts/build_substantive_rebuild_wave*.py'
      - 'scripts/build_help_center_*crosswalk.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: docs-wave7-melanin-magic-substantive-003-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify-melanin-magic-cohort-003:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Execute Melanin Magic substantive gate 003
        run: |
          set -o pipefail
          mkdir -p runtime/docs-rebuild
          python scripts/qualify_wave7_melanin_magic_substantive_gate_003.py \
            --output runtime/docs-rebuild/wave7-melanin-magic-substantive-gate-003.json \
            | tee runtime/docs-rebuild/wave7-melanin-magic-substantive-gate-003.log
      - name: Validate gate 003 invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('runtime/docs-rebuild/wave7-melanin-magic-substantive-gate-003.json').read_text())
          assert d['qualified_inventory_ids']==['HC-0104','HC-0109','HC-0110','HC-0112']
          assert d['records_machine_qualified']==4
          assert d['counting']['machine_qualified_before']==69
          assert d['counting']['machine_qualified_after']==73
          assert d['counting']['pending_p0_before']==380
          assert d['counting']['pending_p0_after']==376
          assert d['guardrails']['historical_body_recovery_claimed'] is False
          assert d['guardrails']['terminal_disposition_self_authorized'] is False
          assert d['guardrails']['provider_write_expansion_created'] is False
          for row in d['results']:
              assert row['machine_substantive_qualified'] is True
              assert row['candidate_flags']==[]
              assert row['missing_required_phrases']==[]
              assert row['terminal_disposition_accepted'] is False
          print('PASS_WAVE7_MELANIN_MAGIC_SUBSTANTIVE_GATE_003_INVARIANTS')
          PY
      - name: Compare permanent gate 003 receipt when present
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          permanent=Path('developers/manifests/docs-wave7-melanin-magic-substantive-gate-003.v1.json')
          if not permanent.exists():
              print('NO_PERMANENT_GATE_003_RECEIPT_YET')
              raise SystemExit(0)
          d=json.loads(Path('runtime/docs-rebuild/wave7-melanin-magic-substantive-gate-003.json').read_text())
          p=json.loads(permanent.read_text())
          assert p['gate_id']==d['gate_id']
          # Preserve the immutable v1 receipt digest while validating the
          # current PentaDocs v2 execution by identity and count semantics.
          assert p['gate_sha256']=='6104d57c4c99a741e4c3ef8ebf7e074862b403d6edd7e8289f90ea47369b817e'
          assert p['qualified_inventory_ids']==d['qualified_inventory_ids']
          assert p['official_counts_after_gate']=={'machine_qualified_p0':73,'pending_p0':376}
          print('PASS_PERMANENT_WAVE7_MELANIN_MAGIC_GATE_003_RECEIPT')
          PY
      - name: Upload gate 003 evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-wave7-melanin-magic-substantive-003-${{ github.run_id }}
          path: runtime/docs-rebuild/
          if-no-files-found: error
          retention-days: 90
