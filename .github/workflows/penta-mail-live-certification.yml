name: PentaMail Live Certification — Compatibility HOLD

# Legacy Phase-4 gate identity retained without a provider write path.
# The executable implementation lives in penta-provider-control-plane.yml and
# remains BUILT_HOLD_AUTHORITY until a governed single-use authority receipt
# channel and protected-environment settings readback are adopted.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pentamail-compatibility-hold-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authority-hold:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record fail-closed compatibility disposition
        shell: bash
        run: |
          {
            echo '## PentaMail Live Certification — BUILT_HOLD_AUTHORITY'
            echo
            echo 'This legacy workflow identity has no credentials and cannot send mail.'
            echo 'Activation requires an adopted single-use authority receipt verifier and protected-environment settings readback.'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 78
