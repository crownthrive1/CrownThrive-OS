name: PentaMail Live Certification
# activation-revision: 2026-08-26.5 — all-Penta convergence + workflow_run + signed provider proof.

on:
  workflow_dispatch:
    inputs:
      recipient:
        description: 'Authorized PentaMail certification recipient'
        required: false
        default: 'jones.usmc.kj@gmail.com'
  push:
    branches: [main]
    paths:
      - 'runtime/penta_mail.py'
      - 'runtime/penta_runtime_suite.py'
      - 'runtime/penta_convergence_certifier.py'
      - 'tests/test_penta_convergence_certifier.py'
      - '.github/workflows/penta-mail-live-certification.yml'
  workflow_run:
    workflows: ['CodeQL']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: pentamail-live-certification
  cancel-in-progress: false

jobs:
  certify-send-readback:
    # Connector-originated merges have not reliably emitted repository push
    # workflows. A successful GitHub-native CodeQL workflow_run is therefore
    # the production bridge. The explicit founder activation token remains
    # mandatory. Keep this secret-bearing provider workload on GitHub-hosted
    # infrastructure; the self-hosted fabric remains bootstrap-certification
    # only until a separate policy promotion. Never add pull_request here.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[pentamail-live-certify]')) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       contains(github.event.workflow_run.head_commit.message, '[pentamail-live-certify]'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      PENTAMAIL_FROM: ${{ secrets.PENTAMAIL_FROM }}
      PENTA_NURTURE_COOKIE_SIGNING_KEY: ${{ secrets.PENTA_NURTURE_COOKIE_SIGNING_KEY }}
      PENTAMAIL_RECIPIENT: ${{ github.event.inputs.recipient || 'jones.usmc.kj@gmail.com' }}
      PENTAMAIL_SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PENTAMAIL_SOURCE_SHA }}
          persist-credentials: false

      - name: Compile Penta certification software
        run: |
          python3 -m py_compile \
            runtime/penta_mail.py \
            runtime/penta_runtime_suite.py \
            runtime/penta_family.py \
            runtime/penta_observability.py \
            runtime/penta_convergence_certifier.py \
            runtime/penta-provider-control-plane/penta_control_plane.py

      - name: Run Penta regression suites
        run: |
          python3 -m unittest discover -s tests -p 'test_penta*.py' -v

      - name: Invoke and certify every registered Penta
        run: |
          python3 runtime/penta_convergence_certifier.py \
            --root . \
            --output penta-convergence-certification.json \
            --summary-output penta-convergence-summary.txt
          sha256sum penta-convergence-certification.json > penta-convergence-certification.sha256
          cat penta-convergence-summary.txt

      - name: Establish read-only Resend certification
        run: |
          python3 - <<'PY'
          import importlib.util
          import json
          from pathlib import Path
          import sys

          root = Path.cwd()
          module_path = root / 'runtime' / 'penta-provider-control-plane' / 'penta_control_plane.py'
          spec = importlib.util.spec_from_file_location('penta_control_plane_live_mail', module_path)
          mod = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = mod
          spec.loader.exec_module(mod)

          registry = mod.Registry(root / 'runtime' / 'penta-provider-control-plane' / 'providers.json')
          state = root / '.penta' / 'pentamail-provider-control'
          binding = mod.PentaCredentials(registry, state).bind('resend')
          build = mod.PentaBuild(registry, state).build('resend')
          cert = mod.PentaCertify(registry, state).certify('resend')
          nurture = mod.PentaNurture(registry, state).observe('resend')
          result = {
              'credential': 'BOUND' if binding.bound else 'HOLD_UNBOUND',
              'build': build.state,
              'certification': cert.state,
              'certified_operations': cert.certified_operations,
              'health': nurture.health,
          }
          Path('resend-read-certification.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print(json.dumps(result, sort_keys=True))
          if not binding.bound:
              raise SystemExit('RESEND credential is HOLD_UNBOUND')
          if cert.state not in {'CERTIFIED', 'WRITE_VERIFIED'}:
              raise SystemExit('Resend read-only live certification did not pass')
          if 'domain_read' not in cert.certified_operations:
              raise SystemExit('Resend domain_read lacks live readback evidence')
          PY

      - name: Send all-systems owner report through PentaMail and exact-readback
        run: |
          python3 - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path
          import sys

          root = Path.cwd()

          def load(name, path):
              spec = importlib.util.spec_from_file_location(name, path)
              mod = importlib.util.module_from_spec(spec)
              sys.modules[spec.name] = mod
              spec.loader.exec_module(mod)
              return mod

          pm = load('penta_mail_live', root / 'runtime' / 'penta_mail.py')
          prs = load('penta_runtime_suite_live', root / 'runtime' / 'penta_runtime_suite.py')

          snapshot = prs.build_snapshot(root)
          report = Path('penta-convergence-summary.txt').read_text().strip()
          report += '\n\n' + prs.owner_summary(snapshot)
          report += '\nGitHub source commit: ' + os.environ['PENTAMAIL_SOURCE_SHA']
          report += '\nExecution authority: explicit Founding Member D1 transport certification directive.'
          report += '\nAll child Penta maturity and downstream authority gates remain independently fail-closed.'

          sender = (os.environ.get('PENTAMAIL_FROM') or '').strip()
          if not sender:
              sender = 'CrownThrive PentaMail <contact@crownthrive.com>'
          recipient = os.environ['PENTAMAIL_RECIPIENT'].strip()
          correlation = 'penta-all-systems-live-' + os.environ['GITHUB_RUN_ID']
          authority_ref = 'founder-directive-2026-08-26-all-penta-live-certification'

          envelope = pm.build_envelope(
              origin_penta='penta.status',
              purpose='all_systems_certification_report',
              classification='internal',
              recipient=recipient,
              sender_identity=sender,
              subject='[CrownThrive Systems Certification] All-Penta + PentaMail Live Proof — 2026-08-26',
              body_text=report,
              correlation_id=correlation,
              authority_ref=authority_ref,
              authority_class='D1',
              priority='high',
              retention_classification='institutional_status',
              idempotency_key='penta-all-systems-live-' + os.environ['PENTAMAIL_SOURCE_SHA'],
          )
          authorization = pm.AuthorizationContext(
              authorized=True,
              authorized_by='Founding Member execution directive 2026-08-26',
              authority_ref=authority_ref,
              authority_class='D1',
          )
          receipt = pm.certification_send(
              envelope=envelope,
              authorization=authorization,
              state_dir=root / '.penta' / 'pentamail',
          )
          Path('pentamail-live-receipt.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(json.dumps({
              'provider': receipt['provider'],
              'provider_message_id': receipt['provider_message_id'],
              'lifecycle_state': receipt['lifecycle_state'],
              'correlation_id': receipt['correlation_id'],
              'exact_readback': all(e.get('readback') is True for e in receipt['live_evidence']),
          }, sort_keys=True))
          PY

      - name: Certify exact email_send and verify production gate
        run: |
          python3 - <<'PY'
          import importlib.util
          import json
          from pathlib import Path
          import sys

          root = Path.cwd()
          module_path = root / 'runtime' / 'penta-provider-control-plane' / 'penta_control_plane.py'
          spec = importlib.util.spec_from_file_location('penta_control_plane_post_mail', module_path)
          mod = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = mod
          spec.loader.exec_module(mod)

          receipt = json.loads(Path('pentamail-live-receipt.json').read_text())
          registry = mod.Registry(root / 'runtime' / 'penta-provider-control-plane' / 'providers.json')
          state = root / '.penta' / 'pentamail-provider-control'
          cert = mod.PentaCertify(registry, state).certify('resend', live_evidence=receipt['live_evidence'])
          nurture = mod.PentaNurture(registry, state).observe('resend')
          gate = mod.ProductionGate(registry, state).decide('resend', 'email_send')
          result = {
              'certification': cert.state,
              'certified_operations': cert.certified_operations,
              'health': nurture.health,
              'email_send_gate': gate,
              'provider_message_id': receipt['provider_message_id'],
              'lifecycle_state': receipt['lifecycle_state'],
          }
          Path('pentamail-certification-result.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print(json.dumps(result, sort_keys=True))
          if cert.state != 'WRITE_VERIFIED':
              raise SystemExit('email_send did not reach WRITE_VERIFIED')
          if not gate.get('eligible'):
              raise SystemExit('email_send production gate did not pass after exact readback certification')
          PY

      - name: Build sanitized all-systems attestation subject
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          receipt = json.loads(Path('pentamail-live-receipt.json').read_text())
          cert = json.loads(Path('pentamail-certification-result.json').read_text())
          convergence = json.loads(Path('penta-convergence-certification.json').read_text())
          exact_readback = bool(receipt.get('live_evidence')) and all(
              evidence.get('readback') is True for evidence in receipt['live_evidence']
          )
          pass_state = (
              convergence.get('disposition') == 'PASS'
              and exact_readback
              and cert.get('certification') == 'WRITE_VERIFIED'
              and cert.get('email_send_gate', {}).get('eligible') is True
          )
          evidence = {
              'schema': 'crownthrive.penta.all-systems-live-certification.v1',
              'disposition': 'PASS' if pass_state else 'HOLD',
              'family_invocation': {
                  'member_count': convergence.get('family', {}).get('member_count'),
                  'invocation_count': convergence.get('family', {}).get('invocation_count'),
                  'eligible_count': convergence.get('family', {}).get('eligible_count'),
                  'held_count': convergence.get('family', {}).get('held_count'),
                  'evidence_sha256': convergence.get('evidence_sha256'),
              },
              'provider': receipt.get('provider'),
              'provider_message_id': receipt.get('provider_message_id'),
              'lifecycle_state': receipt.get('lifecycle_state'),
              'correlation_id': receipt.get('correlation_id'),
              'exact_provider_readback': exact_readback,
              'certification': cert.get('certification'),
              'email_send_eligible': cert.get('email_send_gate', {}).get('eligible', False),
              'self_hosted_runner_state': 'HOLD_UNTIL_NODE24_MACHINE_ATTESTATION_IS_VERIFIED',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'commit_sha': os.environ['PENTAMAIL_SOURCE_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'event': os.environ['GITHUB_EVENT_NAME'],
              'attested_at': datetime.now(timezone.utc).isoformat(),
          }
          if evidence['disposition'] != 'PASS':
              raise SystemExit('refusing to attest an unproven all-systems/provider result')
          payload = json.dumps(evidence, indent=2, sort_keys=True) + '\n'
          Path('penta-system-certification-evidence.json').write_text(payload)
          digest = hashlib.sha256(payload.encode()).hexdigest()
          Path('penta-system-certification-evidence.sha256').write_text(
              digest + '  penta-system-certification-evidence.json\n'
          )
          print(payload)
          print('sha256=' + digest)
          PY

      - name: Attest all-systems certification evidence
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: penta-system-certification-evidence.json

      - name: Upload complete certification proof bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: penta-all-systems-certification-${{ github.run_id }}
          path: |
            penta-convergence-certification.json
            penta-convergence-certification.sha256
            penta-convergence-summary.txt
            resend-read-certification.json
            pentamail-certification-result.json
            penta-system-certification-evidence.json
            penta-system-certification-evidence.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish PentaStatus evidence summary
        if: always()
        run: |
          if [ -f penta-system-certification-evidence.json ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r = json.loads(Path('penta-system-certification-evidence.json').read_text())
          f = r['family_invocation']
          print('## CrownThrive All-Penta Systems Certification — ' + r.get('disposition', 'UNKNOWN'))
          print()
          print('Pentas invoked: ' + str(f.get('invocation_count')) + '/' + str(f.get('member_count')))
          print('Execution-eligible: ' + str(f.get('eligible_count')))
          print('Held without promotion: ' + str(f.get('held_count')))
          print('Provider: ' + str(r.get('provider')))
          print('Provider message ID: ' + str(r.get('provider_message_id')))
          print('Lifecycle at exact readback: ' + str(r.get('lifecycle_state')))
          print('email_send eligible: ' + str(r.get('email_send_eligible')))
          print('Provenance subject: `penta-system-certification-evidence.json`')
          print('Self-hosted PentaFabric: ' + r.get('self_hosted_runner_state', 'UNKNOWN'))
          PY
          else
            echo '## CrownThrive All-Penta Systems Certification — HOLD/FAILED' >> "$GITHUB_STEP_SUMMARY"
          fi
