name: COS 1.8 Constitutional Gate
on:
  pull_request:
    paths:
      - ".crownthrive/releases/cos-1.8.0-rc.1*"
      - "governance/pentagovernance/**"
      - "scripts/cos18/**"
      - "tests/cos18/**"
      - "supabase/migrations/20260904000100_cos_1_8_constitutional_kernel.sql"
      - ".github/workflows/cos-1.8-constitutional-gate.yml"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  deterministic-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - run: python -m compileall -q scripts/cos18 tests/cos18
      - run: python -m unittest discover -s tests/cos18 -p "test_*.py" -v
      - run: python scripts/cos18/validate_cos18_kernel.py --root .
      - name: Prohibit premature production claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          k=json.loads(Path(".crownthrive/releases/cos-1.8.0-rc.1.kernel.json").read_text())
          assert k["release"]["constitutional_effectiveness"] is False
          assert k["release"]["production_eligible"] is False
          assert k["release"]["authority_created"] is False
          print("PASS_FAIL_CLOSED_RELEASE_CLAIMS")
          PY
