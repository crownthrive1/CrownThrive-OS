name: PentaDocs Presentation Contract Integrator

on:
  push:
    branches:
      - admin-mcp/pentadocs-mobile-visual-repair-47e2929
    paths:
      - ".github/workflows/pentadocs-presentation-integrator.yml"

permissions:
  contents: write

concurrency:
  group: pentadocs-presentation-integrator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integrate:
    name: Integrate presentation contract into canonical docs governance
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: admin-mcp/pentadocs-mobile-visual-repair-47e2929
          fetch-depth: 0

      - name: Bind presentation validation into validate_docs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/validate_docs.py")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  'TEXT_SUFFIXES = {".md", ".mdx", ".json", ".svg", ".yml", ".yaml", ".py", ".txt"}',
                  'TEXT_SUFFIXES = {".md", ".mdx", ".json", ".svg", ".css", ".yml", ".yaml", ".py", ".txt"}',
              ),
              (
                  'try:\n    from pentadocs_quality import validate_repository as validate_pentadocs_quality\nexcept ModuleNotFoundError:  # Imported as scripts.validate_docs in unit tests.\n    from scripts.pentadocs_quality import validate_repository as validate_pentadocs_quality\n',
                  'try:\n    from pentadocs_quality import validate_repository as validate_pentadocs_quality\nexcept ModuleNotFoundError:  # Imported as scripts.validate_docs in unit tests.\n    from scripts.pentadocs_quality import validate_repository as validate_pentadocs_quality\n\ntry:\n    from validate_pentadocs_presentation import (\n        validate_repository as validate_pentadocs_presentation,\n    )\nexcept ModuleNotFoundError:  # Imported as scripts.validate_docs in unit tests.\n    from scripts.validate_pentadocs_presentation import (\n        validate_repository as validate_pentadocs_presentation,\n    )\n',
              ),
              (
                  '    Path("docs.json"),\n    Path("logo/light.svg"),',
                  '    Path("docs.json"),\n    Path("style.css"),\n    Path("logo/light.svg"),',
              ),
              (
                  '    navigation = docs_config.get("navigation")\n',
                  '    presentation_errors = validate_pentadocs_presentation(root)\n    errors.extend(\n        f"PentaDocs presentation: {error}" for error in presentation_errors\n    )\n\n    navigation = docs_config.get("navigation")\n',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"refusing non-deterministic validate_docs edit: expected one match, got {count}: {old[:80]!r}"
                  )
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/docs-governance.yml")
          workflow_text = workflow.read_text(encoding="utf-8")
          css_path_needle = '      - "**/*.svg"\n      - "**/*.yml"'
          css_path_replacement = '      - "**/*.svg"\n      - "**/*.css"\n      - "**/*.yml"'
          if workflow_text.count(css_path_needle) != 1:
              raise SystemExit("docs-governance CSS path insertion point drifted")
          workflow_text = workflow_text.replace(css_path_needle, css_path_replacement, 1)

          compile_needle = '          python -m py_compile scripts/validate_docs.py\n          python -m py_compile scripts/pentadocs_quality.py'
          compile_replacement = '          python -m py_compile scripts/validate_docs.py\n          python -m py_compile scripts/validate_pentadocs_presentation.py\n          python -m py_compile scripts/pentadocs_quality.py'
          if workflow_text.count(compile_needle) != 1:
              raise SystemExit("docs-governance compile insertion point drifted")
          workflow_text = workflow_text.replace(compile_needle, compile_replacement, 1)
          workflow.write_text(workflow_text, encoding="utf-8")

          Path(".github/workflows/pentadocs-presentation-integrator.yml").unlink()
          PY

          python -m py_compile scripts/validate_docs.py scripts/validate_pentadocs_presentation.py
          python scripts/validate_pentadocs_presentation.py

      - name: Commit deterministic integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CrownThrive PentaDocs"
          git config user.email "contact@crownthrive.com"
          git add scripts/validate_docs.py .github/workflows/docs-governance.yml .github/workflows/pentadocs-presentation-integrator.yml
          git diff --cached --check
          git commit -m "test(pentadocs): bind presentation contract into governed merge path"
          git push origin HEAD:admin-mcp/pentadocs-mobile-visual-repair-47e2929
