name: CHLOM Wallet Independent Review Contract

on:
  pull_request:
    paths:
      - "developers/chlom-wallet-independent-review-contract.mdx"
      - "developers/chlom-wallet-independent-review-lanes.mdx"
      - "developers/manifests/chlom-wallet-independent-review-contract.v1.json"
      - "developers/manifests/chlom-wallet-independent-review-contract.v2.json"
      - "developers/reference/chlom-wallet/smart-account/independent-review-lane-packets.v1.json"
      - "developers/reference/chlom-wallet/smart-account/independent-review-lane-packets.v2.json"
      - "developers/reference/chlom-wallet/smart-account/independent-review-receipt.v1.schema.json"
      - "developers/reference/chlom-wallet/smart-account/independent-review-receipt.v2.schema.json"
      - "developers/reference/chlom-wallet/smart-account/independent-review-status.v1.schema.json"
      - "developers/reference/chlom-wallet/smart-account/test-independent-review-receipt-contract.mjs"
      - "developers/reference/chlom-wallet/smart-account/test-independent-review-receipt-contract-v2.mjs"
      - ".github/workflows/chlom-wallet-independent-review-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chlom-wallet-independent-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Validate dynamic exact-head reviewer target without fabricating review
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      REVIEW_TARGET_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out actual PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Require checkout and review target equality
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${REVIEW_TARGET_HEAD_SHA}"
          test -n "${REVIEW_TARGET_HEAD_SHA}"

      - name: Install exact schema validators
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-save --no-package-lock ajv@8.17.1 ajv-formats@3.0.1

      - name: Validate v1 compatibility and v2 dynamic-target contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool developers/manifests/chlom-wallet-independent-review-contract.v1.json >/dev/null
          python -m json.tool developers/manifests/chlom-wallet-independent-review-contract.v2.json >/dev/null
          python -m json.tool developers/reference/chlom-wallet/smart-account/independent-review-lane-packets.v1.json >/dev/null
          python -m json.tool developers/reference/chlom-wallet/smart-account/independent-review-lane-packets.v2.json >/dev/null
          python -m json.tool developers/reference/chlom-wallet/smart-account/independent-review-receipt.v1.schema.json >/dev/null
          python -m json.tool developers/reference/chlom-wallet/smart-account/independent-review-receipt.v2.schema.json >/dev/null
          node --check developers/reference/chlom-wallet/smart-account/test-independent-review-receipt-contract-v2.mjs
          node developers/reference/chlom-wallet/smart-account/test-independent-review-receipt-contract-v2.mjs

      - name: Verify frozen evidence anchor and runtime-target semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          manifest=json.load(open('developers/manifests/chlom-wallet-independent-review-contract.v2.json'))
          packet=json.load(open('developers/reference/chlom-wallet/smart-account/independent-review-lane-packets.v2.json'))
          anchor='df67672b99839e58d7873dabe49e06de58007820'
          digest='a11e9c03cfd0ec05d9e4f1171b1d99e124cf2f7fffd697881bb3718f13e4b9fb'
          runtime=os.environ['REVIEW_TARGET_HEAD_SHA']
          assert manifest['technical_snapshot']['evidence_anchor_head_sha']==anchor
          assert manifest['technical_snapshot']['evidence_digest_sha256']==digest
          assert manifest['review_target']['mode']=='pull_request_head_at_review_time'
          assert manifest['review_target']['source']=='github.event.pull_request.head.sha'
          assert manifest['review_target']['exact_head_required'] is True
          assert manifest['review_target']['receipt_must_match_runtime_target'] is True
          assert manifest['review_target']['static_head_pin_prohibited'] is True
          assert packet['technical_snapshot']['evidence_anchor_head_sha']==anchor
          assert packet['review_target_contract']['static_review_target_sha'] is None
          assert packet['review_target_contract']['runtime_target_equality_required'] is True
          assert len(packet['lanes'])==5
          assert packet['current_state']['reviewers_fresh']==0
          assert packet['current_state']['reviewers_stale']==5
          assert packet['current_state']['receipts_recorded']==0
          assert manifest['current_counts']['receipts_recorded']==0
          assert all(v is False for v in manifest['hard_boundaries'].values())
          assert len(runtime)==40
          PY

      - name: Enforce no-secret and no-authority projection
        shell: bash
        run: |
          set -euo pipefail
          files=(
            developers/manifests/chlom-wallet-independent-review-contract.v2.json
            developers/reference/chlom-wallet/smart-account/independent-review-lane-packets.v2.json
            developers/reference/chlom-wallet/smart-account/independent-review-receipt.v2.schema.json
            developers/reference/chlom-wallet/smart-account/test-independent-review-receipt-contract-v2.mjs
          )
          if grep -nE -- 'sk_live_[A-Za-z0-9]{16,}|rk_live_[A-Za-z0-9]{16,}|whsec_[A-Za-z0-9]{16,}|-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----|sb_secret_[A-Za-z0-9._-]{16,}' "${files[@]}"; then
            echo 'Potential secret-shaped material detected.'
            exit 1
          fi
          if grep -nE -- '"(deployment_authorized|broadcast_authorized|custody|money_movement|production_rights_grant|phase_advancement|merge_authorized)"[[:space:]]*:[[:space:]]*true' "${files[@]}"; then
            echo 'Review contract crossed a no-authority boundary.'
            exit 1
          fi

      - name: Record boundary
        run: |
          echo "Review target is the actual PR head ${REVIEW_TARGET_HEAD_SHA}; evidence remains anchored to df67672b99839e58d7873dabe49e06de58007820."
          echo 'No reviewer heartbeat, review receipt, vote, profile promotion, deployment, broadcast, custody, money movement, rights grant, phase advancement or merge authority is created.'
