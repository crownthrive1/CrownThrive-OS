name: Governed Merge Gate

on:
  pull_request:
  push:
    branches:
      - main
      - "phase4/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: governed-merge-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governed-merge-gate:
    name: CrownThrive governed merge gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve exact governed diff range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_HEAD_SHA: ${{ github.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # The sovereign-governance contract preserves a shallow checkout perimeter, but the
          # applicability resolver requires the complete ancestry before computing merge-base.
          # Expand history here instead of relying on a shallow merge-base or caller assertions.
          if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
            git fetch --no-tags --prune --unshallow origin
          fi
          test "$(git rev-parse --is-shallow-repository)" = "false"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            head="$PUSH_HEAD_SHA"
            base="$PUSH_BEFORE_SHA"
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base="$(git rev-parse "${head}^")"
            fi
          else
            head="$(git rev-parse HEAD)"
            base="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "${base}^{commit}"
          git cat-file -e "${head}^{commit}"
          merge_base="$(git merge-base "$base" "$head")"
          test -n "$merge_base"
          echo "CT_GIT_BASE_SHA=$base" >> "$GITHUB_ENV"
          echo "CT_GIT_HEAD_SHA=$head" >> "$GITHUB_ENV"
          echo "CT_GIT_MERGE_BASE_SHA=$merge_base" >> "$GITHUB_ENV"

      - name: Resolve applicable PR gate contract
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          python scripts/resolve_pr_gate_applicability.py \
            --repo . \
            --base "$CT_GIT_BASE_SHA" \
            --head "$CT_GIT_HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT" \
            --json-output "$RUNNER_TEMP/ct-pr-gate-contract.json"
          cat "$RUNNER_TEMP/ct-pr-gate-contract.json"

      - name: Validate gate applicability resolver
        run: python scripts/resolve_pr_gate_applicability.py --self-test

      - name: Verify universal governed validator syntax
        run: |
          python -m py_compile scripts/resolve_pr_gate_applicability.py
          python -m py_compile scripts/governed_merge_decision.py
          python -m py_compile scripts/governed_current_pr_preflight_v2.py
          python -m py_compile scripts/penta_pr_autopilot.py

      - name: Validate evidence-data classifier negative vectors
        run: python scripts/governed_current_pr_preflight_v2.py --self-test

      - name: Enforce PentaSerialized continuity in required merge perimeter
        run: |
          python -m penta.runtime.serialized git-gate \
            --repo . \
            --base "$CT_GIT_BASE_SHA" \
            --head "$CT_GIT_HEAD_SHA" \
            --policy penta/registry/serialized-suite.json

      - name: Bind governed changed files to trusted Git diff
        run: |
          python scripts/governed_merge_decision.py \
            --verify-git-diff \
            --git-base "$CT_GIT_BASE_SHA" \
            --git-head "$CT_GIT_HEAD_SHA"
          python scripts/governed_current_pr_preflight_v2.py \
            --git-base "$CT_GIT_BASE_SHA" \
            --git-head "$CT_GIT_HEAD_SHA"

      - name: Set up Node.js for applicable projection checks
        if: steps.scope.outputs.homepage == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install validation dependencies for applicable executable controls
        if: steps.scope.outputs.phase_control == 'true' || steps.scope.outputs.penta_control == 'true' || steps.scope.outputs.security == 'true' || steps.scope.outputs.namespace_api == 'true'
        run: python -m pip install --disable-pip-version-check -r requirements/cos-v1-validation.txt

      - name: Validate GitHub Actions runtime and supply-chain policy
        if: steps.scope.outputs.workflow_policy == 'true'
        run: python scripts/validate_github_actions_runtime_policy.py

      - name: Validate Phase 4 V4 gate contract
        if: steps.scope.outputs.phase_control == 'true'
        run: python scripts/validate_gate_registry_v4.py

      - name: Validate Phase 3 institutional gate
        if: steps.scope.outputs.phase3_state == 'true'
        run: python scripts/validate_phase3_institutional_gate.py

      - name: Validate exact retired-phase alias dispositions
        if: steps.scope.outputs.phase_control == 'true'
        run: python scripts/penta_gap_closure.py . --json

      - name: Run function-style Penta control tests
        if: steps.scope.outputs.penta_control == 'true'
        run: |
          python scripts/run_function_tests.py \
            tests/test_governed_evidence_data_classification.py \
            tests/test_penta_compliance_license.py \
            tests/test_penta_family.py \
            tests/test_penta_institutional_controls.py \
            tests/test_penta_institutional_controls_family.py \
            tests/test_penta_self_build.py
          python scripts/penta_pr_autopilot.py --self-test

      - name: Validate institutional documentation
        if: steps.scope.outputs.documentation == 'true'
        run: python scripts/validate_docs.py

      - name: Validate homepage control-plane projection
        if: steps.scope.outputs.homepage == 'true'
        run: |
          python scripts/render_homepage_projection.py --check
          python scripts/validate_homepage_control_plane.py

      - name: Validate Collab Portal adapter contract
        if: steps.scope.outputs.collab_portal == 'true'
        run: python scripts/validate_collab_portal_adapter.py

      - name: Validate Holdings 82-domain seed
        if: steps.scope.outputs.holdings_82 == 'true'
        run: python scripts/validate_holdings_82_domain_seed.py

      - name: Validate affected registry seed and crosswalks
        if: steps.scope.outputs.registry_crosswalk == 'true'
        run: |
          python scripts/validate_phase_2_7_74_registry_seed.py
          python scripts/validate_s103_74_canonical_crosswalk.py
          python scripts/validate_s103_s100_engine_domain_edges.py

      - name: Validate namespace and API/MCP control plane
        if: steps.scope.outputs.namespace_api == 'true'
        run: python scripts/validate_phase_namespace_and_api_control.py

      - name: Validate agent-sovereign governance
        if: steps.scope.outputs.agent_governance == 'true'
        run: python scripts/validate_agent_sovereign_governance.py

      - name: Validate deterministic security governance
        if: steps.scope.outputs.security == 'true'
        run: python scripts/validate_security_governance.py

      - name: Validate sovereign merge decision invariants
        if: steps.scope.outputs.phase_control == 'true' || steps.scope.outputs.security == 'true'
        run: python scripts/governed_merge_decision.py --self-test

      - name: Validate PM routing invariants
        if: steps.scope.outputs.pm_routing == 'true'
        run: python scripts/resolve_pm_notification_recipients.py --self-test

      - name: Validate security self-healing invariants
        if: steps.scope.outputs.security_self_heal == 'true'
        run: python scripts/security_self_heal_plan.py --self-test

      - name: Validate repository enforcement target
        if: steps.scope.outputs.workflow_policy == 'true' || steps.scope.outputs.phase_control == 'true'
        run: python scripts/validate_repository_governance_enforcement_state.py

      - name: Prevent conflicting advanced CodeQL setup
        if: steps.scope.outputs.workflow_policy == 'true'
        shell: bash
        run: |
          if grep -R -nE '^[[:space:]]*uses:[[:space:]]*github/codeql-action/' .github/workflows; then
            echo "Advanced CodeQL workflow detected while GitHub default setup is the registered provider mode."
            exit 1
          fi
          echo "Provider-managed CodeQL default setup remains the registered mode."
          echo "This check does not synthesize provider CodeQL findings."

      - name: Detect dependency-manifest changes
        id: dependency_scope
        shell: bash
        run: |
          set -euo pipefail
          dependency_pattern='(^|/)(package\.json|package-lock\.json|npm-shrinkwrap\.json|yarn\.lock|pnpm-lock\.yaml|bun\.lockb?|deno\.lock|requirements([^/]*)\.txt|Pipfile|Pipfile\.lock|poetry\.lock|pyproject\.toml|uv\.lock|Gemfile|Gemfile\.lock|go\.mod|go\.sum|Cargo\.toml|Cargo\.lock|composer\.json|composer\.lock|pom\.xml|build\.gradle|build\.gradle\.kts|gradle\.lockfile|packages\.lock\.json|paket\.dependencies|paket\.lock|mix\.exs|mix\.lock|Package\.swift|Package\.resolved)$'
          if git diff --name-only "$CT_GIT_BASE_SHA" "$CT_GIT_HEAD_SHA" | grep -Eq "$dependency_pattern"; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "Dependency manifest changes detected; provider dependency review is required."
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "No dependency manifest changes detected; provider dependency review is NOT_APPLICABLE."
          fi

      - name: Review dependency changes
        if: steps.dependency_scope.outputs.required == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          base-ref: ${{ env.CT_GIT_BASE_SHA }}
          head-ref: ${{ env.CT_GIT_HEAD_SHA }}

      - name: Check whitespace and conflict markers
        run: |
          git diff --check "$CT_GIT_BASE_SHA" "$CT_GIT_HEAD_SHA"
          if git diff --check "$CT_GIT_BASE_SHA" "$CT_GIT_HEAD_SHA" | grep -q .; then
            exit 1
          fi
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!THIRD_PARTY_NOTICES.md'; then
            echo "Unresolved merge-conflict markers detected."
            exit 1
          fi

      - name: Publish applicable gate summary
        if: always()
        shell: bash
        run: |
          {
            echo '## CrownThrive governed merge gate — applicability v1'
            echo
            echo "- Change class: **${{ steps.scope.outputs.change_class || 'unresolved' }}**"
            echo "- Risk class: **${{ steps.scope.outputs.risk_class || 'unresolved' }}**"
            echo "- Required validation groups: \`${{ steps.scope.outputs.required_groups || 'universal-only' }}\`"
            echo "- Contract SHA-256: \`${{ steps.scope.outputs.contract_sha256 || 'unresolved' }}\`"
            echo '- Unrelated controls resolve as **NOT_APPLICABLE**, never synthetic PASS.'
            echo '- Release-specific PentaSecurity / CHLOM / CIE / PentaCertifier / provider gates remain separate governed predicates.'
          } >> "$GITHUB_STEP_SUMMARY"
