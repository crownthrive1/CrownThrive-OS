name: Penta Portal Docs

on:
  push:
    branches:
      - "admin-mcp/penta-portal-*"
    paths:
      - "scripts/penta_portal_docs.py"
      - "scripts/penta_portal_finalize.py"
      - "tests/test_penta_portal_docs.py"
      - "data/penta/**"
      - "data/documentation/pentadocs-page-profiles.v1.json"
      - "penta/registry/**"
      - "runtime/penta_families.py"
      - "PENTA-FAMILY-REGISTRY.md"
      - "PENTA-PORTAL-STANDARD.md"
      - "pentas.mdx"
      - "pentas/**"
      - "docs.json"
      - ".github/workflows/penta-portal-docs.yml"
  pull_request:
    paths:
      - "scripts/penta_portal_docs.py"
      - "scripts/penta_portal_finalize.py"
      - "tests/test_penta_portal_docs.py"
      - "data/penta/**"
      - "data/documentation/pentadocs-page-profiles.v1.json"
      - "penta/registry/**"
      - "runtime/penta_families.py"
      - "PENTA-FAMILY-REGISTRY.md"
      - "PENTA-PORTAL-STANDARD.md"
      - "pentas.mdx"
      - "pentas/**"
      - "docs.json"
      - ".github/workflows/penta-portal-docs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Generate raw Penta namespace projection
        run: python scripts/penta_portal_docs.py --write
      - name: Finalize governed PentaDocs corpus
        run: python scripts/penta_portal_finalize.py --apply
      - name: Validate complete Penta portal
        run: |
          python scripts/penta_portal_finalize.py --check
          python -m unittest tests.test_penta_portal_docs
          python scripts/validate_docs.py
          python runtime/penta_families.py --portal-index > /tmp/penta-families.json
          git diff --check
      - name: Commit deterministic documentation projection
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Penta portal already converged."
            exit 0
          fi
          git config user.name "CrownThrive PentaDocs"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            docs.json \
            data/penta/namespace-census.v1.json \
            data/documentation/pentadocs-page-profiles.v1.json \
            pentas.mdx \
            pentas \
            changelog/penta-portal-full-census-2026-08-28.mdx
          git commit -m "docs(penta): finalize governed full Penta portal [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}

  verify:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Verify deterministic governed corpus
        run: |
          python scripts/penta_portal_finalize.py --check
          python -m unittest tests.test_penta_portal_docs
          python scripts/validate_docs.py
          python runtime/penta_families.py --portal-index > /tmp/penta-families.json
          git diff --check
