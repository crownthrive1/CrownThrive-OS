name: PentaTagger GitHub Native

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft, closed]
  issues:
    types: [opened, reopened, edited, closed]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: event, sweep, or verify
        required: false
        default: sweep
      number:
        description: Optional issue or PR number
        required: false
        default: ''
      kind:
        description: all, pr, or issue
        required: false
        default: all

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: read
  statuses: read
  actions: read

concurrency:
  group: penta-github-tagger-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number || 'sweep' }}
  cancel-in-progress: true

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      number: ${{ steps.select.outputs.number }}
      kind: ${{ steps.select.outputs.kind }}
    steps:
      - id: select
        shell: bash
        env:
          REQUESTED_MODE: ${{ github.event.inputs.mode }}
          REQUESTED_NUMBER: ${{ github.event.inputs.number }}
          REQUESTED_KIND: ${{ github.event.inputs.kind }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request_target" ]]; then
            mode=event
            number="${EVENT_PR_NUMBER:-}"
            kind=pr
          elif [[ "$EVENT_NAME" == "issues" ]]; then
            mode=event
            number="${EVENT_ISSUE_NUMBER:-}"
            kind=issue
          else
            mode="${REQUESTED_MODE:-sweep}"
            number="${REQUESTED_NUMBER:-}"
            kind="${REQUESTED_KIND:-all}"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

  tagger:
    needs: select
    uses: ./.github/workflows/penta-github-tagger-reusable.yml
    with:
      mode: ${{ needs.select.outputs.mode }}
      number: ${{ needs.select.outputs.number }}
      kind: ${{ needs.select.outputs.kind }}
    secrets: inherit
