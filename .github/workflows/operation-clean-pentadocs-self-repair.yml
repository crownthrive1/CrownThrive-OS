name: Operation CLEAN PentaDocs Self-Repair

on:
  push:
    branches:
      - "admin-mcp/operation-clean-v3-20260831"
    paths:
      - ".github/workflows/operation-clean-pentadocs-self-repair.yml"

permissions:
  contents: write

concurrency:
  group: operation-clean-pentadocs-self-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: admin-mcp/operation-clean-v3-20260831
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Apply canonical PentaDocs quality contract
        run: |
          python scripts/pentadocs_quality.py --apply
          python scripts/validate_docs.py

      - name: Retire repair workflow and commit deterministic output
        run: |
          rm .github/workflows/operation-clean-pentadocs-self-repair.yml
          git config user.name "CrownThrive PentaDocs Repair"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No deterministic repair changes were required."
            exit 0
          fi
          git commit -m "docs: normalize Operation CLEAN PentaDocs contract"
          git push origin HEAD:admin-mcp/operation-clean-v3-20260831
