name: Commercial Gap Encrypted Transport Bootstrap

on:
  push:
    branches:
      - ops/commercial-gap-private-fulfillment-20260822
    paths:
      - ".github/workflows/commercial-gap-encrypted-transport-bootstrap.yml"

env:
  TRANSPORT_BOOTSTRAP_VERSION: "4"

permissions:
  contents: write
  id-token: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout operations branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Request scoped GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=crownthrive-commercial-gap-encrypted-transport")"
          ID_TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"${RESPONSE}")"
          test -n "${ID_TOKEN}"
          echo "token=${ID_TOKEN}" >> "${GITHUB_OUTPUT}"
          echo "::add-mask::${ID_TOKEN}"

      - name: Create stateless wrapped payload key
        env:
          ID_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          source=json.loads(Path('developers/reference/commercial-release/private-fulfillment-client-public-jwk.json').read_text())
          assert source.get('private_key_committed') is False
          Path('/tmp/bootstrap-request.json').write_text(json.dumps({
              'public_key_jwk': source['public_key_jwk'],
              'public_key_jwk_sha256': source['public_key_jwk_sha256'],
          }, separators=(',',':')))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${ID_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/bootstrap-request.json \
            "https://tzajnzshmtzjenqulehq.supabase.co/functions/v1/commercial-gap-encrypted-transport-bootstrap-oidc" \
            > /tmp/bootstrap.json

      - name: Validate public-only bootstrap receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          source=json.loads(Path('developers/reference/commercial-release/private-fulfillment-client-public-jwk.json').read_text())
          data=json.loads(Path('/tmp/bootstrap.json').read_text())
          assert data.get('state') == 'created', data
          assert data.get('payload_key_returned_plaintext') is False, data
          assert data.get('payload_key_publicly_stored') is False, data
          assert data.get('public_url_created') is False, data
          assert data.get('plaintext_returned') is False, data
          assert data.get('server_state_persisted') is False, data
          assert data.get('algorithm') == 'RSA-OAEP-3072-SHA256 + HKDF-SHA256 + AES-256-GCM', data
          assert isinstance(data.get('transport_id'), str) and len(data['transport_id']) == 36, data
          assert data.get('client_public_jwk_sha256') == source['public_key_jwk_sha256'], data
          wrapped=data.get('wrapped_payload_key_b64url')
          commitment=data.get('payload_key_commitment_sha256')
          assert isinstance(wrapped,str) and len(wrapped) > 100, data
          assert isinstance(commitment,str) and len(commitment) == 64, data
          receipt={
            'schema_version':'1.1.0',
            'receipt_id':'ct.receipt.commercial-gap-encrypted-transport-bootstrap.2026-08-22.v4',
            'source_commit':os.environ['GITHUB_SHA'],
            'transport_bootstrap_version':os.environ['TRANSPORT_BOOTSTRAP_VERSION'],
            'transport_id':data['transport_id'],
            'expires_at':data['expires_at'],
            'algorithm':data['algorithm'],
            'client_public_jwk_sha256':data['client_public_jwk_sha256'],
            'wrapped_payload_key_b64url':wrapped,
            'payload_key_commitment_sha256':commitment,
            'payload_key_returned_plaintext':False,
            'payload_key_publicly_stored':False,
            'server_state_persisted':False,
            'public_url_created':False,
            'plaintext_returned':False,
          }
          Path('changelog/commercial-gap-encrypted-transport-bootstrap-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'transport_id':receipt['transport_id'],'expires_at':receipt['expires_at'],'client_public_jwk_sha256':receipt['client_public_jwk_sha256']},sort_keys=True))
          PY

      - name: Commit public bootstrap receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add changelog/commercial-gap-encrypted-transport-bootstrap-receipt.json
          git commit -m "Record encrypted private fulfillment transport bootstrap v4"
          git push origin "HEAD:${GITHUB_REF_NAME}"
