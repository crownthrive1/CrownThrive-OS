name: PentaTagger — PR Taxonomy Reconciliation

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, labeled, unlabeled]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: penta-tagger-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  reconcile-current-pr:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile canonical Penta labels
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const number = pr.number;
            const existing = new Set((pr.labels || []).map(l => l.name));
            const required = new Set(['penta:authority:tagger', 'penta:entity:pr', 'penta:tagged']);
            const title = (pr.title || '').toLowerCase();
            const files = await github.paginate(github.rest.pulls.listFiles, {owner, repo, pull_number:number, per_page:100});
            const paths = files.map(f => f.filename.toLowerCase());

            if (title.includes('docs') || paths.some(p => p.startsWith('docs/') || p.endsWith('.md'))) required.add('penta:lane:docs');
            if (title.includes('govern') || paths.some(p => p.includes('govern'))) required.add('penta:lane:governance');
            if (title.includes('database') || title.includes('supabase') || paths.some(p => p.includes('supabase') || p.includes('migration'))) required.add('penta:lane:database');
            if (title.includes('security') || paths.some(p => p.includes('security'))) required.add('penta:lane:security');
            if (title.includes('commerce') || title.includes('economic') || paths.some(p => p.includes('commerce') || p.includes('economic'))) required.add('penta:lane:commerce');
            if (paths.some(p => p.startsWith('.github/workflows/'))) required.add('penta:lane:workflow');

            const missing = [...required].filter(x => !existing.has(x));
            if (missing.length) {
              const repoLabels = new Set((await github.paginate(github.rest.issues.listLabelsForRepo,{owner,repo,per_page:100})).map(l=>l.name));
              const applicable = missing.filter(x => repoLabels.has(x));
              if (applicable.length) await github.rest.issues.addLabels({owner,repo,issue_number:number,labels:applicable});
              core.info(`PentaTagger reconciled PR #${number}: ${applicable.join(', ') || 'no missing registered labels'}`);
            } else core.info(`PentaTagger PR #${number} already canonical.`);

  reconcile-open-prs:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Backfill PentaTagger authority markers
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const repoLabels = new Set((await github.paginate(github.rest.issues.listLabelsForRepo,{owner,repo,per_page:100})).map(l=>l.name));
            const required = ['penta:authority:tagger','penta:entity:pr','penta:tagged'].filter(x=>repoLabels.has(x));
            const prs = await github.paginate(github.rest.pulls.list,{owner,repo,state:'open',per_page:100});
            for (const pr of prs) {
              const existing = new Set((pr.labels || []).map(l=>l.name));
              const missing = required.filter(x=>!existing.has(x));
              if (missing.length) await github.rest.issues.addLabels({owner,repo,issue_number:pr.number,labels:missing});
            }
            core.info(`PentaTagger reconciled ${prs.length} open PR(s).`);
