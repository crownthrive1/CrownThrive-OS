name: PentaTagger GitHub Native Reusable

on:
  workflow_call:
    inputs:
      mode:
        description: event, sweep, or verify
        required: true
        type: string
      number:
        description: Optional issue or PR number
        required: false
        type: string
        default: ''
      kind:
        description: all, pr, or issue
        required: false
        type: string
        default: all
      max_items:
        description: Bounded sweep entity count
        required: false
        type: string
        default: '75'
      request_budget:
        description: Maximum GitHub API calls per run
        required: false
        type: string
        default: '180'
      sweep_since_hours:
        description: Recent open/closed replay window
        required: false
        type: string
        default: '72'
    secrets:
      PENTA_GITHUB_TOKEN:
        description: Optional dedicated GitHub token with issues and pull-request write scope
        required: false
  workflow_dispatch:
    inputs:
      mode:
        description: event, sweep, or verify
        required: true
        default: sweep
      number:
        description: Optional issue or PR number
        required: false
        default: ''
      kind:
        description: all, pr, or issue
        required: false
        default: all
      max_items:
        description: Bounded sweep entity count
        required: false
        default: '75'
      request_budget:
        description: Maximum GitHub API calls per run
        required: false
        default: '180'
      sweep_since_hours:
        description: Recent open/closed replay window
        required: false
        default: '72'

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: read
  statuses: read
  actions: read

jobs:
  tag-and-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      # Serialize provider writes across the repository. The caller-level
      # per-entity group removes duplicate event storms before they enter here.
      group: penta-github-tagger-transport-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Checkout canonical Penta control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: crownthrive1/CrownThrive-OS
          ref: main
          persist-credentials: false
          path: penta-control

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Execute PentaTagger with quota shield and provider readback
        id: execute
        env:
          PENTA_GITHUB_TOKEN: ${{ secrets.PENTA_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PENTA_MODE: ${{ inputs.mode || github.event.inputs.mode }}
          PENTA_NUMBER: ${{ inputs.number || github.event.inputs.number }}
          PENTA_KIND: ${{ inputs.kind || github.event.inputs.kind || 'all' }}
          PENTA_MAX_ITEMS: ${{ inputs.max_items || github.event.inputs.max_items || '75' }}
          PENTA_REQUEST_BUDGET: ${{ inputs.request_budget || github.event.inputs.request_budget || '180' }}
          PENTA_SWEEP_SINCE_HOURS: ${{ inputs.sweep_since_hours || github.event.inputs.sweep_since_hours || '72' }}
          PENTA_GITHUB_INLINE_WAIT_SECONDS: '20'
        shell: bash
        run: |
          set -euo pipefail
          args=(
            "${PENTA_MODE:-sweep}"
            --repo "$GITHUB_REPOSITORY"
            --kind "${PENTA_KIND:-all}"
            --max-items "${PENTA_MAX_ITEMS:-75}"
            --request-budget "${PENTA_REQUEST_BUDGET:-180}"
            --sweep-since-hours "${PENTA_SWEEP_SINCE_HOURS:-72}"
            --event-path "$GITHUB_EVENT_PATH"
            --receipt-path "$RUNNER_TEMP/penta-github-tagger-receipt.json"
            --summary-path "$RUNNER_TEMP/penta-github-tagger-summary.md"
          )
          if [[ -n "${PENTA_NUMBER:-}" ]]; then
            args+=(--number "$PENTA_NUMBER")
          fi

          set +e
          python penta-control/scripts/penta_github_tagger.py "${args[@]}"
          status=$?
          set -e

          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if [[ "$status" -eq 75 ]]; then
            echo "deferred=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=PentaTagger quota deferral::Provider quota was exhausted; bounded replay remains scheduled and the receipt records the reset evidence."
            exit 0
          fi
          echo "deferred=false" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Publish PentaTagger receipt summary
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/penta-github-tagger-summary.md" ]]; then
            cat "$RUNNER_TEMP/penta-github-tagger-summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '## PentaTagger GitHub Native v3'
              echo
              echo '- Readback status: **FAIL — summary receipt missing**'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Enforce explicit deferred semantics
        if: steps.execute.outputs.deferred == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/penta-github-tagger-receipt.json"
          python - "$RUNNER_TEMP/penta-github-tagger-receipt.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if payload.get("status") != "DEFERRED":
              raise SystemExit("deferred exit did not produce a DEFERRED receipt")
          if not payload.get("deferred_count"):
              raise SystemExit("deferred receipt count missing")
          print("PASS: quota deferral is explicit, receipted, and scheduled for replay")
          PY
