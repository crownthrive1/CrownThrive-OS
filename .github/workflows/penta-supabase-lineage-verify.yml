name: PentaMigrationLineage — Supabase Lineage Guard

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/migration_lineage/**"
      - "scripts/penta_migration_lineage_verify.py"
      - ".github/workflows/penta-supabase-lineage-verify.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/migration_lineage/**"
      - "scripts/penta_migration_lineage_verify.py"
      - ".github/workflows/penta-supabase-lineage-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lineage:
    name: verify-local-remote-lineage-snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify PentaMigrationLineage contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/penta_migration_lineage_verify.py
          python3 scripts/penta_migration_lineage_verify.py
