name: PentaPM PR Metadata Convergence

on:
  pull_request_target:
    types: [opened, reopened, edited]
  workflow_run:
    workflows: ["PentaSELF Remediation Handoff"]
    types: [completed]
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional PR number; blank reconciles metadata across the repository
        required: false
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write
  repository-projects: write

# Metadata ownership is serialized only within one PR. Repository-wide cleanup
# gets its own sweep lane instead of blocking every active PR.
concurrency:
  group: penta-pm-pr-convergence-${{ github.repository }}-${{ github.event.pull_request.number || inputs.pr_number || 'sweep' }}
  cancel-in-progress: true

jobs:
  converge:
    name: PentaPM canonical PR metadata
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PENTA_PM_GITHUB_TOKEN: ${{ secrets.PENTA_PM_GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.PENTA_PM_GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.PENTA_PM_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Verify trusted mutation source
        if: github.event_name == 'pull_request_target'
        shell: bash
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          if [[ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]]; then
            echo "External fork PR: provider mutation remains fail-closed."
            exit 78
          fi

      - name: Require dedicated PentaPM provider credential
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PENTA_PM_GITHUB_TOKEN}" ]]; then
            echo "::error::PENTA_PM_GITHUB_TOKEN is unavailable; refusing provider mutation."
            exit 78
          fi

      - id: scope
        name: Resolve reconciliation scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          MANUAL_PR: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request_target" ]]; then
            echo "args=--pr ${EVENT_PR}" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && -n "${MANUAL_PR}" ]]; then
            if [[ ! "${MANUAL_PR}" =~ ^[0-9]+$ ]]; then
              echo "::error::pr_number must be numeric"
              exit 2
            fi
            echo "args=--pr ${MANUAL_PR}" >> "$GITHUB_OUTPUT"
          else
            echo "args=--all" >> "$GITHUB_OUTPUT"
          fi

      - name: Converge Development metadata to one unit per PR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/penta-pm
          python scripts/penta_pr_metadata_converge_v2.py \
            --repo "$GITHUB_REPOSITORY" \
            ${{ steps.scope.outputs.args }} \
            --apply | tee artifacts/penta-pm/pr-metadata-v2.json

      - id: provider
        name: Reconcile Project, milestone, owner, lane, risk, stage and evidence
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python scripts/penta_pm_reconcile.py --repo "$GITHUB_REPOSITORY" --apply

      - name: Classify provider-only hold
        if: steps.provider.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("artifacts/penta-pm/latest.json")
          if not path.exists():
              raise SystemExit("PentaPM provider reconciliation failed without receipt")
          payload = json.loads(path.read_text())
          holds = payload.get("holds") or []
          provider = [
              item for item in holds
              if item.get("type") in {
                  "projects_v2_provider_authority",
                  "project_item_provider_authority",
              }
          ]
          if not provider:
              raise SystemExit("PentaPM reconciliation failed for an unclassified reason")
          print("Provider-only Projects hold preserved; repository-native metadata convergence completed.")
          PY

      - name: Verify idempotent post-state
        shell: bash
        run: |
          set -euo pipefail
          python scripts/penta_pr_metadata_converge_v2.py \
            --repo "$GITHUB_REPOSITORY" \
            ${{ steps.scope.outputs.args }} \
            > artifacts/penta-pm/pr-metadata-v2-postcheck.json

      - name: Upload convergence evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: penta-pm-pr-metadata-v2-${{ github.run_id }}
          path: artifacts/penta-pm/
          if-no-files-found: warn
          retention-days: 90
