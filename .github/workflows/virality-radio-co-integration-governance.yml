name: Virality Music Radio.co Integration Governance

on:
  pull_request:
    paths:
      - "integrations/radio-co/virality-music/**"
      - ".github/workflows/virality-radio-co-integration-governance.yml"
  push:
    branches:
      - main
    paths:
      - "integrations/radio-co/virality-music/**"
      - ".github/workflows/virality-radio-co-integration-governance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Radio.co institutional contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Parse institutional JSON contracts
        run: |
          python -m json.tool integrations/radio-co/virality-music/provider.json >/dev/null
          python -m json.tool integrations/radio-co/virality-music/public-projection.json >/dev/null
          python -m json.tool integrations/radio-co/virality-music/verification-contract.json >/dev/null
          python -m json.tool integrations/radio-co/virality-music/consumer-bindings.json >/dev/null
      - name: Compile public readback verifier
        run: python -m py_compile integrations/radio-co/virality-music/verify_public_readback.py
      - name: Validate projection and security invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("integrations/radio-co/virality-music")
          provider = json.loads((root / "provider.json").read_text())
          projection = json.loads((root / "public-projection.json").read_text())
          contract = json.loads((root / "verification-contract.json").read_text())
          bindings = json.loads((root / "consumer-bindings.json").read_text())

          integration_id = "virality-music.radio-co.s0831f6c44"
          station_id = "s0831f6c44"
          documents = (provider, projection, contract, bindings)
          for document in documents:
              assert document["integration_id"] == integration_id

          assert provider["integration"]["station_id"] == station_id
          assert projection["station_id"] == station_id
          assert contract["station_id"] == station_id
          assert provider["live_broadcast"]["password_secret_ref"] == "RADIOCO_VIRALITY_LIVE_BROADCAST_PASSWORD"

          projection_text = json.dumps(projection)
          assert "RADIOCO_VIRALITY_LIVE_BROADCAST_PASSWORD" not in projection_text
          assert "live_broadcast" not in projection
          assert projection["consumer_policy"]["contains_credentials"] is False
          assert projection["consumer_policy"]["contains_live_broadcast_secret_reference"] is False

          required = {item["id"] for item in contract["checks"] if item["class"] == "required"}
          assert required == {"station_metadata", "station_status"}
          assert contract["security"]["may_read_live_broadcast_secret"] is False
          assert contract["security"]["may_mutate_provider_state"] is False

          for item in contract["checks"]:
              assert item["method"] == "GET"
              assert item["url"].startswith("https://public.radio.co/")

          binding = bindings["bindings"][0]
          assert binding["projection_source"] == "public-projection.json"
          assert binding["control_plane_state"] in {"unbound", "bound", "verified"}
          PY
      - name: Check whitespace and conflict markers
        run: |
          git diff --check
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!THIRD_PARTY_NOTICES.md'; then
            echo "Unresolved merge-conflict markers detected."
            exit 1
          fi

  public-readback:
    name: Read back Radio.co public provider state
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Execute secret-free provider readback
        run: python integrations/radio-co/virality-music/verify_public_readback.py --output radio-co-readback.json
      - name: Show evidence digest
        if: always()
        run: |
          if [ -f radio-co-readback.json ]; then
            cat radio-co-readback.json
          fi
