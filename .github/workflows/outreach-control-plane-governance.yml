name: Outreach Control Plane Governance

on:
  pull_request:
    paths:
      - 'data/penta/outreach-control-plane.v1.json'
      - 'tests/test_outreach_control_plane_contract.py'
      - 'docs/phase3/OUTREACH_CONTROL_PLANE_v1.md'
      - '.github/workflows/outreach-control-plane-governance.yml'
  push:
    branches: [main]
    paths:
      - 'data/penta/outreach-control-plane.v1.json'
      - 'tests/test_outreach_control_plane_contract.py'
      - 'docs/phase3/OUTREACH_CONTROL_PLANE_v1.md'
      - '.github/workflows/outreach-control-plane-governance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Validate machine contract
        run: python -m json.tool data/penta/outreach-control-plane.v1.json >/dev/null
      - name: Certify outreach invariants
        run: python tests/test_outreach_control_plane_contract.py
