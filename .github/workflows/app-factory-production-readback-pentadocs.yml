name: App Factory Production Readback — PentaDocs Quality

on:
  push:
    branches:
      - institutionalize/app-factory-production-readback-20260831
    paths:
      - penta/evidence/app-factory-production-readback-pentadocs.ready

permissions:
  contents: write

concurrency:
  group: app-factory-production-readback-pentadocs
  cancel-in-progress: false

jobs:
  normalize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: institutionalize/app-factory-production-readback-20260831
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Apply deterministic PentaDocs standard
        run: python scripts/pentadocs_quality.py --apply

      - name: Verify complete documentation corpus
        run: |
          python scripts/penta_portal_finalize.py --check
          python scripts/penta_operational_knowledge_entrypoint.py --check
          python scripts/pentagonal_reference_suite.py --check
          python scripts/validate_docs.py
          git diff --check

      - name: Remove one-shot execution files
        run: |
          rm -f .github/workflows/app-factory-production-readback-pentadocs.yml
          rm -f penta/evidence/app-factory-production-readback-pentadocs.ready

      - name: Commit verified normalized output
        run: |
          git config user.name "CrownThrive PentaDocs Automation"
          git config user.email "contact@crownthrive.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No normalization changes required."
          else
            git commit -m "docs(app-factory): normalize production readback"
            git push origin HEAD:institutionalize/app-factory-production-readback-20260831
          fi
