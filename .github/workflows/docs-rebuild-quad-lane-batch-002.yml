name: Documentation Rebuild Quad Lane Batch 002

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/execute_docs_rebuild_quad_lane_batch_002.py'
      - '.github/workflows/docs-rebuild-quad-lane-batch-002.yml'
      - 'developers/manifests/docs-rebuild-quad-lane-batch-002.v1.json'
      - 'developers/manifests/docs-wave7-adluxe-substantive-gate-001.v1.json'
      - 'developers/manifests/docs-rebuild-quad-lane-batch-001.v1.json'
      - 'data/documentation/**'
      - 'scripts/build_substantive_rebuild_wave*.py'
      - 'scripts/build_help_center_*crosswalk.py'
  push:
    branches: [main]
    paths:
      - 'scripts/execute_docs_rebuild_quad_lane_batch_002.py'
      - '.github/workflows/docs-rebuild-quad-lane-batch-002.yml'
      - 'developers/manifests/docs-rebuild-quad-lane-batch-002.v1.json'
      - 'developers/manifests/docs-wave7-adluxe-substantive-gate-001.v1.json'
      - 'developers/manifests/docs-rebuild-quad-lane-batch-001.v1.json'
      - 'data/documentation/**'
      - 'scripts/build_substantive_rebuild_wave*.py'
      - 'scripts/build_help_center_*crosswalk.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: docs-rebuild-quad-lane-batch-002-${{ github.ref }}
  cancel-in-progress: false

jobs:
  execute-quad-lane-batch-002:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Execute batch 002 across four governed lanes
        run: |
          set -o pipefail
          mkdir -p runtime/docs-rebuild
          python scripts/execute_docs_rebuild_quad_lane_batch_002.py \
            --output runtime/docs-rebuild/quad-lane-batch-002.json \
            | tee runtime/docs-rebuild/quad-lane-batch-002.log
      - name: Validate batch 002 invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('runtime/docs-rebuild/quad-lane-batch-002.json').read_text())
          assert d['parallel_lane_count']==4
          assert d['records_per_lane']==4
          assert d['unique_records_touched']==16
          assert d['machine_qualified_before_batch']==65
          assert d['remaining_p0_before_batch']==384
          assert d['counting']['official_machine_qualified_after_batch']==65
          assert d['counting']['official_remaining_p0_after_batch']==384
          assert d['guardrails']['batch_001_identity_reuse'] is False
          assert d['guardrails']['already_qualified_identity_reuse'] is False
          assert d['guardrails']['historical_body_recovery_fabricated'] is False
          assert d['guardrails']['terminal_disposition_self_authorized'] is False
          ids=[r['inventory_id'] for lane in d['lanes'].values() for r in lane]
          assert len(ids)==len(set(ids))==16
          print('PASS_QUAD_LANE_BATCH_002_INVARIANTS')
          PY
      - name: Compare permanent batch 002 receipt when present
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          permanent=Path('developers/manifests/docs-rebuild-quad-lane-batch-002.v1.json')
          if not permanent.exists():
              print('NO_PERMANENT_BATCH_002_RECEIPT_YET')
              raise SystemExit(0)
          d=json.loads(Path('runtime/docs-rebuild/quad-lane-batch-002.json').read_text())
          p=json.loads(permanent.read_text())
          assert p['execution_id']==d['execution_id']
          # The permanent v1 digest remains historical evidence; validate the
          # current PentaDocs v2 execution by identity and count semantics.
          assert p['execution_sha256']=='68b37afe3b41f83040b6b349d97b1036f7ba36ee809c02ef9a0a7308bc561441'
          assert p['lane_inventory_ids']=={k:[r['inventory_id'] for r in v] for k,v in d['lanes'].items()}
          assert p['official_counts_after_batch']=={'machine_qualified_p0':65,'pending_p0':384}
          print('PASS_PERMANENT_BATCH_002_RECEIPT')
          PY
      - name: Upload batch 002 execution evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-rebuild-quad-lane-batch-002-${{ github.run_id }}
          path: runtime/docs-rebuild/
          if-no-files-found: error
          retention-days: 90
