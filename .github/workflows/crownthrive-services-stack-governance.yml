name: CrownThrive Services Stack Governance

on:
  pull_request:
    paths:
      - developers/manifests/crownthrive-services-stack.v1.json
      - developers/manifests/css-service-lanes.v1.json
      - developers/manifests/css-caas-controls.v1.json
      - platforms/crownthrive-services-stack.mdx
      - chlom/compliance-as-a-service.mdx
      - automation/crownthrive-services-stack-agent-mesh.mdx
      - developers/crownthrive-services-stack.mdx
      - skills/crownthrive-services-stack/**
      - plugins/crownthrive-services-stack/**
      - apps/crownthrive-services-stack/**
      - scripts/validate_crownthrive_services_stack.py
      - .github/workflows/crownthrive-services-stack-governance.yml
  push:
    branches:
      - agent/crownthrive-services-stack-css-20260823
    paths:
      - developers/manifests/crownthrive-services-stack.v1.json
      - developers/manifests/css-service-lanes.v1.json
      - developers/manifests/css-caas-controls.v1.json
      - platforms/crownthrive-services-stack.mdx
      - chlom/compliance-as-a-service.mdx
      - automation/crownthrive-services-stack-agent-mesh.mdx
      - developers/crownthrive-services-stack.mdx
      - skills/crownthrive-services-stack/**
      - plugins/crownthrive-services-stack/**
      - apps/crownthrive-services-stack/**
      - scripts/validate_crownthrive_services_stack.py
      - .github/workflows/crownthrive-services-stack-governance.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: css-governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate CSS contracts, CaaS controls and plugin boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact repository head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: python -m py_compile scripts/validate_crownthrive_services_stack.py

      - name: Validate CSS and CaaS invariants
        run: python scripts/validate_crownthrive_services_stack.py

      - name: Validate JSON artifacts
        run: |
          python -m json.tool developers/manifests/crownthrive-services-stack.v1.json >/dev/null
          python -m json.tool developers/manifests/css-service-lanes.v1.json >/dev/null
          python -m json.tool developers/manifests/css-caas-controls.v1.json >/dev/null
          python -m json.tool plugins/crownthrive-services-stack/plugin.manifest.json >/dev/null
          python -m json.tool plugins/crownthrive-services-stack/tool-contracts.json >/dev/null
          python -m json.tool apps/crownthrive-services-stack/app-manifest.json >/dev/null
          python -m json.tool apps/crownthrive-services-stack/chatgpt-app-submission.candidate.v0.1.json >/dev/null
          python -m json.tool apps/crownthrive-services-stack/mcp-resource-manifest.v0.1.json >/dev/null

      - name: Validate repository documentation
        run: python scripts/validate_docs.py

      - name: Check whitespace and merge-conflict markers
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!THIRD_PARTY_NOTICES.md'; then
            echo "Unresolved merge-conflict markers detected."
            exit 1
          fi

      - name: Publish public-safe summary
        run: |
          {
            echo "## CrownThrive Services Stack"
            echo ""
            echo "- Shared-service lanes: 14"
            echo "- CHLOM CaaS controls: 28"
            echo "- Derived Asset Fabric candidates: 672"
            echo "- Protected algorithms: 4"
            echo "- Protected kernels: 8"
            echo "- Non-voting A2/D2 agents: 7"
            echo "- MCP tools: 14"
            echo "- Readiness is professional certification: false"
            echo "- Provider writes, checkout, entitlements and D3: disabled"
          } >> "${GITHUB_STEP_SUMMARY}"
