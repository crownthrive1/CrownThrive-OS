# CHLOM autonomous publication provider — bootstrap push is bounded to this workflow path.
name: CHLOM Continuous Publisher

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chlom-continuous-publisher.yml'

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: chlom-continuous-publisher
  cancel-in-progress: false

env:
  CHLOM_BRIDGE_URL: https://tzajnzshmtzjenqulehq.supabase.co/functions/v1/chlom-publication-github-bridge

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Acquire bounded GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          raw="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=chlom-publication-publisher")"
          token="$(jq -r '.value' <<<"$raw")"
          test -n "$token" && test "$token" != "null"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Claim bounded CHLOM publication commands
        id: claim
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST "$CHLOM_BRIDGE_URL" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"action":"claim","limit":3}' > /tmp/chlom-claim.json
          jq -e '.ok == true' /tmp/chlom-claim.json >/dev/null
          count="$(jq -r '.result.count // 0' /tmp/chlom-claim.json)"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          jq -c '[.result.commands[].command_id]' /tmp/chlom-claim.json > /tmp/chlom-command-ids.json

      - name: Materialize verified public-safe MDX
        if: steps.claim.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          jq -c '.result.commands[]' /tmp/chlom-claim.json | while IFS= read -r command; do
            path="$(jq -r '.file_path' <<<"$command")"
            case "$path" in
              chlom/*.mdx) ;;
              *) echo "Unsafe destination path: $path" >&2; exit 19 ;;
            esac
            resolved="$(realpath -m -- "$path")"
            case "$resolved" in
              "$GITHUB_WORKSPACE"/chlom/*.mdx) ;;
              *) echo "Destination escapes the CHLOM candidate root: $path" >&2; exit 19 ;;
            esac
            if [[ -L "$path" ]]; then
              echo "Symlink destinations are prohibited: $path" >&2
              exit 19
            fi
            path="$resolved"
            mkdir -p "$(dirname "$path")"
            jq -j '.mdx' <<<"$command" > "$path"
            expected="$(jq -r '.content_sha256' <<<"$command")"
            actual="$(sha256sum "$path" | awk '{print $1}')"
            if [[ "$expected" != "$actual" ]]; then
              echo "Digest mismatch for $path" >&2
              exit 20
            fi
          done

      - name: Commit publication candidate and open pull request
        id: commit
        if: steps.claim.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CrownThrive CHLOM Publisher"
          git config user.email "contact@crownthrive.com"
          git add chlom/
          if git diff --cached --quiet; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "pr_url=" >> "$GITHUB_OUTPUT"
          else
            git commit -m "docs(chlom): autonomous governed publication batch"
            BRANCH="chlom/publication-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            git push origin "HEAD:refs/heads/$BRANCH"
            PR_URL=$(gh pr create --base main --head "$BRANCH" \
              --title "CHLOM governed publication candidate" \
              --body "Provider-materialized CHLOM candidate. Production publication requires the ordinary governed pull-request acceptance path; this workflow does not merge or write directly to main.")
            test -n "$PR_URL"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          fi

      - name: Acknowledge candidate or existing destination
        if: steps.claim.outputs.count != '0' && success()
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
          CHANGED: ${{ steps.commit.outputs.changed }}
          PR_URL: ${{ steps.commit.outputs.pr_url }}
        run: |
          set -euo pipefail
          ids="$(cat /tmp/chlom-command-ids.json)"
          if [[ "$CHANGED" == "true" ]]; then
            publication_state="candidate_pr"
          else
            publication_state="already_present_on_main"
          fi
          jq -n --argjson ids "$ids" --arg sha "$COMMIT_SHA" \
            --arg state "$publication_state" --arg pr_url "$PR_URL" \
            '{action:"ack",command_ids:$ids,commit_sha:$sha,publication_state:$state,pull_request_url:$pr_url}' \
            > /tmp/chlom-ack-body.json
          curl --fail --silent --show-error \
            -X POST "$CHLOM_BRIDGE_URL" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H 'Content-Type: application/json' \
            --data @/tmp/chlom-ack-body.json > /tmp/chlom-ack.json
          jq -e '.ok == true' /tmp/chlom-ack.json >/dev/null

      - name: Release claims on provider failure
        if: steps.claim.outputs.count != '0' && failure()
        continue-on-error: true
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          test -s /tmp/chlom-command-ids.json || exit 0
          ids="$(cat /tmp/chlom-command-ids.json)"
          jq -n --argjson ids "$ids" \
            '{action:"release",command_ids:$ids,reason:"github_provider_job_failed"}' > /tmp/chlom-release-body.json
          curl --silent --show-error \
            -X POST "$CHLOM_BRIDGE_URL" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H 'Content-Type: application/json' \
            --data @/tmp/chlom-release-body.json >/dev/null
