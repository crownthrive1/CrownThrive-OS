# CHLOM autonomous publication provider — provider claims remain bounded; repository writes converge through governed main.
name: CHLOM Continuous Publisher

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chlom-continuous-publisher.yml'

permissions:
  actions: write
  checks: read
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: chlom-continuous-publisher
  cancel-in-progress: false

env:
  CHLOM_BRIDGE_URL: https://tzajnzshmtzjenqulehq.supabase.co/functions/v1/chlom-publication-github-bridge

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Acquire bounded GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          raw="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=chlom-publication-publisher")"
          token="$(jq -r '.value' <<<"$raw")"
          test -n "$token" && test "$token" != "null"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Claim bounded CHLOM publication commands
        id: claim
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST "$CHLOM_BRIDGE_URL" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"action":"claim","limit":3}' > /tmp/chlom-claim.json
          jq -e '.ok == true' /tmp/chlom-claim.json >/dev/null
          count="$(jq -r '.result.count // 0' /tmp/chlom-claim.json)"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          jq -c '[.result.commands[].command_id]' /tmp/chlom-claim.json > /tmp/chlom-command-ids.json

      - name: Materialize verified public-safe MDX
        if: steps.claim.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          jq -c '.result.commands[]' /tmp/chlom-claim.json | while IFS= read -r command; do
            path="$(jq -r '.file_path' <<<"$command")"
            case "$path" in
              chlom/*.mdx) ;;
              *) echo "Unsafe destination path: $path" >&2; exit 19 ;;
            esac
            mkdir -p "$(dirname "$path")"
            jq -j '.mdx' <<<"$command" > "$path"
            expected="$(jq -r '.content_sha256' <<<"$command")"
            actual="$(sha256sum "$path" | awk '{print $1}')"
            if [[ "$expected" != "$actual" ]]; then
              echo "Provider digest mismatch for $path" >&2
              exit 20
            fi
          done

      - name: Bind governed unlisted-page dispositions
        if: steps.claim.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          claim = json.loads(Path('/tmp/chlom-claim.json').read_text(encoding='utf-8'))
          docs = json.loads(Path('docs.json').read_text(encoding='utf-8'))
          manifest_path = Path('developers/manifests/pentadocs-unlisted-page-dispositions.v1.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))

          if manifest.get('schema_version') != '1.0.0':
              raise SystemExit('Unexpected unlisted-page disposition schema')
          if manifest.get('owner') != 'penta_docs_governance':
              raise SystemExit('Unexpected unlisted-page disposition owner')

          expected_categories = {
              'historical_change_evidence',
              'certification_evidence',
              'generated_build_evidence',
              'specialist_reconciliation_evidence',
              'operational_reference_direct_link',
          }
          dispositions = manifest.get('dispositions', {})
          if set(dispositions) != expected_categories:
              raise SystemExit('Unlisted-page disposition categories drifted')

          def iter_pages(node):
              if isinstance(node, str):
                  yield node
                  return
              if isinstance(node, list):
                  for item in node:
                      yield from iter_pages(item)
                  return
              if not isinstance(node, dict):
                  return
              for key in ('pages', 'groups', 'tabs', 'dropdowns', 'products', 'versions', 'languages'):
                  value = node.get(key)
                  if value is not None:
                      yield from iter_pages(value)

          navigation = docs.get('navigation', {})
          primary = navigation.get('groups') or navigation.get('pages') or navigation
          navigated = set()
          for page in iter_pages(primary):
              if page.startswith(('http://', 'https://', 'mailto:')):
                  continue
              normalized = page.split('#', 1)[0].split('?', 1)[0].strip('/')
              if not normalized.endswith(('.md', '.mdx')):
                  normalized += '.mdx'
              navigated.add(normalized)

          commands = claim.get('result', {}).get('commands', [])
          targets = {
              command.get('file_path')
              for command in commands
              if isinstance(command, dict)
              and isinstance(command.get('file_path'), str)
              and command['file_path'].startswith('chlom/')
              and command['file_path'].endswith('.mdx')
          }
          if not targets:
              raise SystemExit('Claim contained no governed CHLOM MDX targets')

          for category in sorted(expected_categories):
              pages = dispositions.get(category)
              if not isinstance(pages, list) or any(not isinstance(page, str) for page in pages):
                  raise SystemExit(f'Invalid disposition list: {category}')
              dispositions[category] = sorted({page for page in pages if page not in targets})

          direct = set(dispositions['operational_reference_direct_link'])
          direct.update(path for path in targets if path not in navigated)
          dispositions['operational_reference_direct_link'] = sorted(direct)

          manifest_path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )

          for path in sorted(targets):
              disposition = 'navigated' if path in navigated else 'operational_reference_direct_link'
              print(f'{path}: {disposition}')
          PY

      - name: Apply canonical PentaDocs quality standard
        if: steps.claim.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/pentadocs_quality.py --apply
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          claim = json.loads(Path('/tmp/chlom-claim.json').read_text(encoding='utf-8'))
          records = []
          for command in claim.get('result', {}).get('commands', []):
              path = command.get('file_path')
              if not isinstance(path, str) or not path.startswith('chlom/') or not path.endswith('.mdx'):
                  continue
              data = Path(path).read_bytes()
              records.append({
                  'file_path': path,
                  'provider_content_sha256': command.get('content_sha256'),
                  'canonical_content_sha256': hashlib.sha256(data).hexdigest(),
              })
          if not records:
              raise SystemExit('No canonical CHLOM digest records were generated')
          Path('/tmp/chlom-canonical-digests.json').write_text(
              json.dumps(records, sort_keys=True, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(records, indent=2, sort_keys=True))
          PY

      - name: Commit governed publication candidate
        id: commit
        if: steps.claim.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CrownThrive CHLOM Publisher"
          git config user.email "contact@crownthrive.com"
          BASE_SHA="$(git rev-parse HEAD)"
          BRANCH="chlom/publication-${BASE_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$BRANCH"
          git add \
            chlom/ \
            developers/manifests/pentadocs-unlisted-page-dispositions.v1.json \
            data/documentation/pentadocs-page-profiles.v1.json
          if git diff --cached --quiet; then
            echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
            echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "docs(chlom): autonomous governed publication batch"
            HEAD_SHA="$(git rev-parse HEAD)"
            git push origin "$BRANCH"
            echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Govern and request protected-main merge
        id: merge
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          HEAD_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          PR_URL="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "CHLOM governed publication batch" \
            --body "Bounded CHLOM publication commands were provider-digest verified, deterministically normalized through the canonical PentaDocs quality engine, disposition-bound, and committed with their page-profile projection. The canonical governed merge gate is explicitly dispatched on this exact head because GITHUB_TOKEN-originated pull_request events are non-recursive. No direct protected-main push, force-push, admin bypass, credential mutation, or authority expansion is requested.")"

          # GITHUB_TOKEN-created PRs do not recursively execute normal pull_request workflows.
          # workflow_dispatch is the bounded exception, so explicitly invoke the canonical gate
          # against the exact publication head and require its exact-head PASS before auto-merge.
          gh workflow run governed-merge-gate.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

          GATE_RUN_ID=""
          for _ in $(seq 1 12); do
            sleep 10
            GATE_RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow governed-merge-gate.yml --branch "$BRANCH" --event workflow_dispatch \
              --limit 10 --json databaseId,headSha,createdAt \
              --jq '[.[] | select(.headSha == env.HEAD_SHA)] | sort_by(.createdAt) | last | .databaseId // empty')"
            if [ -n "$GATE_RUN_ID" ]; then break; fi
          done
          test -n "$GATE_RUN_ID"
          gh run watch "$GATE_RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status

          GATE_STATE="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs" \
            --jq '[.check_runs[] | select(.name=="CrownThrive governed merge gate")] | sort_by(.started_at) | last | ((.status // "missing") + ":" + (.conclusion // "pending"))')"
          echo "Governed publication gate: $GATE_STATE"
          test "$GATE_STATE" = "completed:success"

          gh pr merge "$PR_URL" --repo "$GITHUB_REPOSITORY" --auto --squash \
            --subject "docs(chlom): autonomous governed publication batch"

          MERGED=false
          for _ in $(seq 1 30); do
            sleep 30
            git fetch --quiet origin main
            DEST_SHA="$(git rev-parse origin/main)"
            READY=true
            while IFS= read -r record; do
              path="$(jq -r '.file_path' <<<"$record")"
              expected="$(jq -r '.canonical_content_sha256' <<<"$record")"
              if ! git cat-file -e "${DEST_SHA}:${path}" 2>/dev/null; then
                READY=false
                break
              fi
              actual="$(git show "${DEST_SHA}:${path}" | sha256sum | awk '{print $1}')"
              if [ "$expected" != "$actual" ]; then
                READY=false
                break
              fi
            done < <(jq -c '.[]' /tmp/chlom-canonical-digests.json)
            if [ "$READY" = true ]; then
              MERGED=true
              break
            fi
          done
          if [ "$MERGED" != true ]; then
            set +e
            gh pr checks "$PR_URL" --repo "$GITHUB_REPOSITORY" --required
            gh pr view "$PR_URL" --repo "$GITHUB_REPOSITORY" --json state,mergeStateStatus
            set -e
            exit 46
          fi
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "sha=$DEST_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify exact destination commit
        id: readback
        if: steps.claim.outputs.count != '0' && success()
        shell: bash
        env:
          CHANGED: ${{ steps.commit.outputs.changed }}
          CANDIDATE_SHA: ${{ steps.commit.outputs.sha }}
          MERGE_SHA: ${{ steps.merge.outputs.sha }}
        run: |
          set -euo pipefail
          if [ "$CHANGED" = "true" ]; then
            DEST_SHA="$MERGE_SHA"
          else
            DEST_SHA="$CANDIDATE_SHA"
          fi
          test -n "$DEST_SHA"
          git fetch origin main
          git cat-file -e "${DEST_SHA}^{commit}"
          while IFS= read -r record; do
            path="$(jq -r '.file_path' <<<"$record")"
            expected="$(jq -r '.canonical_content_sha256' <<<"$record")"
            git show "${DEST_SHA}:${path}" > /tmp/chlom-destination-readback.mdx
            actual="$(sha256sum /tmp/chlom-destination-readback.mdx | awk '{print $1}')"
            test "$expected" = "$actual"
          done < <(jq -c '.[]' /tmp/chlom-canonical-digests.json)
          python scripts/pentadocs_quality.py --check
          echo "sha=$DEST_SHA" >> "$GITHUB_OUTPUT"

      - name: Acknowledge destination commit
        if: steps.claim.outputs.count != '0' && success()
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          COMMIT_SHA: ${{ steps.readback.outputs.sha }}
        run: |
          set -euo pipefail
          ids="$(cat /tmp/chlom-command-ids.json)"
          test -n "$COMMIT_SHA"
          jq -n --argjson ids "$ids" --arg sha "$COMMIT_SHA" \
            '{action:"ack",command_ids:$ids,commit_sha:$sha}' > /tmp/chlom-ack-body.json
          curl --fail --silent --show-error \
            -X POST "$CHLOM_BRIDGE_URL" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H 'Content-Type: application/json' \
            --data @/tmp/chlom-ack-body.json > /tmp/chlom-ack.json
          jq -e '.ok == true' /tmp/chlom-ack.json >/dev/null

      - name: Release claims on provider failure
        if: steps.claim.outputs.count != '0' && failure()
        continue-on-error: true
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          test -s /tmp/chlom-command-ids.json || exit 0
          ids="$(cat /tmp/chlom-command-ids.json)"
          jq -n --argjson ids "$ids" \
            '{action:"release",command_ids:$ids,reason:"github_provider_job_failed"}' > /tmp/chlom-release-body.json
          curl --silent --show-error \
            -X POST "$CHLOM_BRIDGE_URL" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H 'Content-Type: application/json' \
            --data @/tmp/chlom-release-body.json >/dev/null
