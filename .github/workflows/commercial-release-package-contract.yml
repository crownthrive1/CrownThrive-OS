name: Commercial Release Package Contract

on:
  pull_request:
    paths:
      - "automation/commercial-release-package-agent*.mdx"
      - "developers/manifests/commercial-release-package-agent.v1.json"
      - "developers/reference/commercial-release/**"
      - "developers/schemas/commercial-product-release-package.v1.schema.json"
      - "scripts/build_commercial_release_packages.py"
      - "scripts/validate_commercial_release_packages.py"
      - ".github/workflows/commercial-release-package-contract.yml"
      - "platforms/crownthrive-*-institutional-registry.mdx"
      - "workflows/commercial-*.mdx"
      - "runbooks/commercial-sites-publication-and-rollback.mdx"
  push:
    branches:
      - main
      - "feature/commercial-release-package-agent-*"
    paths:
      - "automation/commercial-release-package-agent*.mdx"
      - "developers/manifests/commercial-release-package-agent.v1.json"
      - "developers/reference/commercial-release/**"
      - "developers/schemas/commercial-product-release-package.v1.schema.json"
      - "scripts/build_commercial_release_packages.py"
      - "scripts/validate_commercial_release_packages.py"
      - ".github/workflows/commercial-release-package-contract.yml"
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commercial-release-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controlled-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Compile agent code
        run: |
          python -m py_compile scripts/build_commercial_release_packages.py
          python -m py_compile scripts/validate_commercial_release_packages.py

      - name: Run deterministic, perpetual and negative controls
        run: python scripts/validate_commercial_release_packages.py

      - name: Rebuild all currently governed product packages
        run: python scripts/build_commercial_release_packages.py --output build/commercial-release-packages

      - name: Assert inventory-driven fail-closed factory state
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          inventory = json.loads(Path("developers/reference/commercial-release/commercial-gap-products.v1.json").read_text())
          summary = json.loads(Path("build/commercial-release-packages/summary.json").read_text())
          products = inventory["products"]
          expected_count = len(products)
          expected_platform_counts = dict(sorted(Counter(p["platform_key"] for p in products).items()))
          package_files = [p for p in Path("build/commercial-release-packages").glob("ct-*.json") if p.name != "summary.json"]

          assert expected_count > 0
          assert summary["product_count"] == expected_count
          assert summary["platform_counts"] == expected_platform_counts
          assert len(package_files) == expected_count
          assert summary["cash_checkout_enabled_count"] == 0
          assert summary["automatic_publication_eligible_count"] == 0
          assert summary["accepted_count"] == 0
          assert summary["hold_count"] == expected_count
          PY

      - name: Assert scheduled execution is mutation-free
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path(".github/workflows/commercial-release-package-contract.yml").read_text().lower()
          assert "permissions:\n  contents: read" in text
          forbidden = [
              "contents:" + " write",
              "stripe product " + "create",
              "checkout session " + "create",
              "supabase " + "db push",
          ]
          for item in forbidden:
              assert item not in text, f"scheduled factory workflow contains forbidden mutation surface: {item}"
          PY
