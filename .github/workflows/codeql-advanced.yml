name: "CodeQL Provider Compatibility Sentinel"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "18 11 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-provider-sentinel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  provider-default-setup:
    name: Verify provider-managed CodeQL boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preserve provider authority
        shell: bash
        run: |
          set -euo pipefail
          echo "GitHub CodeQL default setup is the registered security-scanning authority."
          echo "This sentinel intentionally does not invoke github/codeql-action/* or duplicate provider-managed analysis."
          echo "Provider CodeQL check runs remain independent release evidence."
