name: "CodeQL Advanced — Retired Provider-Duplicate"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retired-codeql-advanced-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retired-provider-duplicate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Historical retirement receipt
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Advanced CodeQL workflow retired'
            echo
            echo '- Current authority: GitHub provider-managed CodeQL default setup'
            echo '- Prior local advanced workflow: superseded historical configuration'
            echo '- Local CodeQL init/analyze action execution: disabled'
            echo '- Security findings authority: provider-managed CodeQL readback'
            echo '- Authority expansion: false'
            echo '- Provider write: false'
          } >> "$GITHUB_STEP_SUMMARY"
