name: Documentation Governance

on:
  pull_request:
  push:
    branches:
      - main
      - "admin-mcp/**"
      - "institutional/**"
      - "phase4/**"
    paths:
      - "**/*.md"
      - "**/*.mdx"
      - "**/*.json"
      - "**/*.svg"
      - "**/*.yml"
      - "**/*.yaml"
      - "scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate institutional documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Verify validator syntax
        run: |
          python -m py_compile scripts/validate_docs.py
          python -m py_compile scripts/pentadocs_quality.py
          python -m py_compile tests/test_pentadocs_quality.py
          python -m py_compile tests/test_docs_wave7_historical_baseline.py
          python -m py_compile scripts/substantive_rebuild_current_snapshot.py
          python -m py_compile scripts/build_substantive_rebuild_wave{1,2,3,4,5,6}.py
          python -m py_compile scripts/validate_sprint_7_substantive_wave1.py
          python -m py_compile scripts/validate_sprint_8_substantive_wave2.py
          python -m py_compile scripts/validate_sprint_9_substantive_wave3.py
          python -m py_compile scripts/validate_sprint_10_substantive_wave4.py
          python -m py_compile scripts/validate_sprint_11_substantive_wave5.py
          python -m py_compile scripts/validate_sprint_12_substantive_wave6.py
          python -m py_compile scripts/validate_phase_2_99_hard_exit_ledger.py
          python -m py_compile scripts/validate_phase3_institutional_gate.py
          python -m py_compile scripts/validate_gate_registry_v4.py
          python -m py_compile scripts/run_phase4_preparation_audit.py
          python -m py_compile scripts/validate_homepage_control_plane.py
          python -m py_compile scripts/render_homepage_projection.py
          python -m py_compile scripts/validate_collab_portal_adapter.py
          python -m py_compile scripts/validate_holdings_82_domain_seed.py
          python -m py_compile scripts/validate_phase_2_7_74_registry_seed.py
          python -m py_compile scripts/validate_s103_74_canonical_crosswalk.py
          python -m py_compile scripts/validate_s103_s100_engine_domain_edges.py
          python -m py_compile scripts/validate_repository_governance_enforcement_state.py
          python -m py_compile scripts/validate_phase_namespace_and_api_control.py
          python -m py_compile scripts/validate_agent_sovereign_governance.py
          python -m py_compile scripts/validate_security_governance.py
          python -m py_compile scripts/validate_github_actions_runtime_policy.py
          python -m py_compile scripts/penta_gap_closure.py
          python -m py_compile scripts/governed_merge_decision.py
          python -m py_compile scripts/resolve_pm_notification_recipients.py
          python -m py_compile scripts/security_self_heal_plan.py
          python -m py_compile scripts/validate_cie_wave1_docs.py
          python -m py_compile scripts/validate_cie_wave2_docs.py
          python -m py_compile scripts/validate_cie_wave3b_docs.py
          python -m py_compile scripts/validate_cie_wave4_docs.py
          python -m py_compile scripts/validate_thriveevergreen_hourly_product_orchestrator.py

      - name: Validate GitHub Actions runtime and supply-chain policy
        run: python scripts/validate_github_actions_runtime_policy.py

      - name: Validate Phase 4 V4 gate contract
        run: python scripts/validate_gate_registry_v4.py

      - name: Test PentaDocs audience and component quality engine
        run: python -m unittest -v tests.test_pentadocs_quality

      - name: Test Wave 7 historical/current dual-view adapter
        run: python -m unittest -v tests.test_docs_wave7_historical_baseline

      - name: Validate current semantic and immutable historical substantive views
        run: |
          python scripts/substantive_rebuild_current_snapshot.py --check
          python scripts/validate_sprint_7_substantive_wave1.py
          python scripts/validate_sprint_8_substantive_wave2.py
          python scripts/validate_sprint_9_substantive_wave3.py
          python scripts/validate_sprint_10_substantive_wave4.py
          python scripts/validate_sprint_11_substantive_wave5.py
          python scripts/validate_sprint_12_substantive_wave6.py

      - name: Validate immutable Phase 2.99 hard-exit ledger
        run: |
          python scripts/validate_phase_2_99_hard_exit_ledger.py --self-test
          python scripts/validate_phase_2_99_hard_exit_ledger.py

      - name: Run CrownThrive governance validator
        run: python scripts/validate_docs.py

      - name: Validate Phase 3 institutional gate
        run: python scripts/validate_phase3_institutional_gate.py

      - name: Validate exact retired-phase alias dispositions
        run: python scripts/penta_gap_closure.py . --json

      - name: Validate CIE Wave 1 documentation
        run: python scripts/validate_cie_wave1_docs.py

      - name: Validate CIE Wave 2 public/internal + CHLOM interoperability docs
        run: python scripts/validate_cie_wave2_docs.py

      - name: Validate CIE Wave 3B durable runtime documentation
        run: python scripts/validate_cie_wave3b_docs.py

      - name: Validate CIE Wave 4 activation evidence documentation
        run: python scripts/validate_cie_wave4_docs.py

      - name: Validate ThriveEvergreen hourly product orchestrator
        run: python scripts/validate_thriveevergreen_hourly_product_orchestrator.py

      - name: Validate homepage control-plane projection
        run: |
          python scripts/render_homepage_projection.py --check
          python scripts/validate_homepage_control_plane.py

      - name: Validate Collab Portal adapter contract
        run: python scripts/validate_collab_portal_adapter.py

      - name: Validate Holdings 82-domain seed
        run: python scripts/validate_holdings_82_domain_seed.py

      - name: Validate Phase 2.7 74-registry seed
        run: python scripts/validate_phase_2_7_74_registry_seed.py

      - name: Validate S103 74-row canonical crosswalk
        run: python scripts/validate_s103_74_canonical_crosswalk.py

      - name: Validate S103/S100 engine-domain edges
        run: python scripts/validate_s103_s100_engine_domain_edges.py

      - name: Validate ten-phase namespace and API/MCP control plane
        run: python scripts/validate_phase_namespace_and_api_control.py

      - name: Validate agent-sovereign governance
        run: python scripts/validate_agent_sovereign_governance.py

      - name: Validate deterministic security governance
        run: python scripts/validate_security_governance.py

      - name: Validate agent merge decision invariants
        run: python scripts/governed_merge_decision.py --self-test

      - name: Validate PM notification routing invariants
        run: python scripts/resolve_pm_notification_recipients.py --self-test

      - name: Validate security self-healing invariants
        run: python scripts/security_self_heal_plan.py --self-test

      - name: Validate repository governance state
        run: python scripts/validate_repository_governance_enforcement_state.py

      - name: Check whitespace and conflict markers
        run: |
          git diff --check
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!THIRD_PARTY_NOTICES.md'; then
            echo "Unresolved merge-conflict markers detected."
            exit 1
          fi
