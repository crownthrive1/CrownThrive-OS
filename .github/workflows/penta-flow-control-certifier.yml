name: Penta Flow Control Certifier

on:
  pull_request:
    paths:
      - 'scripts/penta_flow_control_certifier.py'
      - 'runtime/penta_d3_approval.py'
      - 'tests/test_penta_flow_control_certifier.py'
      - 'tests/test_penta_d3_approval.py'
      - 'supabase/migrations/20260827170000_d3_founder_production_approval_window_v1.sql'
      - '.github/workflows/penta-flow-control-certifier.yml'
  push:
    branches:
      - main
      - 'penta/**'
    paths:
      - 'scripts/penta_flow_control_certifier.py'
      - 'runtime/penta_d3_approval.py'
      - 'tests/test_penta_flow_control_certifier.py'
      - 'tests/test_penta_d3_approval.py'
      - 'supabase/migrations/20260827170000_d3_founder_production_approval_window_v1.sql'
      - '.github/workflows/penta-flow-control-certifier.yml'

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Run certifier regression suite
        run: python -m unittest -v tests.test_penta_flow_control_certifier tests.test_penta_d3_approval
