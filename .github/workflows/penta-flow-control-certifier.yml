name: Penta Flow Control Certifier

on:
  pull_request:
    paths:
      - 'scripts/penta_flow_control_certifier.py'
      - 'tests/test_penta_flow_control_certifier.py'
      - '.github/workflows/penta-flow-control-certifier.yml'
  push:
    branches:
      - main
      - 'penta/**'
    paths:
      - 'scripts/penta_flow_control_certifier.py'
      - 'tests/test_penta_flow_control_certifier.py'
      - '.github/workflows/penta-flow-control-certifier.yml'

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run certifier regression suite
        run: python -m unittest discover -s tests -p 'test_penta_flow_control_certifier.py' -v
