name: PentaVercel Preview Certification

on:
  deployment_status:

permissions:
  contents: read
  deployments: read
  id-token: write

concurrency:
  group: pentavercel-preview-${{ github.event.deployment.id }}
  cancel-in-progress: true

jobs:
  certify-preview:
    name: Certify Vercel preview
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Preview'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url }}
      DEPLOYMENT_ID: ${{ github.event.deployment.id }}
      DEPLOYMENT_STATUS_ID: ${{ github.event.deployment_status.id }}
      DEPLOYMENT_SHA: ${{ github.event.deployment.sha }}
      DEPLOYMENT_REF: ${{ github.event.deployment.ref }}
      GH_API_TOKEN: ${{ github.token }}
    steps:
      - name: Provider-originated preview certification
        shell: bash
        run: |
          set -euo pipefail

          # Match GitHub toolkit core.getIDToken() with no audience override.
          # When the Vercel project trusts this identity, application-level
          # preview probes execute through Deployment Protection. When it does
          # not, the 401/403 wall is recorded as a bounded Trusted Sources HOLD
          # rather than being misreported as a deployment/build/runtime outage.
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?GitHub OIDC request URL unavailable}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?GitHub OIDC request token unavailable}"
          OIDC_RESPONSE="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}")"
          TRUSTED_OIDC_TOKEN="$(jq -er '.value' <<<"${OIDC_RESPONSE}")"
          echo "::add-mask::${TRUSTED_OIDC_TOKEN}"
          export TRUSTED_OIDC_TOKEN

          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from typing import Any

          raw_base = os.environ.get("DEPLOYMENT_URL", "").strip().rstrip("/")
          parsed = urllib.parse.urlparse(raw_base)
          if (
              parsed.scheme != "https"
              or not parsed.hostname
              or not parsed.hostname.endswith(".vercel.app")
              or parsed.username
              or parsed.password
              or parsed.port not in (None, 443)
          ):
              raise SystemExit("Preview URL is missing or outside the allowlisted Vercel HTTPS boundary.")

          deployment_id = os.environ.get("DEPLOYMENT_ID", "").strip()
          deployment_status_id = os.environ.get("DEPLOYMENT_STATUS_ID", "").strip()
          expected_sha = os.environ.get("DEPLOYMENT_SHA", "").strip()
          expected_ref = os.environ.get("DEPLOYMENT_REF", "").strip()
          repository = os.environ.get("GITHUB_REPOSITORY", "").strip()
          gh_token = os.environ.get("GH_API_TOKEN", "").strip()
          trusted_oidc_token = os.environ["TRUSTED_OIDC_TOKEN"]

          if not deployment_id.isdigit():
              raise SystemExit("GitHub deployment id is unavailable or malformed.")
          if not repository or not gh_token:
              raise SystemExit("GitHub provider readback credentials are unavailable.")

          def gh_json(path: str) -> Any:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}{path}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {gh_token}",
                      "User-Agent": "CrownThrive-PentaVercel-Preview-Certifier/2.0",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=15) as response:
                  return json.loads(response.read().decode("utf-8"))

          provider_failures: list[str] = []
          application_failures: list[str] = []
          bounded_holds: list[str] = []

          # Re-read GitHub's Vercel deployment record rather than trusting only
          # the workflow trigger. This binds provider success to the exact
          # deployment id, commit SHA, ref, environment, and environment URL.
          deployment = gh_json(f"/deployments/{deployment_id}")
          statuses = gh_json(f"/deployments/{deployment_id}/statuses?per_page=25")
          event_status = None
          if deployment_status_id.isdigit():
              event_status = next(
                  (s for s in statuses if str(s.get("id", "")) == deployment_status_id),
                  None,
              )
          if event_status is None and statuses:
              event_status = statuses[0]

          if str(deployment.get("id", "")) != deployment_id:
              provider_failures.append("provider: deployment id readback mismatch")
          if expected_sha and deployment.get("sha") != expected_sha:
              provider_failures.append("provider: deployment SHA readback mismatch")
          if expected_ref and deployment.get("ref") != expected_ref:
              provider_failures.append("provider: deployment ref readback mismatch")
          if deployment.get("environment") != "Preview":
              provider_failures.append("provider: deployment environment is not Preview")
          if not isinstance(event_status, dict):
              provider_failures.append("provider: deployment status readback missing")
          else:
              if event_status.get("state") != "success":
                  provider_failures.append("provider: deployment status is not success")
              observed_url = (event_status.get("environment_url") or "").rstrip("/")
              if observed_url and observed_url != raw_base:
                  provider_failures.append("provider: deployment environment URL readback mismatch")

          common_headers = {
              "Accept": "application/json",
              "User-Agent": "CrownThrive-PentaVercel-Preview-Certifier/2.0",
              "x-vercel-trusted-oidc-idp-token": trusted_oidc_token,
          }

          def request_payload(path: str, *, method: str = "GET", data: bytes | None = None) -> dict:
              headers = dict(common_headers)
              if data is not None:
                  headers["Content-Type"] = "application/json"
              request = urllib.request.Request(
                  f"{raw_base}{path}",
                  data=data,
                  method=method,
                  headers=headers,
              )
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      status = response.status
                      raw = response.read().decode("utf-8", errors="replace")
                      response_headers = {k.lower(): v for k, v in response.headers.items()}
              except urllib.error.HTTPError as error:
                  status = error.code
                  raw = error.read().decode("utf-8", errors="replace")
                  response_headers = {k.lower(): v for k, v in error.headers.items()}
              except Exception as error:
                  return {
                      "http_status": None,
                      "body": {},
                      "raw": "",
                      "headers": {},
                      "error": f"{type(error).__name__}: {error}",
                  }

              body: dict = {}
              try:
                  decoded = json.loads(raw)
                  if isinstance(decoded, dict):
                      body = decoded
              except json.JSONDecodeError:
                  pass
              return {
                  "http_status": status,
                  "body": body,
                  "raw": raw[:320],
                  "headers": response_headers,
              }

          def is_vercel_protection_wall(result: dict) -> bool:
              status = result.get("http_status")
              headers = result.get("headers") or {}
              server = str(headers.get("server", "")).lower()
              return (
                  status in (401, 403)
                  and ("vercel" in server or bool(headers.get("x-vercel-id")))
              )

          results: dict[str, dict] = {}
          for key, path in {
              "health": "/api/health",
              "mcp": "/api/mcp?selftest=1",
              "pentafabric": "/api/penta?selftest=1",
          }.items():
              results[key] = request_payload(path)

          read_results = [results["health"], results["mcp"], results["pentafabric"]]
          protection_wall = all(is_vercel_protection_wall(item) for item in read_results)
          partial_protection = any(is_vercel_protection_wall(item) for item in read_results)

          if protection_wall:
              application_probe_status = "HOLD_TRUSTED_SOURCE"
              certification_scope = "provider-deployment-only"
              bounded_holds.append(
                  "application: Vercel Deployment Protection rejected the GitHub OIDC identity; provider deployment is READY/success but application-level preview probes remain trust-gated"
              )
          else:
              application_probe_status = "PASS"
              certification_scope = "provider-deployment-and-application-runtime"
              if partial_protection:
                  application_failures.append(
                      "application: inconsistent Deployment Protection response across preview endpoints"
                  )

              for key, result in results.items():
                  if result.get("error"):
                      application_failures.append(f"{key}: provider request failed")

              health = results.get("health", {}).get("body", {})
              if results.get("health", {}).get("http_status") != 200:
                  application_failures.append("health: HTTP status is not 200")
              if health.get("status") != "OPERATIONAL":
                  application_failures.append("health: status is not OPERATIONAL")
              if health.get("release") != "candidate":
                  application_failures.append("health: preview release is not candidate")
              if health.get("vercel_provider_state") != "BOUND_PREVIEW":
                  application_failures.append("health: provider state is not BOUND_PREVIEW")
              if health.get("provider_readback") is not True:
                  application_failures.append("health: provider_readback is not true")
              if health.get("pass_manufactured") is not False:
                  application_failures.append("health: pass_manufactured invariant failed")

              mcp = results.get("mcp", {}).get("body", {})
              if mcp.get("status") != "OPERATIONAL":
                  application_failures.append("mcp: status is not OPERATIONAL")
              if mcp.get("self_test", {}).get("status") != "PASS":
                  application_failures.append("mcp: protocol self-test did not pass")
              if mcp.get("write_tools") != 0:
                  application_failures.append("mcp: write tool count is not zero")

              penta = results.get("pentafabric", {}).get("body", {})
              if penta.get("status") != "OPERATIONAL":
                  application_failures.append("pentafabric: status is not OPERATIONAL")
              if penta.get("self_test", {}).get("status") != "PASS":
                  application_failures.append("pentafabric: packet self-test did not pass")
              if penta.get("write_authorization", {}).get("required") is not True:
                  application_failures.append("pentafabric: write authorization is not required")

          if protection_wall:
              results["unauthorized_write"] = {
                  "status": "NOT_EXECUTED",
                  "reason": "Vercel Deployment Protection blocks application-level access before the Penta write boundary.",
              }
              negative_status = None
          else:
              negative = request_payload("/api/penta", method="POST", data=b"{}")
              results["unauthorized_write"] = negative
              negative_status = negative.get("http_status")
              negative_body = negative.get("body") or {}
              if negative_status not in (401, 403, 503):
                  application_failures.append(
                      f"pentafabric: unauthenticated write returned {negative_status}, expected 401/403/503"
                  )
              if negative_body.get("status") != "WRITE_GATED":
                  application_failures.append(
                      "pentafabric: unauthenticated write did not report WRITE_GATED"
                  )

          failures = provider_failures + application_failures
          provider_status = "PASS" if not provider_failures else "HOLD"
          status = "PASS" if not failures else "HOLD"

          envelope = {
              "schema": "ct.penta.vercel.preview-certification.20260828.v2",
              "status": status,
              "certification_scope": certification_scope,
              "provider_deployment_status": provider_status,
              "application_probe_status": application_probe_status,
              "deployment_url": raw_base,
              "deployment_id": deployment_id,
              "deployment_sha": deployment.get("sha"),
              "deployment_ref": deployment.get("ref"),
              "provider_readback": {
                  "deployment": {
                      "id": deployment.get("id"),
                      "sha": deployment.get("sha"),
                      "ref": deployment.get("ref"),
                      "environment": deployment.get("environment"),
                      "creator": (deployment.get("creator") or {}).get("login"),
                  },
                  "status": event_status,
              },
              "results": results,
              "failures": failures,
              "bounded_holds": bounded_holds,
              "github": {
                  "repository": repository,
                  "sha": os.getenv("GITHUB_SHA"),
                  "run_id": os.getenv("GITHUB_RUN_ID"),
                  "run_attempt": os.getenv("GITHUB_RUN_ATTEMPT"),
              },
              "observed_at": datetime.now(timezone.utc).isoformat(),
              "pass_manufactured": False,
          }
          canonical = json.dumps(envelope, sort_keys=True, separators=(",", ":"))
          envelope["sha256"] = hashlib.sha256(canonical.encode("utf-8")).hexdigest()
          print(json.dumps(envelope, indent=2, sort_keys=True))

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("# PentaVercel preview certification\n\n")
              summary.write(f"- Status: **{envelope['status']}**\n")
              summary.write(f"- Scope: `{certification_scope}`\n")
              summary.write(f"- Provider deployment: **{provider_status}**\n")
              summary.write(f"- Application probe: **{application_probe_status}**\n")
              summary.write(f"- Deployment: `{raw_base}`\n")
              summary.write(f"- Deployment SHA: `{deployment.get('sha')}`\n")
              summary.write(f"- Receipt: `{envelope['sha256']}`\n")
              if protection_wall:
                  summary.write("- Deployment Protection: `ENFORCED`\n")
                  summary.write("- Trusted Sources: `HOLD` — GitHub OIDC identity is not accepted by the Vercel project yet\n")
                  summary.write("- Application-level smoke/self-tests: `NOT EXECUTED` behind the Vercel protection wall\n")
              else:
                  summary.write("- MCP write tools: `0`\n")
                  summary.write(f"- Unauthorized Penta write: `{negative_status}`\n")
              if bounded_holds:
                  summary.write("\n## Bounded holds\n")
                  for hold in bounded_holds:
                      summary.write(f"- {hold}\n")
              if failures:
                  summary.write("\n## Failures\n")
                  for failure in failures:
                      summary.write(f"- {failure}\n")

          if failures:
              raise SystemExit(1)
          PY
