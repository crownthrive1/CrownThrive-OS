name: PentaRelease — PR Backlog Reconciler

on:
  release:
    types: [published]
  workflow_run:
    workflows:
      - "PentaRelease — Autonomous Release Awareness"
      - "PentaRelease — Comprehensive Release Surface"
    types: [completed]
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

# Release/workflow events are the primary path. The hourly sweep is only a
# recovery net; a newer reconciliation supersedes an older in-flight sweep.
concurrency:
  group: pentarelease-pr-backlog-reconciler
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Retire provider-proven and source-converged PentaRelease PR shells
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          REPO="$GITHUB_REPOSITORY"
          gh api "repos/$REPO/releases?per_page=100" >/tmp/pentarelease-releases.json
          LATEST=$(jq -r '[.[] | select(.draft == false and .prerelease == false)][0].tag_name // empty' /tmp/pentarelease-releases.json)
          if [ -z "$LATEST" ]; then
            echo 'No published release exists; nothing may be retired.'
            exit 0
          fi

          jq --arg tag "$LATEST" '.[] | select(.tag_name == $tag) | {tagName: .tag_name, isDraft: .draft, isPrerelease: .prerelease, url: .html_url}' \
            /tmp/pentarelease-releases.json >/tmp/pentarelease-latest.json
          test "$(jq -r '.isDraft' /tmp/pentarelease-latest.json)" = "false"
          test "$(jq -r '.isPrerelease' /tmp/pentarelease-latest.json)" = "false"

          # Provider publication is not sufficient terminal evidence for a release
          # shell. Read the canonical managed-source projection from protected main.
          SOURCE_TAG=""
          if gh api "repos/$REPO/contents/.pentarelease/state/release-surface.json?ref=main" >/tmp/pentarelease-source-state-api.json 2>/dev/null; then
            jq -r '.content // empty' /tmp/pentarelease-source-state-api.json | tr -d '\n' | base64 --decode >/tmp/pentarelease-source-state.json 2>/dev/null || true
            if jq -e . /tmp/pentarelease-source-state.json >/dev/null 2>&1; then
              SOURCE_TAG=$(jq -r '.last_release // empty' /tmp/pentarelease-source-state.json)
            fi
          fi

          if [ -n "$SOURCE_TAG" ]; then
            if gh api "repos/$REPO/contents/pentarelease/latest.mdx?ref=main" >/tmp/pentarelease-latest-source-api.json 2>/dev/null; then
              jq -r '.content // empty' /tmp/pentarelease-latest-source-api.json | tr -d '\n' | base64 --decode >/tmp/pentarelease-latest-source.mdx 2>/dev/null || true
              if ! grep -Fq "$SOURCE_TAG" /tmp/pentarelease-latest-source.mdx; then
                echo "Managed source state/page disagree: state=$SOURCE_TAG; terminal retirement disabled."
                SOURCE_TAG=""
              fi
            else
              echo 'Managed latest-release source page is unreadable; terminal retirement disabled.'
              SOURCE_TAG=""
            fi
          fi

          source_covers_tag() {
            local source_tag="$1"
            local candidate_tag="$2"
            python3 - "$source_tag" "$candidate_tag" <<'PY'
          import sys

          def version(tag: str):
              value = tag.strip()
              if value.startswith('v'):
                  value = value[1:]
              parts = value.split('.')
              if len(parts) != 4 or any(not p.isdigit() for p in parts):
                  raise ValueError(value)
              return tuple(int(p) for p in parts)

          try:
              source = version(sys.argv[1])
              candidate = version(sys.argv[2])
          except Exception:
              raise SystemExit(2)
          raise SystemExit(0 if source >= candidate else 1)
          PY
          }

          gh pr list --repo "$REPO" --state open --limit 100 \
            --json number,title,headRefName > /tmp/pentarelease-open-prs.json

          retired=0
          retained_branches=0
          held_for_source_convergence=0
          while IFS=$'\t' read -r number title head; do
            [ -n "$number" ] || continue

            case "$head" in
              pentarelease/auto-*)
                version=${title#PentaRelease autonomous release }
                tag="v${version#v}"
                if ! gh api "repos/$REPO/releases/tags/$tag" >/tmp/pentarelease-candidate.json 2>/dev/null; then
                  echo "KEEP #$number: no provider release readback for $tag"
                  continue
                fi
                test "$(jq -r '.draft' /tmp/pentarelease-candidate.json)" = "false"
                test "$(jq -r '.prerelease' /tmp/pentarelease-candidate.json)" = "false"
                jq -e '[.assets[].name] | index("MANIFEST.json") != null' /tmp/pentarelease-candidate.json >/dev/null
                jq -e '[.assets[].name] | index("RELEASE_NOTES.md") != null' /tmp/pentarelease-candidate.json >/dev/null
                ;;

              pentarelease/surface-*)
                tag=${title#PentaRelease comprehensive surface }
                if ! gh api "repos/$REPO/releases/tags/$tag" >/tmp/pentarelease-candidate.json 2>/dev/null; then
                  echo "KEEP #$number: no provider release readback for $tag"
                  continue
                fi
                test "$(jq -r '.draft' /tmp/pentarelease-candidate.json)" = "false"
                test "$(jq -r '.prerelease' /tmp/pentarelease-candidate.json)" = "false"
                jq -e '[.assets[].name] | index("PENTARELEASE_COMPREHENSIVE_RELEASE.md") != null' /tmp/pentarelease-candidate.json >/dev/null
                jq -e '[.assets[].name] | index("PENTARELEASE_EVIDENCE.json") != null' /tmp/pentarelease-candidate.json >/dev/null
                ;;

              *)
                continue
                ;;
            esac

            author=$(gh api "repos/$REPO/pulls/$number" --jq '.user.login // empty')
            if [ "$author" != "github-actions[bot]" ]; then
              echo "KEEP #$number: provider REST author is '$author', not github-actions[bot]."
              continue
            fi

            # Published provider state is not enough: protected main must prove the
            # same release or a newer forward-only managed-source projection.
            if [ -z "$SOURCE_TAG" ] || ! source_covers_tag "$SOURCE_TAG" "$tag"; then
              echo "KEEP #$number: source projection not converged for $tag (main managed source=${SOURCE_TAG:-unreadable})."
              held_for_source_convergence=$((held_for_source_convergence + 1))
              continue
            fi

            NOTE="PentaRelease reconciler: provider readback proves $tag is published and its required evidence assets exist; protected-main managed-source readback also proves source projection $SOURCE_TAG, which is the same release or a newer forward-only projection. Provider REST identity proves this generated PR was authored by github-actions[bot]. This shell is therefore represented and may retire without deleting its retained branch or weakening protected-main governance."
            gh pr close "$number" --repo "$REPO" --comment "$NOTE"
            echo "RETIRED #$number ($tag); managed source=$SOURCE_TAG; generated branch retained under least-privilege contents:read authority."
            retired=$((retired + 1))
            retained_branches=$((retained_branches + 1))
          done < <(jq -r '.[] | [.number,.title,.headRefName] | @tsv' /tmp/pentarelease-open-prs.json)

          {
            echo '## PentaRelease PR backlog reconciliation'
            echo
            echo "- Trigger: $GITHUB_EVENT_NAME"
            echo "- Latest published release: $LATEST"
            echo "- Protected-main managed source release: ${SOURCE_TAG:-unreadable}"
            echo "- Generated PR shells retired: $retired"
            echo "- Held for source convergence: $held_for_source_convergence"
            echo "- Generated branches retained under least privilege: $retained_branches"
            echo '- Recovery sweep cadence: hourly; release and upstream workflow events remain primary.'
            echo '- Safety invariant: provider publication/assets alone never authorize PR-shell retirement.'
            echo '- Safety invariant: protected-main managed source must represent the candidate release or a newer forward-only release before retirement.'
            echo '- Generated-PR identity is verified from the provider REST pull-request record.'
            echo '- Remote branch deletion remains advisory and is not granted to this workflow.'
            echo '- Main-branch rules are not bypassed or weakened.'
          } >> "$GITHUB_STEP_SUMMARY"
