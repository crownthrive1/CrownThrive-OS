name: PentaRelease — PR Backlog Reconciler

on:
  release:
    types: [published]
  workflow_run:
    workflows:
      - "PentaRelease — Autonomous Release Awareness"
      - "PentaRelease — Comprehensive Release Surface"
    types: [completed]
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

# Release/workflow events are the primary path. The hourly sweep is only a
# recovery net; a newer reconciliation supersedes an older in-flight sweep.
concurrency:
  group: pentarelease-pr-backlog-reconciler
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Retire provider-proven and source-converged PentaRelease PR shells
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          REPO="$GITHUB_REPOSITORY"
          gh api "repos/$REPO/releases?per_page=100" >/tmp/pentarelease-releases.json
          LATEST=$(jq -r '[.[] | select(.draft == false and .prerelease == false)][0].tag_name // empty' /tmp/pentarelease-releases.json)
          if [ -z "$LATEST" ]; then
            echo 'No published release exists; nothing may be retired.'
            exit 0
          fi

          jq --arg tag "$LATEST" '.[] | select(.tag_name == $tag) | {tagName: .tag_name, isDraft: .draft, isPrerelease: .prerelease, url: .html_url}' \
            /tmp/pentarelease-releases.json >/tmp/pentarelease-latest.json
          test "$(jq -r '.isDraft' /tmp/pentarelease-latest.json)" = "false"
          test "$(jq -r '.isPrerelease' /tmp/pentarelease-latest.json)" = "false"

          # Provider publication is not sufficient terminal evidence for a release
          # shell. Read the canonical managed-source projection from protected main.
          SOURCE_TAG=""
          if gh api "repos/$REPO/contents/.pentarelease/state/release-surface.json?ref=main" >/tmp/pentarelease-source-state-api.json 2>/dev/null; then
            jq -r '.content // empty' /tmp/pentarelease-source-state-api.json | tr -d '\n' | base64 --decode >/tmp/pentarelease-source-state.json 2>/dev/null || true
            if jq -e . /tmp/pentarelease-source-state.json >/dev/null 2>&1; then
              SOURCE_TAG=$(jq -r '.last_release // empty' /tmp/pentarelease-source-state.json)
            fi
          fi

          if [ -n "$SOURCE_TAG" ]; then
            if gh api "repos/$REPO/contents/pentarelease/latest.mdx?ref=main" >/tmp/pentarelease-latest-source-api.json 2>/dev/null; then
              jq -r '.content // empty' /tmp/pentarelease-latest-source-api.json | tr -d '\n' | base64 --decode >/tmp/pentarelease-latest-source.mdx 2>/dev/null || true
              if ! grep -Fq "$SOURCE_TAG" /tmp/pentarelease-latest-source.mdx; then
                echo "Managed source state/page disagree: state=$SOURCE_TAG; terminal retirement disabled."
                SOURCE_TAG=""
              fi
            else
              echo 'Managed latest-release source page is unreadable; terminal retirement disabled.'
              SOURCE_TAG=""
            fi
          fi

          source_covers_tag() {
            local source_tag="$1"
            local candidate_tag="$2"
            python3 - "$source_tag" "$candidate_tag" <<'PY'
          import sys

          def version(tag: str):
              value = tag.strip()
              if value.startswith('v'):
                  value = value[1:]
              parts = value.split('.')
              if len(parts) != 4 or any(not p.isdigit() for p in parts):
                  raise ValueError(value)
              return tuple(int(p) for p in parts)

          try:
              source = version(sys.argv[1])
              candidate = version(sys.argv[2])
          except Exception:
              raise SystemExit(2)
          raise SystemExit(0 if source >= candidate else 1)
          PY
          }

          # Fail closed: even generated paths may contain unique follow-up work.
          # Superseded generated bytes that differ from main are intentionally held.
          exact_source_coverage() {
            python3 - "$REPO" "$1" <<'PY_COVERAGE'
          import json
          import subprocess
          import sys


          def api(repo, path):
              return json.loads(subprocess.check_output(
                  ['gh', 'api', f'repos/{repo}/{path}'], text=True))


          def represented_on_main(repo, number):
              def read(path):
                  return api(repo, path)

              def identity(pr):
                  return (pr['state'], pr['user']['login'], pr['head']['sha'],
                          pr['head']['repo']['full_name'], pr['base']['sha'],
                          pr['base']['ref'], pr['base']['repo']['full_name'],
                          pr['changed_files'])

              def tree(sha):
                  result = read(f'git/trees/{sha}?recursive=1')
                  if result.get('truncated') is not False:
                      raise ValueError('incomplete tree readback')
                  entries = result['tree']
                  paths = {entry['path']: (entry['mode'], entry['type'], entry['sha'])
                           for entry in entries}
                  if len(paths) != len(entries):
                      raise ValueError('duplicate tree paths')
                  return paths

              pr = read(f'pulls/{number}')
              snapshot = identity(pr)
              if (pr['state'] != 'open' or pr['user']['login'] != 'github-actions[bot]'
                      or pr['base']['ref'] != 'main'
                      or pr['base']['repo']['full_name'] != repo
                      or pr['head']['repo']['full_name'] != repo):
                  raise ValueError('PR identity or target changed')
              expected = pr['changed_files']
              if type(expected) is not int or not 0 < expected <= 3000:
                  raise ValueError('changed-file count missing, empty, or beyond API limit')
              files = []
              for page in range(1, 32):
                  batch = read(f'pulls/{number}/files?per_page=100&page={page}')
                  if not isinstance(batch, list) or len(batch) > 100:
                      raise ValueError('invalid changed-file page')
                  files.extend(batch)
                  if len(batch) < 100:
                      break
              if len(files) != expected or len({f['filename'] for f in files}) != expected:
                  raise ValueError('incomplete or duplicate changed-file listing')

              main_sha = read('commits/main')['sha']
              main_tree = tree(main_sha)
              head_tree = tree(pr['head']['sha'])
              for item in files:
                  path, status = item['filename'], item['status']
                  if status not in ('added', 'modified', 'removed', 'renamed', 'changed', 'copied'):
                      raise ValueError(f'unsupported change status: {status}')
                  if status == 'removed':
                      if path in main_tree or path in head_tree:
                          raise ValueError(f'deletion not represented: {path}')
                  elif path not in head_tree or main_tree.get(path) != head_tree[path]:
                      raise ValueError(f'exact PR content/mode not represented: {path}')
                  if status == 'renamed':
                      previous = item['previous_filename']
                      if previous in main_tree or previous in head_tree:
                          raise ValueError(f'rename source still present: {previous}')

              # A bot-created branch may acquire human follow-up changes, including inside
              # generated paths. Version, author, and path allowlists cannot prove coverage.
              # Do not act on a stale file list or a main snapshot that moved while reading.
              if read('commits/main')['sha'] != main_sha:
                  raise ValueError('main changed during coverage proof')
              if identity(read(f'pulls/{number}')) != snapshot:
                  raise ValueError('PR changed during coverage proof')
              print(f'Exact changed-path content/mode represented on main {main_sha}.')


          if __name__ == '__main__':
              try:
                  represented_on_main(sys.argv[1], sys.argv[2])
              except Exception as exc:
                  print(f'HOLD exact-source proof: {exc}', file=sys.stderr)
                  raise SystemExit(1)
          PY_COVERAGE
          }

          # The repository can exceed 100 open PRs. Page the provider API so the
          # reconciler cannot silently ignore older generated shells.
          : > /tmp/pentarelease-open-prs.ndjson
          page=1
          while true; do
            batch=$(gh api "repos/$REPO/pulls?state=open&per_page=100&page=$page")
            count=$(jq 'length' <<<"$batch")
            [ "$count" -gt 0 ] || break
            jq -c '.[] | {number,title,headRefName:.head.ref}' <<<"$batch" >> /tmp/pentarelease-open-prs.ndjson
            [ "$count" -eq 100 ] || break
            page=$((page + 1))
          done
          jq -s '.' /tmp/pentarelease-open-prs.ndjson > /tmp/pentarelease-open-prs.json
          echo "Provider-complete open PR scan: $(jq 'length' /tmp/pentarelease-open-prs.json) PRs across $page page(s)."

          retired=0
          retained_branches=0
          held_for_source_convergence=0
          held_for_exact_source=0
          while IFS=$'\t' read -r number title head; do
            [ -n "$number" ] || continue

            case "$head" in
              pentarelease/auto-*)
                version=${title#PentaRelease autonomous release }
                tag="v${version#v}"
                if ! gh api "repos/$REPO/releases/tags/$tag" >/tmp/pentarelease-candidate.json 2>/dev/null; then
                  echo "KEEP #$number: no provider release readback for $tag"
                  continue
                fi
                test "$(jq -r '.draft' /tmp/pentarelease-candidate.json)" = "false"
                test "$(jq -r '.prerelease' /tmp/pentarelease-candidate.json)" = "false"
                jq -e '[.assets[].name] | index("MANIFEST.json") != null' /tmp/pentarelease-candidate.json >/dev/null
                jq -e '[.assets[].name] | index("RELEASE_NOTES.md") != null' /tmp/pentarelease-candidate.json >/dev/null
                ;;

              pentarelease/surface-*)
                tag=${title#PentaRelease comprehensive surface }
                if ! gh api "repos/$REPO/releases/tags/$tag" >/tmp/pentarelease-candidate.json 2>/dev/null; then
                  echo "KEEP #$number: no provider release readback for $tag"
                  continue
                fi
                test "$(jq -r '.draft' /tmp/pentarelease-candidate.json)" = "false"
                test "$(jq -r '.prerelease' /tmp/pentarelease-candidate.json)" = "false"
                jq -e '[.assets[].name] | index("PENTARELEASE_COMPREHENSIVE_RELEASE.md") != null' /tmp/pentarelease-candidate.json >/dev/null
                jq -e '[.assets[].name] | index("PENTARELEASE_EVIDENCE.json") != null' /tmp/pentarelease-candidate.json >/dev/null
                ;;

              *)
                continue
                ;;
            esac

            author=$(gh api "repos/$REPO/pulls/$number" --jq '.user.login // empty')
            if [ "$author" != "github-actions[bot]" ]; then
              echo "KEEP #$number: provider REST author is '$author', not github-actions[bot]."
              continue
            fi

            # Published provider state is not enough: protected main must prove the
            # same release or a newer forward-only managed-source projection.
            if [ -z "$SOURCE_TAG" ] || ! source_covers_tag "$SOURCE_TAG" "$tag"; then
              echo "KEEP #$number: source projection not converged for $tag (main managed source=${SOURCE_TAG:-unreadable})."
              held_for_source_convergence=$((held_for_source_convergence + 1))
              continue
            fi

            if ! exact_source_coverage "$number"; then
              echo "KEEP #$number: complete exact-source coverage is unproven."
              held_for_exact_source=$((held_for_exact_source + 1))
              continue
            fi

            NOTE="PentaRelease reconciler: provider readback proves $tag is published and its required evidence assets exist; protected-main managed-source readback also proves source projection $SOURCE_TAG, which is the same release or a newer forward-only projection. Provider REST identity proves this generated PR was authored by github-actions[bot]. A complete changed-file readback also proves every resulting path, blob, and mode is already represented on pinned main, including deletions and renames, with unchanged PR head/base readback. This shell is therefore represented and may retire without deleting its retained branch or weakening protected-main governance."
            gh pr close "$number" --repo "$REPO" --comment "$NOTE"
            echo "RETIRED #$number ($tag); managed source=$SOURCE_TAG; generated branch retained under least-privilege contents:read authority."
            retired=$((retired + 1))
            retained_branches=$((retained_branches + 1))
          done < <(jq -r '.[] | [.number,.title,.headRefName] | @tsv' /tmp/pentarelease-open-prs.json)

          {
            echo '## PentaRelease PR backlog reconciliation'
            echo
            echo "- Trigger: $GITHUB_EVENT_NAME"
            echo "- Latest published release: $LATEST"
            echo "- Protected-main managed source release: ${SOURCE_TAG:-unreadable}"
            echo "- Generated PR shells retired: $retired"
            echo "- Held for source convergence: $held_for_source_convergence"
            echo "- Held for exact source coverage: $held_for_exact_source"
            echo '- Exact coverage is required even for generated paths; newer but different generated bytes remain held.'
            echo "- Generated branches retained under least privilege: $retained_branches"
            echo '- Recovery sweep cadence: hourly; release and upstream workflow events remain primary.'
            echo '- Safety invariant: provider publication/assets alone never authorize PR-shell retirement.'
            echo '- Safety invariant: protected-main managed source must represent the candidate release or a newer forward-only release before retirement.'
            echo '- Generated-PR identity is verified from the provider REST pull-request record.'
            echo '- Remote branch deletion remains advisory and is not granted to this workflow.'
            echo '- Main-branch rules are not bypassed or weakened.'
          } >> "$GITHUB_STEP_SUMMARY"

