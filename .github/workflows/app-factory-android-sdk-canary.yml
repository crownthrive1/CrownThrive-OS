name: CrownThrive App Factory — Direct Android SDK Canary

on:
  push:
    branches:
      - app-factory/android-sdk-canary-20260831
    paths:
      - .github/workflows/app-factory-android-sdk-canary.yml
      - penta/evidence/app-factory/android-sdk-canary.ready
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-factory-android-sdk-canary-1.0.0-rc.1
  cancel-in-progress: false

jobs:
  android-sdk-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APP_FACTORY_RELEASE_ID: 1.0.0-rc.1
      APP_FACTORY_SOURCE_SHA: ef060e73d079c1b06304382763efdcb32b22ef1b
      APP_FACTORY_SOURCE_ZIP_SHA256: aacf319dfec12ec7052da36f55ed8deab505d8a2dd6e6a958f820fa4f027813a
      APP_FACTORY_CANONICAL_URL: https://app.crownthrive.io
      ANDROID_PLATFORM: android-35
      ANDROID_BUILD_TOOLS: 35.0.0
    steps:
      - name: Check out governed OS ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify live App Factory and Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            --max-time 30 \
            --output /tmp/app-factory-up.txt \
            "$APP_FACTORY_CANONICAL_URL/up"
          test -f /tmp/app-factory-up.txt
          sha256sum /tmp/app-factory-up.txt

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ -z "$SDKMANAGER" ] && [ -x "$ANDROID_HOME/tools/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;$ANDROID_PLATFORM" "build-tools;$ANDROID_BUILD_TOOLS"

          test -s "$ANDROID_HOME/platforms/$ANDROID_PLATFORM/android.jar"
          for tool in aapt2 d8 zipalign apksigner; do
            test -x "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/$tool"
          done
          java -version
          javac -version

      - name: Generate source-bound WebView application
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/io/crownthrive/appfactory/canary build/classes build/dex out

          cat > AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-sdk android:minSdkVersion="23" android:targetSdkVersion="35" />
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="false"
                  android:label="CrownThrive App Factory Canary"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name="io.crownthrive.appfactory.canary.MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="ct.app_factory.source_sha"
                      android:value="ef060e73d079c1b06304382763efdcb32b22ef1b" />
                  <meta-data
                      android:name="ct.app_factory.release_id"
                      android:value="1.0.0-rc.1" />
              </application>
          </manifest>
          EOF

          cat > src/io/crownthrive/appfactory/canary/MainActivity.java <<'EOF'
          package io.crownthrive.appfactory.canary;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public final class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(false);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("https://app.crownthrive.io");
                  setContentView(webView);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          find AndroidManifest.xml src -type f -print0 | sort -z | xargs -0 sha256sum | tee out/generated-source.sha256

      - name: Compile, package, align, and sign APK
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_JAR="$ANDROID_HOME/platforms/$ANDROID_PLATFORM/android.jar"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS"

          javac \
            -source 8 \
            -target 8 \
            -classpath "$ANDROID_JAR" \
            -d build/classes \
            src/io/crownthrive/appfactory/canary/MainActivity.java

          jar --create --file build/classes.jar -C build/classes .
          "$BUILD_TOOLS/d8" \
            --lib "$ANDROID_JAR" \
            --min-api 23 \
            --output build/dex \
            build/classes.jar

          "$BUILD_TOOLS/aapt2" link \
            -o build/base-unsigned.apk \
            -I "$ANDROID_JAR" \
            --manifest AndroidManifest.xml \
            --min-sdk-version 23 \
            --target-sdk-version 35 \
            --version-code 1 \
            --version-name "1.0.0-rc.1-canary"

          zip -q -j build/base-unsigned.apk build/dex/classes.dex

          keytool -genkeypair \
            -keystore build/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=CrownThrive App Factory Canary,O=CrownThrive,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          "$BUILD_TOOLS/zipalign" -f 4 build/base-unsigned.apk build/canary-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks build/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out out/crownthrive-app-factory-1.0.0-rc.1-sdk-canary.apk \
            build/canary-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs out/crownthrive-app-factory-1.0.0-rc.1-sdk-canary.apk \
            | tee out/apksigner-verification.txt
          test -s out/crownthrive-app-factory-1.0.0-rc.1-sdk-canary.apk
          sha256sum out/crownthrive-app-factory-1.0.0-rc.1-sdk-canary.apk \
            | tee out/crownthrive-app-factory-1.0.0-rc.1-sdk-canary.apk.sha256

      - name: Create deterministic canary receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          apk = Path("out/crownthrive-app-factory-1.0.0-rc.1-sdk-canary.apk")
          source_manifest = Path("out/generated-source.sha256").read_text(encoding="utf-8")
          receipt = {
              "schema": "ct.app-factory.android-sdk-canary.v1",
              "property_id": "ct.platform.app-factory",
              "release_id": os.environ["APP_FACTORY_RELEASE_ID"],
              "canonical_url": os.environ["APP_FACTORY_CANONICAL_URL"],
              "app_factory_source_commit": os.environ["APP_FACTORY_SOURCE_SHA"],
              "app_factory_source_zip_sha256": os.environ["APP_FACTORY_SOURCE_ZIP_SHA256"],
              "builder_repository": os.environ["GITHUB_REPOSITORY"],
              "builder_commit": os.environ["GITHUB_SHA"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "runner_os": os.environ["RUNNER_OS"],
              "artifact": {
                  "filename": apk.name,
                  "bytes": apk.stat().st_size,
                  "sha256": hashlib.sha256(apk.read_bytes()).hexdigest(),
              },
              "canary_scope": "live_https_webview_delivery_plane",
              "builder_mode": "direct_android_sdk_no_gradle",
              "generated_source_manifest_sha256": hashlib.sha256(source_manifest.encode()).hexdigest(),
              "secret_values_included": False,
              "production_certification_effect": "EVIDENCE_ONLY_UNTIL_THRIVEBASE_GATE",
          }
          Path("out/android-sdk-canary-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Upload APK and SHA-256 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crownthrive-app-factory-1.0.0-rc.1-android-sdk-canary
          path: out/
          if-no-files-found: error
          retention-days: 30
