name: Verify CHLOM Institutional Foundation v8

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/migration_lineage/provider_custody/institutional_foundation_v8/**'
      - 'supabase/migration_lineage/chlom_institutional_foundation_custody_v8.json'
      - 'supabase/migration_lineage/chlom_institutional_foundation_materialization_v8.json'
      - 'scripts/assemble_chlom_institutional_foundation_custody_v8.py'
      - 'scripts/verify_chlom_institutional_foundation_custody_v8.py'
      - '.github/workflows/verify-chlom-institutional-foundation-v8.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-chlom-institutional-foundation-v8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Exact provider federation identities and hashes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Verify institutional, framework, and agent-runtime custody
        run: |
          python scripts/verify_chlom_institutional_foundation_custody_v8.py
          python scripts/verify_chlom_replay_dependency_custody_v7.py
          python scripts/verify_chlom_agent_runtime_custody.py
