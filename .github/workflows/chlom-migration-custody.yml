name: CHLOM Migration Custody

on:
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'supabase/migration_lineage/**'
      - 'scripts/verify_chlom_migration_custody.py'
      - '.github/workflows/chlom-migration-custody.yml'
  push:
    branches:
      - 'repair/chlom-replay-custody-*'
    paths:
      - 'supabase/migrations/**'
      - 'supabase/migration_lineage/**'
      - 'scripts/verify_chlom_migration_custody.py'
      - '.github/workflows/chlom-migration-custody.yml'

permissions:
  contents: read

concurrency:
  group: chlom-migration-custody-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-source-custody:
    name: Verify CHLOM source custody
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify migration identity, digests, and safety boundary
        run: python3 scripts/verify_chlom_migration_custody.py
