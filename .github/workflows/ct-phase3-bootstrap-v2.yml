name: CT Phase 3 Bootstrap v2

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ct-phase3-bootstrap-v2.yml"
      - "changelog/2026-08-26-phase3-entry-bootstrap-v2.mdx"
      - "scripts/evaluate_ct_p299_machine_exit.py"
      - "governance/phase3-entry-production-fabric-attestation.v2.json"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: ct-phase3-bootstrap-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap-candidate:
    name: Bind exact-head Phase 3 bootstrap candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact current head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Acquire exact ThriveBase snapshot through GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase3-inputs artifacts
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?}"
          OIDC_RESPONSE="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ct-phase3-hard-exit")"
          OIDC_TOKEN="$(jq -er '.value' <<<"${OIDC_RESPONSE}")"
          BODY="$(jq -cn --arg head_sha "$(git rev-parse HEAD)" '{protocol:"ct_p299_phase3_snapshot_v1",head_sha:$head_sha,event_name:"push"}')"
          HTTP_CODE="$(curl --silent --show-error \
            --output phase3-inputs/thivebase-snapshot.json \
            --write-out "%{http_code}" \
            -X POST "https://tzajnzshmtzjenqulehq.supabase.co/functions/v1/ct-phase3-hard-exit-snapshot" \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "${BODY}")"
          test "${HTTP_CODE}" = "200"
          jq -e '.ok == true and .required_reads_complete == true and .phase3_live_gate_exact_head_bound == true' phase3-inputs/thivebase-snapshot.json >/dev/null

      - name: Require real machine GO and emit bootstrap packet
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CT_REPOSITORY: ${{ github.repository }}
          CT_EXPECTED_MAIN: main
        run: |
          set -euo pipefail
          python scripts/evaluate_ct_p299_machine_exit.py \
            --thivebase-snapshot phase3-inputs/thivebase-snapshot.json \
            --output artifacts/ct-p299-hard-exit-evaluation.json \
            --emit-bootstrap artifacts/ct-phase3-bootstrap-v2.json \
            --require-go
          jq -e '.verdict == "GO" and .bootstrap_permitted == true and .exact_git_sha == .current_main_sha and .holds == [] and (.absolute_no_go_conditions | length) == 0' artifacts/ct-p299-hard-exit-evaluation.json >/dev/null
          jq -e '.state == "GO_ELIGIBLE_BOOTSTRAP_NOT_COMMITTED" and .phase3_active == false' artifacts/ct-phase3-bootstrap-v2.json >/dev/null

      - name: Create or verify exact-head institutional Phase 3 bootstrap release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          TAG="institutional-phase-3.0-${HEAD_SHA:0:12}"
          EVAL_SHA="$(jq -r '.evaluation_sha256' artifacts/ct-p299-hard-exit-evaluation.json)"
          SNAP_SHA="$(jq -r '.thivebase_snapshot_sha256' artifacts/ct-p299-hard-exit-evaluation.json)"
          cat > artifacts/release-notes.md <<EOF
          CrownThrive institutional Phase 3 bootstrap candidate.

          Exact Support head: ${HEAD_SHA}
          CT-P299 evaluation SHA-256: ${EVAL_SHA}
          ThriveBase snapshot SHA-256: ${SNAP_SHA}
          Machine verdict: GO
          Activation state: GO_ELIGIBLE_BOOTSTRAP_NOT_COMMITTED

          This release does not by itself declare Phase 3 active. Phase 3 activation remains contingent on exact readback of all five bootstrap effects: DAIL transition event, ThriveBase baseline, Git tag/release, Mintlify changelog, and rollback snapshot.
          EOF
          if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${HEAD_SHA}" \
              --title "CrownThrive Institutional Phase 3.0 Bootstrap Candidate" \
              --notes-file artifacts/release-notes.md
          fi
          REMOTE_SHA="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${TAG}" | awk '{print $1}')"
          test "${REMOTE_SHA}" = "${HEAD_SHA}"
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json tagName,targetCommitish,url,name > artifacts/phase3-git-release-readback.json
          jq -e --arg tag "${TAG}" --arg head "${HEAD_SHA}" '.tagName == $tag and .targetCommitish == $head' artifacts/phase3-git-release-readback.json >/dev/null
          echo "PHASE3_BOOTSTRAP_TAG=${TAG}" >> "${GITHUB_ENV}"

      - name: Preserve bootstrap evidence summary
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg head "$(git rev-parse HEAD)" \
            --arg tag "${PHASE3_BOOTSTRAP_TAG}" \
            --arg evaluation_sha256 "$(jq -r '.evaluation_sha256' artifacts/ct-p299-hard-exit-evaluation.json)" \
            --arg snapshot_sha256 "$(jq -r '.thivebase_snapshot_sha256' artifacts/ct-p299-hard-exit-evaluation.json)" \
            '{state:"GIT_RELEASE_READBACK_PASS",exact_head_sha:$head,tag:$tag,evaluation_sha256:$evaluation_sha256,thivebase_snapshot_sha256:$snapshot_sha256,phase3_active:false}' \
            > artifacts/phase3-bootstrap-git-effect.json
          cat artifacts/phase3-bootstrap-git-effect.json
