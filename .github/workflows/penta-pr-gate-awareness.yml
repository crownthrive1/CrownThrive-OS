name: Penta PR Gate Awareness

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      number:
        description: Pull request number to reconcile
        required: true
        type: string

# v3 remains observation/projection-only. PentaPM owns Development metadata.
# It publishes exact-head originator readiness plus a machine-readable gate
# applicability/submission contract. It does not mutate candidate source.
permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: read
  statuses: read
  actions: read

concurrency:
  group: penta-pr-gate-awareness-${{ github.repository }}-${{ github.event.pull_request.number || inputs.number }}
  cancel-in-progress: true

jobs:
  gate-awareness:
    name: Penta originator readiness projection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve exact same-repository PR target
        id: target
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_NUMBER: ${{ inputs.number }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request

          repo = os.environ["REPOSITORY"]
          number = (os.environ.get("EVENT_NUMBER") or os.environ.get("INPUT_NUMBER") or "").strip()
          if not number.isdigit():
              raise SystemExit("pull_request_number_required")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/pulls/{number}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "CrownThrive-Penta-Gate-Awareness/3.0",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              pull = json.load(response)
          if pull.get("state") != "open":
              raise SystemExit("pull_request_not_open")
          if (((pull.get("head") or {}).get("repo") or {}).get("full_name")) != repo:
              raise SystemExit("external_fork_projection_fail_closed")
          head = (pull.get("head") or {}).get("sha") or ""
          base = (pull.get("base") or {}).get("sha") or ""
          head_ref = (pull.get("head") or {}).get("ref") or ""
          originator = ((pull.get("user") or {}).get("login") or "unknown-originator").strip()
          if len(head) != 40 or len(base) != 40 or not head_ref:
              raise SystemExit("exact_pr_identity_unresolved")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"number={int(number)}\n")
              fh.write(f"head_sha={head}\n")
              fh.write(f"base_sha={base}\n")
              fh.write(f"head_ref={head_ref}\n")
              fh.write(f"originator={originator}\n")
          PY

      - name: Check out canonical Penta control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: crownthrive1/CrownThrive-OS
          ref: main
          persist-credentials: false
          path: penta-control

      - name: Check out exact candidate head read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.target.outputs.head_sha }}
          persist-credentials: false
          fetch-depth: 0
          path: pr-worktree

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Resolve exact gate applicability and Penta submission contract
        id: applicability
        shell: bash
        env:
          BASE_SHA: ${{ steps.target.outputs.base_sha }}
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
        run: |
          set -euo pipefail
          cd pr-worktree
          git fetch --no-tags --no-recurse-submodules origin "$BASE_SHA" "$HEAD_SHA"
          python ../penta-control/scripts/resolve_pr_gate_applicability.py \
            --repo . \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --policy ../penta-control/config/penta_pr_gate_applicability.json \
            --github-output "$GITHUB_OUTPUT" \
            --json-output "$RUNNER_TEMP/penta-pr-gate-contract.json"
          cat "$RUNNER_TEMP/penta-pr-gate-contract.json"

      - name: Generate exact-head originator-readiness packet without source mutation
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ steps.target.outputs.number }}
          BASE_SHA: ${{ steps.target.outputs.base_sha }}
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
          ORIGINATOR: ${{ steps.target.outputs.originator }}
        run: |
          set -euo pipefail
          cd pr-worktree
          observed="$(git rev-parse HEAD)"
          if [[ "$observed" != "$HEAD_SHA" ]]; then
            echo "::error::PR head moved during readiness projection"
            exit 75
          fi
          git fetch --no-tags --no-recurse-submodules origin "$BASE_SHA" "$HEAD_SHA"
          python ../penta-control/scripts/penta_pr_gate_awareness.py prepare \
            --repo . \
            --repository "$REPOSITORY" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --pr-number "$NUMBER" \
            --originator "$ORIGINATOR" \
            > "$RUNNER_TEMP/penta-pr-originator-readiness.json"
          cat "$RUNNER_TEMP/penta-pr-originator-readiness.json"

      - name: Upload immutable workflow evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: penta-pr-originator-readiness-${{ steps.target.outputs.number }}-${{ steps.target.outputs.head_sha }}
          path: |
            ${{ runner.temp }}/penta-pr-originator-readiness.json
            ${{ runner.temp }}/penta-pr-gate-contract.json
            pr-worktree/penta/evidence/pr-self-cert/pr-${{ steps.target.outputs.number }}.json
            pr-worktree/penta/continuity/receipts/pr-${{ steps.target.outputs.number }}-self-certification.json
          if-no-files-found: warn
          retention-days: 90

      - name: Project ownership and repair boundary
        if: always()
        shell: bash
        run: |
          {
            echo '## Penta PR Gate Awareness v3'
            echo
            echo "- PR: #${{ steps.target.outputs.number }}"
            echo "- Exact head: \`${{ steps.target.outputs.head_sha }}\`"
            echo "- Change class: **${{ steps.applicability.outputs.change_class || 'unresolved' }}**"
            echo "- Risk class: **${{ steps.applicability.outputs.risk_class || 'unresolved' }}**"
            echo "- Required merge groups: \`${{ steps.applicability.outputs.required_groups || 'universal-only' }}\`"
            echo "- Gate contract SHA-256: \`${{ steps.applicability.outputs.contract_sha256 || 'unresolved' }}\`"
            echo '- Development metadata owner: **PentaPM only**'
            echo '- Candidate branch mutation: **disabled in Gate Awareness**'
            echo '- Unrelated controls: **NOT_APPLICABLE**, not FAIL'
            echo '- Each applicable group includes an exact owner, evidence requirement and repair action in the uploaded contract.'
            echo '- Originator readiness: workflow artifact only; zero independent certification authority.'
          } >> "$GITHUB_STEP_SUMMARY"
