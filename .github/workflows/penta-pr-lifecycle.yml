name: Penta PR Lifecycle — Manual Compatibility

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Manual recovery authority: pr, merge, or closer
        required: true
        default: pr
        type: choice
        options:
          - pr
          - merge
          - closer
      number:
        description: Optional pull request number; blank performs a bounded repository sweep
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  statuses: read
  actions: read

jobs:
  run:
    uses: ./.github/workflows/penta-pr-lifecycle-reusable.yml
    with:
      mode: ${{ github.event.inputs.mode }}
      number: ${{ github.event.inputs.number }}
    secrets: inherit
