name: CHLOM Recovery Navigation Reconciler

on:
  push:
    branches:
      - "admin-mcp/chlom-wave2e-reconciled-8cab988"
    paths:
      - "**/*.mdx"
      - "scripts/reconcile_full_navigation_coverage.py"
      - ".github/workflows/chlom-recovery-navigation-reconciler.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chlom-recovery-navigation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact recovery branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Reconcile every MDX page into navigation
        run: python scripts/reconcile_full_navigation_coverage.py --write

      - name: Validate reconciled documentation
        run: |
          python scripts/validate_docs.py
          git diff --check

      - name: Commit navigation reconciliation when changed
        shell: bash
        run: |
          if git diff --quiet -- docs.json; then
            echo "Navigation already reconciled."
            exit 0
          fi
          git config user.name "crownthrive-navigation-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs.json
          git commit -m "Reconcile Mintlify navigation to full MDX coverage"
          git push origin HEAD:${GITHUB_REF_NAME}
