name: CHLOM Tabbed Navigation Reconcile

on:
  push:
    branches:
      - admin-mcp/chlom-wave2f-tabbed-successor-5807e8a
    paths:
      - scripts/reconcile_chlom_tabbed_navigation.py
      - .github/workflows/chlom-tabbed-navigation-reconcile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: admin-mcp/chlom-wave2f-tabbed-successor-5807e8a
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Reconcile tabbed navigation
        run: python scripts/reconcile_chlom_tabbed_navigation.py

      - name: Verify generator idempotency
        run: |
          cp docs.json /tmp/docs.first.json
          python scripts/reconcile_chlom_tabbed_navigation.py
          cmp --silent docs.json /tmp/docs.first.json || {
            echo 'Navigation generator is not idempotent.'
            exit 1
          }

      - name: Commit generated navigation only
        run: |
          if git diff --quiet -- docs.json; then
            echo 'docs.json already reconciled.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs.json
          git diff --cached --check
          git commit -m 'docs: reconcile comprehensive CHLOM corpus into tabbed navigation'
          git push origin HEAD:admin-mcp/chlom-wave2f-tabbed-successor-5807e8a
