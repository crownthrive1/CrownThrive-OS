name: CIE Parent Interoperability Governance

on:
  pull_request:
    paths:
      - "developers/manifests/cie-interoperability-parent.v1.json"
      - "developers/manifests/cie-commercialization-candidates.v1.json"
      - "developers/templates/framework-child-interoperability-backlink.v1.json"
      - "developers/evals/cie-parent-interoperability-evals.v1.json"
      - "doctrine/cultural-imprint-engine.mdx"
      - "automation/cie-framework-agent.mdx"
      - "chlom/cie-cultural-governance-pallet.mdx"
      - "changelog/phase-2-99-cie-interoperability-continuity-2026-08-22.mdx"
      - "scripts/validate_cie_interoperability_parent.py"
      - ".github/workflows/cie-interoperability-parent-governance.yml"
  push:
    branches: [main, "admin-mcp/**", "agent-c/**"]
    paths:
      - "developers/manifests/cie-interoperability-parent.v1.json"
      - "developers/manifests/cie-commercialization-candidates.v1.json"
      - "developers/templates/framework-child-interoperability-backlink.v1.json"
      - "developers/evals/cie-parent-interoperability-evals.v1.json"
      - "doctrine/cultural-imprint-engine.mdx"
      - "automation/cie-framework-agent.mdx"
      - "chlom/cie-cultural-governance-pallet.mdx"
      - "changelog/phase-2-99-cie-interoperability-continuity-2026-08-22.mdx"
      - "scripts/validate_cie_interoperability_parent.py"
      - ".github/workflows/cie-interoperability-parent-governance.yml"
  workflow_dispatch:

concurrency:
  group: cie-parent-interoperability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate current-main CIE parent continuity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Compile validator
        run: python -m py_compile scripts/validate_cie_interoperability_parent.py
      - name: Validate contract and negative controls
        run: python scripts/validate_cie_interoperability_parent.py --self-test
      - name: Validate JSON syntax
        run: |
          python -m json.tool developers/manifests/cie-interoperability-parent.v1.json >/dev/null
          python -m json.tool developers/manifests/cie-commercialization-candidates.v1.json >/dev/null
          python -m json.tool developers/templates/framework-child-interoperability-backlink.v1.json >/dev/null
          python -m json.tool developers/evals/cie-parent-interoperability-evals.v1.json >/dev/null
      - name: Confirm protected implementation is absent
        shell: bash
        run: |
          if grep -R -nE '(vault_secret_name|sealed_bundle_secret_name|private_runtime_locator[[:space:]]*:[[:space:]]*"[^"]+"|credential[[:space:]]*:[[:space:]]*"[^"]+")' \
              developers/manifests/cie-* developers/templates/framework-child-interoperability-backlink.v1.json doctrine/cultural-imprint-engine.mdx automation/cie-framework-agent.mdx chlom/cie-cultural-governance-pallet.mdx; then
            echo "Restricted locator or credential-like value detected."
            exit 1
          fi
          echo "Public-safe interface-only projection confirmed."
