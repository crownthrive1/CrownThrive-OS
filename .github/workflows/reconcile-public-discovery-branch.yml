name: Reconcile Public Discovery Branch

on:
  push:
    branches:
      - admin-mcp/public-knowledge-seo-governed-push-current-main-20260823
    paths:
      - scripts/reconcile_public_discovery.py
      - .github/workflows/reconcile-public-discovery-branch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Reconcile public discovery surfaces
        run: |
          python -m py_compile scripts/reconcile_public_discovery.py
          python scripts/reconcile_public_discovery.py
          python scripts/render_homepage_projection.py --check
          python scripts/validate_homepage_control_plane.py
          python scripts/validate_docs.py
          git diff --check

      - name: Commit deterministic result
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Public discovery surfaces already reconciled."
            exit 0
          fi
          git config user.name "crownthrive-public-discovery-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs.json index.mdx about/kavonte-jones-sr.mdx support/licensing-and-ip-overview.mdx chlom/overview.mdx developers/overview.mdx standards/documentation-source-of-truth-and-autonomous-governance.mdx
          staged="$(git diff --cached --name-only)"
          if [ -z "$staged" ]; then
            echo "No governed files staged."
            exit 0
          fi
          git commit -m "docs: reconcile public discovery and projection policy"
          git push origin HEAD
