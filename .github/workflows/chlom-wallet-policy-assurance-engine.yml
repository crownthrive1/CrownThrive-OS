name: CHLOM Wallet Policy Assurance Engine

on:
  pull_request:
    paths:
      - "automation/chlom-wallet-policy-assurance-algorithms.v1.json"
      - "developers/chlom-wallet-policy-assurance-engine.mdx"
      - "developers/manifests/chlom-wallet-policy-assurance-engine.v1.json"
      - "developers/reference/chlom-wallet/policy/**"
      - ".github/workflows/chlom-wallet-policy-assurance-engine.yml"
      - ".github/workflows/chlom-wallet-policy-runtime-canary.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chlom-wallet-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Validate ECAC HOLD DENY engine, source correction, and Edge v2
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install exact schema validators
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-save --no-package-lock ajv@8.17.1 ajv-formats@3.0.1
          node - <<'NODE'
          const expected={ajv:'8.17.1','ajv-formats':'3.0.1'};
          for (const [name,version] of Object.entries(expected)) {
            const actual=require(`./node_modules/${name}/package.json`).version;
            if (actual!==version) throw new Error(`${name}:${actual}`);
          }
          NODE

      - name: Validate syntax and machine contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check developers/reference/chlom-wallet/policy/chlom-wallet-policy-assurance.mjs
          node --check developers/reference/chlom-wallet/policy/test-policy-assurance-engine.mjs
          node --check developers/reference/chlom-wallet/policy/test-policy-schemas.mjs
          node --check developers/reference/chlom-wallet/policy/policy-chaos-fuzz.mjs
          node --check developers/reference/chlom-wallet/policy/edge/authenticated-runtime-canary.mjs
          python -m json.tool automation/chlom-wallet-policy-assurance-algorithms.v1.json >/dev/null
          python -m json.tool developers/manifests/chlom-wallet-policy-assurance-engine.v1.json >/dev/null
          python -m json.tool developers/reference/chlom-wallet/policy/baseline-rulepack.v1.json >/dev/null
          python -m json.tool developers/reference/chlom-wallet/policy/edge/runtime-deployment.v1.json >/dev/null
          for schema in developers/reference/chlom-wallet/policy/schemas/*.schema.json; do
            python -m json.tool "$schema" >/dev/null
          done

      - name: Verify exact committed source identity and append-only correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess

          manifest=json.load(open('developers/manifests/chlom-wallet-policy-assurance-engine.v1.json'))
          deployment=json.load(open('developers/reference/chlom-wallet/policy/edge/runtime-deployment.v1.json'))
          engine_path='developers/reference/chlom-wallet/policy/chlom-wallet-policy-assurance.mjs'
          edge_engine_path='developers/reference/chlom-wallet/policy/edge/engine.mjs'
          actual_engine=hashlib.sha256(Path(engine_path).read_bytes()).hexdigest()
          actual_edge=hashlib.sha256(Path(edge_engine_path).read_bytes()).hexdigest()
          actual_blob=subprocess.check_output(['git','hash-object',engine_path],text=True).strip()

          expected_sha='1fc78917285351ac08b0d8bdc1d80a1c816485cd66b3d35291cb715f0379f70c'
          expected_blob='41edcecf931b6c653cda6b9f9118ea15b795c72a'
          assert actual_engine==expected_sha
          assert actual_edge==expected_sha
          assert actual_blob==expected_blob

          correction=manifest['engine']['source_identity_correction']
          assert manifest['semantic_version']=='1.2.0'
          assert manifest['engine']['effective_source_sha256']==expected_sha
          assert manifest['engine']['source_git_blob_sha1']==expected_blob
          assert manifest['engine']['source_sha256_state']=='CORRECTED_EXACT_HEAD_CI_APPEND_ONLY'
          assert correction['correction_id']=='ct.correction.chlom-wallet-policy-engine-source-sha256.v1'
          assert correction['recorded_sha256']=='b29e31e5061e66dd24a7d1a399b31df453c54acbf6fbfd0516b499f038b4d6da'
          assert correction['corrected_sha256']==expected_sha
          assert correction['git_blob_sha1']==expected_blob
          assert correction['source_blob_changed'] is False
          assert correction['historical_value_preserved'] is True

          source=deployment['source_identity']
          assert deployment['deployment_contract_id']=='ct.deploy.chlom-wallet-policy-assurance.v1.2'
          assert deployment['supersedes_deployment_contract_id']=='ct.deploy.chlom-wallet-policy-assurance.v1.1'
          assert deployment['semantic_version']=='1.1.0'
          assert deployment['edge_function']['version']==2
          assert deployment['edge_function']['status']=='ACTIVE'
          assert deployment['edge_function']['verify_jwt'] is True
          assert deployment['edge_function']['deployment_bundle_sha256']=='00cedfe45163deeb3c71042f911eaedf3418189913a962c5daa1e838f820e9ac'
          assert source['effective_engine_source_sha256']==expected_sha
          assert source['engine_git_blob_sha1']==expected_blob
          assert source['source_identity_correction']['correction_id']==correction['correction_id']
          assert source['source_identity_correction']['source_blob_changed'] is False
          assert deployment['private_runtime']['deployment_metadata_canary']=='PASS_CHLOM_WALLET_POLICY_EDGE_DEPLOYMENT_METADATA_CANARY_V2'
          assert deployment['runtime_canaries']['authenticated_status_and_verify_receipt']=='NOT_EXECUTED'
          assert deployment['runtime_canaries']['authenticated_evaluate_and_persistence']=='NOT_EXECUTED'
          assert deployment['runtime_canaries']['unauthorized_request_rejection']=='NOT_EXECUTED'
          assert all(value is False for value in deployment['hard_boundaries'].values())
          PY

      - name: Run JSON Schema contract tests
        run: node developers/reference/chlom-wallet/policy/test-policy-schemas.mjs

      - name: Run deterministic policy scenarios twice
        shell: bash
        run: |
          set -euo pipefail
          node developers/reference/chlom-wallet/policy/test-policy-assurance-engine.mjs | tee /tmp/policy-scenarios-1.json
          node developers/reference/chlom-wallet/policy/test-policy-assurance-engine.mjs | tee /tmp/policy-scenarios-2.json
          cmp /tmp/policy-scenarios-1.json /tmp/policy-scenarios-2.json
          python - <<'PY'
          import json
          result=json.load(open('/tmp/policy-scenarios-1.json'))
          assert result['result']=='PASS_CHLOM_WALLET_POLICY_ASSURANCE_ENGINE'
          assert result['rulepack_sha256']=='c20767aaa8cce230d8b50af9c7a2b86e83bd7ffb65704c9af75f7d196da6a90b'
          assert result['scenarios']==12
          assert result['deterministic_receipt'] is True
          assert result['receipt_tamper_rejected'] is True
          assert result['private_secret_field_rejected'] is True
          PY

      - name: Run 50,000-case deterministic CHAOS suite twice
        shell: bash
        env:
          CHLOM_WALLET_POLICY_FUZZ_CASES: "50000"
        run: |
          set -euo pipefail
          node developers/reference/chlom-wallet/policy/policy-chaos-fuzz.mjs | tee /tmp/policy-chaos-1.json
          node developers/reference/chlom-wallet/policy/policy-chaos-fuzz.mjs | tee /tmp/policy-chaos-2.json
          cmp /tmp/policy-chaos-1.json /tmp/policy-chaos-2.json
          python - <<'PY'
          import json
          result=json.load(open('/tmp/policy-chaos-1.json'))
          assert result['result']=='PASS_CHLOM_WALLET_POLICY_CHAOS_FUZZ'
          assert result['cases']==50000
          assert result['dispositions']=={'ECAC':9007,'HOLD':24586,'DENY':16407}
          assert result['invariant_failures']==0
          assert result['receipt_checks']==50000
          assert result['determinism_checks']==51
          assert result['payment_only_rights_cases']==915
          assert result['impact_false_settlement_cases']==1236
          assert result['forbidden_secret_cases']==747
          assert result['broadcast_attempt_cases']==1007
          assert result['stale_heartbeat_cases']==4020
          PY

      - name: Validate algorithm pack, rulepack, manifest, and readback contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          algorithms=json.load(open('automation/chlom-wallet-policy-assurance-algorithms.v1.json'))
          manifest=json.load(open('developers/manifests/chlom-wallet-policy-assurance-engine.v1.json'))
          rulepack=json.load(open('developers/reference/chlom-wallet/policy/baseline-rulepack.v1.json'))

          assert algorithms['algorithm_pack_id']=='ct.algorithm-pack.chlom-wallet-policy-assurance.v1'
          assert algorithms['engine_id']=='ct.engine.chlom-wallet-policy-assurance.v1'
          assert len(algorithms['algorithms'])==7
          assert {a['algorithm_key'] for a in algorithms['algorithms']}=={'CAPS','EAGR','VCL','AIR','RIGOR','DRIFT','CHAOS'}
          assert algorithms['ai_policy']['current_ai_advisory_enabled'] is False
          assert algorithms['ai_policy']['future_llm_may_not_change_disposition'] is True
          assert all(value is False for value in algorithms['hard_boundaries'].values())

          assert manifest['state']=='CONTROLLED_TEST_EDGE_RUNTIME_ACTIVE_AUTHENTICATED_CANARY_PENDING'
          assert manifest['rulepack']['compiled_sha256']=='c20767aaa8cce230d8b50af9c7a2b86e83bd7ffb65704c9af75f7d196da6a90b'
          assert manifest['private_runtime']['runtime_canary']=='PASS_CHLOM_WALLET_POLICY_ASSURANCE_RUNTIME_CANARY'
          assert manifest['private_runtime']['deployment_metadata_canary']=='PASS_CHLOM_WALLET_POLICY_EDGE_DEPLOYMENT_METADATA_CANARY_V2'
          assert manifest['runtime_surface']['edge_function_version']==2
          assert manifest['runtime_surface']['deployment_receipt_id']=='ct.deploy.chlom-wallet-policy-assurance.v1.2'
          assert manifest['runtime_surface']['deployment_bundle_sha256']=='00cedfe45163deeb3c71042f911eaedf3418189913a962c5daa1e838f820e9ac'
          assert manifest['runtime_surface']['authenticated_runtime_canary']=='NOT_EXECUTED'
          assert all(value is False for value in manifest['hard_boundaries'].values())

          assert rulepack['allowed_environments']==['controlled_test','testnet']
          assert rulepack['authority_ceiling']=={'autonomy':'A2','decision':'D2'}
          assert len(rulepack['rules'])==12
          assert len(rulepack['required_evidence'])==12
          assert len(rulepack['required_handoffs'])==12

          readback=open('developers/reference/chlom-wallet/policy/thrivebase-policy-assurance-readback-v1.sql').read()
          assert 'PASS_CHLOM_WALLET_POLICY_ASSURANCE_THRIVEBASE_READBACK_V2' in readback
          assert 'ct.correction.chlom-wallet-policy-engine-source-sha256.v1' in readback
          assert 'ct.deploy.chlom-wallet-policy-assurance.v1.2' in readback
          assert '00cedfe45163deeb3c71042f911eaedf3418189913a962c5daa1e838f820e9ac' in readback
          PY

      - name: Enforce secret and no-live boundaries
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find automation developers/reference/chlom-wallet/policy developers -maxdepth 8 -type f \( -name '*policy-assurance*' -o -path '*/chlom-wallet/policy/*' \) -print)
          test "${#files[@]}" -gt 0
          if grep -nE -- 'sk_live_[A-Za-z0-9]{16,}|rk_live_[A-Za-z0-9]{16,}|whsec_[A-Za-z0-9]{16,}|-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----|sb_secret_[A-Za-z0-9._-]{16,}' "${files[@]}"; then
            echo 'Potential live secret-shaped material detected in policy-assurance source.'
            exit 1
          fi
          if grep -nE -- '"(production_activation|provider_write|custody|token_issuance|money_movement|production_rights_grant|chain_broadcast|effective_price_publication|checkout_activation|phase_advancement|merge_authorized)"[[:space:]]*:[[:space:]]*true' automation/chlom-wallet-policy-assurance-algorithms.v1.json developers/manifests/chlom-wallet-policy-assurance-engine.v1.json developers/reference/chlom-wallet/policy/edge/runtime-deployment.v1.json; then
            echo 'Policy Assurance packet crossed a no-live or no-authority boundary.'
            exit 1
          fi

      - name: Record boundary
        run: |
          echo 'CONTROLLED_TEST: deterministic ECAC/HOLD/DENY policy receipts only.'
          echo 'The engine digest correction is append-only and the committed Git blob did not change.'
          echo 'The JWT-protected Edge function v2 is active and metadata-certified; authenticated HTTP canary remains separately pending.'
          echo 'No AI final authority, production activation, provider write, custody, token issuance, money movement, rights grant, chain broadcast, pricing publication, checkout, phase advancement, or merge authority is created.'
