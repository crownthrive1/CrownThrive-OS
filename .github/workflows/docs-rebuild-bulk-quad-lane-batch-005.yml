name: Documentation Rebuild Bulk Quad Lane Batch 005

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/execute_docs_rebuild_bulk_quad_lane_batch_005.py'
      - '.github/workflows/docs-rebuild-bulk-quad-lane-batch-005.yml'
      - 'developers/manifests/docs-rebuild-bulk-quad-lane-batch-005.v1.json'
      - 'developers/manifests/docs-rebuild-quad-lane-batch-*.v1.json'
      - 'developers/manifests/docs-wave7-*-gate-*.v1.json'
      - 'scripts/build_help_center_*crosswalk.py'
  push:
    branches: [main]
    paths:
      - 'scripts/execute_docs_rebuild_bulk_quad_lane_batch_005.py'
      - '.github/workflows/docs-rebuild-bulk-quad-lane-batch-005.yml'
      - 'developers/manifests/docs-rebuild-bulk-quad-lane-batch-005.v1.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: docs-bulk-quad-lane-batch-005-${{ github.ref }}
  cancel-in-progress: false

jobs:
  execute-bulk-quad-lane-batch-005:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Execute Batch 005 across four 16-record governed lanes
        run: |
          mkdir -p runtime/docs-rebuild
          python scripts/execute_docs_rebuild_bulk_quad_lane_batch_005.py --output runtime/docs-rebuild/bulk-quad-lane-batch-005.json | tee runtime/docs-rebuild/bulk-quad-lane-batch-005.log
      - name: Validate Batch 005 invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('runtime/docs-rebuild/bulk-quad-lane-batch-005.json').read_text())
          assert d['parallel_lane_count']==4
          assert d['records_per_lane']==16
          assert d['unique_records_touched']==64
          assert d['machine_qualified_before_batch']==76
          assert d['remaining_p0_before_batch']==373
          assert d['previous_batches_touched_count']==64
          assert d['counting']['official_machine_qualified_after_batch']==76
          assert d['counting']['official_remaining_p0_after_batch']==373
          ids=[r['inventory_id'] for lane in d['lanes'].values() for r in lane]
          assert len(ids)==len(set(ids))==64
          assert d['guardrails']['quality_thresholds_unchanged'] is True
          assert d['guardrails']['already_qualified_identity_reuse'] is False
          assert d['guardrails']['historical_body_recovery_fabricated'] is False
          assert d['guardrails']['terminal_disposition_self_authorized'] is False
          assert all(not r['flags'] for r in d['lanes']['A'])
          print('PASS_BULK_QUAD_LANE_BATCH_005_INVARIANTS')
          PY
      - name: Compare permanent Batch 005 receipt when present
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          permanent=Path('developers/manifests/docs-rebuild-bulk-quad-lane-batch-005.v1.json')
          if not permanent.exists(): print('NO_PERMANENT_BATCH_005_RECEIPT_YET'); raise SystemExit(0)
          d=json.loads(Path('runtime/docs-rebuild/bulk-quad-lane-batch-005.json').read_text()); p=json.loads(permanent.read_text())
          assert p['execution_id']==d['execution_id']; assert p['execution_sha256']==d['execution_sha256']
          assert p['lane_inventory_ids']=={k:[r['inventory_id'] for r in v] for k,v in d['lanes'].items()}
          assert p['official_counts_after_batch']=={'machine_qualified_p0':76,'pending_p0':373}
          print('PASS_PERMANENT_BULK_BATCH_005_RECEIPT')
          PY
      - name: Upload Batch 005 evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-rebuild-bulk-quad-lane-batch-005-${{ github.run_id }}
          path: runtime/docs-rebuild/
          if-no-files-found: error
          retention-days: 90
