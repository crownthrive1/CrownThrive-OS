name: PentaFactory GitHub Provider

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  id-token: write

concurrency:
  group: crownthrive-factory-github-provider
  cancel-in-progress: false

jobs:
  publish:
    # Emergency fail-closed containment after the 2026-08-26 exact-head gate
    # and workflow-run continuation audit. Re-enable only with certified
    # PentaQueue admission, fencing, and promotion readback.
    if: ${{ false }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        slot: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Claim PentaFactory provider job
        id: claim
        shell: bash
        env:
          BRIDGE: https://tzajnzshmtzjenqulehq.supabase.co/functions/v1/ct-factory-github-bridge
        run: |
          set -euo pipefail
          echo "PentaFactory provider drain slot: ${{ matrix.slot }}"
          OIDC=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ct-factory-github" | jq -r .value)
          curl -fsSL -H "Authorization: Bearer ${OIDC}" -H 'Content-Type: application/json' -d '{"action":"claim"}' "$BRIDGE" > claim.json
          jq '{ok,claimed,job:(.job // null),file_count:(.files|length // 0),factory}' claim.json
          echo "claimed=$(jq -r '.claimed // false' claim.json)" >> "$GITHUB_OUTPUT"
          echo "job_id=$(jq -r '.job.id // empty' claim.json)" >> "$GITHUB_OUTPUT"
          echo "run_id=$(jq -r '.job.build_run_id // empty' claim.json)" >> "$GITHUB_OUTPUT"
          printf '%s' "$OIDC" > oidc.token
          chmod 600 oidc.token

      - name: Materialize generated source bundle
        if: steps.claim.outputs.claimed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          RUN='${{ steps.claim.outputs.run_id }}'
          ROOT="generated/factory/${RUN}"
          mkdir -p "$ROOT"
          jq -c '.files[]' claim.json | while read -r row; do
            path=$(printf '%s' "$row" | jq -r .path)
            case "$path" in /*|*..*) echo "unsafe path: $path" >&2; exit 2;; esac
            mkdir -p "$ROOT/$(dirname "$path")"
            printf '%s' "$row" | jq -r .content > "$ROOT/$path"
          done
          jq '{contract:"ct.factory.github.readback.v1",product_contract:"ct.pentaframework-factory.v1",canonical_name:"PentaFactory™",job:.job,files:[.files[]|{path,sha256}]}' claim.json > "$ROOT/factory-manifest.json"

      - name: Stage exact provider commit and dispatch governed gate
        if: steps.claim.outputs.claimed == 'true'
        id: stage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ steps.claim.outputs.job_id }}
          RUN_ID: ${{ steps.claim.outputs.run_id }}
        run: |
          set -euo pipefail
          BRANCH="factory/provider-job-${JOB_ID}"
          git config user.name 'pentafactory[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "generated/factory/${RUN_ID}"

          if git diff --cached --quiet; then
            git fetch origin main
            SHA=$(git rev-parse origin/main)
            echo "needs_promotion=false" >> "$GITHUB_OUTPUT"
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            echo "branch=main" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "pentafactory: publish ${RUN_ID}"
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git rebase origin/main
          fi
          SHA=$(git rev-parse HEAD)
          git push --force-with-lease origin HEAD:"refs/heads/${BRANCH}"

          # Do not poll the GitHub API here. The workflow_run continuation consumes
          # the governed gate completion event and promotes this exact SHA.
          gh workflow run governed-merge-gate.yml --ref "$BRANCH"

          echo "needs_promotion=true" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "Staged $SHA on $BRANCH for governed promotion."

      - name: Complete idempotent no-change provider job
        if: steps.claim.outputs.claimed == 'true' && steps.stage.outputs.needs_promotion == 'false'
        shell: bash
        env:
          BRIDGE: https://tzajnzshmtzjenqulehq.supabase.co/functions/v1/ct-factory-github-bridge
          JOB_ID: ${{ steps.claim.outputs.job_id }}
          COMMIT_SHA: ${{ steps.stage.outputs.sha }}
        run: |
          set -euo pipefail
          OIDC=$(cat oidc.token)
          COUNT=$(jq '.files|length' claim.json)
          URL="https://github.com/${GITHUB_REPOSITORY}/commit/${COMMIT_SHA}"
          jq -n --arg job "$JOB_ID" --arg sha "$COMMIT_SHA" --arg url "$URL" --argjson count "$COUNT" '{action:"complete",job_id:$job,commit_sha:$sha,head_sha:$sha,commit_url:$url,branch:"main",file_count:$count,governance_gate_run_id:"idempotent-no-change",rollback_ref:("git:"+$sha+"^1")}' > complete.json
          curl -fsSL -H "Authorization: Bearer ${OIDC}" -H 'Content-Type: application/json' --data-binary @complete.json "$BRIDGE" | jq .

      - name: Release claimed job on staging failure
        if: failure() && steps.claim.outputs.claimed == 'true'
        shell: bash
        env:
          BRIDGE: https://tzajnzshmtzjenqulehq.supabase.co/functions/v1/ct-factory-github-bridge
          JOB_ID: ${{ steps.claim.outputs.job_id }}
        run: |
          set -euo pipefail
          OIDC=$(cat oidc.token)
          jq -n --arg job "$JOB_ID" --arg err "GitHub provider staging workflow ${GITHUB_RUN_ID} slot ${{ matrix.slot }} failed before governed handoff" '{action:"release",job_id:$job,error:$err}' > release.json
          curl -fsSL -H "Authorization: Bearer ${OIDC}" -H 'Content-Type: application/json' --data-binary @release.json "$BRIDGE" | jq .
