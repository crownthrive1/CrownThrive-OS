name: Verify CHLOM Agent Runtime Custody v6

on:
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'supabase/migration_lineage/chlom_agent_runtime_custody_v6.json'
      - 'scripts/verify_chlom_agent_runtime_custody.py'
      - '.github/workflows/verify-chlom-agent-runtime-custody-v6.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-chlom-agent-runtime-custody-v6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Exact provider identities, hashes, and holds
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify source custody
        run: python3 scripts/verify_chlom_agent_runtime_custody.py
