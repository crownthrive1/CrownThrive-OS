name: PentaHeal Branch Regenerator RETIRED

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    if: github.repository == 'crownthrive1/CrownThrive-OS' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retired authority receipt
        shell: bash
        run: |
          set -euo pipefail
          echo 'PentaHeal branch regeneration authority is retired.'
          echo 'No source mutation, provider write, branch write, merge, release, or production promotion is authorized.'
