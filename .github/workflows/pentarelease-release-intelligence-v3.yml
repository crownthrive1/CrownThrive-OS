name: PentaRelease — Release Intelligence v3

on:
  workflow_run:
    workflows: ["PentaRelease — Autonomous Release Awareness"]
    types: [completed]
  schedule:
    - cron: '22 * * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Optional release tag; defaults to latest published release
        required: false
        type: string

permissions:
  actions: write
  checks: read
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: pentarelease-release-intelligence-v3
  cancel-in-progress: false

env:
  PENTARELEASE_EVIDENCE_ENDPOINT: https://tzajnzshmtzjenqulehq.supabase.co/functions/v1/penta-release-evidence-oidc
  PENTARELEASE_OIDC_AUDIENCE: crownthrive-pentarelease

jobs:
  converge:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Validate release-intelligence software
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/pentarelease/release_surface.py \
            scripts/pentarelease/enrich_release_intelligence.py \
            scripts/pentarelease/build_cie_subject.py \
            scripts/pentarelease/pentadocs_group.py \
            scripts/validate_docs.py
          python3 -m json.tool .pentarelease/state/release-surface.json >/dev/null
          python3 -m json.tool .pentarelease/policy.json >/dev/null

      - name: Resolve published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${REQUESTED_TAG:-}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName')
          fi
          test -n "$TAG"
          RELEASE=$(gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")
          VERSION="${TAG#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          PAYLOAD_BYTES=$(jq '[.assets[]?.size] | add // 0' <<<"$RELEASE")
          printf '%s\n' "$RELEASE" > /tmp/pentarelease-provider-release.json
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "payload_bytes=$PAYLOAD_BYTES" >> "$GITHUB_OUTPUT"
          echo "$RELEASE" | jq '{tag_name,name,target_commitish,published_at,assets:[.assets[].name]}'

      - name: Recover release source inputs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pentarelease-source
          mkdir -p /tmp/pentarelease-source
          for NAME in MANIFEST.json RELEASE_NOTES.md SHA256SUMS COSTS.json PENTARELEASE_COSTS.json; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$NAME" --dir /tmp/pentarelease-source --clobber || true
          done
          test -s /tmp/pentarelease-source/MANIFEST.json
          test -s /tmp/pentarelease-source/RELEASE_NOTES.md

      - name: Materialize governed release CIE evidence
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/pentarelease/build_cie_subject.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --version "$RELEASE_VERSION" \
            --manifest /tmp/pentarelease-source/MANIFEST.json \
            --release-notes /tmp/pentarelease-source/RELEASE_NOTES.md \
            --provider-release /tmp/pentarelease-provider-release.json \
            --sha256sums /tmp/pentarelease-source/SHA256SUMS \
            --output /tmp/pentarelease-source/PENTARELEASE_CIE_SUBJECT.json
          jq -e '.subject_type == "release"' /tmp/pentarelease-source/PENTARELEASE_CIE_SUBJECT.json >/dev/null
          for DIM in identity_fit community_value story_alignment brand_safety legacy_impact; do
            jq -e --arg dim "$DIM" '.dimension_evidence[$dim] | type == "array" and length > 0' \
              /tmp/pentarelease-source/PENTARELEASE_CIE_SUBJECT.json >/dev/null
          done
          jq -e '.findings == []' /tmp/pentarelease-source/PENTARELEASE_CIE_SUBJECT.json >/dev/null

      - name: Mint governed OIDC identity
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${PENTARELEASE_OIDC_AUDIENCE}")
          TOKEN=$(jq -r '.value // empty' <<<"$RESPONSE")
          test -n "$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Resolve canonical economics and CIE
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          PAYLOAD_BYTES: ${{ steps.release.outputs.payload_bytes }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg release_version "$RELEASE_VERSION" \
            --arg release_tag "$RELEASE_TAG" \
            --argjson payload_bytes "$PAYLOAD_BYTES" \
            --slurpfile cie_subject /tmp/pentarelease-source/PENTARELEASE_CIE_SUBJECT.json \
            '{release_version:$release_version,release_tag:$release_tag,pr_number:null,payload_bytes:$payload_bytes,cie_subject:$cie_subject[0]}' \
            > /tmp/pentarelease-evidence-request.json
          curl --fail-with-body --silent --show-error \
            -X POST "$PENTARELEASE_EVIDENCE_ENDPOINT" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/pentarelease-evidence-request.json \
            > /tmp/pentarelease-source/PENTARELEASE_RUNTIME_EVIDENCE.json
          jq . /tmp/pentarelease-source/PENTARELEASE_RUNTIME_EVIDENCE.json
          test "$(jq -r '.ok' /tmp/pentarelease-source/PENTARELEASE_RUNTIME_EVIDENCE.json)" = "true"
          test -n "$(jq -r '.result.projected.footer.evidence_sha256 // .result.footer.evidence_sha256 // empty' /tmp/pentarelease-source/PENTARELEASE_RUNTIME_EVIDENCE.json)"
          jq -e '.result.projected.footer.cie.score | type == "number"' /tmp/pentarelease-source/PENTARELEASE_RUNTIME_EVIDENCE.json >/dev/null
          jq -e '.result.projected.footer.cie.evidence.dimension_scores | length == 5' /tmp/pentarelease-source/PENTARELEASE_RUNTIME_EVIDENCE.json >/dev/null
          jq -e '.result.projected.footer.cie.evidence.algorithm_id == "ct.algorithm.cie.v1"' /tmp/pentarelease-source/PENTARELEASE_RUNTIME_EVIDENCE.json >/dev/null

      - name: Materialize and enrich every release surface
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/pentarelease-surface
          python3 scripts/pentarelease/release_surface.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --policy .pentarelease/policy.json \
            --source-dir /tmp/pentarelease-source \
            --outdir dist/pentarelease-surface
          python3 scripts/pentarelease/pentadocs_group.py --root . --policy .pentarelease/policy.json
          python3 scripts/pentarelease/enrich_release_intelligence.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --runtime-evidence /tmp/pentarelease-source/PENTARELEASE_RUNTIME_EVIDENCE.json \
            --dist dist/pentarelease-surface \
            --root .
          python3 scripts/pentadocs_quality.py --apply
          python3 scripts/validate_docs.py
          python3 scripts/pentarelease/pentadocs_group.py --root . --policy .pentarelease/policy.json --check
          for JSON in PENTARELEASE_RELEASE_RECORD.json PENTARELEASE_COSTS.json PENTARELEASE_CIE_SCORE.json PENTARELEASE_DATA_CATALOG.json PENTARELEASE_EVIDENCE.json; do
            python3 -m json.tool "dist/pentarelease-surface/$JSON" >/dev/null
          done
          test "$(find dist/pentarelease-surface -maxdepth 1 -type f | wc -l)" -eq 8
          grep -Fq '## Release intelligence' dist/pentarelease-surface/PENTARELEASE_COMPREHENSIVE_RELEASE.md
          grep -Fq '| **Who** |' dist/pentarelease-surface/PENTARELEASE_COMPREHENSIVE_RELEASE.md
          grep -Fq '| **What** |' dist/pentarelease-surface/PENTARELEASE_COMPREHENSIVE_RELEASE.md
          grep -Fq '| **When** |' dist/pentarelease-surface/PENTARELEASE_COMPREHENSIVE_RELEASE.md
          grep -Fq '| **Where** |' dist/pentarelease-surface/PENTARELEASE_COMPREHENSIVE_RELEASE.md
          grep -Fq '| **Why** |' dist/pentarelease-surface/PENTARELEASE_COMPREHENSIVE_RELEASE.md
          grep -Fq '| **What to expect** |' dist/pentarelease-surface/PENTARELEASE_COMPREHENSIVE_RELEASE.md
          grep -Fq 'Cost calculation and methodology' dist/pentarelease-surface/PENTARELEASE_COMPREHENSIVE_RELEASE.md
          grep -Fq 'CIE dimension' dist/pentarelease-surface/PENTARELEASE_COMPREHENSIVE_RELEASE.md
          jq -e '.cie_score.score | type == "number"' dist/pentarelease-surface/PENTARELEASE_RELEASE_RECORD.json >/dev/null
          jq -e '.release_intelligence.costs.methodology | type == "object"' dist/pentarelease-surface/PENTARELEASE_RELEASE_RECORD.json >/dev/null

      - name: Resolve current release-intelligence subject
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA=$(git rev-parse HEAD)
          SAFE_TAG=$(printf '%s' "$TAG" | tr '/' '-')
          TITLE="PentaRelease release intelligence $TAG"
          TRACKED=(
            .pentarelease/state/release-surface.json
            data/documentation/pentadocs-page-profiles.v1.json
            docs.json
            README.md ABOUT_ME.md LICENSE CODE_OF_CONDUCT.md PARTNERS.md FAQ.md CHANGELOG.md
            pentarelease/latest.mdx pentarelease/faq.mdx pentarelease/changelog.mdx
            pentarelease/costs.mdx pentarelease/cie.mdx pentarelease/data.mdx pentarelease/evidence.mdx
          )
          CONTENT_SHA=$(git diff --no-ext-diff --binary -- "${TRACKED[@]}" | sha256sum | awk '{print $1}')
          BRANCH="pentarelease/intelligence-${SAFE_TAG}-${BASE_SHA:0:12}-${CONTENT_SHA:0:12}"
          CANDIDATE=$(gh pr list --repo "$GITHUB_REPOSITORY" --state all --base main --limit 300 \
            --json number,title,state,mergedAt,headRefName,headRefOid,baseRefOid,url \
            | jq -c --arg title "$TITLE" --arg base "$BASE_SHA" --arg branch "$BRANCH" \
              '[.[] | select(.title == $title and .baseRefOid == $base and .headRefName == $branch)] | sort_by(.number) | last // empty')
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "content_sha=$CONTENT_SHA" >> "$GITHUB_OUTPUT"
          if [ -n "$CANDIDATE" ]; then
            PR_NUM=$(jq -r '.number' <<<"$CANDIDATE")
            PR_STATE=$(jq -r '.state' <<<"$CANDIDATE")
            MERGED_AT=$(jq -r '.mergedAt // empty' <<<"$CANDIDATE")
            if [ "$PR_STATE" = "CLOSED" ] && [ -z "$MERGED_AT" ]; then
              gh pr reopen "$PR_NUM" --repo "$GITHUB_REPOSITORY"
              PR_STATE="OPEN"
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "pr_number=$PR_NUM" >> "$GITHUB_OUTPUT"
            echo "head_sha=$(jq -r '.headRefOid' <<<"$CANDIDATE")" >> "$GITHUB_OUTPUT"
            echo "url=$(jq -r '.url' <<<"$CANDIDATE")" >> "$GITHUB_OUTPUT"
            echo "state=$PR_STATE" >> "$GITHUB_OUTPUT"
            echo "merged=$([ -n "$MERGED_AT" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
            echo "Reusing deterministic exact-base/exact-content release-intelligence subject $(jq -r '.url' <<<"$CANDIDATE")."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish rich release record and assets
        if: steps.candidate.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" dist/pentarelease-surface/* --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file dist/pentarelease-surface/PENTARELEASE_COMPREHENSIVE_RELEASE.md
          READBACK=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,assets,body,url)
          test "$(jq -r '.tagName' <<<"$READBACK")" = "$TAG"
          jq -e '.body | contains("pentarelease:comprehensive-release:start")' <<<"$READBACK" >/dev/null
          jq -e '.body | contains("Cost calculation and methodology")' <<<"$READBACK" >/dev/null
          jq -e '.body | contains("Cultural Imprint Engine (CIE)")' <<<"$READBACK" >/dev/null
          jq -e '.body | contains("What to expect")' <<<"$READBACK" >/dev/null
          for EXPECTED in PENTARELEASE_COMPREHENSIVE_RELEASE.md PENTARELEASE_RELEASE_RECORD.json PENTARELEASE_COSTS.json PENTARELEASE_CIE_SCORE.json PENTARELEASE_DATA_CATALOG.json PENTARELEASE_EVIDENCE.json PENTARELEASE_FAQ.md PENTARELEASE_CHANGELOG.md; do
            jq -e --arg n "$EXPECTED" '.assets[] | select(.name == $n)' <<<"$READBACK" >/dev/null
          done

      - name: Commit synchronized README and PentaDocs surfaces
        id: commit
        if: steps.candidate.outputs.exists != 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          BRANCH: ${{ steps.candidate.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PentaRelease'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          BASE_SHA=$(git rev-parse HEAD)
          git checkout -b "$BRANCH"
          git add \
            .pentarelease/state/release-surface.json \
            data/documentation/pentadocs-page-profiles.v1.json \
            docs.json \
            README.md ABOUT_ME.md LICENSE CODE_OF_CONDUCT.md PARTNERS.md FAQ.md CHANGELOG.md \
            pentarelease/latest.mdx pentarelease/faq.mdx pentarelease/changelog.mdx \
            pentarelease/costs.mdx pentarelease/cie.mdx pentarelease/data.mdx pentarelease/evidence.mdx
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "docs(pentarelease): converge release intelligence $TAG"
          HEAD_SHA=$(git rev-parse HEAD)
          git push origin "$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Govern and merge synchronized surfaces
        id: merge
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          HEAD_SHA: ${{ steps.commit.outputs.head_sha }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          ISSUE_URL=$(gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "PentaRelease $TAG release-intelligence production convergence" \
            --body "Autonomous tracking issue for the exact $TAG release-intelligence synchronization. The generated PR must receive the PR-bound CrownThrive governed merge gate and reach a merged terminal state before production readback. No authority is manufactured and HOLD remains fail-closed.")
          ISSUE_NUM="${ISSUE_URL##*/}"

          PR_URL=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "PentaRelease release intelligence $TAG" \
            --body "Canonical convergence of GitHub Release, README, repository release surfaces, PentaDocs, calculated economic methodology, CIE scorecard and provider readback for $TAG. Generated from exact governed evidence; no authority is manufactured. Refs #${ISSUE_NUM}")
          PR_NUM="${PR_URL##*/}"

          PASS=false
          for _ in $(seq 1 90); do
            sleep 10
            STATE=$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs" \
              --jq "[.check_runs[] | select(.name==\"CrownThrive governed merge gate\") | select(any(.pull_requests[]?; .number == ${PR_NUM}))] | sort_by(.started_at) | last | ((.status // \"missing\") + \":\" + (.conclusion // \"pending\"))")
            echo "PR-bound governed gate: $STATE"
            if [ "$STATE" = "completed:success" ]; then PASS=true; break; fi
            if [[ "$STATE" == completed:* ]] && [ "$STATE" != "completed:success" ]; then exit 44; fi
          done
          test "$PASS" = true

          gh pr merge "$PR_URL" --repo "$GITHUB_REPOSITORY" --auto --squash \
            --subject "PentaRelease release intelligence $TAG"

          MERGED=false
          for _ in $(seq 1 90); do
            SNAPSHOT=$(gh pr view "$PR_URL" --repo "$GITHUB_REPOSITORY" --json state,mergedAt,mergeCommit)
            STATE=$(jq -r '.state' <<<"$SNAPSHOT")
            MERGED_AT=$(jq -r '.mergedAt // empty' <<<"$SNAPSHOT")
            if [ -n "$MERGED_AT" ]; then
              MERGE_SHA=$(jq -r '.mergeCommit.oid // empty' <<<"$SNAPSHOT")
              test -n "$MERGE_SHA"
              echo "merge_sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"
              echo "pr_number=$PR_NUM" >> "$GITHUB_OUTPUT"
              MERGED=true
              break
            fi
            if [ "$STATE" = "CLOSED" ]; then
              echo "Synchronization PR closed without merge" >&2
              exit 46
            fi
            sleep 10
          done
          test "$MERGED" = true
          gh issue close "$ISSUE_NUM" --repo "$GITHUB_REPOSITORY" --reason completed \
            --comment "Merged synchronization PR #${PR_NUM}; terminal merge confirmed before production readback."

      - name: Production readback
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout --detach origin/main
          git show HEAD:README.md | grep -Fq "Latest PentaRelease — $TAG"
          git show HEAD:.pentarelease/state/release-surface.json | jq -e --arg tag "$TAG" '.last_release == $tag' >/dev/null
          git show HEAD:pentarelease/latest.mdx | grep -Fq 'Cost calculation and methodology'
          git show HEAD:pentarelease/latest.mdx | grep -Fq 'What to expect'
          git show HEAD:pentarelease/cie.mdx | grep -Eq 'Overall score:.*[0-9]+.*\/100'
          git show HEAD:pentarelease/cie.mdx | grep -Fq 'Identity Fit'
          git show HEAD:pentarelease/cie.mdx | grep -Fq 'Community Value'
          git show HEAD:pentarelease/cie.mdx | grep -Fq 'Story Alignment'
          git show HEAD:pentarelease/cie.mdx | grep -Fq 'Brand Safety'
          git show HEAD:pentarelease/cie.mdx | grep -Fq 'Legacy Impact'
          python3 scripts/pentarelease/pentadocs_group.py --root . --policy .pentarelease/policy.json --check
          READBACK=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets,body)
          jq -e '.body | contains("Release intelligence")' <<<"$READBACK" >/dev/null
          jq -e '.body | test("Overall score:[^0-9]*[0-9]+(?:\\.[0-9]+)?/100")' <<<"$READBACK" >/dev/null
          test "$(jq '[.assets[] | select(.name|startswith("PENTARELEASE_"))] | length' <<<"$READBACK")" -ge 8
