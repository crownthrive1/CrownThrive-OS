name: CrownThrive IO Domain Certification

on:
  pull_request:
    paths:
      - "technology/crownthrive-io-domain-deployment-certification.mdx"
      - "developers/manifests/crownthrive-io-domain-deployment-certification.v1.json"
      - "scripts/validate_crownthrive_io_domain_certification.py"
      - ".github/workflows/crownthrive-io-domain-certification.yml"
      - "changelog/crownthrive-io-domain-deployment-certification-2026-08-22.mdx"
  push:
    branches:
      - "domain/crownthrive-io-deployment-certification-*"
    paths:
      - "technology/crownthrive-io-domain-deployment-certification.mdx"
      - "developers/manifests/crownthrive-io-domain-deployment-certification.v1.json"
      - "scripts/validate_crownthrive_io_domain_certification.py"
      - ".github/workflows/crownthrive-io-domain-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crownthrive-io-domain-cert-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Validate documentation
        run: python3 scripts/validate_docs.py
      - name: Validate domain certification contract
        run: python3 scripts/validate_crownthrive_io_domain_certification.py
