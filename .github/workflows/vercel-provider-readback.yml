name: PentaVercel Production Readback

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches:
      - main
    paths:
      - "apps/crownthrive-os-control-plane/**"
      - "config/vercel/execution-fabric.v1.json"
      - ".github/workflows/vercel-provider-readback.yml"

permissions:
  contents: read

concurrency:
  group: pentavercel-production-readback
  cancel-in-progress: true

jobs:
  activation-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      READBACK_REF: ${{ github.ref }}
    steps:
      - name: Require exact main lineage
        shell: bash
        run: |
          if [ "$READBACK_REF" != 'refs/heads/main' ]; then
            echo 'PentaVercel production readback — HOLD: exact main is required.' >> "$GITHUB_STEP_SUMMARY"
            exit 78
          fi
          echo 'PentaVercel production readback — exact main lineage accepted.' >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify all Vercel production planes
    needs: activation-gate
    if: needs.activation-gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Collect provider-originated readback
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          endpoints = {
              "crownthrive_os": "https://crown-thrive-os.vercel.app/health",
              "private_penta_os": "https://private-penta-os.vercel.app/health",
              "private_penta_execution": "https://private-penta-execution.vercel.app/health",
              "chlom_protocol": "https://chlom-protocol.vercel.app/health",
              "execution_fabric": "https://crown-thrive-os.vercel.app/fabric",
              "mcp_gateway": "https://crown-thrive-os.vercel.app/api/mcp?selftest=1",
              "pentafabric": "https://crown-thrive-os.vercel.app/api/penta?selftest=1",
          }
          expected_projects = {
              "crownthrive_os": {
                  "project_id": "prj_x6AcQaYdt6lkuyoWkdzv9TSL9lAN",
                  "repository": "crownthrive1/CrownThrive-OS",
              },
              "private_penta_os": {
                  "project_id": "prj_bokKbkKjxSq4jKYRtBjxhwEE4xbS",
                  "repository": "crownthrive1/PRIVATE-PentaOS",
              },
              "private_penta_execution": {
                  "project_id": "prj_d1uyuhNZHXfANgZv9zTEiaIlcZer",
                  "repository": "crownthrive1/PRIVATE-PentaExecution",
              },
              "chlom_protocol": {
                  "project_id": "prj_HewLgMjUiVBNCl0FADFbSggSp2QN",
                  "repository": "crownthrive1/chlom-protocol",
              },
          }

          class NoRedirectHandler(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirectHandler())

          def read_json_limited(response) -> dict:
              raw = response.read(1024 * 1024 + 1)
              if len(raw) > 1024 * 1024:
                  raise ValueError("provider readback exceeded one MiB")
              return json.loads(raw.decode("utf-8"))

          def parse_body(raw: str) -> dict:
              try:
                  return json.loads(raw)
              except json.JSONDecodeError:
                  return {"raw": raw[:300]}

          def probe(url: str) -> dict:
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/json",
                      "User-Agent": "CrownThrive-PentaVercel-CI/1.0",
                  },
              )
              try:
                  with opener.open(request, timeout=10) as response:
                      return {
                          "url": url,
                          "http_status": response.status,
                          "body": read_json_limited(response),
                      }
              except urllib.error.HTTPError as error:
                  raw = error.read(1024 * 1024 + 1).decode("utf-8", errors="replace")
                  return {
                      "url": url,
                      "http_status": error.code,
                      "body": parse_body(raw),
                      "error": f"HTTPError: {error}",
                  }
              except Exception as error:
                  return {
                      "url": url,
                      "error": f"{type(error).__name__}: {error}",
                  }

          def probe_unauthorized_write(url: str) -> dict:
              request = urllib.request.Request(
                  url,
                  data=b"{}",
                  method="POST",
                  headers={
                      "Accept": "application/json",
                      "Content-Type": "application/json",
                      "User-Agent": "CrownThrive-PentaVercel-CI/1.0",
                  },
              )
              try:
                  with opener.open(request, timeout=10) as response:
                      return {
                          "url": url,
                          "http_status": response.status,
                          "body": read_json_limited(response),
                      }
              except urllib.error.HTTPError as error:
                  raw = error.read(1024 * 1024 + 1).decode("utf-8", errors="replace")
                  return {
                      "url": url,
                      "http_status": error.code,
                      "body": parse_body(raw),
                      "error": f"HTTPError: {error}",
                  }
              except Exception as error:
                  return {
                      "url": url,
                      "error": f"{type(error).__name__}: {error}",
                  }

          def validate(results: dict) -> list[str]:
              failures: list[str] = []

              for key in (
                  "crownthrive_os",
                  "private_penta_os",
                  "private_penta_execution",
                  "chlom_protocol",
              ):
                  result = results.get(key, {})
                  body = result.get("body", {})
                  provider_state = (
                      body.get("provider_state")
                      or body.get("vercel_provider_state")
                  )
                  if result.get("http_status") != 200:
                      failures.append(f"{key}: HTTP status is not 200")
                  if body.get("status") != "OPERATIONAL":
                      failures.append(f"{key}: status is not OPERATIONAL")
                  if body.get("release") != "production":
                      failures.append(f"{key}: release is not production")
                  if body.get("provider_readback") is not True:
                      failures.append(
                          f"{key}: provider_readback is not true"
                      )
                  if provider_state != "BOUND_PRODUCTION":
                      failures.append(
                          f"{key}: provider state is not BOUND_PRODUCTION"
                      )
                  if body.get("pass_manufactured") is not False:
                      failures.append(
                          f"{key}: pass_manufactured invariant failed"
                      )
                  expected = expected_projects[key]
                  if body.get("project_id") != expected["project_id"]:
                      failures.append(f"{key}: exact project_id mismatch")
                  if body.get("repository") != expected["repository"]:
                      failures.append(f"{key}: exact repository mismatch")
                  if not re.fullmatch(r"[a-f0-9]{40}", str(body.get("build_sha") or "")):
                      failures.append(f"{key}: canonical build SHA is unavailable")
                  if not re.fullmatch(r"dpl_[A-Za-z0-9]+", str(body.get("deployment_id") or "")):
                      failures.append(f"{key}: canonical deployment ID is unavailable")

              control = results.get("crownthrive_os", {}).get("body", {})
              if control.get("build_sha") != os.getenv("GITHUB_SHA"):
                  failures.append(
                      "crownthrive_os: production build SHA does not match GITHUB_SHA"
                  )

              fabric = results.get("execution_fabric", {}).get("body", {})
              if fabric.get("status") != "OPERATIONAL":
                  failures.append(
                      "execution_fabric: status is not OPERATIONAL"
                  )
              if fabric.get("required_project_count") != 4:
                  failures.append(
                      "execution_fabric: required project count is not 4"
                  )
              if fabric.get("operational_project_count") != 4:
                  failures.append(
                      "execution_fabric: operational project count is not 4"
                  )
              fabric_projects = {
                  item.get("key"): item
                  for item in fabric.get("projects", [])
                  if isinstance(item, dict)
              }
              if set(fabric_projects) != set(expected_projects):
                  failures.append(
                      "execution_fabric: exact project identity set mismatch"
                  )
              for key, expected in expected_projects.items():
                  project = fabric_projects.get(key, {})
                  health = project.get("health") or {}
                  if project.get("state") != "PASS":
                      failures.append(f"execution_fabric: {key} is not PASS")
                  if project.get("project_id") != expected["project_id"]:
                      failures.append(f"execution_fabric: {key} binding project_id mismatch")
                  if project.get("repository") != expected["repository"]:
                      failures.append(f"execution_fabric: {key} binding repository mismatch")
                  if health.get("project_id") != expected["project_id"]:
                      failures.append(f"execution_fabric: {key} health project_id mismatch")
                  if health.get("repository") != expected["repository"]:
                      failures.append(f"execution_fabric: {key} health repository mismatch")
              fabric_evidence = fabric.get("evidence", {})
              if fabric_evidence.get("sink_bound") is not False:
                  failures.append(
                      "execution_fabric: OIDC GET state incorrectly claims a bound sink"
                  )
              if fabric_evidence.get("sink_mode") != "VERCEL_OIDC_PRESENT_UNVERIFIED":
                  failures.append(
                      "execution_fabric: OIDC is not the configured unverified primary route"
                  )
              if fabric_evidence.get("oidc_token_present") is not True:
                  failures.append("execution_fabric: OIDC token is not present")
              if fabric_evidence.get("oidc_token_verified") is not False:
                  failures.append("execution_fabric: GET manufactured OIDC verification")
              if fabric_evidence.get("oidc_ingest_configuration_valid") is not True:
                  failures.append("execution_fabric: OIDC ingest configuration is invalid")
              if fabric_evidence.get("persistence_state") != "PROVIDER_VALIDATION_REQUIRED_ON_DELIVERY":
                  failures.append("execution_fabric: persistence boundary is not delivery-gated")
              if (
                  fabric.get("governance", {}).get("pass_manufactured")
                  is not False
              ):
                  failures.append(
                      "execution_fabric: pass_manufactured invariant failed"
                  )

              mcp = results.get("mcp_gateway", {}).get("body", {})
              if mcp.get("status") != "OPERATIONAL":
                  failures.append(
                      "mcp_gateway: status is not OPERATIONAL"
                  )
              if mcp.get("write_tools") != 0:
                  failures.append(
                      "mcp_gateway: write tool count is not zero"
                  )
              if mcp.get("self_test", {}).get("status") != "PASS":
                  failures.append(
                      "mcp_gateway: POST protocol self-test did not pass"
                  )
              if mcp.get("self_test", {}).get("callback_build_sha") != os.getenv("GITHUB_SHA"):
                  failures.append("mcp_gateway: callback build SHA does not match GITHUB_SHA")
              callback_origin = str(mcp.get("self_test", {}).get("callback_origin") or "")
              if not re.fullmatch(r"https://crown-thrive-os-[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.vercel\.app", callback_origin):
                  failures.append("mcp_gateway: callback origin is not an exact CrownThrive deployment")
              if mcp.get("self_test", {}).get("callback_deployment_id") != control.get("deployment_id"):
                  failures.append("mcp_gateway: callback deployment ID does not match health readback")
              if mcp.get("self_test", {}).get("exact_deployment_origin") is not True:
                  failures.append("mcp_gateway: callback did not preserve exact deployment origin")

              penta = results.get("pentafabric", {}).get("body", {})
              if penta.get("status") != "OPERATIONAL":
                  failures.append(
                      "pentafabric: status is not OPERATIONAL"
                  )
              if penta.get("self_test", {}).get("status") != "PASS":
                  failures.append(
                      "pentafabric: packet self-test did not pass"
                  )
              penta_sink = penta.get("evidence_sink", {})
              if penta_sink.get("bound") is not False:
                  failures.append(
                      "pentafabric: OIDC GET state incorrectly claims a bound sink"
                  )
              if penta_sink.get("mode") != "VERCEL_OIDC_PRESENT_UNVERIFIED":
                  failures.append("pentafabric: OIDC is not the configured unverified primary route")
              if penta_sink.get("primary_route") != "VERCEL_OIDC":
                  failures.append("pentafabric: OIDC is not the primary persistence route")
              if penta_sink.get("oidc_token_present") is not True:
                  failures.append("pentafabric: OIDC token is not present")
              if penta_sink.get("oidc_token_verified") is not False:
                  failures.append("pentafabric: GET manufactured OIDC verification")
              if penta_sink.get("oidc_ingest_configuration_valid") is not True:
                  failures.append("pentafabric: OIDC ingest configuration is invalid")
              if penta.get("fabric", {}).get("signing") != "HMAC_SHA256_BOUND":
                  failures.append("pentafabric: HMAC signing binding is unavailable")
              if penta.get("fabric", {}).get("secret_bound") is not True:
                  failures.append("pentafabric: signing secret is not bound")
              if penta.get("fabric", {}).get("build_sha") != os.getenv("GITHUB_SHA"):
                  failures.append("pentafabric: signing build SHA does not match GITHUB_SHA")
              if penta.get("self_test", {}).get("assurance") != "HMAC-SHA256":
                  failures.append("pentafabric: self-test did not use HMAC-SHA256")
              if penta.get("write_authorization", {}).get("required") is not True:
                  failures.append(
                      "pentafabric: write authorization is not required"
                  )

              negative = results.get(
                  "unauthorized_pentafabric_write", {}
              )
              negative_status = negative.get("http_status")
              negative_body = negative.get("body", {})
              if negative_status not in (401, 403, 503):
                  failures.append(
                      "pentafabric: unauthenticated POST was not denied"
                  )
              if negative_body.get("status") != "WRITE_GATED":
                  failures.append(
                      "pentafabric: unauthenticated POST did not report WRITE_GATED"
                  )
              if negative_body.get("pass_manufactured") is not False:
                  failures.append(
                      "pentafabric: unauthenticated POST invariant failed"
                  )

              return failures

          results: dict = {}
          failures: list[str] = []

          for attempt in range(1, 13):
              results = {
                  key: probe(url)
                  for key, url in endpoints.items()
              }
              results["unauthorized_pentafabric_write"] = (
                  probe_unauthorized_write(
                      "https://crown-thrive-os.vercel.app/api/penta"
                  )
              )
              failures = validate(results)
              if not failures:
                  break
              if attempt < 12:
                  print(
                      f"Attempt {attempt}/12 remains HOLD; "
                      "waiting for exact production provider convergence."
                  )
                  for failure in failures:
                      print(f"- {failure}")
                  time.sleep(10)

          envelope = {
              "schema": "ct.penta.vercel.provider-readback-ci.20260830.v4",
              "status": "PASS" if not failures else "HOLD",
              "pentafabric_persistence_proof": "SEPARATE_PROTECTED_CANARY_REQUIRED",
              "pentafabric_persistence_claimed": False,
              "attempts": attempt,
              "results": results,
              "failures": failures,
              "observed_at": datetime.now(timezone.utc).isoformat(),
              "github": {
                  "repository": os.getenv("GITHUB_REPOSITORY"),
                  "sha": os.getenv("GITHUB_SHA"),
                  "event_name": os.getenv("GITHUB_EVENT_NAME"),
                  "run_id": os.getenv("GITHUB_RUN_ID"),
                  "run_attempt": os.getenv("GITHUB_RUN_ATTEMPT"),
              },
              "pass_manufactured": False,
          }
          canonical = json.dumps(
              envelope,
              sort_keys=True,
              separators=(",", ":"),
          )
          envelope["sha256"] = hashlib.sha256(
              canonical.encode("utf-8")
          ).hexdigest()

          print(json.dumps(envelope, indent=2, sort_keys=True))

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              fabric = results.get(
                  "execution_fabric", {}
              ).get("body", {})
              mcp = results.get("mcp_gateway", {}).get("body", {})
              negative = results.get(
                  "unauthorized_pentafabric_write", {}
              )
              with open(
                  summary_path, "a", encoding="utf-8"
              ) as summary:
                  summary.write(
                      "# PentaVercel production readback\n\n"
                  )
                  summary.write(
                      f"- Status: **{envelope['status']}**\n"
                  )
                  summary.write(
                      f"- Attempts: `{envelope['attempts']}`\n"
                  )
                  summary.write(
                      f"- SHA-256: `{envelope['sha256']}`\n"
                  )
                  summary.write(
                      "- Required planes: "
                      f"`{fabric.get('required_project_count', 'unknown')}`\n"
                  )
                  summary.write(
                      "- Operational planes: "
                      f"`{fabric.get('operational_project_count', 'unknown')}`\n"
                  )
                  summary.write(
                      "- OIDC configuration state: "
                      f"`{fabric.get('evidence', {}).get('sink_mode', 'unknown')}`\n"
                  )
                  summary.write(
                      "- Persistence proof: `SEPARATE_PROTECTED_CANARY_REQUIRED`\n"
                  )
                  summary.write(
                      "- MCP self-test: "
                      f"`{mcp.get('self_test', {}).get('status', 'unknown')}`\n"
                  )
                  summary.write(
                      "- Unauthorized Penta write: "
                      f"`{negative.get('http_status', 'unknown')}`\n"
                  )
                  if failures:
                      summary.write("\n## Holds\n")
                      for failure in failures:
                          summary.write(f"- {failure}\n")

          if failures:
              raise SystemExit(1)
          PY
