name: Penta Runtime Suite

on:
  pull_request:
    paths:
      - 'runtime/penta_*.py'
      - 'runtime/penta-provider-control-plane/**'
      - 'tests/test_penta*.py'
      - 'scripts/run_function_tests.py'
      - 'scripts/penta-family'
      - 'data/penta/**'
      - 'schemas/penta/**'
      - 'developers/manifests/penta-runtime-suite.v1.json'
      - 'developers/manifests/penta-os-v1.v1.json'
      - 'scripts/build_penta_os_v1.py'
      - 'scripts/package_penta_os_v1.py'
      - 'automation/penta-os-v1.mdx'
      - '.github/workflows/penta-runtime-suite.yml'
      - '.github/workflows/penta-interoperability-production.yml'
      - '.github/workflows/penta-provider-control-plane.yml'
      - '.github/workflows/penta-observability-production.yml'
  push:
    branches: [main]
    paths:
      - 'runtime/penta_*.py'
      - 'runtime/penta-provider-control-plane/**'
      - 'tests/test_penta*.py'
      - 'scripts/run_function_tests.py'
      - 'scripts/penta-family'
      - 'data/penta/**'
      - 'schemas/penta/**'
      - 'developers/manifests/penta-runtime-suite.v1.json'
      - 'developers/manifests/penta-os-v1.v1.json'
      - 'scripts/build_penta_os_v1.py'
      - 'scripts/package_penta_os_v1.py'
      - 'automation/penta-os-v1.mdx'
      - '.github/workflows/penta-runtime-suite.yml'
      - '.github/workflows/penta-interoperability-production.yml'
      - '.github/workflows/penta-provider-control-plane.yml'
      - '.github/workflows/penta-observability-production.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: penta-runtime-suite-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Install pinned COS V1 validation dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements/cos-v1-validation.txt

      - name: Compile Penta runtime software
        run: |
          python3 -m py_compile \
            runtime/penta_mail.py \
            runtime/penta_runtime_suite.py \
            runtime/penta_os_v1.py \
            runtime/penta_interop.py \
            runtime/penta_family.py \
            runtime/penta_exec.py \
            runtime/penta_evi_builder.py \
            runtime/penta_immune.py \
            runtime/penta_institutional_services.py \
            runtime/penta_institutional_controls.py \
            runtime/penta_compliance_license.py \
            runtime/penta_self_build.py \
            runtime/penta_observability.py \
            runtime/penta_error.py \
            runtime/penta_logger.py \
            runtime/penta_trace.py \
            runtime/penta_metric.py \
            runtime/penta-provider-control-plane/penta_control_plane.py \
            scripts/penta-family \
            scripts/build_penta_os_v1.py \
            scripts/package_penta_os_v1.py \
            scripts/run_function_tests.py

      - name: Run focused Penta runtime tests
        run: |
          python3 -m unittest discover -s tests -p 'test_penta_mail.py' -v
          python3 -m unittest discover -s tests -p 'test_penta_runtime_suite.py' -v
          python3 -m unittest discover -s tests -p 'test_penta_interop.py' -v
          python3 scripts/run_function_tests.py tests/test_penta_compliance_license.py tests/test_penta_self_build.py
          python3 tests/test_penta_family.py
          python3 tests/test_penta_exec.py
          python3 -m unittest tests.test_penta_evi_builder tests.test_penta_immune -v
          python3 tests/test_penta_institutional_services.py
          python3 tests/test_penta_institutional_controls.py
          python3 tests/test_penta_institutional_controls_family.py
          python3 -m unittest discover -s tests -p 'test_penta_observability.py' -v
          python3 -m unittest tests.test_penta_os_v1 -v
          python3 -m unittest tests.test_penta_helper_bounded_retry_contract -v

      - name: Validate and package Penta OS V1
        run: |
          python3 scripts/build_penta_os_v1.py --check
          python3 runtime/penta_os_v1.py --root . validate
          python3 scripts/package_penta_os_v1.py --output penta-os-v1-dist

      - name: Validate executable member control plane
        run: |
          python3 -m json.tool data/penta/execution-adapters.registry.json >/dev/null
          python3 -m json.tool data/penta/member-runtime.contract.json >/dev/null
          python3 -m json.tool schemas/penta/execution-request.schema.json >/dev/null
          python3 -m json.tool schemas/penta/execution-receipt.schema.json >/dev/null
          python3 runtime/penta_exec.py --root . validate

      - name: Smoke-test executable Penta family
        run: |
          python3 scripts/penta-family status penta.mail
          python3 scripts/penta-family invoke penta.status penta.beata heartbeat --risk D0 --evidence-ref ci:penta-runtime-suite
          python3 scripts/penta-family invoke penta.status penta.mesh route_check --risk D0 --evidence-ref ci:penta-runtime-suite --payload-json '{"candidate_target":"penta.mail"}'
          set +e
          python3 scripts/penta-family invoke penta.status penta.mail send --risk D1 --evidence-ref ci:penta-runtime-suite
          code=$?
          set -e
          if [ "$code" -ne 3 ]; then
            echo "Expected unimplemented PentaMail.send to fail closed with exit 3; got $code"
            exit 1
          fi

      - name: Validate provider contracts
        run: python3 scripts/validate_penta_provider_control_plane.py

      - name: Generate truth snapshot
        run: |
          python3 runtime/penta_runtime_suite.py --root . --output penta-runtime-suite-report.json
          python3 - <<'PY'
          import importlib.util
          import json
          from pathlib import Path
          import sys
          path = Path('runtime/penta_runtime_suite.py')
          spec = importlib.util.spec_from_file_location('penta_runtime_suite_ci', path)
          mod = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = mod
          spec.loader.exec_module(mod)
          snapshot = json.loads(Path('penta-runtime-suite-report.json').read_text())
          print(mod.owner_summary(snapshot))
          if snapshot['provider_control_plane'].get('contract_errors'):
              raise SystemExit('provider control contract errors detected')
          if not snapshot['pentamail']['registered']:
              raise SystemExit('PentaMail missing from Penta registry')
          if not snapshot['pentamail']['resend_registered']:
              raise SystemExit('Resend provider missing from Penta provider registry')
          PY

      - name: Certify interoperability snapshot
        run: |
          python3 runtime/penta_interop.py --root . --certify --output penta-interoperability-certification.json

      - name: Publish suite summary
        if: always()
        run: |
          {
            echo '## Penta Runtime Suite'
            echo
            echo 'Executable runtime, member-control-plane, provider-contract, family, observability, and interoperability verification.'
            echo
            if [ -f penta-runtime-suite-report.json ]; then
              echo '- Truth snapshot: generated'
            else
              echo '- Truth snapshot: missing'
            fi
            if [ -f penta-interoperability-certification.json ]; then
              python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("penta-interoperability-certification.json").read_text())
          print(f"- Interoperability: {r['status']} / {r['production_state']}")
          print(f"- Addressable Pentas: {r['addressable_member_count']}")
          print(f"- Blockers: {r['blocker_count']}")
          PY
            else
              echo '- Interoperability: HOLD (receipt missing)'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
