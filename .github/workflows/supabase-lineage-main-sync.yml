name: Supabase Lineage Main Sync

on:
  push:
    branches:
      - repair/supabase-migration-lineage-20260827

permissions:
  contents: write

jobs:
  sync-main:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Merge current protected main into repair branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CrownThrive Migration Lineage Repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main

      - name: Retire one-time sync workflow and push
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/supabase-lineage-main-sync.yml
          git commit -m 'chore(supabase): retire one-time main sync workflow'
          git push origin HEAD:repair/supabase-migration-lineage-20260827
