name: Framework Agent Transport Binding Governance

on:
  pull_request:
    paths:
      - 'developers/manifests/framework-agent-transport-inventory.v1.json'
      - 'scripts/validate_framework_agent_transport_inventory.py'
      - '.github/workflows/framework-agent-transport-binding-governance.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate exact CIE pre-cert transport binding
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Compile binding validator
        run: python -m py_compile scripts/validate_framework_agent_transport_inventory.py

      - name: Validate exact parent child binding and negative cases
        run: python scripts/validate_framework_agent_transport_inventory.py --self-test

      - name: Reject conflict markers
        shell: bash
        run: |
          if grep -R -nE '^(<<<<<<<|=======|>>>>>>>)' \
            developers/manifests/framework-agent-transport-inventory.v1.json \
            scripts/validate_framework_agent_transport_inventory.py; then
            echo 'Conflict markers detected.' >&2
            exit 1
          fi
