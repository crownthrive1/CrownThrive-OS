name: Commercial Gap Encrypted Transport Diagnostic

on:
  push:
    branches:
      - ops/commercial-gap-private-fulfillment-20260822
    paths:
      - ".github/workflows/commercial-gap-drive-read-probe.yml"
      - "developers/reference/commercial-release/private-fulfillment-client-public-jwk.json"

permissions:
  contents: write
  id-token: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout operations branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Request scoped GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=crownthrive-commercial-gap-encrypted-transport")"
          ID_TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"${RESPONSE}")"
          test -n "${ID_TOKEN}"
          echo "token=${ID_TOKEN}" >> "${GITHUB_OUTPUT}"
          echo "::add-mask::${ID_TOKEN}"

      - name: Call one-time payload-key bootstrap
        id: call
        env:
          ID_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          source=json.loads(Path('developers/reference/commercial-release/private-fulfillment-client-public-jwk.json').read_text())
          Path('/tmp/request.json').write_text(json.dumps({
            'public_key_jwk': source['public_key_jwk'],
            'public_key_jwk_sha256': source['public_key_jwk_sha256'],
          },separators=(',',':')))
          PY
          CODE="$(curl --silent --show-error -o /tmp/response.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer ${ID_TOKEN}" -H 'Content-Type: application/json' \
            --data-binary @/tmp/request.json \
            'https://tzajnzshmtzjenqulehq.supabase.co/functions/v1/commercial-gap-encrypted-transport-bootstrap-oidc')"
          echo "http_code=${CODE}" >> "${GITHUB_OUTPUT}"
          test -s /tmp/response.json

      - name: Write sanitized result
        env:
          HTTP_CODE: ${{ steps.call.outputs.http_code }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads(Path('/tmp/response.json').read_text())
          code=int(os.environ['HTTP_CODE'])
          for p in [Path('changelog/commercial-gap-encrypted-transport-bootstrap-receipt.json'),Path('changelog/commercial-gap-encrypted-transport-bootstrap-diagnostic.json')]:
            p.unlink(missing_ok=True)
          if code==200 and data.get('state')=='created':
            assert data.get('payload_key_returned_plaintext') is False
            assert data.get('payload_key_publicly_stored') is False
            assert data.get('public_url_created') is False
            assert data.get('plaintext_returned') is False
            wrapped=data.get('wrapped_payload_key_b64url')
            assert isinstance(wrapped,str) and len(wrapped)>100
            out={
              'schema_version':'1.0.0','state':'created','http_status':code,
              'source_commit':os.environ['GITHUB_SHA'],'transport_id':data['transport_id'],
              'expires_at':data['expires_at'],'algorithm':data['algorithm'],
              'client_public_jwk_sha256':data['client_public_jwk_sha256'],
              'wrapped_payload_key_b64url':wrapped,
              'payload_key_returned_plaintext':False,'payload_key_publicly_stored':False,
              'public_url_created':False,'plaintext_returned':False
            }
            Path('changelog/commercial-gap-encrypted-transport-bootstrap-receipt.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          else:
            out={
              'schema_version':'1.0.0','state':'failed','http_status':code,
              'source_commit':os.environ['GITHUB_SHA'],'error':data.get('error','unknown_error'),
              'detail':data.get('detail','unspecified'),'oidc_token_recorded':False,
              'product_bytes_recorded':False,'payload_key_returned_plaintext':False,'plaintext_returned':False
            }
            Path('changelog/commercial-gap-encrypted-transport-bootstrap-diagnostic.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY

      - name: Commit sanitized result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A changelog/
          git commit -m 'Record encrypted transport bootstrap result'
          git push origin "HEAD:${GITHUB_REF_NAME}"
