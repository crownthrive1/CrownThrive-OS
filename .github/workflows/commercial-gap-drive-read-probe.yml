name: Commercial Gap Drive Read Probe

on:
  push:
    branches:
      - ops/commercial-gap-private-fulfillment-20260822
    paths:
      - ".github/workflows/commercial-gap-drive-read-probe.yml"

permissions:
  contents: write
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout operations branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Preserve Drive privacy readback
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            "https://tzajnzshmtzjenqulehq.supabase.co/functions/v1/commercial-gap-drive-read-probe" \
            > /tmp/drive-probe.json

      - name: Request scoped GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=crownthrive-commercial-gap-encrypted-transport")"
          ID_TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"${RESPONSE}")"
          test -n "${ID_TOKEN}"
          echo "token=${ID_TOKEN}" >> "${GITHUB_OUTPUT}"
          echo "::add-mask::${ID_TOKEN}"

      - name: Bootstrap one-time encrypted payload key
        id: bootstrap
        env:
          ID_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          source=json.loads(Path('developers/reference/commercial-release/private-fulfillment-client-public-jwk.json').read_text())
          Path('/tmp/bootstrap-request.json').write_text(json.dumps({
              'public_key_jwk': source['public_key_jwk'],
              'public_key_jwk_sha256': source['public_key_jwk_sha256'],
          }, separators=(',',':')))
          PY
          HTTP_CODE="$(curl --silent --show-error \
            -o /tmp/bootstrap.json \
            -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${ID_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/bootstrap-request.json \
            "https://tzajnzshmtzjenqulehq.supabase.co/functions/v1/commercial-gap-encrypted-transport-bootstrap-oidc")"
          echo "http_code=${HTTP_CODE}" >> "${GITHUB_OUTPUT}"
          test -s /tmp/bootstrap.json

      - name: Write sanitized Drive and bootstrap receipts
        env:
          BOOTSTRAP_HTTP_CODE: ${{ steps.bootstrap.outputs.http_code }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          drive = json.loads(Path('/tmp/drive-probe.json').read_text())
          results = drive.get('results', [])
          assert len(results) == 3, drive
          assert {x.get('key') for x in results} == {'launch','ready','procure'}, drive
          safe = [{
              'key': item.get('key'),
              'status': item.get('status'),
              'ok': item.get('ok'),
              'content_type': item.get('content_type'),
              'byte_size': item.get('byte_size'),
              'sha256': item.get('sha256'),
              'expected_sha256': item.get('expected_sha256'),
              'exact_match': item.get('exact_match'),
              'final_host': item.get('final_host'),
              'error': item.get('error'),
          } for item in results]
          drive_receipt = {
              'schema_version':'1.0.0',
              'receipt_id':'ct.receipt.commercial-gap-drive-read-probe.2026-08-22.v3',
              'source_commit':os.environ['GITHUB_SHA'],
              'mutating':False,
              'all_exact_match':all(x.get('exact_match') is True for x in results),
              'privacy_boundary_preserved':True,
              'results':safe,
          }
          Path('changelog/commercial-gap-drive-read-probe-receipt.json').write_text(json.dumps(drive_receipt,indent=2,sort_keys=True)+'\n')

          source=json.loads(Path('developers/reference/commercial-release/private-fulfillment-client-public-jwk.json').read_text())
          data=json.loads(Path('/tmp/bootstrap.json').read_text())
          http_code=int(os.environ['BOOTSTRAP_HTTP_CODE'])
          if http_code == 200 and data.get('state') == 'created':
              assert data.get('payload_key_returned_plaintext') is False, data
              assert data.get('payload_key_publicly_stored') is False, data
              assert data.get('public_url_created') is False, data
              assert data.get('plaintext_returned') is False, data
              assert data.get('client_public_jwk_sha256') == source['public_key_jwk_sha256'], data
              wrapped=data.get('wrapped_payload_key_b64url')
              assert isinstance(wrapped,str) and len(wrapped)>100, data
              bootstrap_receipt = {
                  'schema_version':'1.0.0',
                  'receipt_id':'ct.receipt.commercial-gap-encrypted-transport-bootstrap.2026-08-22.v4',
                  'source_commit':os.environ['GITHUB_SHA'],
                  'http_status':http_code,
                  'state':'created',
                  'transport_id':data['transport_id'],
                  'expires_at':data['expires_at'],
                  'algorithm':data['algorithm'],
                  'client_public_jwk_sha256':data['client_public_jwk_sha256'],
                  'wrapped_payload_key_b64url':wrapped,
                  'payload_key_returned_plaintext':False,
                  'payload_key_publicly_stored':False,
                  'public_url_created':False,
                  'plaintext_returned':False,
              }
              Path('changelog/commercial-gap-encrypted-transport-bootstrap-receipt.json').write_text(json.dumps(bootstrap_receipt,indent=2,sort_keys=True)+'\n')
              Path('changelog/commercial-gap-encrypted-transport-bootstrap-diagnostic.json').unlink(missing_ok=True)
              print(json.dumps({'bootstrap_state':'created','transport_id':bootstrap_receipt['transport_id'],'expires_at':bootstrap_receipt['expires_at']},sort_keys=True))
          else:
              diagnostic={
                  'schema_version':'1.0.0',
                  'receipt_id':'ct.diagnostic.commercial-gap-encrypted-transport-bootstrap.2026-08-22.v1',
                  'source_commit':os.environ['GITHUB_SHA'],
                  'http_status':http_code,
                  'error':data.get('error','unknown_error'),
                  'detail':data.get('detail','unspecified'),
                  'payload_key_returned_plaintext':False,
                  'plaintext_returned':False,
                  'oidc_token_recorded':False,
                  'product_bytes_recorded':False,
              }
              Path('changelog/commercial-gap-encrypted-transport-bootstrap-diagnostic.json').write_text(json.dumps(diagnostic,indent=2,sort_keys=True)+'\n')
              Path('changelog/commercial-gap-encrypted-transport-bootstrap-receipt.json').unlink(missing_ok=True)
              print(json.dumps({'bootstrap_state':'failed','http_status':http_code,'error':diagnostic['error'],'detail':diagnostic['detail']},sort_keys=True))
          PY

      - name: Commit sanitized evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A changelog/
          if git diff --cached --quiet; then
            echo "No receipt delta."
            exit 0
          fi
          git commit -m "Record encrypted transport bootstrap diagnostic"
          git push origin "HEAD:${GITHUB_REF_NAME}"
