name: Framework Package Fleet Governance

on:
  pull_request:
    paths:
      - "developers/manifests/framework-child-fleet.v1.json"
      - "developers/templates/framework-child-repository/**"
      - "scripts/framework_child_fleet.py"
      - "automation/framework-child-repository-factory.mdx"
      - "changelog/phase-2-99-framework-child-fleet-self-sustain.mdx"
      - ".github/workflows/framework-child-fleet-governance.yml"
  push:
    branches:
      - main
      - "admin-mcp/**"
    paths:
      - "developers/manifests/framework-child-fleet.v1.json"
      - "developers/templates/framework-child-repository/**"
      - "scripts/framework_child_fleet.py"
      - "automation/framework-child-repository-factory.mdx"
      - "changelog/phase-2-99-framework-child-fleet-self-sustain.mdx"
      - ".github/workflows/framework-child-fleet-governance.yml"
  schedule:
    - cron: "42 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: framework-package-fleet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate framework package fleet
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Compile fleet controller
        run: python -m py_compile scripts/framework_child_fleet.py

      - name: Validate package manifest and templates
        run: python scripts/framework_child_fleet.py --validate

      - name: Run one-at-a-time and negative-case self-test
        run: python scripts/framework_child_fleet.py --self-test

      - name: Emit current next-safe framework packet
        run: python scripts/framework_child_fleet.py --next

      - name: Render and validate current CIE package
        run: |
          rm -rf /tmp/ct-framework-cie
          python scripts/framework_child_fleet.py \
            --render ct.framework.cultural-imprint-engine \
            --output-dir /tmp/ct-framework-cie
          python /tmp/ct-framework-cie/scripts/validate_child_repository.py --root /tmp/ct-framework-cie
          python /tmp/ct-framework-cie/engine/engine.py health

      - name: Render and validate Convergent preview package
        run: |
          rm -rf /tmp/ct-framework-convergent
          python scripts/framework_child_fleet.py \
            --render ct.framework.convergent-ecosystem \
            --output-dir /tmp/ct-framework-convergent
          python /tmp/ct-framework-convergent/scripts/validate_child_repository.py --root /tmp/ct-framework-convergent
          python /tmp/ct-framework-convergent/engine/engine.py health

      - name: Check whitespace and conflict markers
        run: |
          git diff --check
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!THIRD_PARTY_NOTICES.md'; then
            echo "Unresolved merge-conflict markers detected."
            exit 1
          fi

  route-drift:
    name: Route framework package fleet drift
    needs: validate
    if: ${{ always() && needs.validate.result == 'failure' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DRIFT_TITLE: "CT Framework Package Fleet Governance Drift"
    steps:
      - name: Create or update one governed drift issue
        run: |
          existing="$(gh issue list --state open --search "\"${DRIFT_TITLE}\" in:title" --limit 100 --json number,title --jq ".[] | select(.title == \"${DRIFT_TITLE}\") | .number" | head -n1)"
          body="Framework Package Fleet Governance failed on run ${GITHUB_RUN_ID} at ${GITHUB_SHA}. This is an internal WATCH/HOLD only. It creates no sovereign vote, framework acceptance, package certification, provider write, price, checkout or Phase-3 authority. Repair root cause through a reviewed packet and rerun unchanged controls."
          if [ -z "$existing" ]; then
            gh issue create --title "$DRIFT_TITLE" --body "$body"
          else
            gh issue comment "$existing" --body "$body"
          fi

  reconcile-drift:
    name: Reconcile recovered framework package fleet drift
    needs: validate
    if: ${{ always() && needs.validate.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DRIFT_TITLE: "CT Framework Package Fleet Governance Drift"
    steps:
      - name: Close recovered drift issue when present
        run: |
          existing="$(gh issue list --state open --search "\"${DRIFT_TITLE}\" in:title" --limit 100 --json number,title --jq ".[] | select(.title == \"${DRIFT_TITLE}\") | .number" | head -n1)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Framework Package Fleet Governance recovered on run ${GITHUB_RUN_ID} at ${GITHUB_SHA}. Closing this operational drift record does not certify any package or create a sovereign vote."
            gh issue close "$existing" --reason completed
          fi
