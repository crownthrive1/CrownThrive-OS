name: PentaVercel Control Plane

on:
  pull_request:
    paths:
      - "apps/crownthrive-os-control-plane/**"
      - "config/vercel_control_plane.json"
      - "scripts/validate_vercel_control_plane.py"
      - "tests/test_vercel_control_plane.py"
      - ".github/workflows/penta-vercel-control-plane.yml"
  push:
    branches: [main]
    paths:
      - "apps/crownthrive-os-control-plane/**"
      - "config/vercel_control_plane.json"
      - "scripts/validate_vercel_control_plane.py"
      - "tests/test_vercel_control_plane.py"
      - ".github/workflows/penta-vercel-control-plane.yml"
  workflow_dispatch:
    inputs:
      production:
        description: "Dispatch the registered Vercel production deploy hook"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: penta-vercel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: PentaVercel contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Validate static application JavaScript
        run: |
          node --check apps/crownthrive-os-control-plane/app.js
          node --check apps/crownthrive-os-control-plane/api/health.js

      - name: Validate Vercel source and no-false-production contract
        run: |
          mkdir -p artifacts/penta-vercel
          python scripts/validate_vercel_control_plane.py --root . --output artifacts/penta-vercel/source-receipt.json
          python -m unittest tests.test_vercel_control_plane -v

      - name: Upload PentaVercel source receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: penta-vercel-source-${{ github.sha }}
          path: artifacts/penta-vercel
          if-no-files-found: error
          retention-days: 90

  provider-deploy:
    name: PentaVercel explicit provider deployment
    if: github.event_name == 'workflow_dispatch' && inputs.production == true
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_CONTROL_PLANE_DEPLOY_HOOK_URL }}
    steps:
      - name: Require registered provider binding
        shell: bash
        run: |
          if [[ -z "$VERCEL_DEPLOY_HOOK_URL" ]]; then
            echo "::error::VERCEL_CONTROL_PLANE_DEPLOY_HOOK_URL is not bound. Source is deployable, but production cannot be claimed."
            exit 78
          fi

      - name: Dispatch Vercel production build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/penta-vercel
          response="$(curl --fail-with-body --silent --show-error --request POST "$VERCEL_DEPLOY_HOOK_URL")"
          printf '%s\n' "$response" > artifacts/penta-vercel/deploy-hook-response.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('artifacts/penta-vercel/deploy-hook-response.json').read_text())
          if not data.get('job') and not data.get('id'):
              raise SystemExit('Vercel did not return a deployment job identity')
          print(json.dumps({'status': 'DISPATCHED', 'provider_readback_pending': True, 'response': data}, indent=2))
          PY

      - name: Upload provider dispatch receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: penta-vercel-provider-${{ github.run_id }}
          path: artifacts/penta-vercel
          if-no-files-found: error
          retention-days: 90
