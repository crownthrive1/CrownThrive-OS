name: Supabase Migration Lineage Repair

on:
  push:
    branches:
      - repair/supabase-migration-lineage-20260827

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Materialize safe migration lineage parity
        run: python3 scripts/repair_supabase_migration_lineage.py

      - name: Verify generated parity receipt
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('supabase/migration_lineage/receipt_20260827.json').read_text())
          assert receipt['remote_migration_count'] == 991
          assert receipt['post_repair_active_count'] == 991
          assert receipt['remote_history_mutated'] is False
          assert receipt['exact_sql_published'] is False
          print('LINEAGE_RECEIPT=PASS')
          PY

      - name: Remove one-time repair workflow and commit branch result
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/supabase-migration-lineage-inventory.yml
          git config user.name 'CrownThrive Migration Lineage Repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore(supabase): restore production migration lineage parity'
          git push origin HEAD:repair/supabase-migration-lineage-20260827
