name: Collision Governance v2 — trusted RTC

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, ready_for_review, closed]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: collision-governance-trusted-v2-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  trusted-base-preflight:
    name: Trusted base — live prevention and reaction
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted base without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Evaluate candidate against a before/after-bound snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
          COLLISION_REPOSITORY: ${{ github.repository }}
          COLLISION_BRANCH: ${{ github.event.pull_request.base.ref }}
          COLLISION_CANDIDATE: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          run_collision() {
            python3 scripts/governed_collision_agent_v2.py \
              --repository "$COLLISION_REPOSITORY" \
              --branch "$COLLISION_BRANCH" \
              --candidate "$COLLISION_CANDIDATE" \
              --output collision-governance-v2-report.json \
              --fail-on-severity 2
          }
          set +e
          run_collision
          rc=$?
          set -e
          if [[ "$rc" -ne 0 ]] && [[ -s collision-governance-v2-report.json ]]; then
            reason=$(jq -r '.reason_code // empty' collision-governance-v2-report.json)
            error=$(jq -r '.error // empty' collision-governance-v2-report.json)
            if [[ "$reason" == "COLLISION_OBSERVER_FAILED_CLOSED" && "$error" == *"HTTP Error 403"* ]]; then
              echo 'Authenticated GitHub installation read is rate-limited; retrying the same read-only public-repository observer without Authorization.' >> "$GITHUB_STEP_SUMMARY"
              export GITHUB_TOKEN=''
              run_collision
              rc=$?
            fi
          fi
          exit "$rc"

  trusted-main-reconciliation:
    name: Trusted main — continuous awareness and reaction
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted main without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Recompute the open collision graph
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COLLISION_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          run_collision() {
            python3 scripts/governed_collision_agent_v2.py \
              --repository "$COLLISION_REPOSITORY" \
              --branch main \
              --output collision-governance-v2-report.json \
              --fail-on-severity 6
          }
          set +e
          run_collision
          rc=$?
          set -e
          if [[ "$rc" -ne 0 ]] && [[ -s collision-governance-v2-report.json ]]; then
            reason=$(jq -r '.reason_code // empty' collision-governance-v2-report.json)
            error=$(jq -r '.error // empty' collision-governance-v2-report.json)
            if [[ "$reason" == "COLLISION_OBSERVER_FAILED_CLOSED" && "$error" == *"HTTP Error 403"* ]]; then
              echo 'Authenticated GitHub installation read is rate-limited; retrying the same read-only public-repository observer without Authorization.' >> "$GITHUB_STEP_SUMMARY"
              export GITHUB_TOKEN=''
              run_collision
              rc=$?
            fi
          fi
          exit "$rc"
