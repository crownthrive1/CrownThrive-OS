name: Collision Governance v2 — trusted RTC

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, ready_for_review, closed]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: collision-governance-trusted-v2-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  trusted-base-preflight:
    name: Trusted base — live prevention and reaction
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted base without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Evaluate candidate against a before/after-bound snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
        shell: bash
        run: |
          set -euo pipefail
          attempt=1
          max_attempts=3
          fail_threshold=2
          while true; do
            report="collision-governance-v2-report-attempt-${attempt}.json"
            set +e
            python3 scripts/governed_collision_agent_v2_trusted.py \
              --repository "${{ github.repository }}" \
              --branch "${{ github.event.pull_request.base.ref }}" \
              --candidate "${{ github.event.pull_request.number }}" \
              --expected-main-sha "${{ github.event.pull_request.base.sha }}" \
              --output "$report" \
              --fail-on-severity 2
            status=$?
            set -e

            cp "$report" collision-governance-v2-report.json
            if [[ "$status" -eq 0 ]]; then
              echo "Collision preflight passed on attempt ${attempt}."
              exit 0
            fi

            retryable=$(python3 - "$report" "$fail_threshold" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as fh:
              report = json.load(fh)
          fail_threshold = int(sys.argv[2])

          decision = report.get("decision") or {}
          codes = set(decision.get("reason_codes") or [])
          collisions = report.get("collisions") or []
          inspection_errors = report.get("inspection_errors") or {}
          main_stable = report.get("main_sha_start") == report.get("main_sha_end")
          candidate_stable = report.get("candidate_head_start") == report.get("candidate_head_end")
          material_collisions = [
              item for item in collisions
              if int(item.get("severity") or 0) >= fail_threshold
          ]
          retryable = (
              "snapshot_changed_during_evaluation" in codes
              and not material_collisions
              and not inspection_errors
              and main_stable
              and candidate_stable
          )
          print("true" if retryable else "false")
          PY
          )

            if [[ "$retryable" != "true" ]]; then
              echo "Collision preflight remains fail-closed: status=${status} retryable=${retryable} attempt=${attempt}/${max_attempts}."
              exit "$status"
            fi

            if [[ "$attempt" -ge "$max_attempts" ]]; then
              python3 - "$report" "$attempt" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          attempts = int(sys.argv[2])
          with open(path, encoding="utf-8") as fh:
              report = json.load(fh)

          collisions = report.get("collisions") or []
          observed_max = max((int(item.get("severity") or 0) for item in collisions), default=0)
          decision = report.setdefault("decision", {})
          codes = set(decision.get("reason_codes") or [])
          codes.discard("snapshot_changed_during_evaluation")
          codes.add("global_snapshot_churn_accepted_after_bounded_candidate_fence")
          decision["disposition"] = "ALLOW_AWARE" if observed_max else "ALLOW"
          decision["max_severity"] = observed_max
          decision["reason_codes"] = sorted(codes)
          report["candidate_bounded_snapshot_resolution"] = {
              "attempts": attempts,
              "candidate_head_stable": report.get("candidate_head_start") == report.get("candidate_head_end"),
              "main_stable": report.get("main_sha_start") == report.get("main_sha_end"),
              "material_collision_count": sum(1 for item in collisions if int(item.get("severity") or 0) >= 2),
              "inspection_error_count": len(report.get("inspection_errors") or {}),
              "global_snapshot_stable": bool(report.get("snapshot_stable")),
              "resolution": "candidate_bounded_fence_after_transient_global_churn",
          }

          rendered = json.dumps(report, indent=2, sort_keys=True) + "\n"
          with open(path, "w", encoding="utf-8") as fh:
              fh.write(rendered)
          PY
              cp "$report" collision-governance-v2-report.json
              echo "Transient global PR churn persisted through ${max_attempts} attempts; candidate-bounded fence passed because main and candidate head stayed stable with zero material collisions and zero inspection errors."
              exit 0
            fi

            echo "Transient collision snapshot fence changed during evaluation; preserving attempt ${attempt} and recomputing from fresh provider state."
            sleep $((attempt * 2))
            attempt=$((attempt + 1))
          done

  trusted-main-reconciliation:
    name: Trusted main — continuous awareness and reaction
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted main without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Recompute the open collision graph
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          python3 scripts/governed_collision_agent_v2.py
          --repository "${{ github.repository }}"
          --branch main
          --output collision-governance-v2-report.json
          --fail-on-severity 6
