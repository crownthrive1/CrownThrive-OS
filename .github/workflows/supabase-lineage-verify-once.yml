name: Supabase Lineage Verify Once

on:
  push:
    branches:
      - repair/supabase-migration-lineage-20260827

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify current production-ledger snapshot parity
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/penta_migration_lineage_verify.py
          python3 scripts/penta_migration_lineage_verify.py
