name: COS 1.8 Patch Materializer

on:
  push:
    branches:
      - "governance/cos-1.8-pentagovernance-ratification-20260904"

permissions:
  contents: write

concurrency:
  group: cos-1-8-materializer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "governance/cos-1.8-pentagovernance-ratification-20260904"
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Verify and materialize hash-locked patch
        shell: bash
        run: |
          set -euo pipefail
          echo "7ec37f8a6de0489d66cd55bff86fe41c403be435e51a9807b174f59005f8d422  .cos18-bootstrap/payload.part00" | sha256sum --check --strict
          echo "7acc165a1406717212987468963b27c8d016ddc2e34935f0e73dc9ef503debcf  .cos18-bootstrap/payload.part01" | sha256sum --check --strict
          echo "63d4a91f03e554a65f43fd23b5a0198ba8085185dfb48a0dfcd7949d08878035  .cos18-bootstrap/payload.part02" | sha256sum --check --strict
          echo "9651905270733ff3056f48a7d8f046b5d48c14991c43eabef56f2acce549bc11  .cos18-bootstrap/payload.part03" | sha256sum --check --strict
          cat .cos18-bootstrap/payload.part00 .cos18-bootstrap/payload.part01 .cos18-bootstrap/payload.part02 .cos18-bootstrap/payload.part03 > /tmp/cos18-patch.b64
          base64 --decode /tmp/cos18-patch.b64 > /tmp/cos18-patch.tar.gz
          echo "e0fb8547ce9c40eeb3706228943afd2a2cedc6d2c64ff233173ad106b635fe7e  /tmp/cos18-patch.tar.gz" | sha256sum --check --strict

          python - <<'PY'
          import pathlib
          import tarfile

          archive = pathlib.Path('/tmp/cos18-patch.tar.gz')
          with tarfile.open(archive, 'r:gz') as tf:
              for member in tf.getmembers():
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe archive member: {member.name}')
          PY

          rm -rf /tmp/cos18-extract
          mkdir -p /tmp/cos18-extract
          tar -xzf /tmp/cos18-patch.tar.gz -C /tmp/cos18-extract

          mapfile -t manifests < <(find /tmp/cos18-extract -type f -path '*/governance/pentagovernance/ratification/PATCH_MANIFEST.json' -print | sort)
          test "${#manifests[@]}" -eq 1
          payload_root="${manifests[0]%/governance/pentagovernance/ratification/PATCH_MANIFEST.json}"
          test -d "$payload_root/governance/pentagovernance"
          cp -a "$payload_root"/. .

          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          target = Path("governance/pentagovernance/contracts/PENTAGOVERNANCE_CONSTITUENCY_COMPACT_v1.md")
          if not target.is_file():
              raise SystemExit(f"materialized compact not found: {target}")
          normalized = "\n".join(line.rstrip() for line in target.read_text(encoding="utf-8").splitlines()).rstrip() + "\n"
          target.write_text(normalized, encoding="utf-8")

          manifest_path = Path("governance/pentagovernance/ratification/PATCH_MANIFEST.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          found = False
          for entry in manifest.get("files", []):
              path = Path(entry["path"])
              if path.as_posix() == target.as_posix():
                  data = path.read_bytes()
                  entry["size_bytes"] = len(data)
                  entry["sha256"] = hashlib.sha256(data).hexdigest()
                  found = True
                  break
          if not found:
              raise SystemExit("compact markdown missing from patch manifest")
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          rm -rf .cos18-bootstrap
          rm -f .github/workflows/_cos18_materialize.yml
      - name: Validate materialized candidate
        run: |
          python -m py_compile scripts/validate_cos18_constitutional_release.py tests/test_cos18_constitutional_release.py
          python -m unittest tests.test_cos18_constitutional_release -v
          python scripts/validate_cos18_constitutional_release.py --root .
          git diff --check
      - name: Commit exact candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CrownThrive COS 1.8 Materializer"
          git config user.email "contact@crownthrive.com"
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat(cos): materialize COS 1.8 constitutional survival kernel"
          git push origin HEAD:"governance/cos-1.8-pentagovernance-ratification-20260904"
