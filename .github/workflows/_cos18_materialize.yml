name: COS 1.8 Patch Materializer

on:
  push:
    branches:
      - "governance/cos-1.8-pentagovernance-ratification-20260904"

permissions:
  contents: write

concurrency:
  group: cos-1-8-materializer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out governed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "governance/cos-1.8-pentagovernance-ratification-20260904"
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Diagnose exact recovery stage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import io
          import json
          import pathlib
          import subprocess
          import tarfile
          import time
          import traceback

          repository = pathlib.Path.cwd()
          bootstrap = repository / '.cos18-bootstrap'
          expected_part_hashes = {
              'payload.part00': '7ec37f8a6de0489d66cd55bff86fe41c403be435e51a9807b174f59005f8d422',
              'payload.part01': '7acc165a1406717212987468963b27c8d016ddc2e34935f0e73dc9ef503debcf',
              'payload.part02': '63d4a91f03e554a65f43fd23b5a0198ba8085185dfb48a0dfcd7949d08878035',
              'payload.part03': '9651905270733ff3056f48a7d8f046b5d48c14991c43eabef56f2acce549bc11',
          }
          expected_archive_hash = 'e0fb8547ce9c40eeb3706228943afd2a2cedc6d2c64ff233173ad106b635fe7e'
          record: dict[str, object] = {
              'schema': 'ct.cos18.payload-recovery-forensics.v1',
              'expected_archive_sha256': expected_archive_hash,
              'stage': 'STARTED',
              'status': 'FORENSICS_COMPLETE',
              'parts': {},
              'historical_part00_versions': [],
          }
          started = time.monotonic()
          try:
              raw_parts: dict[str, bytes] = {}
              compact_parts: dict[str, bytes] = {}
              for index in range(4):
                  name = f'payload.part{index:02d}'
                  raw = (bootstrap / name).read_bytes()
                  compact = b''.join(raw.split())
                  raw_parts[name] = raw
                  compact_parts[name] = compact
                  lines = raw.splitlines()
                  variants = {
                      'raw': raw,
                      'rstrip_line_endings': raw.rstrip(b'\r\n'),
                      'lf_terminal': b'\n'.join(lines) + b'\n',
                      'crlf_terminal': b'\r\n'.join(lines) + b'\r\n',
                      'whitespace_free': compact,
                  }
                  record['parts'][name] = {
                      'expected_sha256': expected_part_hashes[name],
                      'raw_bytes': len(raw),
                      'compact_bytes': len(compact),
                      'line_count': len(lines),
                      'line_lengths': sorted(set(len(line) for line in lines)),
                      'last_12_compact_ascii': compact[-12:].decode('ascii', errors='replace'),
                      'variant_sha256': {
                          variant: hashlib.sha256(data).hexdigest()
                          for variant, data in variants.items()
                      },
                      'matching_variants': [
                          variant for variant, data in variants.items()
                          if hashlib.sha256(data).hexdigest() == expected_part_hashes[name]
                      ],
                  }

              record['stage'] = 'HISTORY_SCAN'
              history = subprocess.run(
                  ['git', 'log', '--all', '--format=%H', '--', '.cos18-bootstrap/payload.part00'],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout.splitlines()
              for commit in history:
                  shown = subprocess.run(
                      ['git', 'show', f'{commit}:.cos18-bootstrap/payload.part00'],
                      capture_output=True,
                  )
                  if shown.returncode != 0:
                      continue
                  data = shown.stdout
                  entry = {
                      'commit': commit,
                      'bytes': len(data),
                      'sha256': hashlib.sha256(data).hexdigest(),
                      'matches_expected': hashlib.sha256(data).hexdigest() == expected_part_hashes['payload.part00'],
                  }
                  record['historical_part00_versions'].append(entry)

              record['stage'] = 'SINGLE_INSERTION_SEARCH'
              damaged_part = compact_parts['payload.part00']
              suffix = b''.join(compact_parts[f'payload.part{index:02d}'] for index in range(1, 4))
              alphabet = b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
              recovered_archive: bytes | None = None
              recovered_encoded: bytes | None = None
              recovered_position: int | None = None
              recovered_character: str | None = None
              attempts = 0
              decode_successes = 0
              for position in range(len(damaged_part) + 1):
                  prefix = damaged_part[:position]
                  tail = damaged_part[position:]
                  for value in alphabet:
                      attempts += 1
                      candidate = prefix + bytes((value,)) + tail + suffix
                      try:
                          archive = base64.b64decode(candidate, validate=True)
                      except Exception:
                          continue
                      decode_successes += 1
                      if hashlib.sha256(archive).hexdigest() == expected_archive_hash:
                          recovered_archive = archive
                          recovered_encoded = candidate
                          recovered_position = position
                          recovered_character = chr(value)
                          break
                  if recovered_archive is not None:
                      break
              record['single_insertion_search'] = {
                  'attempts': attempts,
                  'decode_successes': decode_successes,
                  'found': recovered_archive is not None,
                  'position_zero_based': recovered_position,
                  'character': recovered_character,
                  'elapsed_seconds': round(time.monotonic() - started, 6),
              }

              if recovered_archive is None or recovered_encoded is None:
                  record['stage'] = 'NO_EXACT_SINGLE_INSERTION_CANDIDATE'
              else:
                  record['stage'] = 'ARCHIVE_VALIDATION'
                  record['recovered_encoded_sha256'] = hashlib.sha256(recovered_encoded).hexdigest()
                  record['recovered_archive_sha256'] = hashlib.sha256(recovered_archive).hexdigest()
                  with tarfile.open(fileobj=io.BytesIO(recovered_archive), mode='r:gz') as archive:
                      members = archive.getmembers()
                      names = [member.name for member in members]
                      unsafe = [
                          member.name for member in members
                          if pathlib.PurePosixPath(member.name).is_absolute()
                          or '..' in pathlib.PurePosixPath(member.name).parts
                          or member.issym()
                          or member.islnk()
                      ]
                      record['archive_validation'] = {
                          'member_count': len(names),
                          'unsafe_members': unsafe,
                          'manifest_candidates': sorted(
                              name for name in names
                              if name.endswith('governance/pentagovernance/ratification/PATCH_MANIFEST.json')
                          ),
                          'compact_candidates': sorted(
                              name for name in names
                              if name.endswith('governance/pentagovernance/contracts/PENTAGOVERNANCE_CONSTITUENCY_COMPACT_v1.md')
                          ),
                          'members': sorted(names),
                      }
                  record['stage'] = 'PASS_EXACT_ARCHIVE_RECOVERED_AND_VALIDATED'
          except Exception as exc:
              record['status'] = 'FORENSICS_EXCEPTION_CAPTURED'
              record['error_type'] = type(exc).__name__
              record['error'] = str(exc)
              record['traceback'] = traceback.format_exc()
          finally:
              record['total_elapsed_seconds'] = round(time.monotonic() - started, 6)
              output = bootstrap / 'recovery-forensics.json'
              output.write_text(json.dumps(record, indent=2, sort_keys=True) + '\n', encoding='utf-8')
              print(output.read_text(encoding='utf-8'))
          PY
      - name: Commit forensic receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CrownThrive COS 1.8 Materializer"
          git config user.email "contact@crownthrive.com"
          git add .cos18-bootstrap/recovery-forensics.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Forensic receipt is unchanged."
            exit 0
          fi
          git commit -m "chore(cos): persist exact COS 1.8 recovery failure stage"
          git push origin HEAD:"governance/cos-1.8-pentagovernance-ratification-20260904"
