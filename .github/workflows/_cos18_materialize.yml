name: COS 1.8 Patch Materializer

on:
  push:
    branches:
      - "governance/cos-1.8-pentagovernance-ratification-20260904"

permissions:
  contents: write

concurrency:
  group: cos-1-8-materializer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "governance/cos-1.8-pentagovernance-ratification-20260904"
          fetch-depth: 0
          persist-credentials: true
      - name: Capture encoded-payload canonicalization diagnostic
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import io
          import json
          import pathlib
          import tarfile
          import traceback

          root = pathlib.Path('.cos18-bootstrap')
          expected_parts = {
              'payload.part00': '7ec37f8a6de0489d66cd55bff86fe41c403be435e51a9807b174f59005f8d422',
              'payload.part01': '7acc165a1406717212987468963b27c8d016ddc2e34935f0e73dc9ef503debcf',
              'payload.part02': '63d4a91f03e554a65f43fd23b5a0198ba8085185dfb48a0dfcd7949d08878035',
              'payload.part03': '9651905270733ff3056f48a7d8f046b5d48c14991c43eabef56f2acce549bc11',
          }
          expected_archive = 'e0fb8547ce9c40eeb3706228943afd2a2cedc6d2c64ff233173ad106b635fe7e'
          record: dict[str, object] = {
              'schema': 'ct.cos18.payload-diagnostic.v2',
              'expected_archive_sha256': expected_archive,
              'parts': {},
              'decode_attempts': {},
              'status': 'DIAGNOSTIC_COMPLETE',
          }
          raw_joined = bytearray()
          compact_joined = bytearray()
          for name, expected in expected_parts.items():
              path = root / name
              data = path.read_bytes()
              stripped = data.rstrip(b'\r\n')
              compact = b''.join(data.split())
              actual = hashlib.sha256(data).hexdigest()
              stripped_sha = hashlib.sha256(stripped).hexdigest()
              compact_sha = hashlib.sha256(compact).hexdigest()
              record['parts'][name] = {
                  'raw_bytes': len(data),
                  'compact_bytes': len(compact),
                  'expected_sha256': expected,
                  'raw_sha256': actual,
                  'rstrip_newline_sha256': stripped_sha,
                  'whitespace_free_sha256': compact_sha,
                  'expected_matches': [
                      mode for mode, digest in {
                          'raw': actual,
                          'rstrip_newline': stripped_sha,
                          'whitespace_free': compact_sha,
                      }.items() if digest == expected
                  ],
              }
              raw_joined.extend(data)
              compact_joined.extend(compact)

          attempts = {
              'raw_permissive': bytes(raw_joined),
              'whitespace_free': bytes(compact_joined),
          }
          for label, encoded in attempts.items():
              attempt: dict[str, object] = {
                  'encoded_bytes': len(encoded),
                  'encoded_sha256': hashlib.sha256(encoded).hexdigest(),
              }
              try:
                  archive = base64.b64decode(encoded, validate=(label == 'whitespace_free'))
                  archive_sha = hashlib.sha256(archive).hexdigest()
                  attempt['archive_bytes'] = len(archive)
                  attempt['archive_sha256'] = archive_sha
                  attempt['expected_archive_match'] = archive_sha == expected_archive
                  with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as tf:
                      members = tf.getmembers()
                      names = [member.name for member in members]
                      unsafe = [
                          name for name in names
                          if pathlib.PurePosixPath(name).is_absolute()
                          or '..' in pathlib.PurePosixPath(name).parts
                      ]
                      attempt['tar_valid'] = True
                      attempt['member_count'] = len(names)
                      attempt['members'] = sorted(names)
                      attempt['unsafe_members'] = unsafe
                      attempt['manifest_candidates'] = sorted(
                          name for name in names
                          if name.endswith('governance/pentagovernance/ratification/PATCH_MANIFEST.json')
                      )
                      attempt['compact_candidates'] = sorted(
                          name for name in names
                          if name.endswith('governance/pentagovernance/contracts/PENTAGOVERNANCE_CONSTITUENCY_COMPACT_v1.md')
                      )
              except Exception as exc:
                  attempt['error_type'] = type(exc).__name__
                  attempt['error'] = str(exc)
                  attempt['traceback'] = traceback.format_exc()
              record['decode_attempts'][label] = attempt

          output = root / 'archive-diagnostic.json'
          output.write_text(json.dumps(record, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(output.read_text(encoding='utf-8'))
          PY
      - name: Commit payload diagnostic receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CrownThrive COS 1.8 Materializer"
          git config user.email "contact@crownthrive.com"
          git add .cos18-bootstrap/archive-diagnostic.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Diagnostic is unchanged."
            exit 0
          fi
          git commit -m "chore(cos): record COS 1.8 payload canonicalization diagnostic"
          git push origin HEAD:"governance/cos-1.8-pentagovernance-ratification-20260904"
