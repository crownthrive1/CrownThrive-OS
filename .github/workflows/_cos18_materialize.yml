name: COS 1.8 Patch Materializer

on:
  push:
    branches:
      - "governance/cos-1.8-pentagovernance-ratification-20260904"

permissions:
  contents: write

concurrency:
  group: cos-1-8-materializer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "governance/cos-1.8-pentagovernance-ratification-20260904"
          fetch-depth: 0
          persist-credentials: true
      - name: Capture deterministic payload diagnostic
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import io
          import json
          import pathlib
          import tarfile
          import traceback

          root = pathlib.Path('.cos18-bootstrap')
          expected_parts = {
              'payload.part00': '7ec37f8a6de0489d66cd55bff86fe41c403be435e51a9807b174f59005f8d422',
              'payload.part01': '7acc165a1406717212987468963b27c8d016ddc2e34935f0e73dc9ef503debcf',
              'payload.part02': '63d4a91f03e554a65f43fd23b5a0198ba8085185dfb48a0dfcd7949d08878035',
              'payload.part03': '9651905270733ff3056f48a7d8f046b5d48c14991c43eabef56f2acce549bc11',
          }
          expected_archive = 'e0fb8547ce9c40eeb3706228943afd2a2cedc6d2c64ff233173ad106b635fe7e'
          record: dict[str, object] = {
              'schema': 'ct.cos18.payload-diagnostic.v1',
              'expected_archive_sha256': expected_archive,
              'parts': {},
              'members': [],
              'status': 'DIAGNOSTIC_FAILED',
          }
          try:
              joined = bytearray()
              for name, expected in expected_parts.items():
                  path = root / name
                  data = path.read_bytes()
                  actual = hashlib.sha256(data).hexdigest()
                  record['parts'][name] = {
                      'bytes': len(data),
                      'expected_sha256': expected,
                      'actual_sha256': actual,
                      'matches': actual == expected,
                  }
                  if actual != expected:
                      raise ValueError(f'part digest mismatch: {name}')
                  joined.extend(data)

              record['joined_base64_bytes'] = len(joined)
              archive = base64.b64decode(bytes(joined), validate=True)
              archive_sha = hashlib.sha256(archive).hexdigest()
              record['archive_bytes'] = len(archive)
              record['actual_archive_sha256'] = archive_sha
              record['archive_matches'] = archive_sha == expected_archive
              if archive_sha != expected_archive:
                  raise ValueError('archive digest mismatch')

              with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as tf:
                  members = tf.getmembers()
                  names: list[str] = []
                  unsafe: list[str] = []
                  for member in members:
                      name = member.name
                      names.append(name)
                      path = pathlib.PurePosixPath(name)
                      if path.is_absolute() or '..' in path.parts:
                          unsafe.append(name)
                  record['members'] = sorted(names)
                  record['member_count'] = len(names)
                  record['unsafe_members'] = unsafe
                  record['manifest_candidates'] = sorted(
                      name for name in names if name.endswith('governance/pentagovernance/ratification/PATCH_MANIFEST.json')
                  )
                  record['compact_candidates'] = sorted(
                      name for name in names if name.endswith('governance/pentagovernance/contracts/PENTAGOVERNANCE_CONSTITUENCY_COMPACT_v1.md')
                  )
                  if unsafe:
                      raise ValueError('unsafe archive members present')
              record['status'] = 'PASS_DIAGNOSTIC'
          except Exception as exc:  # diagnostic must survive the failing condition
              record['error_type'] = type(exc).__name__
              record['error'] = str(exc)
              record['traceback'] = traceback.format_exc()

          output = root / 'archive-diagnostic.json'
          output.write_text(json.dumps(record, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(output.read_text(encoding='utf-8'))
          PY
      - name: Commit payload diagnostic receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CrownThrive COS 1.8 Materializer"
          git config user.email "contact@crownthrive.com"
          git add .cos18-bootstrap/archive-diagnostic.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Diagnostic is unchanged."
            exit 0
          fi
          git commit -m "chore(cos): record deterministic COS 1.8 payload diagnostic"
          git push origin HEAD:"governance/cos-1.8-pentagovernance-ratification-20260904"
