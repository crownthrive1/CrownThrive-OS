name: Penta Runner Fabric Certification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: penta-runner-fabric-certification
  cancel-in-progress: false

jobs:
  certify-pentafabric-rtc:
    # SECURITY: this repository is public. This privileged self-hosted lane is
    # workflow_dispatch-only, exact-main only, and carries no provider secrets.
    # Never add pull_request or production provider operations here.
    if: github.repository == 'crownthrive1/CrownThrive-OS' && github.repository_id == '1336348391' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, crownthrive, pentafabric, rtc, trusted, provider, pentamail]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate runner prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          command -v python3
          command -v git
          command -v curl
          command -v sha256sum
          command -v sort
          python3 --version
          git --version
          runner_root="$(dirname "$(dirname "$RUNNER_TEMP")")"
          runner_version="$($runner_root/bin/Runner.Listener --version)"
          minimum_version='2.327.1'
          if [[ "$(printf '%s\n%s\n' "$minimum_version" "$runner_version" | sort -V | head -n1)" != "$minimum_version" ]]; then
            echo "ERROR: Actions runner $runner_version is below governed minimum $minimum_version" >&2
            exit 1
          fi
          echo "PENTA_ACTIONS_RUNNER_VERSION=$runner_version" >> "$GITHUB_ENV"

      - name: Build runner certification evidence
        shell: bash
        env:
          PENTA_RUNNER_NAME: ${{ runner.name }}
          PENTA_RUNNER_OS: ${{ runner.os }}
          PENTA_RUNNER_ARCH: ${{ runner.arch }}
          PENTA_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          def command_version(*argv):
              return subprocess.check_output(argv, text=True).strip()

          evidence = {
              "schema": "crownthrive.pentafabric.runner-certification.v1",
              "disposition": "HOLD",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "repository_id": os.environ["GITHUB_REPOSITORY_ID"],
              "commit_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "policy_state": "self_hosted_blocked_until_node24_runner_attestation_is_machine_verified",
              "runner": {
                  "name": os.environ.get("PENTA_RUNNER_NAME"),
                  "os": os.environ.get("PENTA_RUNNER_OS"),
                  "arch": os.environ.get("PENTA_RUNNER_ARCH"),
                  "environment": os.environ.get("PENTA_RUNNER_ENVIRONMENT"),
                  "hostname": platform.node(),
                  "python": command_version("python3", "--version"),
                  "git": command_version("git", "--version"),
                  "actions_runner_version": os.environ["PENTA_ACTIONS_RUNNER_VERSION"],
              },
              "trust_contract": {
                  "labels_required": [
                      "self-hosted", "linux", "x64", "crownthrive",
                      "pentafabric", "rtc", "trusted", "provider", "pentamail"
                  ],
                  "public_pr_execution_allowed": False,
                  "provider_execution_class": "hold_unverified",
                  "observed_runner_matches_required_labels": False,
              },
              "observed_at": datetime.now(timezone.utc).isoformat(),
          }
          payload = json.dumps(evidence, indent=2, sort_keys=True) + "\n"
          Path("penta-runner-fabric-certification.json").write_text(payload)
          digest = hashlib.sha256(payload.encode()).hexdigest()
          Path("penta-runner-fabric-certification.sha256").write_text(
              digest + "  penta-runner-fabric-certification.json\n"
          )
          print(payload)
          print("sha256=" + digest)
          PY

      - name: Upload certification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: penta-runner-fabric-certification-${{ github.run_id }}
          path: |
            penta-runner-fabric-certification.json
            penta-runner-fabric-certification.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish runner certification summary
        shell: bash
        run: |
          {
            echo '## Penta Runner Fabric Certification — HOLD'
            echo
            echo 'Runner: `${{ runner.name }}`'
            echo 'OS/arch: `${{ runner.os }}/${{ runner.arch }}`'
            echo 'Commit: `${{ github.sha }}`'
            echo 'Evidence: `penta-runner-fabric-certification.json`'
            echo 'State: self-hosted runner certification remains blocked pending machine-verified Node 24 attestation.'
          } >> "$GITHUB_STEP_SUMMARY"
