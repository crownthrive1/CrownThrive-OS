name: PentaPM Governance

on:
  push:
    branches: [main]
    paths:
      - "config/penta_pm_policy.json"
      - "config/penta_credential_bindings.json"
      - "scripts/penta_pm_reconcile.py"
      - ".github/workflows/penta-pm-governance.yml"
      - "tests/test_penta_pm_reconcile.py"
  pull_request:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, ready_for_review]
    paths:
      - "config/penta_pm_policy.json"
      - "config/penta_credential_bindings.json"
      - "scripts/penta_pm_reconcile.py"
      - ".github/workflows/penta-pm-governance.yml"
      - "tests/test_penta_pm_reconcile.py"
  issues:
    types: [opened, reopened, edited, labeled, unlabeled]
  release:
    types: [published, edited]
  repository_dispatch:
    types: [penta-pm-reconcile]
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply provider reconciliation"
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  issues: write
  pull-requests: write
  repository-projects: write

concurrency:
  group: penta-pm-${{ github.repository }}
  cancel-in-progress: false

jobs:
  reconcile:
    name: PentaPM reconcile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PENTA_PM_GITHUB_TOKEN: ${{ secrets.PENTA_PM_GITHUB_TOKEN || secrets.PENTA || github.token }}
      GH_TOKEN: ${{ secrets.PENTA_PM_GITHUB_TOKEN || secrets.PENTA || github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Validate PentaPM policy and unit tests
        run: |
          python -m json.tool config/penta_pm_policy.json >/dev/null
          python -m json.tool config/penta_credential_bindings.json >/dev/null
          python -m unittest tests.test_penta_pm_reconcile -v

      - name: Determine reconciliation mode
        id: mode
        shell: bash
        run: |
          APPLY=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.apply }}" == "true" ]]; then APPLY=true; fi
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "repository_dispatch" || "${{ github.event_name }}" == "push" ]]; then APPLY=true; fi
          echo "apply=$APPLY" >> "$GITHUB_OUTPUT"

      - name: Reconcile GitHub Projects, milestones and Development state
        if: github.event_name != 'pull_request'
        run: |
          if [[ "${{ steps.mode.outputs.apply }}" == "true" ]]; then
            python scripts/penta_pm_reconcile.py --repo "${GITHUB_REPOSITORY}" --apply
          else
            python scripts/penta_pm_reconcile.py --repo "${GITHUB_REPOSITORY}"
          fi

      - name: Emit PR-local PentaPM validation receipt
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p artifacts/penta-pm
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          receipt = {
              "schema": "crownthrive.penta.pm-local-validation.v1",
              "status": "PASS",
              "mode": "PR_LOCAL_NO_PROVIDER_CALLS",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit": os.environ["GITHUB_SHA"],
              "policy_validation": "PASS",
              "unit_tests": "PASS",
              "provider_mutation": "NONE",
              "provider_read": "NONE"
          }
          encoded = json.dumps(receipt, sort_keys=True, separators=(",", ":")).encode()
          receipt["receipt_sha256"] = hashlib.sha256(encoded).hexdigest()
          Path("artifacts/penta-pm/latest.json").write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          PY

      - name: Upload immutable-style PentaPM receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: penta-pm-receipt-${{ github.run_id }}
          path: artifacts/penta-pm/latest.json
          if-no-files-found: warn
          retention-days: 90

  gate:
    name: PentaPM governed metadata gate
    if: github.event_name == 'pull_request'
    needs: reconcile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Validate governed PentaPM contracts without provider calls
        run: |
          python -m json.tool config/penta_pm_policy.json >/dev/null
          python -m json.tool config/penta_credential_bindings.json >/dev/null
          python -m unittest tests.test_penta_pm_reconcile -v
