name: PentaPM Governance

on:
  push:
    branches: [main]
    paths:
      - "config/penta_pm_policy.json"
      - "config/penta_credential_bindings.json"
      - "scripts/penta_pm_reconcile.py"
      - ".github/workflows/penta-pm-governance.yml"
      - "tests/test_penta_pm_reconcile.py"
  pull_request:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, ready_for_review]
  issues:
    types: [opened, reopened, edited, labeled, unlabeled]
  release:
    types: [published, edited]
  repository_dispatch:
    types: [penta-pm-reconcile]
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply provider reconciliation"
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: penta-pm-${{ github.repository }}
  cancel-in-progress: false

jobs:
  reconcile:
    name: PentaPM reconcile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write
      repository-projects: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Validate PentaPM policy and unit tests
        run: |
          set -euo pipefail
          python -m json.tool config/penta_pm_policy.json >/dev/null
          python -m json.tool config/penta_credential_bindings.json >/dev/null
          python -m unittest tests.test_penta_pm_reconcile -v

      - name: Determine reconciliation mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          APPLY=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.apply }}" == "true" ]]; then APPLY=true; fi
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "repository_dispatch" || "${{ github.event_name }}" == "push" ]]; then APPLY=true; fi
          echo "apply=$APPLY" >> "$GITHUB_OUTPUT"
          echo "Provider mutation on pull_request/issues/release events: false" >> "$GITHUB_STEP_SUMMARY"

      - name: Reconcile trusted provider state
        if: steps.mode.outputs.apply == 'true'
        env:
          PENTA_PM_GITHUB_TOKEN: ${{ secrets.PENTA_PM_GITHUB_TOKEN || secrets.PENTA || github.token }}
          GH_TOKEN: ${{ secrets.PENTA_PM_GITHUB_TOKEN || secrets.PENTA || github.token }}
        run: |
          set -euo pipefail
          python scripts/penta_pm_reconcile.py --repo "${GITHUB_REPOSITORY}" --apply

      - name: Emit provider-independent PR/event validation receipt
        if: steps.mode.outputs.apply != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/penta-pm
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          policy=json.loads(Path('config/penta_pm_policy.json').read_text(encoding='utf-8'))
          credentials=json.loads(Path('config/penta_credential_bindings.json').read_text(encoding='utf-8'))
          receipt={
            'schema':'ct.penta.pm.pr-safe-validation.v1',
            'state':'PASS_PR_SAFE_SOURCE_VALIDATION',
            'repository':os.environ['GITHUB_REPOSITORY'],
            'sha':os.environ['GITHUB_SHA'],
            'event':os.environ['GITHUB_EVENT_NAME'],
            'provider_readback':'DEFERRED_TO_TRUSTED_AUTONOMOUS_LANE',
            'provider_mutation':False,
            'provider_api_called':False,
            'policy_sha256':hashlib.sha256(json.dumps(policy,sort_keys=True,separators=(',',':')).encode()).hexdigest(),
            'credential_contract_sha256':hashlib.sha256(json.dumps(credentials,sort_keys=True,separators=(',',':')).encode()).hexdigest(),
            'money_movement':False,
            'checkout_activation':False,
          }
          receipt['receipt_sha256']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          Path('artifacts/penta-pm/latest.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(receipt,sort_keys=True))
          PY

      - name: Upload immutable-style PentaPM receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: penta-pm-receipt-${{ github.run_id }}
          path: artifacts/penta-pm/latest.json
          if-no-files-found: error
          retention-days: 90

  gate:
    name: PentaPM governed metadata gate
    if: github.event_name == 'pull_request'
    needs: reconcile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Verify source contract without provider calls
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool config/penta_pm_policy.json >/dev/null
          python -m json.tool config/penta_credential_bindings.json >/dev/null
          python -m unittest tests.test_penta_pm_reconcile -v
          echo 'PentaPM PR gate PASS: provider API/readback is intentionally deferred to the trusted autonomous main/schedule lane.' >> "$GITHUB_STEP_SUMMARY"
