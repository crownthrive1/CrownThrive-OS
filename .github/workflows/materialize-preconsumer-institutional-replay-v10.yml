name: Materialize Preconsumer Institutional Replay Supplement v10

on:
  push:
    branches:
      - 'repair/chlom-framework-package-custody-v8-20260904'
    paths:
      - 'supabase/migration_lineage/provider_custody/20260820003352/**'
      - 'scripts/materialize_preconsumer_institutional_replay_v10.py'
      - '.github/workflows/materialize-preconsumer-institutional-replay-v10.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-preconsumer-institutional-replay-v10-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    name: Assemble and verify replay supplement plus exact provider body
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check out exact repair head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize deterministic combined migration
        run: python3 scripts/materialize_preconsumer_institutional_replay_v10.py

      - name: Reject patch and whitespace corruption
        run: git diff --check

      - name: Verify provider body remains exact suffix
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          target = Path('supabase/migrations/20260820003352_preserve_future_credential_pending_state.sql').read_bytes()
          provider = Path('supabase/migration_lineage/provider_custody/20260820003352/provider.sqlpart').read_bytes()
          if len(provider) != 2803:
              raise SystemExit('HOLD_PROVIDER_COMPONENT_BYTE_MISMATCH')
          if hashlib.sha256(provider).hexdigest() != 'd774bd53a6114267fc6bbc1270b773acdc8050ea041be0341be605fe5a4d0c3b':
              raise SystemExit('HOLD_PROVIDER_COMPONENT_SHA_MISMATCH')
          if not target.endswith(provider):
              raise SystemExit('HOLD_PROVIDER_BODY_NOT_EXACT_SUFFIX')
          matches = sorted(p.name for p in Path('supabase/migrations').glob('20260820003352_*.sql'))
          if matches != ['20260820003352_preserve_future_credential_pending_state.sql']:
              raise SystemExit(f'HOLD_PROVIDER_VERSION_NOT_UNIQUE: {matches}')
          print('PASS_PRECONSUMER_REPLAY_SUPPLEMENT')
          PY

      - name: Commit materialized replay source without force
        run: |
          if git diff --quiet --exit-code; then
            echo 'Preconsumer replay supplement already materialized.'
            exit 0
          fi
          git config user.name 'crownthrive-custody[bot]'
          git config user.email 'crownthrive-custody[bot]@users.noreply.github.com'
          git add -A \
            supabase/migrations/20260820003352_preserve_future_credential_pending_state.sql \
            supabase/migrations/20260820003352_remote_applied_lineage.sql \
            supabase/migration_lineage/replay_diagnostics/20260904_preconsumer_institutional_replay_supplement_v10.json
          git commit -m 'fix(supabase): materialize preconsumer institutional replay supplement'
          git push origin "HEAD:${GITHUB_REF_NAME}"
