name: PentaPMProviderConvergence — Provider Repair

on:
  push:
    branches:
      - repair/supabase-migration-lineage-20260827
    paths:
      - ".github/workflows/penta-pm-provider-convergence.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write
  repository-projects: write

concurrency:
  group: pentapm-provider-convergence-${{ github.repository }}
  cancel-in-progress: false

jobs:
  converge:
    name: Apply PentaPM provider convergence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PENTA_PM_GITHUB_TOKEN: ${{ secrets.PENTA_PM_GITHUB_TOKEN || secrets.PENTA || github.token }}
      GH_TOKEN: ${{ secrets.PENTA_PM_GITHUB_TOKEN || secrets.PENTA || github.token }}
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Validate PentaPM before provider write
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool config/penta_pm_policy.json >/dev/null
          python -m json.tool config/penta_credential_bindings.json >/dev/null
          python -m unittest tests.test_penta_pm_reconcile -v

      - name: Apply canonical project, fields, milestones and artifact bindings
        shell: bash
        run: |
          set -euo pipefail
          python scripts/penta_pm_reconcile.py --repo "${GITHUB_REPOSITORY}" --apply

      - name: Upload provider convergence receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pentapm-provider-convergence-${{ github.run_id }}
          path: artifacts/penta-pm/latest.json
          if-no-files-found: error
          retention-days: 90
