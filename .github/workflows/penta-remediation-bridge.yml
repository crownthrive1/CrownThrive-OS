name: Penta Remediation Bridge

on:
  pull_request:
    paths:
      - 'runtime/penta_hold_remediation.py'
      - 'scripts/penta_remediation_bridge.py'
      - 'tests/test_penta_hold_remediation.py'
      - 'tests/test_penta_remediation_bridge.py'
      - '.github/workflows/penta-remediation-bridge.yml'
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft]
  schedule:
    - cron: '12,32,52 * * * *'
  workflow_dispatch:
    inputs:
      number:
        description: Optional pull request number; blank performs an open-PR sweep
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  statuses: read
  actions: write

concurrency:
  group: penta-remediation-${{ github.repository }}-${{ github.event.pull_request.number || github.event.inputs.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  contract:
    name: Validate remediation safety contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Compile bridge
        run: |
          python -m py_compile runtime/penta_hold_remediation.py scripts/penta_remediation_bridge.py

      - name: Run focused remediation suite
        run: |
          python -m pytest -q tests/test_penta_hold_remediation.py tests/test_penta_remediation_bridge.py

      - name: Assert authority boundary remains fail-closed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text = Path('scripts/penta_remediation_bridge.py').read_text()
          forbidden = [
              '/merge"',
              'draft": False',
              'conclusion": "success"',
              'merge_authority_granted": True',
          ]
          hits = [token for token in forbidden if token in text]
          if hits:
              raise SystemExit(f'forbidden terminal-authority mutation in remediation bridge: {hits}')
          print('remediation authority boundary PASS')
          PY

  remediate:
    name: Route and execute bounded remediation
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted canonical control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Execute PentaCrawler → PentaFlows → PentaHelper bridge
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          REQUESTED_NUMBER: ${{ github.event.inputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from scripts.penta_remediation_bridge import GH, remediate

          gh = GH(os.environ['GITHUB_REPOSITORY'])
          explicit = (os.environ.get('EVENT_PR_NUMBER') or os.environ.get('REQUESTED_NUMBER') or '').strip()
          if explicit:
              numbers = [int(explicit)]
          else:
              pulls = gh.paginate(f"/repos/{gh.repo}/pulls?state=open&per_page=100&sort=updated&direction=asc")
              numbers = [int(pull['number']) for pull in pulls]

          results = []
          failures = []
          for number in numbers:
              try:
                  results.append({'number': number, 'result': remediate(gh, number)})
              except Exception as exc:
                  failures.append({'number': number, 'error': str(exc)[:2000]})

          report = {'schema': 'ct.penta.remediation-sweep.20260827.v1', 'results': results, 'failures': failures}
          path = os.path.join(os.environ['RUNNER_TEMP'], 'penta-remediation-sweep.json')
          with open(path, 'w', encoding='utf-8') as handle:
              json.dump(report, handle, indent=2, sort_keys=True)
              handle.write('\n')
          print(json.dumps(report, indent=2, sort_keys=True))
          if failures:
              raise SystemExit(1)
          PY

      - name: Publish causal remediation summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Penta Remediation Bridge'
            echo
            echo '- Detection: PentaCrawler exact-head check readback'
            echo '- Routing: PentaFlows multi-domain fan-out'
            echo '- Execution: PentaHelper bounded recipes only'
            echo '- Durable state: hash-chained causal projection on each PR'
            echo '- Terminal authority: retained by PentaPR/PentaMerge/PentaCloser'
            echo
            if [[ -f "$RUNNER_TEMP/penta-remediation-sweep.json" ]]; then
              echo '```json'
              cat "$RUNNER_TEMP/penta-remediation-sweep.json"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
