name: Penta Wave 3 ECT Mainline Production

on:
  push:
    branches: [penta-production-promotion-wave3-restack-20260826-v2]
    paths: [".github/workflows/penta-wave3-ect-mainline.yml"]

permissions:
  contents: write

concurrency:
  group: penta-wave3-ect-mainline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ect-mainline-production:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Wave 3 history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: penta-production-promotion-wave3-restack-20260826-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install deterministic validators
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0

      - name: Harden transformer and restack onto exact current main
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/penta_wave3_mainline_integrate.py")
          text = path.read_text(encoding="utf-8")
          old = '''    if 'member_snapshot[key]["maturity_promotion"]' not in text:
                  lines = text.splitlines()
                  output: list[str] = []
                  inside_member = False
                  inserted = False
                  for line in lines:
                      output.append(line)
                      if line == "        member_snapshot[key] = {":
                          inside_member = True
                          continue
                      if inside_member and line == "        }":
                          output.append("        if key in promotions:")
                          output.append('            member_snapshot[key]["maturity_promotion"] = promotions[key]')
                          inside_member = False
                          inserted = True
                  if not inserted:
                      raise IntegrationError("penta_family member promotion projection insertion failed")
                  text = "\\n".join(output) + "\\n"
          '''
          new = '''    if 'member_snapshot[key]["maturity_promotion"]' not in text:
                  marker = '    return {\\n        "family_registry_id":'
                  replacement = (
                      '    for key, promotion in promotions.items():\\n'
                      '        member_snapshot[key]["maturity_promotion"] = promotion\\n\\n'
                      '    return {\\n'
                      '        "family_registry_id":'
                  )
                  if marker not in text:
                      raise IntegrationError("penta_family promotion projection return marker missing")
                  text = text.replace(marker, replacement, 1)
          '''
          if old not in text:
              raise SystemExit("fragile promotion-projection block was not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          cp scripts/penta_wave3_mainline_integrate.py /tmp/penta_wave3_mainline_integrate.py
          chmod +x /tmp/penta_wave3_mainline_integrate.py
          git restore --source=HEAD --worktree scripts/penta_wave3_mainline_integrate.py
          git fetch origin main
          echo "MAIN_SHA=$(git rev-parse origin/main)" >> "$GITHUB_ENV"
          git checkout -B penta-wave3-ect-integration origin/main
          git clean -fdx

      - name: Integrate Wave 3 and reconcile production semantics
        env:
          OLD_HEAD: "105460c828e8baf0d034d43689b278b47d2f9833"
        run: |
          python /tmp/penta_wave3_mainline_integrate.py
          python - <<'PY'
          import json
          from pathlib import Path

          family_path = Path("tests/test_penta_family.py")
          family = family_path.read_text(encoding="utf-8")
          for key in ("penta.mail", "penta.status", "penta.credentials", "penta.build", "penta.certify"):
              needle = f'        "{key}",\n'
              index = family.find(needle)
              if index < 0:
                  raise SystemExit(f"stale held-member entry not found: {key}")
              family = family[:index] + family[index + len(needle):]
          for old, new in {
              '    assert mail["sections"]["status"]["member_maturity"] == "specified"':
                  '    assert mail["sections"]["status"]["member_maturity"] == "production"',
              '    assert mail["sections"]["status"]["execution_eligible"] is False':
                  '    assert mail["sections"]["status"]["execution_eligible"] is True',
          }.items():
              if old in family:
                  family = family.replace(old, new, 1)
              elif new not in family:
                  raise SystemExit(f"promotion assertion not found: {old}")
          family_path.write_text(family, encoding="utf-8")

          exec_path = Path("tests/test_penta_exec.py")
          executable = exec_path.read_text(encoding="utf-8")
          for old, new in {
              '    assert context["details"]["result"]["state"] == "PRODUCTION_CONTRACT_PRESENT"':
                  '    assert context["details"]["result"]["effective_maturity"] == "production"',
              '    assert context["details"]["result"]["missing_refs"] == []':
                  '    assert context["details"]["result"]["runtime_present"] is True and context["details"]["result"]["contract_tests_present"] is True and context["details"]["result"]["ci_present"] is True and context["details"]["result"]["edge_runtime_present"] is True and context["details"]["result"]["documentation_evidence_present"] is True',
              '    assert context["details"]["result"]["secret_values_returned"] is False':
                  '    assert context["details"]["result"]["provider_call_performed"] is False and context["details"]["result"]["credential_material_accessed"] is False and context["details"]["result"]["authority_expanded"] is False',
          }.items():
              if old in executable:
                  executable = executable.replace(old, new, 1)
              elif new not in executable:
                  raise SystemExit(f"context assertion not found: {old}")
          exec_path.write_text(executable, encoding="utf-8")

          context_path = Path("data/penta/systems.extensions.context.json")
          context_catalog = json.loads(context_path.read_text(encoding="utf-8"))
          context_systems = context_catalog.get("systems")
          if not isinstance(context_systems, list) or len(context_systems) != 1:
              raise SystemExit("PentaContext catalog must contain exactly one system")
          context_systems[0]["axis"] = "truth"
          context_systems[0]["purpose"] = "Provide scoped, provenance-aware, redacted operational-memory and bounded context retrieval across approved CrownThrive systems without manufacturing permissions or execution authority."
          context_path.write_text(json.dumps(context_catalog, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          builder_path = Path("scripts/build_penta_os_v1.py")
          builder = builder_path.read_text(encoding="utf-8")
          old_axis = '        axis=infer_axis(machine_key, canonical_name, str(item.get("category", "")), purpose),'
          new_axis = '        axis=str(item.get("axis") or infer_axis(machine_key, canonical_name, str(item.get("category", "")), purpose)),'
          current_axis = '            "axis": row.get("axis") or infer_axis(row.get("canonical_name", ""), row.get("purpose", "")),'
          if old_axis in builder:
              builder = builder.replace(old_axis, new_axis, 1)
          elif new_axis not in builder and current_axis not in builder:
              raise SystemExit("PentaOS explicit-axis precedence insertion point missing")
          merge_marker = '            current["risk_ceiling"] = incoming.get("risk_ceiling", current["risk_ceiling"])\n'
          merge_axis = '            current["axis"] = incoming.get("axis", current["axis"])\n'
          if merge_axis not in builder:
              if merge_marker not in builder:
                  raise SystemExit("PentaOS production-family merge precedence marker missing")
              builder = builder.replace(merge_marker, merge_marker + merge_axis, 1)
          builder_path.write_text(builder, encoding="utf-8")
          PY

      - name: Regenerate PentaOS and synchronize exact golden census
        run: |
          set -euo pipefail
          python scripts/build_penta_os_v1.py --write
          python - <<'PY'
          import json
          from pathlib import Path
          import re

          registry = json.loads(Path("data/penta/os-v1.registry.json").read_text(encoding="utf-8"))
          counts = registry["counts"]
          graph = registry["dependency_graph"]
          context = next(row for row in registry["systems"] if row["machine_key"] == "penta.context")
          if (context["axis"], context["maturity"], context["risk_ceiling"]) != ("truth", "production", "D2"):
              raise SystemExit(f"PentaContext semantic projection is invalid: {context}")
          expected_dependencies = {"penta.docs", "penta.route", "penta.credentials", "penta.status"}
          if set(context.get("dependencies") or []) != expected_dependencies:
              raise SystemExit(f"PentaContext dependency projection is invalid: {context.get('dependencies')}")
          if "operational-memory" not in context.get("role", ""):
              raise SystemExit("PentaContext role lost operational-memory semantics")

          path = Path("tests/test_penta_os_v1.py")
          text = path.read_text(encoding="utf-8")

          def replace_once(pattern: str, replacement: str, label: str) -> None:
              global text
              updated, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f"unable to synchronize PentaOS golden value: {label}")
              text = updated

          replace_once(
              r'self\.assertEqual\(self\.registry\["counts"\]\["execution_eligible_by_registry"\], \d+\)',
              f'self.assertEqual(self.registry["counts"]["execution_eligible_by_registry"], {counts["execution_eligible_by_registry"]})',
              "execution_eligible_by_registry",
          )
          for maturity in ("implemented", "production", "specified"):
              replace_once(
                  rf'            "{maturity}": \d+,',
                  f'            "{maturity}": {counts["by_maturity"][maturity]},',
                  f"by_maturity.{maturity}",
              )
          for field in (
              "dependency_assessed_members",
              "dependency_unassessed_members",
              "members_with_declared_edges",
              "penta_dependency_edges",
              "external_dependency_edges",
              "unresolved_penta_dependencies",
          ):
              replace_once(
                  rf'self\.assertEqual\(counts\["{field}"\], \d+\)',
                  f'self.assertEqual(counts["{field}"], {counts[field]})',
                  field,
              )
          for field in (
              "cyclic_scc_count",
              "cyclic_member_count",
              "cyclic_internal_edge_count",
              "condensed_component_count",
              "condensed_edge_count",
              "transitive_membership_count",
              "maximum_transitive_closure",
          ):
              replace_once(
                  rf'self\.assertEqual\(graph\["{field}"\], \d+\)',
                  f'self.assertEqual(graph["{field}"], {graph[field]})',
                  field,
              )
          partition = graph["readiness_partition"]
          for state in (
              "HOLD_DEPENDENCY_INVENTORY_UNASSESSED",
              "HOLD_EXTERNAL_DEPENDENCY_UNBOUND",
              "HOLD_UNCLASSIFIED_DEPENDENCY_CYCLE",
              "HOLD_MEMBER_MATURITY",
              "HOLD_DEPENDENCY_MATURITY",
              "READY",
          ):
              replace_once(
                  rf'            "{state}": \d+,',
                  f'            "{state}": {partition[state]},',
                  f"readiness_partition.{state}",
              )
          replace_once(
              r'\("truth", "(?:implemented|production)", "D2"\)',
              '("truth", "production", "D2")',
              "penta.context identity semantics",
          )
          path.write_text(text, encoding="utf-8")
          print(json.dumps({
              "execution_eligible_by_registry": counts["execution_eligible_by_registry"],
              "by_maturity": counts["by_maturity"],
              "penta_dependency_edges": counts["penta_dependency_edges"],
              "readiness_partition": partition,
              "context": {
                  "axis": context["axis"],
                  "maturity": context["maturity"],
                  "dependencies": context["dependencies"],
              },
          }, indent=2, sort_keys=True))
          PY
          python scripts/pentadocs_quality.py --apply
          python scripts/build_penta_os_v1.py --check
          python scripts/pentadocs_quality.py --check

      - name: Compile and validate canonical projections
        run: |
          set -euo pipefail
          python -m py_compile \
            runtime/penta_family.py runtime/penta_exec.py runtime/penta_interop.py \
            runtime/penta_runtime_suite.py runtime/penta_wave3_operations.py \
            runtime/penta_context.py runtime/penta_evi_builder.py runtime/penta_immune.py \
            runtime/penta_os_v1.py runtime/penta-provider-control-plane/penta_control_plane.py \
            scripts/build_penta_os_v1.py scripts/package_penta_os_v1.py
          for file in data/penta/family.registry.json data/penta/execution-adapters.registry.json \
            data/penta/member-runtime.contract.json data/penta/production-promotions.v1.json \
            data/penta/systems.extensions.context.json penta/registry/penta-families.v1.json; do
            python -m json.tool "$file" >/dev/null
          done
          python scripts/validate_penta_provider_control_plane.py
          python scripts/validate_supabase_production_convergence_state.py
          python scripts/validate_docs.py
          python runtime/penta_families.py --root . --portal-index > /tmp/penta-families.json
          python runtime/penta_exec.py --root . validate > /tmp/penta-exec-validation.json
          python runtime/penta_runtime_suite.py --root . --output /tmp/penta-runtime-suite.json
          python runtime/penta_interop.py --root . --certify --output /tmp/penta-interoperability.json
          python runtime/penta_os_v1.py --root . validate

      - name: Run complete ECT regression and negative-safety cohort
        run: |
          set -euo pipefail
          python tests/test_penta_family.py
          python tests/test_penta_exec.py
          python -m unittest -v tests.test_penta_runtime_suite
          python -m unittest -v tests.test_penta_interop
          python -m unittest -v tests.test_penta_observability
          python -m unittest -v tests.test_penta_context
          python -m unittest -v tests.test_penta_evi_builder tests.test_penta_immune
          python -m unittest -v tests.test_penta_os_v1
          python -m unittest discover -s tests -p 'test_penta_mail.py' -v
          python -m unittest discover -s tests -p 'test_penta_institutional_services.py' -v
          python -m unittest discover -s tests -p 'test_penta_institutional_controls.py' -v
          python scripts/run_function_tests.py tests/test_penta_compliance_license.py tests/test_penta_self_build.py

      - name: Verify reproducible PentaOS package
        run: |
          set -euo pipefail
          python scripts/package_penta_os_v1.py --output dist/penta-os-v1/build-a --source-revision "$MAIN_SHA"
          python scripts/package_penta_os_v1.py --output dist/penta-os-v1/build-b --source-revision "$MAIN_SHA"
          python scripts/package_penta_os_v1.py --output dist/penta-os-v1/build-a --verify \
            --compare-output dist/penta-os-v1/build-b > /tmp/penta-os-package-verification.json
          (cd dist/penta-os-v1/build-a && sha256sum -c penta-os-v1-1.5.0.sha256)

      - name: Seal exact ECT evidence and remove generated artifacts
        env:
          ECT_RUN_ID: ${{ github.run_id }}
          ECT_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path
          import sys

          root = Path('.')
          spec = importlib.util.spec_from_file_location('penta_family_ect', root / 'runtime/penta_family.py')
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          _, snapshot = module.load_family(root)
          adapters = json.loads((root / 'data/penta/execution-adapters.registry.json').read_text())
          runtime_suite = json.loads(Path('/tmp/penta-runtime-suite.json').read_text())
          interop = json.loads(Path('/tmp/penta-interoperability.json').read_text())
          receipt = {
              'schema': 'ct.penta.ect.v1',
              'ect_id': 'ct.penta.ect.production-promotion-wave3.20260827',
              'canonical_name': 'Execution Certification and Testing',
              'repository': 'crownthrive1/CrownThrive-OS',
              'pull_request': 552,
              'base_main_sha': os.environ['MAIN_SHA'],
              'workflow_run_id': int(os.environ['ECT_RUN_ID']),
              'workflow_run_attempt': int(os.environ['ECT_RUN_ATTEMPT']),
              'status': 'PASS_EXACT_MAINLINE_CANDIDATE',
              'runtime_version': '1.4.0',
              'registered_penta_members': snapshot['member_count'],
              'execution_eligible_members': len(snapshot['execution_eligible_members']),
              'promotion_count': snapshot.get('promotion_count', 0),
              'promoted_members': snapshot.get('promoted_members', []),
              'bounded_executable_adapters': len(adapters['adapters']),
              'provider_effect_adapters': sum(1 for row in adapters['adapters'] if row.get('provider_effect')),
              'interoperability_status': interop.get('status'),
              'interoperability_blockers': interop.get('blocker_count'),
              'runtime_suite_schema': runtime_suite.get('schema'),
              'invariants': {
                  'authority_expanded': False,
                  'd3_automatic_authority': False,
                  'provider_write_performed_by_local_adapters': False,
                  'production_promotion_automatic': False,
                  'penta_evi_builder_self_certification': False,
                  'penta_immune_autonomous_repair_execution': False,
                  'secret_values_returned': False,
                  'fail_closed': True,
              },
          }
          path = root / 'evidence/penta/penta-wave3-ect-20260827.json'
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          assert receipt['promotion_count'] == 5
          assert receipt['bounded_executable_adapters'] == receipt['execution_eligible_members']
          assert receipt['provider_effect_adapters'] == 0
          assert receipt['interoperability_status'] == 'PASS'
          assert receipt['interoperability_blockers'] == 0
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          rm -rf .pytest_cache .mypy_cache .ruff_cache dist

      - name: Commit certified candidate and force-restack PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "crownthrive1"
          git config user.email "jones.usmc.kj@gmail.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No integrated production delta generated."
            exit 1
          fi
          git commit -m "feat(ect): integrate Wave 3 into PentaOS V1.5 production"
          CANDIDATE_SHA=$(git rev-parse HEAD)
          python - <<PY
          import json
          from pathlib import Path
          path = Path('evidence/penta/penta-wave3-ect-20260827.json')
          data = json.loads(path.read_text())
          data['candidate_sha'] = '$CANDIDATE_SHA'
          data['candidate_binding'] = 'The containing amended commit binds this exact ECT candidate.'
          path.write_text(json.dumps(data, indent=2, sort_keys=True) + '\n')
          PY
          git add evidence/penta/penta-wave3-ect-20260827.json
          git commit --amend --no-edit
          FINAL_SHA=$(git rev-parse HEAD)
          git diff --check HEAD^
          git push --force-with-lease origin "HEAD:penta-production-promotion-wave3-restack-20260826-v2"
          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"

      - name: Publish ECT summary
        run: |
          {
            echo '## Penta Wave 3 ECT Mainline Production'
            echo
            echo "- Current main base: $MAIN_SHA"
            echo "- Exact certified candidate: $FINAL_SHA"
            echo '- ECT: PASS'
            echo '- Promotion model: explicit evidence-bound; no automatic authority'
            echo '- Provider-effect adapters: 0'
          } >> "$GITHUB_STEP_SUMMARY"
