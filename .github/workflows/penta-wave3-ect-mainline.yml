name: Penta Wave 3 ECT Mainline Production

on:
  push:
    branches: [penta-production-promotion-wave3-restack-20260826-v2]
    paths:
      - ".github/workflows/penta-wave3-ect-mainline.yml"
      - "scripts/penta_wave3_ect_pipeline.py"

permissions:
  contents: write

concurrency:
  group: penta-wave3-ect-mainline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ect-mainline-production:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Wave 3 history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: penta-production-promotion-wave3-restack-20260826-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install deterministic validators
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0

      - name: Preserve ECT software and restack onto exact current main
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/penta_wave3_ect_pipeline.py")
          text = path.read_text(encoding="utf-8")

          old_checksum = '    run(["sha256sum", "-c", "penta-os-v1-1.5.0.sha256"], env={"PWD": str(ROOT / build_a)})'
          new_checksum = '    subprocess.run(["sha256sum", "-c", "penta-os-v1-1.5.0.sha256"], cwd=ROOT / build_a, check=True)'
          if old_checksum in text:
              text = text.replace(old_checksum, new_checksum, 1)
          elif new_checksum not in text:
              raise SystemExit("package checksum cwd repair target missing")

          replacement_lines = [
              '    production_dependencies = (',
              '        \'            current["dependency_assessed"] = incoming.get("dependency_assessed") is True\\n\'',
              '        \'            current["dependencies"] = sorted(set(incoming.get("dependencies", [])))\\n\'',
              '    )',
              '    dependency_probe = \'current["dependency_assessed"] = incoming.get("dependency_assessed") is True\'',
              '    if dependency_probe not in builder:',
              '        if incoming_axis not in builder:',
              '            raise PipelineError("PentaOS production-family axis insertion missing")',
              '        builder = builder.replace(incoming_axis, incoming_axis + production_dependencies, 1)',
              '',
              '    institutional_old = (',
              '        \'        elif incoming.get("source_kind") == "institutional_registry":\\n\'',
              '        \'            current["operator_route"] = incoming["operator_route"]\\n\'',
              '        \'            current["axis"] = incoming.get("axis", current["axis"])\\n\'',
              '    )',
              '    institutional_new = (',
              '        \'        elif incoming.get("source_kind") == "institutional_registry":\\n\'',
              '        \'            current["operator_route"] = incoming["operator_route"]\\n\'',
              '        \'            if "production_family_catalog" not in current["source_kinds"]:\\n\'',
              '        \'                current["axis"] = incoming.get("axis", current["axis"])\\n\'',
              '    )',
              '    if institutional_old in builder:',
              '        builder = builder.replace(institutional_old, institutional_new, 1)',
              '    elif institutional_new not in builder:',
              '        raise PipelineError("PentaOS institutional-axis guard insertion missing")',
              '',
              '    component_axis_old = \'        if incoming.get("axis") in AXES and "component_registry" in {incoming.get("source_kind"), *current["source_kinds"]} and not (\\n\'',
              '    component_axis_new = \'        if "production_family_catalog" not in current["source_kinds"] and incoming.get("axis") in AXES and "component_registry" in {incoming.get("source_kind"), *current["source_kinds"]} and not (\\n\'',
              '    if component_axis_old in builder:',
              '        builder = builder.replace(component_axis_old, component_axis_new, 1)',
              '    elif component_axis_new not in builder:',
              '        raise PipelineError("PentaOS component-axis guard insertion missing")',
              '',
          ]

          source_lines = text.splitlines()
          output = []
          skipping = False
          replaced = False
          for line in source_lines:
              if line.startswith('    post_marker = '):
                  output.extend(replacement_lines)
                  skipping = True
                  replaced = True
                  continue
              if skipping:
                  if line.strip() == 'builder = builder.replace(post_marker, post_block + post_marker, 1)':
                      skipping = False
                  continue
              output.append(line)
          if skipping or not replaced:
              raise SystemExit("obsolete grouped-merge patch block was not replaced")
          text = "\n".join(output) + "\n"
          path.write_text(text, encoding="utf-8")
          PY
          cp scripts/penta_wave3_mainline_integrate.py /tmp/penta_wave3_mainline_integrate.py
          cp scripts/penta_wave3_ect_pipeline.py /tmp/penta_wave3_ect_pipeline.py
          chmod +x /tmp/penta_wave3_mainline_integrate.py /tmp/penta_wave3_ect_pipeline.py
          git restore --source=HEAD --worktree \
            scripts/penta_wave3_mainline_integrate.py \
            scripts/penta_wave3_ect_pipeline.py
          git fetch origin main
          MAIN_SHA=$(git rev-parse origin/main)
          echo "MAIN_SHA=$MAIN_SHA" >> "$GITHUB_ENV"
          git checkout -B penta-wave3-ect-integration origin/main
          git clean -fdx

      - name: Execute complete exact-main ECT pipeline
        env:
          TRANSFORMER_PATH: /tmp/penta_wave3_mainline_integrate.py
          OLD_HEAD: "105460c828e8baf0d034d43689b278b47d2f9833"
          MAIN_SHA: ${{ env.MAIN_SHA }}
          ECT_RUN_ID: ${{ github.run_id }}
          ECT_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python /tmp/penta_wave3_ect_pipeline.py

      - name: Commit certified candidate and force-restack PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "crownthrive1"
          git config user.email "jones.usmc.kj@gmail.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No integrated production delta generated."
            exit 1
          fi
          git commit -m "feat(ect): integrate Wave 3 into PentaOS V1.5 production"
          CANDIDATE_SHA=$(git rev-parse HEAD)
          python - <<PY
          import json
          from pathlib import Path
          path = Path('evidence/penta/penta-wave3-ect-20260827.json')
          data = json.loads(path.read_text())
          data['candidate_sha'] = '$CANDIDATE_SHA'
          data['candidate_binding'] = 'The containing amended commit binds this exact ECT candidate.'
          path.write_text(json.dumps(data, indent=2, sort_keys=True) + '\n')
          PY
          git add evidence/penta/penta-wave3-ect-20260827.json
          git commit --amend --no-edit
          FINAL_SHA=$(git rev-parse HEAD)
          git diff --check HEAD^
          git push --force-with-lease origin "HEAD:penta-production-promotion-wave3-restack-20260826-v2"
          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"

      - name: Publish ECT summary
        run: |
          {
            echo '## Penta Wave 3 ECT Mainline Production'
            echo
            echo "- Current main base: $MAIN_SHA"
            echo "- Exact certified candidate: $FINAL_SHA"
            echo '- ECT: PASS'
            echo '- Promotion model: explicit evidence-bound; no automatic authority'
            echo '- Provider-effect adapters: 0'
            echo '- PentaEVIBuilder: UNVERIFIED evidence preview only'
            echo '- PentaImmune: bounded repair-plan preview only'
          } >> "$GITHUB_STEP_SUMMARY"
