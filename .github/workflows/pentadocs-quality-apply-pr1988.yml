name: PentaDocs Quality Apply — PR 1988

on:
  push:
    branches:
      - admin-mcp/app-factory-rc1-source-import-a044d93
    paths:
      - penta/evidence/pentadocs-pr1988-quality-apply.ready

permissions:
  contents: read

concurrency:
  group: pentadocs-quality-apply-pr1988
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out documentation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: admin-mcp/app-factory-rc1-source-import-a044d93
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Apply deterministic PentaDocs quality standard
        run: python scripts/pentadocs_quality.py --apply

      - name: Verify full documentation corpus
        run: |
          python scripts/penta_portal_finalize.py --check
          python scripts/penta_operational_knowledge_entrypoint.py --check
          python scripts/pentagonal_reference_suite.py --check
          python scripts/validate_docs.py
          git diff --check

      - name: Package verified migration output
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary > /tmp/pentadocs-pr1988-quality-output.patch
          tar -czf /tmp/pentadocs-pr1988-quality-output.tar.gz \
            changelog/crownthrive-app-factory-rc1-institutionalization-2026-08-30.mdx \
            pentas/app-factory-orchestration.mdx \
            platforms/app-factory \
            data/documentation/pentadocs-page-profiles.v1.json
          sha256sum \
            /tmp/pentadocs-pr1988-quality-output.patch \
            /tmp/pentadocs-pr1988-quality-output.tar.gz \
            > /tmp/pentadocs-pr1988-quality-output.sha256

      - name: Upload verified migration artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pentadocs-pr1988-quality-output
          path: |
            /tmp/pentadocs-pr1988-quality-output.patch
            /tmp/pentadocs-pr1988-quality-output.tar.gz
            /tmp/pentadocs-pr1988-quality-output.sha256
          if-no-files-found: error
          retention-days: 7
