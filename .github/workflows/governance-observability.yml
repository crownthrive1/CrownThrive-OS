name: Governance Observability

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_run:
    workflows:
      - Governed Merge Gate
      - Security Governance
      - Documentation Governance
      - Documentation Reconciliation Continuity
      - PENTA Gap Closure
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

concurrency:
  group: governance-observability-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: true

jobs:
  machine-readback:
    name: Machine exact-head governance readback
    if: github.event_name == 'pull_request_target' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out canonical observability code only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Verify observability script syntax
        run: python -m py_compile scripts/upsert_pr_governance_state.py
      - name: Upsert machine governance readback
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/upsert_pr_governance_state.py
      - name: Publish governance observability receipt
        if: always()
        shell: bash
        run: |
          {
            echo '## Governance Observability'
            echo
            if [[ -f github-observability.json ]]; then
              echo '```json'
              cat github-observability.json
              echo '```'
            else
              echo '- Receipt: **FAIL — github-observability.json missing**'
              exit 1
            fi
          } >> "$GITHUB_STEP_SUMMARY"
