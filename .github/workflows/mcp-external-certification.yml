name: MCP External Certification Security Hold

on:
  pull_request:
    paths:
      - 'contracts/mcp/**'
      - 'reference/mcp/crownthrive-api-control.v4.1.0*.ts'
      - '.github/workflows/mcp-external-certification.yml'

permissions:
  contents: read

jobs:
  public-safe-security-hold:
    name: Verify fail-closed public projection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify security hold and negative controls
        run: node contracts/mcp/test-external-certification-security-hold.mjs
      - name: Type-check public-safe fail-closed reference
        run: node --experimental-strip-types --check reference/mcp/crownthrive-api-control.v4.1.0.release.ts
      - name: Reject prohibited public projection classes
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '(SUPABASE_SERVICE_ROLE_KEY|ADMIN_EMAILS|GITHUB_CERT_REPOSITORY_ID|/functions/v1/|authorization:[[:space:]]*`Bearer|integration_control\.mcp_tools)' contracts/mcp reference/mcp/crownthrive-api-control.v4.1.0*.ts; then
            echo 'Restricted runtime or identity material remains in the current public projection.' >&2
            exit 1
          fi
      - name: Record public-safe evidence digests only
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            contracts/mcp/external-certification-plan.v1.json \
            contracts/mcp/external-certification-security-hold-reconciliation.v1.json \
            contracts/mcp/external-certification-auth-proxy.mjs \
            contracts/mcp/test-external-certification-security-hold.mjs \
            reference/mcp/crownthrive-api-control.v4.1.0.release.ts
