name: Documentation Navigation Governance

on:
  pull_request:
    paths:
      - 'docs.json'
      - 'knowledge/documentation-substantive-rebuild-wave-*.mdx'
      - 'chlom/*-reconciliation-contract.mdx'
      - 'technology/crownthrive-io-surface-machine-contract-reconciliation.mdx'
      - 'changelog/docs-freshness-sprint-6-final-94-2026-08-23.mdx'
      - 'changelog/docs-substantive-rebuild-sprint-*-wave-*.mdx'
      - 'scripts/reconcile_pre_wave6_navigation.py'
      - '.github/workflows/documentation-navigation-governance.yml'
  push:
    branches:
      - main
    paths:
      - 'docs.json'
      - 'knowledge/documentation-substantive-rebuild-wave-*.mdx'
      - 'chlom/*-reconciliation-contract.mdx'
      - 'technology/crownthrive-io-surface-machine-contract-reconciliation.mdx'
      - 'changelog/docs-freshness-sprint-6-final-94-2026-08-23.mdx'
      - 'changelog/docs-substantive-rebuild-sprint-*-wave-*.mdx'
      - 'scripts/reconcile_pre_wave6_navigation.py'
      - '.github/workflows/documentation-navigation-governance.yml'

permissions:
  contents: read

jobs:
  validate-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Validate pre-Wave 6 documentation navigation
        run: python scripts/reconcile_pre_wave6_navigation.py
