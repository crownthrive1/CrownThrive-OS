name: Documentation Reconciliation Continuity

on:
  pull_request:
    paths:
      - 'frameworks/documentation-reconciliation-continuity/**'
      - 'skills/documentation-reconciliation-continuity/**'
      - 'plugins/documentation-reconciliation-continuity/**'
      - 'evals/documentation-reconciliation-continuity.v1.json'
      - 'data/documentation/**'
      - 'scripts/validate_documentation_reconciliation_continuity.py'
      - 'scripts/validate_sprint_documentation_continuity.py'
      - 'scripts/validate_sprint_2_documentation_continuity.py'
      - 'scripts/validate_canonical_brand_spelling.py'
      - 'scripts/build_help_center_legal_depot_crosswalk.py'
      - 'scripts/validate_sprint_3_legal_depot.py'
      - 'scripts/build_help_center_chlom_crosswalk.py'
      - 'scripts/validate_sprint_4_chlom.py'
      - 'scripts/inspect_help_center_convergent_ecosystem.py'
      - 'scripts/build_help_center_convergent_ecosystem_crosswalk.py'
      - 'scripts/inspect_sprint_5_specific_route_gaps.py'
      - 'scripts/validate_sprint_5_convergent_ecosystem.py'
      - 'scripts/inspect_help_center_final_94.py'
      - 'scripts/build_help_center_final_94_crosswalk.py'
      - 'scripts/validate_sprint_6_final_94.py'
      - 'scripts/build_substantive_rebuild_wave1.py'
      - 'scripts/validate_sprint_7_substantive_wave1.py'
      - 'scripts/build_substantive_rebuild_wave2.py'
      - 'scripts/validate_sprint_8_substantive_wave2.py'
      - 'scripts/build_substantive_rebuild_wave3.py'
      - 'scripts/validate_sprint_9_substantive_wave3.py'
      - 'scripts/build_substantive_rebuild_wave4.py'
      - 'scripts/validate_sprint_10_substantive_wave4.py'
      - 'scripts/inspect_sprint_11_remaining_p0.py'
      - 'scripts/inspect_sprint_11_ai_pivot.py'
      - 'scripts/build_substantive_rebuild_wave5.py'
      - 'scripts/validate_sprint_11_substantive_wave5.py'
      - '**/*.mdx'
      - 'docs.json'
  push:
    branches: [main]
    paths:
      - 'frameworks/documentation-reconciliation-continuity/**'
      - 'skills/documentation-reconciliation-continuity/**'
      - 'plugins/documentation-reconciliation-continuity/**'
      - 'evals/documentation-reconciliation-continuity.v1.json'
      - 'data/documentation/**'
      - 'scripts/validate_documentation_reconciliation_continuity.py'
      - 'scripts/validate_sprint_documentation_continuity.py'
      - 'scripts/validate_sprint_2_documentation_continuity.py'
      - 'scripts/validate_canonical_brand_spelling.py'
      - 'scripts/build_help_center_legal_depot_crosswalk.py'
      - 'scripts/validate_sprint_3_legal_depot.py'
      - 'scripts/build_help_center_chlom_crosswalk.py'
      - 'scripts/validate_sprint_4_chlom.py'
      - 'scripts/inspect_help_center_convergent_ecosystem.py'
      - 'scripts/build_help_center_convergent_ecosystem_crosswalk.py'
      - 'scripts/inspect_sprint_5_specific_route_gaps.py'
      - 'scripts/validate_sprint_5_convergent_ecosystem.py'
      - 'scripts/inspect_help_center_final_94.py'
      - 'scripts/build_help_center_final_94_crosswalk.py'
      - 'scripts/validate_sprint_6_final_94.py'
      - 'scripts/build_substantive_rebuild_wave1.py'
      - 'scripts/validate_sprint_7_substantive_wave1.py'
      - 'scripts/build_substantive_rebuild_wave2.py'
      - 'scripts/validate_sprint_8_substantive_wave2.py'
      - 'scripts/build_substantive_rebuild_wave3.py'
      - 'scripts/validate_sprint_9_substantive_wave3.py'
      - 'scripts/build_substantive_rebuild_wave4.py'
      - 'scripts/validate_sprint_10_substantive_wave4.py'
      - 'scripts/inspect_sprint_11_remaining_p0.py'
      - 'scripts/inspect_sprint_11_ai_pivot.py'
      - 'scripts/build_substantive_rebuild_wave5.py'
      - 'scripts/validate_sprint_11_substantive_wave5.py'
      - '**/*.mdx'
      - 'docs.json'

permissions:
  contents: read

jobs:
  validate-documentation-reconciliation-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Validate framework contracts
        run: python scripts/validate_documentation_reconciliation_continuity.py
      - name: Validate canonical CrownThrive spelling
        run: python scripts/validate_canonical_brand_spelling.py
      - name: Validate Sprint 1 continuity links
        run: python scripts/validate_sprint_documentation_continuity.py
      - name: Validate Sprint 2 continuity links
        run: python scripts/validate_sprint_2_documentation_continuity.py
      - name: Build and validate Sprint 3 Legal Depot crosswalk
        run: python scripts/build_help_center_legal_depot_crosswalk.py --summary-only
      - name: Validate Sprint 3 Legal Depot gap closure
        run: python scripts/validate_sprint_3_legal_depot.py
      - name: Build and validate Sprint 4 CHLOM crosswalk
        run: python scripts/build_help_center_chlom_crosswalk.py --summary-only
      - name: Validate Sprint 4 CHLOM gap closure
        run: python scripts/validate_sprint_4_chlom.py
      - name: Inspect Sprint 5 Convergent Ecosystem source estate
        run: python scripts/inspect_help_center_convergent_ecosystem.py
      - name: Build Sprint 5 Convergent Ecosystem crosswalk
        run: python scripts/build_help_center_convergent_ecosystem_crosswalk.py --summary-only
      - name: Inspect Sprint 5 platform-specific route gaps
        run: python scripts/inspect_sprint_5_specific_route_gaps.py
      - name: Validate Sprint 5 Convergent Ecosystem gap closure
        run: python scripts/validate_sprint_5_convergent_ecosystem.py
      - name: Inspect Sprint 6 final 94-title source estate
        run: python scripts/inspect_help_center_final_94.py
      - name: Build Sprint 6 final 94-title crosswalk
        run: python scripts/build_help_center_final_94_crosswalk.py --summary-only
      - name: Validate Sprint 6 final 94-title gap closure
        run: python scripts/validate_sprint_6_final_94.py
      - name: Build Sprint 7 P0 substantive rebuild wave 1
        run: python scripts/build_substantive_rebuild_wave1.py --summary-only
      - name: Validate Sprint 7 substantive rebuild wave 1
        run: python scripts/validate_sprint_7_substantive_wave1.py
      - name: Build Sprint 8 P0 evidence identity registry wave 2
        run: python scripts/build_substantive_rebuild_wave2.py --summary-only
      - name: Validate Sprint 8 substantive rebuild wave 2
        run: python scripts/validate_sprint_8_substantive_wave2.py
      - name: Build Sprint 9 P0 identity and evidence wave 3
        run: python scripts/build_substantive_rebuild_wave3.py --summary-only
      - name: Validate Sprint 9 substantive rebuild wave 3
        run: python scripts/validate_sprint_9_substantive_wave3.py
      - name: Build Sprint 10 P0 component and framework wave 4
        run: python scripts/build_substantive_rebuild_wave4.py --summary-only
      - name: Validate Sprint 10 substantive rebuild wave 4
        run: python scripts/validate_sprint_10_substantive_wave4.py
      - name: Inspect Sprint 11 remaining P0 estate
        run: python scripts/inspect_sprint_11_remaining_p0.py
      - name: Inspect Sprint 11 AI pivot candidates
        run: python scripts/inspect_sprint_11_ai_pivot.py
      - name: Build Sprint 11 P0 interface and surface wave 5
        run: python scripts/build_substantive_rebuild_wave5.py --summary-only
      - name: Validate Sprint 11 substantive rebuild wave 5
        run: python scripts/validate_sprint_11_substantive_wave5.py
