name: PentaRelease — Autonomous Release Awareness

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read

env:
  POLICY_FILE: .pentarelease/policy.json
  DECISION_FILE: /tmp/pentarelease-decision.json

concurrency:
  group: pentarelease-provider-writes-${{ github.repository }}
  cancel-in-progress: false

jobs:
  decide-and-materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout institutional source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Validate PentaRelease policy and engine
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool "$POLICY_FILE" >/dev/null
          python3 -m py_compile scripts/pentarelease/decide.py
          test "$(jq -r '.enabled' "$POLICY_FILE")" = "true"
          test "$(jq -r '.mode' "$POLICY_FILE")" = "production"

      - name: Yield to the human D3 major-release lane
        id: major
        shell: bash
        run: |
          set -euo pipefail
          MAJOR_REQUEST=.github/release-requests/crownthrive-os-v4.0.0.0.json
          MAJOR_TEMPLATE=.pentarelease/templates/major-release-request.v4.0.0.0.template.json
          if [ -e "$MAJOR_REQUEST" ]; then
            CONTRACT_PATH="$MAJOR_REQUEST"
            REASON=human_d3_major_request_pending
            if ! jq -e '
                .release_class == "major" and
                .authority_class == "D3_HUMAN_RESERVED" and
                .version == "4.0.0.0" and
                .tag == "v4.0.0.0" and
                .target_binding == "github_event_merge_sha"
              ' "$MAJOR_REQUEST" >/dev/null 2>&1; then
              REASON=major_release_request_present_but_invalid
            fi
          elif [ -e "$MAJOR_TEMPLATE" ]; then
            CONTRACT_PATH="$MAJOR_TEMPLATE"
            REASON=human_d3_major_release_lane_staged
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq -n --arg reason "$REASON" --arg contract "$CONTRACT_PATH" '{
            decision: "hold",
            release: false,
            reason: $reason,
            authority_class: "D3_HUMAN_RESERVED",
            major_contract_path: $contract
          }' > "$DECISION_FILE"
          echo "pending=true" >> "$GITHUB_OUTPUT"
          echo "PentaRelease HOLD: $REASON; autonomous publication yields to the human-major lane."

      - name: Observe repository and decide
        id: decide
        if: steps.major.outputs.pending != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          python3 scripts/pentarelease/decide.py --policy "$POLICY_FILE" --output "$DECISION_FILE"
          cat "$DECISION_FILE"
          echo "release=$(jq -r '.release' "$DECISION_FILE")" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r '.version // empty' "$DECISION_FILE")" >> "$GITHUB_OUTPUT"

      - name: Explain HOLD
        if: steps.decide.outputs.release != 'true'
        shell: bash
        run: |
          {
            echo '## PentaRelease autonomous decision'
            echo
            echo '**Decision:** HOLD'
            echo
            echo "**Reason:** $(jq -r '.reason' "$DECISION_FILE")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Secret-bearing path gate
        if: steps.decide.outputs.release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          jq -r '.changed_files[]' "$DECISION_FILE" > /tmp/changed-files.txt
          if grep -Eiq '(^|/)(\.env($|\.)|secrets?($|/)|credentials?($|/)|vault($|/)|private[-_]?keys?($|/)|.*\.(pem|p12|pfx|key)$)' /tmp/changed-files.txt; then
            echo 'PentaRelease HOLD: prohibited secret-bearing path detected.' >&2
            exit 43
          fi

      - name: Materialize autonomous release package
        if: steps.decide.outputs.release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' "$DECISION_FILE")
          TAG=$(jq -r '.tag' "$DECISION_FILE")
          SCHEME=$(jq -r '.version_scheme' "$DECISION_FILE")
          WHY=$(jq -r '.why' "$DECISION_FILE")
          BUMP=$(jq -r '.bump' "$DECISION_FILE")
          LATEST=$(jq -r '.latest_tag' "$DECISION_FILE")
          LATEST_TAG_SHA=$(jq -er '.latest_tag_sha | select(type == "string" and test("^[0-9a-f]{40}$"))' "$DECISION_FILE")
          SOURCE_BASELINE_SHA=$(jq -er '.source_baseline_sha | select(type == "string" and test("^[0-9a-f]{40}$"))' "$DECISION_FILE")
          SOURCE_HEAD_SHA=$(jq -er '.source_head_sha | select(type == "string" and test("^[0-9a-f]{40}$"))' "$DECISION_FILE")
          LINEAGE_RESOLUTION=$(jq -er '.lineage_resolution | select(type == "string" and length > 0)' "$DECISION_FILE")
          PKG="releases/$VERSION"
          REQ=".github/release-requests/crownthrive-os-$VERSION.json"
          BRANCH="pentarelease/auto-${VERSION}-${GITHUB_RUN_ID}"
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          test "$(git rev-parse "${LATEST}^{commit}")" = "$LATEST_TAG_SHA"
          git merge-base --is-ancestor "$SOURCE_BASELINE_SHA" "$SOURCE_HEAD_SHA"
          mkdir -p "$PKG" .github/release-requests

          {
            echo "# CrownThrive OS $VERSION — Autonomous PentaRelease"
            echo
            echo "Release generated by PentaRelease autonomous awareness."
            echo
            echo "## Why this release exists"
            echo
            echo "$WHY."
            echo
            echo "PentaRelease observed release-relevant changes after $LATEST, classified the delta as **$BUMP**, selected **$VERSION**, and materialized this release without founder or ChatGPT operation."
            echo
            echo "## Governance"
            echo
            echo "- Versioning does not manufacture certification or authority."
            echo "- D3/breaking-authority changes remain HOLD for human governance."
            echo "- HOLD is never silently promoted to PASS."
            echo "- Secret-bearing paths are blocked from autonomous packaging."
            echo "- Provider readback is mandatory."
          } > "$PKG/RELEASE_NOTES.md"

          python3 - "$DECISION_FILE" "$PKG/MANIFEST.json" <<'PY'
          import json,sys,datetime
          d=json.load(open(sys.argv[1]))
          m={
            'release_id':f"ct.os.v{d['version']}", 'version':d['version'], 'tag':d['tag'],
            'version_scheme':d['version_scheme'], 'title':f"CrownThrive OS {d['version']} — Autonomous PentaRelease",
            'target_ref':'main', 'publisher':'PentaRelease', 'publisher_contract':'ct.pentarelease.autonomous.v2.1.0',
            'previous_release_tag':d['latest_tag'], 'previous_release_tag_sha':d['latest_tag_sha'],
            'source_baseline_sha':d['source_baseline_sha'], 'source_head_sha':d['source_head_sha'],
            'lineage_resolution':d['lineage_resolution'],
            'decision':d, 'artifact_policy':'governed_package_and_checksums',
            'generated_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'governance':{'d3_human_reserved':True,'hold_never_promoted_by_version_only':True,'provider_readback_required':True}
          }
          json.dump(m,open(sys.argv[2],'w'),indent=2); open(sys.argv[2],'a').write('\n')
          PY

          cat > "$REQ" <<EOF
          {
            "release_id": "ct.os.v$VERSION",
            "tag": "$TAG",
            "target": "main",
            "title": "CrownThrive OS $VERSION — Autonomous PentaRelease",
            "package": "$PKG",
            "version_scheme": "$SCHEME",
            "publisher": "PentaRelease",
            "publisher_contract": "ct.pentarelease.autonomous.v2.1.0",
            "previous_release_tag": "$LATEST",
            "previous_release_tag_sha": "$LATEST_TAG_SHA",
            "source_baseline_sha": "$SOURCE_BASELINE_SHA",
            "source_head_sha": "$SOURCE_HEAD_SHA",
            "lineage_resolution": "$LINEAGE_RESOLUTION",
            "requested_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "release_state": "requested",
            "draft": false,
            "prerelease": false
          }
          EOF
          python3 -m json.tool "$PKG/MANIFEST.json" >/dev/null
          python3 -m json.tool "$REQ" >/dev/null
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "PKG=$PKG" >> "$GITHUB_ENV"
          echo "REQ=$REQ" >> "$GITHUB_ENV"
          echo "SOURCE_BASELINE_SHA=$SOURCE_BASELINE_SHA" >> "$GITHUB_ENV"
          echo "SOURCE_HEAD_SHA=$SOURCE_HEAD_SHA" >> "$GITHUB_ENV"

      - name: Route through governance and publish exact merge
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PentaRelease'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add "$PKG" "$REQ"
          git commit -m "pentarelease(auto): materialize CrownThrive OS $VERSION"
          HEAD_SHA=$(git rev-parse HEAD)
          test "$(git rev-parse HEAD^)" = "$SOURCE_HEAD_SHA"
          git push origin "$BRANCH"

          PR_URL=$(gh pr create --base main --head "$BRANCH" \
            --title "PentaRelease autonomous release $VERSION" \
            --body "Autonomous release candidate $VERSION. Publication remains blocked until this exact commit passes the CrownThrive governed merge gate and the pull request is merged into main.")
          test -n "$PR_URL"
          echo "Created governed release candidate PR: $PR_URL"

          # The candidate-branch push runs the complete governed diff gate. A manually
          # dispatched gate is deliberately ineligible to produce a successful check.
          success=false
          for i in $(seq 1 60); do
            sleep 10
            STATE=$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs" \
              --jq '[.check_runs[] | select(.name=="CrownThrive governed merge gate")] | sort_by(.started_at) | last | ((.status // "missing") + ":" + (.conclusion // "pending"))')
            echo "Governed merge gate: $STATE"
            if [ "$STATE" = "completed:success" ]; then success=true; break; fi
            if [[ "$STATE" == completed:* ]] && [ "$STATE" != "completed:success" ]; then
              echo "PentaRelease HOLD: governed merge gate did not pass ($STATE)." >&2
              exit 44
            fi
          done
          test "$success" = true

          git fetch --no-tags origin main
          CURRENT_MAIN_SHA=$(git rev-parse origin/main)
          if [ "$CURRENT_MAIN_SHA" != "$SOURCE_HEAD_SHA" ]; then
            echo "PentaRelease HOLD: main advanced after the exact source decision ($SOURCE_HEAD_SHA -> $CURRENT_MAIN_SHA)." >&2
            exit 46
          fi
          gh pr merge "$PR_URL" --merge --delete-branch
          git fetch --no-tags origin main
          MERGE_SHA=$(gh pr view "$PR_URL" --json state,mergeCommit \
            --jq 'select(.state == "MERGED") | .mergeCommit.oid')
          test -n "$MERGE_SHA"
          git cat-file -e "${MERGE_SHA}^{commit}"
          git merge-base --is-ancestor "$HEAD_SHA" "$MERGE_SHA"
          git merge-base --is-ancestor "$MERGE_SHA" origin/main
          TARGET="$MERGE_SHA"
          echo "Governed PR merged; release target is exact accepted commit $TARGET."

          mkdir -p dist/pentarelease
          SAFE_TAG=$(printf '%s' "$TAG" | tr '/' '-')
          ZIP="dist/pentarelease/CrownThrive-OS-${SAFE_TAG}-package.zip"
          TGZ="dist/pentarelease/CrownThrive-OS-${SAFE_TAG}-package.tar.gz"
          (cd "$PKG" && zip -qr "$GITHUB_WORKSPACE/$ZIP" .)
          tar -C "$PKG" -czf "$TGZ" .
          cp "$PKG/MANIFEST.json" dist/pentarelease/MANIFEST.json
          cp "$PKG/RELEASE_NOTES.md" dist/pentarelease/RELEASE_NOTES.md
          (cd dist/pentarelease && sha256sum * > SHA256SUMS)

          TITLE="CrownThrive OS $VERSION — Autonomous PentaRelease"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "PentaRelease HOLD: release $TAG already exists; autonomous publication is append-only." >&2
            exit 45
          fi
          gh release create "$TAG" --target "$TARGET" --title "$TITLE" --notes-file "$PKG/RELEASE_NOTES.md"
          gh release upload "$TAG" "$ZIP" "$TGZ" dist/pentarelease/SHA256SUMS dist/pentarelease/MANIFEST.json dist/pentarelease/RELEASE_NOTES.md

          READBACK=$(gh release view "$TAG" --json tagName,name,url,isDraft,isPrerelease,targetCommitish,assets)
          echo "$READBACK" | jq .
          test "$(echo "$READBACK" | jq -r '.tagName')" = "$TAG"
          test "$(echo "$READBACK" | jq -r '.targetCommitish')" = "$TARGET"
          test "$(echo "$READBACK" | jq -r '.isDraft')" = "false"
          test "$(echo "$READBACK" | jq -r '.isPrerelease')" = "false"
          for EXPECTED in "$(basename "$ZIP")" "$(basename "$TGZ")" SHA256SUMS MANIFEST.json RELEASE_NOTES.md; do
            echo "$READBACK" | jq -e --arg n "$EXPECTED" '.assets[] | select(.name == $n)' >/dev/null
          done
          test "$(echo "$READBACK" | jq '[.assets[]] | length')" -eq 5
          READBACK_DIR=$(mktemp -d)
          gh release download "$TAG" --dir "$READBACK_DIR"
          (cd "$READBACK_DIR" && sha256sum --strict --check SHA256SUMS)

          {
            echo '## PentaRelease production proof'
            echo
            echo "- Version: $VERSION"
            echo "- Tag: $TAG"
            echo "- Governed exact commit: $HEAD_SHA"
            echo "- Prior release source baseline: $SOURCE_BASELINE_SHA"
            echo "- Evaluated source head: $SOURCE_HEAD_SHA"
            echo "- Accepted main merge commit: $TARGET"
            echo "- Provider asset names and SHA-256 readback: verified"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record autonomous decision
        if: always()
        shell: bash
        run: |
          {
            echo '## PentaRelease autonomous decision'
            echo
            echo "**Decision:** $(jq -r '.decision' "$DECISION_FILE" | tr '[:lower:]' '[:upper:]')"
            if [ "$(jq -r '.release' "$DECISION_FILE")" = true ]; then
              echo
              echo "**Selected tag:** $(jq -r '.tag' "$DECISION_FILE")"
              echo
              echo "**Why:** $(jq -r '.why' "$DECISION_FILE")"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
