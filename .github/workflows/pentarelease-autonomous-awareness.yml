name: PentaRelease — Autonomous Release Awareness

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

env:
  POLICY_FILE: .pentarelease/policy.json
  DECISION_FILE: /tmp/pentarelease-decision.json

concurrency:
  group: pentarelease-autonomous-awareness
  cancel-in-progress: false

jobs:
  decide-and-materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout institutional source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Validate PentaRelease policy and engine
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool "$POLICY_FILE" >/dev/null
          python3 -m py_compile scripts/pentarelease/decide.py
          test "$(jq -r '.enabled' "$POLICY_FILE")" = "true"
          test "$(jq -r '.mode' "$POLICY_FILE")" = "production"

      - name: Observe repository and decide
        id: decide
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          python3 scripts/pentarelease/decide.py --policy "$POLICY_FILE" --output "$DECISION_FILE"
          cat "$DECISION_FILE"
          echo "release=$(jq -r '.release' "$DECISION_FILE")" >> "$GITHUB_OUTPUT"
          echo "tag=$(jq -r '.tag // empty' "$DECISION_FILE")" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r '.version // empty' "$DECISION_FILE")" >> "$GITHUB_OUTPUT"

      - name: Explain HOLD in job summary
        if: steps.decide.outputs.release != 'true'
        shell: bash
        run: |
          {
            echo '## PentaRelease autonomous decision'
            echo
            echo '**Decision:** HOLD'
            echo
            echo "**Reason:** \`$(jq -r '.reason' "$DECISION_FILE")\`"
            echo
            echo "**Latest release:** \`$(jq -r '.latest_tag // "unknown"' "$DECISION_FILE")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Secret-bearing path gate
        if: steps.decide.outputs.release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          jq -r '.changed_files[]' "$DECISION_FILE" > /tmp/changed-files.txt
          if grep -Eiq '(^|/)(\.env($|\.)|secrets?($|/)|credentials?($|/)|vault($|/)|private[-_]?keys?($|/)|.*\.(pem|p12|pfx|key)$)' /tmp/changed-files.txt; then
            echo 'PentaRelease HOLD: prohibited secret-bearing path detected.' >&2
            exit 43
          fi

      - name: Materialize autonomous release package
        if: steps.decide.outputs.release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' "$DECISION_FILE")
          TAG=$(jq -r '.tag' "$DECISION_FILE")
          SCHEME=$(jq -r '.version_scheme' "$DECISION_FILE")
          WHY=$(jq -r '.why' "$DECISION_FILE")
          BUMP=$(jq -r '.bump' "$DECISION_FILE")
          LATEST=$(jq -r '.latest_tag' "$DECISION_FILE")
          PKG="releases/$VERSION"
          REQ=".github/release-requests/crownthrive-os-$VERSION.json"
          mkdir -p "$PKG" .github/release-requests

          {
            echo "# CrownThrive OS $VERSION — Autonomous PentaRelease"
            echo
            echo "Release generated by PentaRelease autonomous awareness."
            echo
            echo "## Why this release exists"
            echo
            echo "$WHY."
            echo
            echo "PentaRelease observed release-relevant changes after $LATEST, classified the delta as **$BUMP**, selected **$VERSION**, and materialized this release without requiring ChatGPT or founder operation."
            echo
            echo "## Included change surface"
            echo
            jq -r '.changed_files[] | "- `" + . + "`"' "$DECISION_FILE"
            echo
            echo "## Governance"
            echo
            echo "- Versioning does not manufacture certification or authority."
            echo "- D3/breaking-authority changes remain HOLD for human governance."
            echo "- HOLD is never silently promoted to PASS."
            echo "- Secret-bearing paths are blocked from autonomous packaging."
            echo "- Provider readback remains mandatory before publication is treated as complete."
          } > "$PKG/RELEASE_NOTES.md"

          python3 - "$DECISION_FILE" "$PKG/MANIFEST.json" <<'PY'
          import json,sys,datetime
          d=json.load(open(sys.argv[1]))
          m={
            'release_id':f"ct.os.v{d['version']}",
            'version':d['version'],
            'tag':d['tag'],
            'version_scheme':d['version_scheme'],
            'title':f"CrownThrive OS {d['version']} — Autonomous PentaRelease",
            'target_ref':'main',
            'publisher':'PentaRelease',
            'publisher_contract':'ct.pentarelease.autonomous.v2',
            'decision':d,
            'artifact_policy':'governed_package_and_checksums',
            'generated_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'governance':{'d3_human_reserved':True,'hold_never_promoted_by_version_only':True,'provider_readback_required':True}
          }
          json.dump(m,open(sys.argv[2],'w'),indent=2); open(sys.argv[2],'a').write('\n')
          PY

          cat > "$REQ" <<EOF
          {
            "release_id": "ct.os.v$VERSION",
            "tag": "$TAG",
            "target": "main",
            "title": "CrownThrive OS $VERSION — Autonomous PentaRelease",
            "package": "$PKG",
            "version_scheme": "$SCHEME",
            "publisher": "PentaRelease",
            "publisher_contract": "ct.pentarelease.autonomous.v2",
            "requested_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "release_state": "requested",
            "draft": false,
            "prerelease": false
          }
          EOF
          python3 -m json.tool "$PKG/MANIFEST.json" >/dev/null
          python3 -m json.tool "$REQ" >/dev/null

      - name: Route governed release through protected main
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' "$DECISION_FILE")
          BRANCH="pentarelease/auto-${VERSION}-${GITHUB_RUN_ID}"
          git config user.name 'PentaRelease'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add "releases/$VERSION" ".github/release-requests/crownthrive-os-$VERSION.json"
          git commit -m "pentarelease(auto): materialize CrownThrive OS $VERSION"
          HEAD_SHA=$(git rev-parse HEAD)
          git push origin "$BRANCH"

          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "PentaRelease autonomous release $VERSION" \
            --body "PentaRelease autonomously detected a release-worthy delta, selected $VERSION, generated the governed package/request, and routed it through the protected-main governance gate. D3/new-authority actions remain excluded.")
          echo "Created governed release PR: $PR_URL"

          gh workflow run governed-merge-gate.yml --ref "$BRANCH"

          success=false
          for i in $(seq 1 60); do
            sleep 10
            STATE=$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs" \
              --jq '[.check_runs[] | select(.name=="CrownThrive governed merge gate")] | sort_by(.started_at) | last | ((.status // "missing") + ":" + (.conclusion // "pending"))')
            echo "Governed merge gate: $STATE"
            if [ "$STATE" = "completed:success" ]; then success=true; break; fi
            if [[ "$STATE" == completed:* ]] && [ "$STATE" != "completed:success" ]; then
              echo "PentaRelease HOLD: governed merge gate did not pass ($STATE)." >&2
              exit 44
            fi
          done
          test "$success" = true
          gh pr merge "$PR_URL" --merge --delete-branch

      - name: Record autonomous decision
        shell: bash
        run: |
          {
            echo '## PentaRelease autonomous decision'
            echo
            echo "**Decision:** $(jq -r '.decision' "$DECISION_FILE" | tr '[:lower:]' '[:upper:]')"
            if [ "$(jq -r '.release' "$DECISION_FILE")" = true ]; then
              echo
              echo "**Selected tag:** \`$(jq -r '.tag' "$DECISION_FILE")\`"
              echo
              echo "**Why:** $(jq -r '.why' "$DECISION_FILE")"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
