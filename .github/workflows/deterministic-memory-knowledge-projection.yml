name: Deterministic Memory Knowledge Projection

on:
  push:
    branches:
      - admin-mcp/pentadocs-pentacensus-deterministic-memory
    paths:
      - ".github/workflows/deterministic-memory-knowledge-projection.yml"

permissions:
  contents: write

concurrency:
  group: deterministic-memory-knowledge-projection-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize-governed-knowledge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Generate governed Penta knowledge corpus
        shell: bash
        run: |
          set -euo pipefail
          python scripts/penta_portal_docs.py --write
          python scripts/penta_portal_finalize.py --apply
          python scripts/penta_operational_knowledge_entrypoint.py --apply
          python scripts/pentagonal_reference_suite.py --apply
          python runtime/penta_deterministic_memory.py reconcile --write

      - name: Validate exact generated corpus
        shell: bash
        run: |
          set -euo pipefail
          python scripts/penta_portal_finalize.py --check
          python scripts/penta_operational_knowledge_entrypoint.py --check
          python scripts/pentagonal_reference_suite.py --check
          python scripts/penta_census.py --root . --validate
          python scripts/penta_census.py --root . --validate-structure
          python scripts/penta_census.py --root . --validate-contract
          python scripts/penta_census.py --root . --check
          python runtime/penta_deterministic_memory.py validate
          python runtime/penta_deterministic_memory.py reconcile --check
          python -m unittest \
            tests.test_penta_portal_docs \
            tests.test_penta_operational_knowledge \
            tests.test_pentagonal_reference_suite \
            tests.test_penta_deterministic_memory \
            tests.test_penta_sql_contract \
            tests.test_penta_family_reconciliation \
            tests.test_penta_provider_family_aliases \
            -v
          python scripts/validate_docs.py
          git diff --check

      - name: Commit deterministic institutional projection
        shell: bash
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf '{}' +
          git config user.name "CrownThrive PentaDocs"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            docs.json \
            data/penta/namespace-census.v1.json \
            data/penta/deterministic-memory-census.v1.json \
            data/penta/operational-knowledge.v1.json \
            data/penta/agent-knowledge.v1.json \
            data/penta/agent-knowledge.v1.jsonl \
            data/penta/pentagonal-reference.v1.json \
            data/penta/pentagonal-reference.v1.jsonl \
            data/penta/pentagonal-ingestion-contract.v1.json \
            data/documentation/pentadocs-page-profiles.v1.json \
            PENTAGONAL-FULL-SUITE-SPECIFICATION.md \
            pentas.mdx \
            pentas \
            changelog/penta-portal-full-census-2026-08-28.mdx
          if git diff --cached --quiet; then
            echo "Governed Penta knowledge corpus already converged."
            exit 0
          fi
          git diff --cached --check
          git commit -m "docs(penta): institutionalize deterministic memory identities"
          git push origin HEAD:${GITHUB_REF_NAME}
