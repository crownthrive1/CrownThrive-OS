name: CrownThrive OS — Forced Repository Rebrand Migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/os-wide-rebrand-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crownthrive-os-rebrand-migration
  cancel-in-progress: false

jobs:
  force-rebrand:
    runs-on: ubuntu-latest
    steps:
      - name: Check out canonical OS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Rewrite retired repository identity everywhere
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          from pathlib import Path

          replacements = {
              'CrownThrive-' + 'Support': 'CrownThrive-OS',
              'crownthrive-' + 'support': 'crownthrive-os',
              'CROWNTHRIVE-' + 'SUPPORT': 'CROWNTHRIVE-OS',
          }
          self_path = '.github/workflows/os-wide-rebrand-migration.yml'
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode('utf-8').split('\0')
          changed = []
          replacements_made = 0
          for filename in tracked:
              if not filename or filename == self_path:
                  continue
              path = Path(filename)
              try:
                  before = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              after = before
              for old, new in replacements.items():
                  count = after.count(old)
                  if count:
                      replacements_made += count
                      after = after.replace(old, new)
              if after != before:
                  path.write_text(after, encoding='utf-8')
                  changed.append(filename)

          print(f'Changed files: {len(changed)}')
          print(f'Replacements: {replacements_made}')
          for filename in changed:
              print(filename)
          PY

          if git diff --quiet; then
            echo 'No retired repository identity remains to rewrite.'
            exit 0
          fi

          git config user.name 'CrownThrive PentaUpdate'
          git config user.email 'contact@crownthrive.com'
          git add -A
          git commit -m 'rebrand(os): replace retired repository identity OS-wide'
          git push origin HEAD:main
