name: Security Governance

on:
  pull_request:
    paths:
      - "**/*.py"
      - "**/*.js"
      - "**/*.ts"
      - "**/*.json"
      - "**/*.yml"
      - "**/*.yaml"
      - ".github/workflows/**"
      - "developers/manifests/**"
  push:
    branches:
      - main
      - "admin-mcp/**"
    paths:
      - "**/*.py"
      - "**/*.js"
      - "**/*.ts"
      - "**/*.json"
      - "**/*.yml"
      - "**/*.yaml"
      - ".github/workflows/**"
      - "developers/manifests/**"
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

concurrency:
  group: security-governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Validate CrownThrive security policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify security scripts
        run: |
          python -m py_compile scripts/validate_security_governance.py
          python -m py_compile scripts/security_self_heal_plan.py
          python -m py_compile scripts/governed_merge_decision.py
      - name: Validate deterministic security governance
        run: python scripts/validate_security_governance.py
      - name: Validate self-healing planner invariants
        run: python scripts/security_self_heal_plan.py --self-test
      - name: Validate quorum decision invariants
        run: python scripts/governed_merge_decision.py --self-test

  codeql:
    name: CodeQL security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
