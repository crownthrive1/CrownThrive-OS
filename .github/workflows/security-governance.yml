name: Security Governance

on:
  pull_request:
  push:
    branches:
      - main
      - "admin-mcp/**"
    paths:
      - "**/*.py"
      - "**/*.js"
      - "**/*.ts"
      - "**/*.json"
      - "**/*.yml"
      - "**/*.yaml"
      - ".github/workflows/**"
      - "developers/manifests/**"
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

concurrency:
  group: security-governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Validate CrownThrive security policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Verify security scripts
        run: |
          python -m py_compile scripts/validate_security_governance.py
          python -m py_compile scripts/validate_github_actions_runtime_policy.py
          python -m py_compile scripts/security_self_heal_plan.py
          python -m py_compile scripts/governed_merge_decision.py
      - name: Validate GitHub Actions runtime and supply-chain policy
        run: python scripts/validate_github_actions_runtime_policy.py
      - name: Validate deterministic security governance
        run: python scripts/validate_security_governance.py
      - name: Validate self-healing planner invariants
        run: python scripts/security_self_heal_plan.py --self-test
      - name: Validate quorum decision invariants
        run: python scripts/governed_merge_decision.py --self-test

  codeql-provider-mode:
    name: Validate provider-managed CodeQL compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prevent conflicting advanced CodeQL setup
        shell: bash
        run: |
          if grep -R -nE '^[[:space:]]*uses:[[:space:]]*github/codeql-action/' .github/workflows; then
            echo "Advanced CodeQL workflow detected while GitHub default setup is the registered provider mode."
            exit 1
          fi
          echo "CodeQL default setup is provider-managed; this workflow intentionally does not duplicate advanced setup."
          echo "Actual provider CodeQL findings remain independent evidence and are not synthesized by this job."

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Resolve dependency-review scope
        id: dependency_scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --no-recurse-submodules --depth=256 origin "$BASE_SHA"
          git fetch --no-tags --no-recurse-submodules --depth=256 origin "$HEAD_SHA"
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          dependency_pattern='(^|/)(package\.json|package-lock\.json|npm-shrinkwrap\.json|yarn\.lock|pnpm-lock\.yaml|bun\.lockb?|deno\.lock|requirements([^/]*)\.txt|Pipfile|Pipfile\.lock|poetry\.lock|pyproject\.toml|uv\.lock|Gemfile|Gemfile\.lock|go\.mod|go\.sum|Cargo\.toml|Cargo\.lock|composer\.json|composer\.lock|pom\.xml|build\.gradle|build\.gradle\.kts|gradle\.lockfile|packages\.lock\.json|paket\.dependencies|paket\.lock|mix\.exs|mix\.lock|Package\.swift|Package\.resolved)$'
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Eq "$dependency_pattern"; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "Dependency manifest changes detected; provider dependency review is required."
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "No dependency manifest changes detected; provider dependency review is not applicable."
          fi

      - name: Review dependency changes
        if: steps.dependency_scope.outputs.required == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          base-ref: ${{ github.event.pull_request.base.sha }}
          head-ref: ${{ github.event.pull_request.head.sha }}

      - name: Record dependency-review no-op
        if: steps.dependency_scope.outputs.required != 'true'
        run: echo "Dependency review not applicable because the pull-request diff contains no dependency manifests."
