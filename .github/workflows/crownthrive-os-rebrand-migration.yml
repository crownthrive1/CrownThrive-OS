name: CrownThrive OS Repository Identity Migration

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crownthrive-os-rebrand-migration
  cancel-in-progress: false

jobs:
  materialize-migration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Rewrite and package legacy repository identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          legacy = 'CrownThrive-' + 'Support'
          pattern = re.compile(re.escape(legacy), re.IGNORECASE)
          replacement = 'CrownThrive-OS'
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode('utf-8').split('\0')
          stage = subprocess.check_output(['git', 'ls-files', '-s']).decode('utf-8').splitlines()
          modes = {}
          for line in stage:
              if not line.strip():
                  continue
              mode, _, _, filename = line.split(None, 3)
              modes[filename] = mode

          changed = []
          for filename in tracked:
              if not filename:
                  continue
              path = Path(filename)
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              rewritten, count = pattern.subn(replacement, text)
              if count:
                  path.write_text(rewritten, encoding='utf-8')
                  changed.append({
                      'path': filename,
                      'replacements': count,
                      'mode': modes.get(filename, '100644')
                  })

          artifact_root = Path('/tmp/crownthrive-os-rebrand')
          artifact_root.mkdir(parents=True, exist_ok=True)
          for entry in changed:
              src = Path(entry['path'])
              dst = artifact_root / entry['path']
              dst.parent.mkdir(parents=True, exist_ok=True)
              dst.write_bytes(src.read_bytes())

          manifest = {
              'schema_version': '1.0.0',
              'canonical_repository': 'crownthrive1/CrownThrive-OS',
              'canonical_url': 'https://github.com/crownthrive1/CrownThrive-OS',
              'legacy_repository_slug': legacy,
              'replacement_repository_slug': replacement,
              'changed_files': len(changed),
              'replacements': sum(item['replacements'] for item in changed),
              'files': changed
          }
          (artifact_root / '_migration_manifest.json').write_text(
              json.dumps(manifest, indent=2) + '\n', encoding='utf-8'
          )

          print(f"Materialized files: {manifest['changed_files']}")
          print(f"Materialized replacements: {manifest['replacements']}")
          PY

      - name: Upload protected migration artifact
        uses: actions/upload-artifact@v4
        with:
          name: crownthrive-os-rebrand-migration
          path: /tmp/crownthrive-os-rebrand
          if-no-files-found: error
          retention-days: 7
