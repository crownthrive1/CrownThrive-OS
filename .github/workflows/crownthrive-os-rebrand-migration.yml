name: CrownThrive OS Repository Identity Migration

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crownthrive-os-rebrand-migration
  cancel-in-progress: false

jobs:
  stage-migration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Stage non-workflow repository identity migration
        shell: bash
        run: |
          set -euo pipefail
          target_branch='chore/crownthrive-os-rebrand'
          git fetch origin "$target_branch" main
          git checkout -B "$target_branch" "origin/$target_branch"
          git merge --ff-only origin/main

          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          legacy = 'CrownThrive-' + 'Support'
          pattern = re.compile(re.escape(legacy), re.IGNORECASE)
          replacement = 'CrownThrive-OS'
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode('utf-8').split('\0')
          changed = []

          for filename in tracked:
              if not filename or filename.startswith('.github/workflows/'):
                  continue
              path = Path(filename)
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              rewritten, count = pattern.subn(replacement, text)
              if count:
                  path.write_text(rewritten, encoding='utf-8')
                  changed.append((filename, count))

          print(f'Staged non-workflow files: {len(changed)}')
          print(f'Staged non-workflow replacements: {sum(count for _, count in changed)}')
          for filename, count in changed:
              print(f'  {filename}: {count}')
          PY

          if git diff --quiet; then
            echo 'No non-workflow migration delta remains.'
            exit 0
          fi

          git config user.name 'CrownThrive OS Automation'
          git config user.email 'contact@crownthrive.com'
          git add -u
          git commit -m 'chore(os): migrate canonical repository identity'
          git push origin HEAD:"$target_branch"
