name: PentaRelease — One-Shot Stuck Run Recovery

on:
  push:
    branches: [main]
    paths:
      - 'penta/recovery/pentarelease-run-33244352453.json'

permissions:
  actions: write
  contents: read

concurrency:
  group: pentarelease-one-shot-recovery-33244352453
  cancel-in-progress: false

jobs:
  cancel-known-broken-run:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel exact pre-fix PentaRelease run
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: '33244352453'
        shell: bash
        run: |
          set -euo pipefail

          gh_retry() {
            local attempt=1
            local max_attempts=8
            local delay=5
            local rc=0
            while true; do
              if "$@"; then
                return 0
              else
                rc=$?
              fi
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Recovery provider retry exhausted after $attempt attempts: $*" >&2
                return "$rc"
              fi
              echo "Recovery provider/API temporarily unavailable (attempt $attempt/$max_attempts); retrying in ${delay}s." >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              if [ "$delay" -lt 30 ]; then delay=$((delay + 5)); fi
            done
          }

          BEFORE=$(gh_retry gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}" --jq '(.status // "unknown") + ":" + (.conclusion // "pending")')
          echo "Target before recovery: $BEFORE"
          STATUS=${BEFORE%%:*}

          if [ "$STATUS" = "completed" ]; then
            echo "Target run already terminal; recovery is an idempotent no-op."
            exit 0
          fi

          gh_retry gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}/cancel" >/dev/null
          echo "Cancellation accepted for exact run ${TARGET_RUN_ID}."

          terminal=false
          FINAL=""
          for i in $(seq 1 36); do
            sleep 5
            FINAL=$(gh_retry gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}" --jq '(.status // "unknown") + ":" + (.conclusion // "pending")')
            echo "Target recovery readback: $FINAL"
            if [[ "$FINAL" == completed:* ]]; then
              terminal=true
              break
            fi
          done

          test "$terminal" = true
          {
            echo '## PentaRelease one-shot recovery proof'
            echo
            echo "- Exact target run: ${TARGET_RUN_ID}"
            echo "- Before: ${BEFORE}"
            echo "- Final: ${FINAL}"
            echo '- Scope: one known pre-fix run only'
            echo '- Superseding provider-retry fix: 620d4ae8ab8926b7bef443e77f5114f863f38d0e'
          } >> "$GITHUB_STEP_SUMMARY"
