name: Penta PR Autopilot

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  workflow_run:
    workflows: ["Governed Merge Gate"]
    types: [completed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      number:
        description: Optional pull request number; blank performs a bounded repository sweep
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  statuses: read
  actions: read

# One active mutation pass per PR. New exact-head work cancels stale passes.
concurrency:
  group: penta-pr-autopilot-${{ github.repository }}-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.inputs.number || 'sweep' }}
  cancel-in-progress: true

jobs:
  autopilot:
    name: PentaPR autopilot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PENTA_PM_GITHUB_TOKEN: ${{ secrets.PENTA_PM_GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.PENTA_PM_GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.PENTA_PM_GITHUB_TOKEN }}
    steps:
      - name: Checkout canonical Penta control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: crownthrive1/CrownThrive-OS
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Require bounded provider credential
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PENTA_PM_GITHUB_TOKEN}" ]]; then
            echo "::error::PENTA_PM_GITHUB_TOKEN is unavailable; refusing provider mutation."
            exit 78
          fi

      - name: Resolve bounded target
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          RUN_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          MANUAL_PR: ${{ github.event.inputs.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          number=""
          skip=false
          case "$EVENT_NAME" in
            pull_request_target)
              if [[ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]]; then
                echo "::warning::External fork remains fail-closed for provider mutation."
                skip=true
              else
                number="$EVENT_PR"
              fi
              ;;
            workflow_run)
              if [[ "$RUN_CONCLUSION" != "success" || -z "$RUN_PR" ]]; then
                skip=true
              else
                number="$RUN_PR"
              fi
              ;;
            workflow_dispatch)
              number="$MANUAL_PR"
              if [[ -n "$number" && ! "$number" =~ ^[0-9]+$ ]]; then
                echo "::error::number must be numeric"
                exit 2
              fi
              ;;
            schedule)
              number=""
              ;;
          esac
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: PentaGate and PentaHeal preflight
        if: steps.target.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          status=0
          python scripts/penta_gate.py --root . --output "$RUNNER_TEMP/pentagate-pr-autopilot.json" || status=$?
          python scripts/penta_heal.py --root . --gate-report "$RUNNER_TEMP/pentagate-pr-autopilot.json" --output "$RUNNER_TEMP/pentaheal-pr-autopilot.json" || true
          if [[ "$status" -ne 0 ]]; then
            cat "$RUNNER_TEMP/pentagate-pr-autopilot.json"
            exit "$status"
          fi

      - name: PentaTagger bounded preflight
        id: tagger
        if: steps.target.outputs.skip != 'true'
        shell: bash
        env:
          PENTA_NUMBER: ${{ steps.target.outputs.number }}
        run: |
          set -euo pipefail
          args=(verify --repo "$GITHUB_REPOSITORY" --kind pr --max-items 24 --request-budget 180 --no-comment)
          if [[ -n "${PENTA_NUMBER:-}" ]]; then
            args+=(--number "$PENTA_NUMBER")
          fi
          args+=(--receipt-path "$RUNNER_TEMP/penta-pr-autopilot-tagger.json")
          args+=(--summary-path "$RUNNER_TEMP/penta-pr-autopilot-tagger.md")
          set +e
          python scripts/penta_github_tagger.py "${args[@]}"
          status=$?
          set -e
          if [[ "$status" -eq 75 ]]; then
            echo "deferred=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deferred=false" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Execute canonical convergence
        if: steps.target.outputs.skip != 'true' && steps.tagger.outputs.deferred != 'true'
        shell: bash
        env:
          PENTA_NUMBER: ${{ steps.target.outputs.number }}
        run: |
          set -euo pipefail
          args=(--repo "$GITHUB_REPOSITORY")
          if [[ -n "${PENTA_NUMBER:-}" ]]; then
            args+=(--number "$PENTA_NUMBER")
          fi
          python scripts/penta_pr_autopilot.py "${args[@]}"

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Penta PR Autopilot v2'
            echo
            echo "- Target: **${{ steps.target.outputs.number || 'hourly bounded sweep' }}**"
            echo '- Schedule: **hourly**, replacing the former 10-minute repository sweep'
            echo '- Stale in-flight passes: **cancelled on newer same-PR work**'
            echo '- Time-only PR closure: **disabled**'
            echo '- Required check authority: **Governed Merge Gate remains unchanged**'
          } >> "$GITHUB_STEP_SUMMARY"
