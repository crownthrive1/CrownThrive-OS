name: Commercial Gap Private Fulfillment OIDC

on:
  push:
    branches:
      - ops/commercial-gap-private-fulfillment-20260822
    paths:
      - ".github/workflows/commercial-gap-private-fulfillment.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: commercial-gap-private-fulfillment-oidc
  cancel-in-progress: false

jobs:
  private-fulfillment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        platform: [launch, ready, procure]
    steps:
      - name: Request scoped GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=crownthrive-commercial-gap-private-fulfillment")"
          ID_TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"${RESPONSE}")"
          test -n "${ID_TOKEN}"
          echo "token=${ID_TOKEN}" >> "${GITHUB_OUTPUT}"
          echo "::add-mask::${ID_TOKEN}"

      - name: Execute exact-content private fulfillment canary
        env:
          ID_TOKEN: ${{ steps.oidc.outputs.token }}
          PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${ID_TOKEN}" \
            "https://tzajnzshmtzjenqulehq.supabase.co/functions/v1/commercial-gap-private-fulfillment-oidc?platform=${PLATFORM}")"
          python3 - "${PLATFORM}" <<'PY' <<<"${BODY}"
          import json, sys
          expected = sys.argv[1]
          data = json.load(sys.stdin)
          assert data.get("platform") == expected, data
          assert data.get("products") == 10, data
          assert data.get("passed") == 10, data
          assert data.get("failed") == 0, data
          assert data.get("customer_effect") is False, data
          assert data.get("money_movement") is False, data
          assert data.get("checkout_activation") is False, data
          assert data.get("entitlement_activation") is False, data
          assert data.get("rights_grant") is False, data
          assert data.get("public_url_created") is False, data
          for item in data.get("results", []):
              assert item.get("status") == "pass", item
              assert item.get("grant_consumed") is True, item
              assert item.get("private_fulfillment_technical_pass") is True, item
          print(json.dumps({
              "platform": expected,
              "products": data["products"],
              "passed": data["passed"],
              "customer_effect": data["customer_effect"],
              "money_movement": data["money_movement"],
              "checkout_activation": data["checkout_activation"],
              "entitlement_activation": data["entitlement_activation"],
              "rights_grant": data["rights_grant"],
              "public_url_created": data["public_url_created"],
          }, sort_keys=True))
          PY
