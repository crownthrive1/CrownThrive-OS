name: Secret Pattern Location Diagnostics

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-pattern-location-diagnostics-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Report credential-shaped pattern locations
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Validate diagnostic syntax
        run: python -m py_compile scripts/report_secret_pattern_locations.py

      - name: Report only labels and paths; never matched values
        run: python scripts/report_secret_pattern_locations.py
