name: Wave 7 AdLuxe Substantive Gate 002

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/qualify_wave7_adluxe_substantive_gate_002.py'
      - '.github/workflows/docs-wave7-adluxe-substantive-gate-002.yml'
      - 'developers/manifests/docs-rebuild-quad-lane-batch-002.v1.json'
      - 'developers/manifests/docs-wave7-adluxe-substantive-gate-001.v1.json'
      - 'developers/manifests/docs-wave7-adluxe-substantive-gate-002.v1.json'
      - 'platforms/adluxe-network-institutional-registry.mdx'
      - 'scripts/build_substantive_rebuild_wave*.py'
      - 'scripts/build_help_center_*crosswalk.py'
  push:
    branches: [main]
    paths:
      - 'scripts/qualify_wave7_adluxe_substantive_gate_002.py'
      - '.github/workflows/docs-wave7-adluxe-substantive-gate-002.yml'
      - 'developers/manifests/docs-rebuild-quad-lane-batch-002.v1.json'
      - 'developers/manifests/docs-wave7-adluxe-substantive-gate-001.v1.json'
      - 'developers/manifests/docs-wave7-adluxe-substantive-gate-002.v1.json'
      - 'platforms/adluxe-network-institutional-registry.mdx'
      - 'scripts/build_substantive_rebuild_wave*.py'
      - 'scripts/build_help_center_*crosswalk.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: docs-wave7-adluxe-substantive-002-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify-adluxe-cohort-002:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Execute dedicated substantive successor gate 002
        run: |
          set -o pipefail
          mkdir -p runtime/docs-rebuild
          python scripts/qualify_wave7_adluxe_substantive_gate_002.py \
            --output runtime/docs-rebuild/wave7-adluxe-substantive-gate-002.json \
            | tee runtime/docs-rebuild/wave7-adluxe-substantive-gate-002.log
      - name: Validate gate 002 invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('runtime/docs-rebuild/wave7-adluxe-substantive-gate-002.json').read_text())
          assert d['qualified_inventory_ids'] == ['HC-0020','HC-0021','HC-0022','HC-0023']
          assert d['records_machine_qualified'] == 4
          assert d['counting']['machine_qualified_before'] == 65
          assert d['counting']['machine_qualified_after'] == 69
          assert d['counting']['pending_p0_before'] == 384
          assert d['counting']['pending_p0_after'] == 380
          assert d['guardrails']['historical_body_recovery_claimed'] is False
          assert d['guardrails']['terminal_disposition_self_authorized'] is False
          assert d['guardrails']['provider_write_expansion_created'] is False
          for row in d['results']:
              assert row['machine_substantive_qualified'] is True
              assert row['candidate_flags'] == []
              assert row['missing_required_phrases'] == []
              assert row['terminal_disposition_accepted'] is False
          print('PASS_WAVE7_ADLUXE_SUBSTANTIVE_GATE_002_INVARIANTS')
          PY
      - name: Compare permanent gate 002 receipt when present
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          permanent = Path('developers/manifests/docs-wave7-adluxe-substantive-gate-002.v1.json')
          if not permanent.exists():
              print('NO_PERMANENT_GATE_002_RECEIPT_YET')
              raise SystemExit(0)
          d = json.loads(Path('runtime/docs-rebuild/wave7-adluxe-substantive-gate-002.json').read_text())
          p = json.loads(permanent.read_text())
          assert p['gate_id'] == d['gate_id']
          # Preserve the immutable v1 receipt digest while validating the
          # current PentaDocs v2 execution by identity and count semantics.
          assert p['gate_sha256'] == '6ad2e29bf4412e37d4b6ce873ab4a38425bfaa36156f81d94a80515f391e0679'
          assert p['qualified_inventory_ids'] == d['qualified_inventory_ids']
          assert p['official_counts_after_gate'] == {
              'machine_qualified_p0': d['counting']['machine_qualified_after'],
              'pending_p0': d['counting']['pending_p0_after'],
          }
          print('PASS_PERMANENT_WAVE7_ADLUXE_GATE_002_RECEIPT')
          PY
      - name: Upload substantive gate 002 evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-wave7-adluxe-substantive-002-${{ github.run_id }}
          path: runtime/docs-rebuild/
          if-no-files-found: error
          retention-days: 90
