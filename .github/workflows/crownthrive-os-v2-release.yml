name: PentaRelease — CrownThrive OS Release Publisher

on:
  push:
    branches: [main]
    paths:
      - '.github/release-requests/crownthrive-os-*.json'
  workflow_dispatch:
    inputs:
      request_file:
        description: Release request JSON path
        required: true
        default: .github/release-requests/crownthrive-os-v3.1.1.9.json

permissions:
  contents: write

concurrency:
  group: pentarelease-crownthrive-os
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 2

      - name: Resolve release request
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REQUEST='${{ inputs.request_file }}'
          else
            REQUEST=$(git diff --name-only HEAD^ HEAD | grep '^.github/release-requests/crownthrive-os-.*\.json$' | tail -1)
          fi
          test -n "$REQUEST"
          test -f "$REQUEST"
          python -m json.tool "$REQUEST" >/dev/null

          TAG=$(jq -r '.tag' "$REQUEST")
          TARGET=$(jq -r '.target' "$REQUEST")
          TITLE=$(jq -r '.title' "$REQUEST")
          PACKAGE=$(jq -r '.package' "$REQUEST")
          DRAFT=$(jq -r '.draft // false' "$REQUEST")
          PRERELEASE=$(jq -r '.prerelease // false' "$REQUEST")

          for V in TAG TARGET TITLE PACKAGE; do
            test -n "${!V}" && test "${!V}" != "null"
          done

          echo "REQUEST=$REQUEST" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "TITLE=$TITLE" >> "$GITHUB_ENV"
          echo "PACKAGE=$PACKAGE" >> "$GITHUB_ENV"
          echo "DRAFT=$DRAFT" >> "$GITHUB_ENV"
          echo "PRERELEASE=$PRERELEASE" >> "$GITHUB_ENV"

      - name: Resolve immutable release source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # A merged source branch can be auto-deleted. Existing releases must
          # use their tag's commit while TARGET remains the original metadata.
          # Enumerate every page: a failed read must never mean "not published".
          RELEASE_TAGS=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name')
          SOURCE_REF="$TARGET"
          if printf '%s\n' "$RELEASE_TAGS" | grep -Fx -- "$TAG" >/dev/null; then
            # The commits endpoint peels lightweight and annotated tags. Qualify
            # the tag to avoid ambiguity with a branch bearing the same name.
            ENCODED_REF=$(python -c 'import os, urllib.parse; print(urllib.parse.quote("refs/tags/" + os.environ["TAG"], safe=""))')
            SOURCE_REF=$(gh api "repos/$GITHUB_REPOSITORY/commits/$ENCODED_REF" --jq '.sha')
            if [[ ! "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]; then
              echo 'Existing release tag did not resolve to an immutable commit SHA.' >&2
              exit 1
            fi
          fi
          echo "SOURCE_REF=$SOURCE_REF" >> "$GITHUB_ENV"

      - name: Checkout requested release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0

      - name: Validate PentaRelease package contract
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PACKAGE/RELEASE_NOTES.md"
          test -f "$PACKAGE/MANIFEST.json"
          python -m json.tool "$PACKAGE/MANIFEST.json" >/dev/null
          test "$(jq -r '.tag' "$PACKAGE/MANIFEST.json")" = "$TAG"
          test "$(jq -r '.target_ref' "$PACKAGE/MANIFEST.json")" = "$TARGET"

          # Fail closed on common secret-bearing files in the release package.
          if find "$PACKAGE" -type f \( \
              -name '.env' -o -name '.env.*' -o -name '*.pem' -o \
              -name '*.p12' -o -name '*.pfx' -o -iname '*private_key*' -o \
              -iname '*credential*' -o -iname '*secret*' \
            \) | grep -q .; then
            echo 'Prohibited secret-like file detected in release package.' >&2
            exit 1
          fi

      - name: Build governed downloadable artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/pentarelease
          SAFE_TAG=$(printf '%s' "$TAG" | tr '/' '-')
          ZIP="dist/pentarelease/CrownThrive-OS-${SAFE_TAG}-package.zip"
          TGZ="dist/pentarelease/CrownThrive-OS-${SAFE_TAG}-package.tar.gz"

          (cd "$PACKAGE" && zip -qr "$GITHUB_WORKSPACE/$ZIP" .)
          tar -C "$PACKAGE" -czf "$TGZ" .
          cp "$PACKAGE/MANIFEST.json" "dist/pentarelease/MANIFEST.json"
          cp "$PACKAGE/RELEASE_NOTES.md" "dist/pentarelease/RELEASE_NOTES.md"
          (cd dist/pentarelease && sha256sum * > SHA256SUMS)

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "TGZ=$TGZ" >> "$GITHUB_ENV"

      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          FLAGS=()
          [ "$DRAFT" = "true" ] && FLAGS+=(--draft)
          [ "$PRERELEASE" = "true" ] && FLAGS+=(--prerelease)

          EXISTING=$(mktemp -d)
          trap 'rm -rf "$EXISTING"' EXIT
          if gh release view "$TAG" --json tagName,name,targetCommitish,isDraft,isPrerelease > "$EXISTING/release.json" 2>/dev/null; then
            # A delayed source merge must not overwrite later release enrichment.
            # Reconcile exact original inputs and preserve the provider body/assets.
            test "$(jq -r '.tagName' "$EXISTING/release.json")" = "$TAG"
            test "$(jq -r '.name' "$EXISTING/release.json")" = "$TITLE"
            test "$(jq -r '.targetCommitish' "$EXISTING/release.json")" = "$TARGET"
            test "$(jq -r '.isDraft' "$EXISTING/release.json")" = "$DRAFT"
            test "$(jq -r '.isPrerelease' "$EXISTING/release.json")" = "$PRERELEASE"
            gh release download "$TAG" --pattern MANIFEST.json --pattern RELEASE_NOTES.md --dir "$EXISTING"
            cmp "$PACKAGE/MANIFEST.json" "$EXISTING/MANIFEST.json"
            cmp "$PACKAGE/RELEASE_NOTES.md" "$EXISTING/RELEASE_NOTES.md"
            echo "Existing release inputs match; preserving published notes and assets."
          else
            # Creation fails safely if an existing release was unreadable or raced us.
            gh release create "$TAG" \
              --target "$TARGET" \
              --title "$TITLE" \
              --notes-file "$PACKAGE/RELEASE_NOTES.md" \
              "${FLAGS[@]}"
            gh release upload "$TAG" \
              "$ZIP" \
              "$TGZ" \
              dist/pentarelease/SHA256SUMS \
              dist/pentarelease/MANIFEST.json \
              dist/pentarelease/RELEASE_NOTES.md
          fi

      - name: Verify provider release and downloadable asset readback
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          READBACK=$(gh release view "$TAG" --json tagName,name,url,isDraft,isPrerelease,targetCommitish,assets)
          echo "$READBACK" | jq .

          test "$(echo "$READBACK" | jq -r '.tagName')" = "$TAG"
          test "$(echo "$READBACK" | jq -r '.name')" = "$TITLE"
          test "$(echo "$READBACK" | jq -r '.targetCommitish')" = "$TARGET"

          for EXPECTED in \
            "$(basename "$ZIP")" \
            "$(basename "$TGZ")" \
            SHA256SUMS MANIFEST.json RELEASE_NOTES.md; do
            echo "$READBACK" | jq -e --arg n "$EXPECTED" '.assets[] | select(.name == $n)' >/dev/null
          done

      - name: Write PentaRelease evidence summary
        shell: bash
        run: |
          set -euo pipefail
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## PentaRelease provider proof
          - Tag: $TAG
          - Target: $TARGET
          - Package: $PACKAGE
          - ZIP: $(basename "$ZIP")
          - TAR.GZ: $(basename "$TGZ")
          - Checksums: SHA256SUMS
          - Provider readback: verified
          EOF

