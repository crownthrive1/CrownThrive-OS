name: Collision Read Transport Governance

on:
  pull_request:
    paths:
      - "scripts/governed_collision_agent_v2.py"
      - "scripts/governed_collision_agent_v2_trusted.py"
      - "scripts/governed_collision_agent_v2_trusted_main.py"
      - "tests/test_collision_agent_v2.py"
      - "tests/test_collision_snapshot_retry_contract.py"
      - "tests/test_collision_trusted_observer.py"
      - "tests/test_collision_trusted_main_observer.py"
      - "tests/test_collision_trusted_gold_lane_scope.py"
      - ".github/workflows/collision-governance-trusted-v2.yml"
      - ".github/workflows/collision-read-transport-governance.yml"
  push:
    branches: [main]
    paths:
      - "scripts/governed_collision_agent_v2.py"
      - "scripts/governed_collision_agent_v2_trusted.py"
      - "scripts/governed_collision_agent_v2_trusted_main.py"
      - "tests/test_collision_agent_v2.py"
      - "tests/test_collision_snapshot_retry_contract.py"
      - "tests/test_collision_trusted_observer.py"
      - "tests/test_collision_trusted_main_observer.py"
      - "tests/test_collision_trusted_gold_lane_scope.py"
      - ".github/workflows/collision-governance-trusted-v2.yml"
      - ".github/workflows/collision-read-transport-governance.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate shared trusted GitHub read transport
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Compile collision observers
        run: |
          python -m py_compile \
            scripts/governed_collision_agent_v2.py \
            scripts/governed_collision_agent_v2_trusted.py \
            scripts/governed_collision_agent_v2_trusted_main.py
      - name: Run collision transport tests
        run: |
          python -m unittest \
            tests.test_collision_agent_v2 \
            tests.test_collision_snapshot_retry_contract \
            tests.test_collision_trusted_observer \
            tests.test_collision_trusted_main_observer \
            tests.test_collision_trusted_gold_lane_scope \
            -v
      - name: Check diff hygiene
        run: |
          git diff --check HEAD^ HEAD

  candidate-live-readonly:
    name: Candidate observer — live read-only evidence
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out exact candidate without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Execute candidate observer with read-only GitHub token
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          report="collision-candidate-readonly-report.json"
          set +e
          python3 scripts/governed_collision_agent_v2_trusted.py \
            --repository "${{ github.repository }}" \
            --branch "${{ github.event.pull_request.base.ref }}" \
            --candidate "${{ github.event.pull_request.number }}" \
            --event-base-sha "${{ github.event.pull_request.base.sha }}" \
            --output "$report" \
            --fail-on-severity 2
          status=$?
          set -e
          python3 - "$report" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as fh:
              report = json.load(fh)
          decision = report.get("decision") or {}
          transport = report.get("trusted_provider_transport") or {}
          scope = report.get("trusted_gold_lane_scope") or {}
          collisions = report.get("collisions") or []
          inspection_errors = report.get("inspection_errors") or {}
          print("candidate_live_readonly_disposition=" + str(decision.get("disposition")))
          print("candidate_live_readonly_reason_codes=" + ",".join(decision.get("reason_codes") or []))
          print("candidate_live_readonly_material_collisions=" + str(sum(1 for item in collisions if int(item.get("severity") or 0) >= 2)))
          print("candidate_live_readonly_inspection_errors=" + str(len(inspection_errors)))
          print("candidate_live_readonly_observed_open=" + str(scope.get("observed_open_pull_count")))
          print("candidate_live_readonly_eligible_open=" + str(scope.get("eligible_open_pull_count")))
          print("candidate_live_readonly_stale_open=" + str(scope.get("stale_base_open_pull_count")))
          print("candidate_live_readonly_authenticated_reads=" + str(transport.get("authenticated_requests")))
          print("candidate_live_readonly_public_fallback_reads=" + str(transport.get("public_fallback_requests")))
          print("candidate_live_readonly_authority_created=false")
          PY
          exit "$status"
