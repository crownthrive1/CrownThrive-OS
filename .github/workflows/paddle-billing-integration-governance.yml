name: Paddle Billing Integration Governance

on:
  pull_request:
    paths:
      - ".mcp.json"
      - ".agents/plugins/marketplace.json"
      - "api/mcp.js"
      - "integrations/paddle/**"
      - "skills/paddle-billing-governed-routing/**"
      - "scripts/validate_paddle_integration.py"
      - "tests/test_paddle_integration.py"
      - "tests/test_mcp_handler.mjs"
      - "apps/crownthrive-os-control-plane/api/mcp-paddle.js"
      - "apps/crownthrive-os-control-plane/lib/paddle-fabric.js"
      - "apps/crownthrive-os-control-plane/tests/paddle-mcp.test.mjs"
      - "apps/crownthrive-os-control-plane/vercel.json"
      - ".github/workflows/paddle-billing-integration-governance.yml"
  push:
    branches:
      - "codex/add-paddle-billing-mcp-skills"
      - "codex/wire-paddle-serving-mcp"
    paths:
      - ".mcp.json"
      - ".agents/plugins/marketplace.json"
      - "api/mcp.js"
      - "integrations/paddle/**"
      - "skills/paddle-billing-governed-routing/**"
      - "scripts/validate_paddle_integration.py"
      - "tests/test_paddle_integration.py"
      - "tests/test_mcp_handler.mjs"
      - "apps/crownthrive-os-control-plane/api/mcp-paddle.js"
      - "apps/crownthrive-os-control-plane/lib/paddle-fabric.js"
      - "apps/crownthrive-os-control-plane/tests/paddle-mcp.test.mjs"
      - "apps/crownthrive-os-control-plane/vercel.json"
      - ".github/workflows/paddle-billing-integration-governance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Paddle Billing source and serving contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Compile validator and tests
        run: |
          python -m py_compile scripts/validate_paddle_integration.py tests/test_paddle_integration.py
      - name: Validate Paddle source and serving contract
        run: |
          python scripts/validate_paddle_integration.py
      - name: Run Paddle repository integration tests
        run: |
          python -m unittest tests.test_paddle_integration
      - name: Run root MCP handler canaries
        run: |
          node --experimental-default-type=module --check api/mcp.js
          node --experimental-default-type=module --test tests/test_mcp_handler.mjs
      - name: Validate serving CrownThrive OS control plane
        working-directory: apps/crownthrive-os-control-plane
        run: |
          npm run validate
      - name: Check diff hygiene
        run: |
          git diff --check
