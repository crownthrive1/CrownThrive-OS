name: Wave 7 Substantive Gate 004

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/qualify_wave7_substantive_gate_004.py'
      - 'developers/manifests/docs-wave7-substantive-gate-004.v1.json'
      - 'developers/manifests/docs-rebuild-quad-lane-batch-004.v1.json'
      - '.github/workflows/docs-wave7-substantive-gate-004.yml'
      - 'scripts/build_substantive_rebuild_wave*.py'
      - 'scripts/build_help_center_*crosswalk.py'
  push:
    branches: [main]
    paths:
      - 'scripts/qualify_wave7_substantive_gate_004.py'
      - 'developers/manifests/docs-wave7-substantive-gate-004.v1.json'
      - 'developers/manifests/docs-rebuild-quad-lane-batch-004.v1.json'
      - '.github/workflows/docs-wave7-substantive-gate-004.yml'
      - 'scripts/build_substantive_rebuild_wave*.py'
      - 'scripts/build_help_center_*crosswalk.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: docs-wave7-substantive-gate-004-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify-cohort-004:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Execute substantive gate 004
        run: |
          set -o pipefail
          mkdir -p runtime/docs-rebuild
          python scripts/qualify_wave7_substantive_gate_004.py \
            --output runtime/docs-rebuild/wave7-substantive-gate-004.json \
            | tee runtime/docs-rebuild/wave7-substantive-gate-004.log
      - name: Validate gate 004 invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('runtime/docs-rebuild/wave7-substantive-gate-004.json').read_text())
          assert d['records_evaluated']==4
          assert d['counting']['machine_qualified_before']==73
          assert d['counting']['pending_p0_before']==376
          assert 0 <= d['records_machine_qualified'] <= 4
          assert d['counting']['machine_qualified_after']==73+d['records_machine_qualified']
          assert d['counting']['pending_p0_after']==376-d['records_machine_qualified']
          assert set(d['qualified_inventory_ids']).isdisjoint(d['held_inventory_ids'])
          assert sorted(d['qualified_inventory_ids']+d['held_inventory_ids'])==sorted(['HC-0114','HC-0115','HC-0117','HC-0256'])
          assert d['guardrails']['held_records_count_as_qualified'] is False
          assert d['guardrails']['historical_body_recovery_claimed'] is False
          assert d['guardrails']['terminal_disposition_self_authorized'] is False
          assert d['guardrails']['provider_write_expansion_created'] is False
          for row in d['results']:
              if row['machine_substantive_qualified']:
                  assert row['candidate_flags']==[]
                  assert row['accepted_successor'] is not None
                  assert row['accepted_successor']['body_characters'] >= 12000
                  assert row['accepted_successor']['internal_link_count'] >= 4
                  assert row['accepted_successor']['lexical_pass'] is True
              else:
                  assert row['hold_reasons']
          print('PASS_WAVE7_SUBSTANTIVE_GATE_004_INVARIANTS')
          PY
      - name: Compare permanent gate 004 receipt when present
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          permanent=Path('developers/manifests/docs-wave7-substantive-gate-004.v1.json')
          if not permanent.exists():
              print('NO_PERMANENT_GATE_004_RECEIPT_YET')
              raise SystemExit(0)
          d=json.loads(Path('runtime/docs-rebuild/wave7-substantive-gate-004.json').read_text())
          p=json.loads(permanent.read_text())
          assert p['gate_id']==d['gate_id']
          # Preserve the immutable v1 receipt digest while validating the
          # current PentaDocs v2 execution by identity and count semantics.
          assert p['gate_sha256']=='c9bcad7aa82e75c5dd9b7730f1488d5143f46c91f103eef5c415b5910f039310'
          assert p['qualified_inventory_ids']==d['qualified_inventory_ids']
          assert p['held_inventory_ids']==d['held_inventory_ids']
          assert p['official_counts_after_gate']=={
              'machine_qualified_p0':d['counting']['machine_qualified_after'],
              'pending_p0':d['counting']['pending_p0_after'],
          }
          print('PASS_PERMANENT_WAVE7_GATE_004_RECEIPT')
          PY
      - name: Upload gate 004 evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-wave7-substantive-gate-004-${{ github.run_id }}
          path: runtime/docs-rebuild/
          if-no-files-found: error
          retention-days: 90
