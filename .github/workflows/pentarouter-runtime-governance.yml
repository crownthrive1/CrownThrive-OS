name: PentaRouter Runtime Governance

on:
  pull_request:
    paths:
      - "runtime/pentarouter/**"
      - "scripts/pentarouter_runtime.py"
      - "contracts/penta/pentarouter-*.json"
      - "commercialization/routing/mesh-routing.v1.json"
      - "commercialization/pentagreen/**"
      - "skills/pentarouter-*/**"
      - "skills/pentagreen-stable-product-handoff/**"
      - "tests/test_pentarouter_runtime.py"
      - ".github/workflows/pentarouter-runtime-governance.yml"
  push:
    branches: [main]
    paths:
      - "runtime/pentarouter/**"
      - "scripts/pentarouter_runtime.py"
      - "contracts/penta/pentarouter-*.json"
      - "commercialization/routing/mesh-routing.v1.json"
      - "commercialization/pentagreen/**"
      - "tests/test_pentarouter_runtime.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate PentaRouter runtime and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Compile runtime
        run: |
          python -m py_compile scripts/pentarouter_runtime.py
      - name: Validate topology
        run: |
          python scripts/pentarouter_runtime.py validate --manifest runtime/pentarouter/pentarouter-system.v1.json
      - name: Run embedded failover tests
        run: |
          python scripts/pentarouter_runtime.py self-test --manifest runtime/pentarouter/pentarouter-system.v1.json
      - name: Run unit tests
        run: |
          python -m unittest tests.test_pentarouter_runtime -v
      - name: Check diff hygiene
        run: |
          git diff --check HEAD^ HEAD
