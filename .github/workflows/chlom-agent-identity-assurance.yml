name: CHLOM Agent and Package Identity Assurance

on:
  pull_request:
    paths:
      - "developers/manifests/chlom-agent-identity-assurance.v1.json"
      - "developers/manifests/framework-child-fleet.v1.json"
      - "developers/templates/framework-child-repository/.crownthrive/federation.json.tmpl"
      - "developers/templates/framework-child-repository/scripts/federation_client.py.tmpl"
      - "scripts/chlom_identity_assurance.py"
      - "automation/chlom-agent-identity-assurance.mdx"
      - ".github/workflows/chlom-agent-identity-assurance.yml"
      - ".github/workflows/docs-governance.yml"
  push:
    branches:
      - main
      - "admin-mcp/**"
    paths:
      - "developers/manifests/chlom-agent-identity-assurance.v1.json"
      - "developers/manifests/framework-child-fleet.v1.json"
      - "developers/templates/framework-child-repository/.crownthrive/federation.json.tmpl"
      - "developers/templates/framework-child-repository/scripts/federation_client.py.tmpl"
      - "scripts/chlom_identity_assurance.py"
      - "automation/chlom-agent-identity-assurance.mdx"
      - ".github/workflows/chlom-agent-identity-assurance.yml"
      - ".github/workflows/docs-governance.yml"
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chlom-agent-package-identity-assurance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate CHLOM DID and package identity assurance
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Compile identity validator
        run: python -m py_compile scripts/chlom_identity_assurance.py

      - name: Validate public/private identity and package contract
        run: python scripts/chlom_identity_assurance.py

      - name: Check whitespace and conflict markers
        run: |
          git diff --check
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!THIRD_PARTY_NOTICES.md'; then
            echo "Unresolved merge-conflict markers detected."
            exit 1
          fi

  parent-heartbeat:
    name: Emit trusted parent identity heartbeat
    needs: validate
    if: ${{ needs.validate.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Emit authoritative parent heartbeat through GitHub OIDC
        run: python scripts/chlom_identity_assurance.py --heartbeat-parent --agent-id ct.agent.framework-factory --require-fresh
