name: CrownThrive OS Binding + Rebrand Enforcement

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  enforce-main:
    if: github.event_name != 'pull_request'
    permissions: {contents: write}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - name: Verify canonical identity and auto-heal retired identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,re,subprocess
          from pathlib import Path
          expected='crownthrive1/CrownThrive-OS'
          identity=json.loads(Path('.crownthrive/canonical-os.json').read_text(encoding='utf-8'))
          archive_path=Path('config/retired_identity_archive.json')
          if not archive_path.exists(): raise SystemExit('Missing governed retired-identity archive boundary')
          archive=json.loads(archive_path.read_text(encoding='utf-8'))
          if archive.get('schema')!='ct.archive.retired-identity-boundary.20260827.v1': raise SystemExit('Retired-identity archive schema mismatch')
          if os.environ['GITHUB_REPOSITORY'] != expected: raise SystemExit('Canonical workflow executed outside CrownThrive-OS')
          if identity.get('canonical_control_repository') != expected: raise SystemExit('Canonical repository binding mismatch')
          if identity.get('canonical_url') != 'https://github.com/crownthrive1/CrownThrive-OS': raise SystemExit('Canonical URL binding mismatch')
          if identity.get('canonical_default_branch') != 'main': raise SystemExit('Canonical branch binding mismatch')
          legacy='CrownThrive-'+'Support'; pattern=re.compile(re.escape(legacy),re.IGNORECASE)
          files=[v for v in subprocess.check_output(['git','ls-files','-z']).decode().split('\0') if v]
          file_set=set(files)
          allowed_migrations=set(map(str,archive.get('allowed_paths') or []))
          allowed_evidence=set(map(str,archive.get('allowed_evidence_paths') or []))
          allowed=allowed_migrations | allowed_evidence
          if not allowed_migrations: raise SystemExit('Retired-identity historical migration allowlist may not be empty')
          def verify_allowed_path(filename,prefix,label):
              path=Path(filename)
              if not filename.startswith(prefix) or filename not in file_set or not path.is_file():
                  raise SystemExit(f'Invalid retired-identity {label} path: {filename}')
              try: historical=path.read_text(encoding='utf-8')
              except (UnicodeDecodeError,OSError) as exc: raise SystemExit(f'Unreadable retired-identity {label} path: {filename}: {exc}')
              if not pattern.search(historical): raise SystemExit(f'Stale retired-identity {label} path: {filename}')
          for filename in sorted(allowed_migrations):
              verify_allowed_path(filename,'supabase/migrations/','migration')
          for filename in sorted(allowed_evidence):
              verify_allowed_path(filename,'supabase/migration_lineage/replay_diagnostics/','replay-evidence')
          changed=[]; count_total=0
          for filename in files:
              if filename=='.github/workflows/crownthrive-os-binding-enforcement.yml' or filename in allowed: continue
              p=Path(filename)
              try: before=p.read_text(encoding='utf-8')
              except (UnicodeDecodeError,OSError): continue
              after,count=pattern.subn('CrownThrive-OS',before)
              if count:
                  p.write_text(after,encoding='utf-8'); changed.append(filename); count_total+=count
          remaining=[]
          for filename in files:
              if filename=='.github/workflows/crownthrive-os-binding-enforcement.yml' or filename in allowed: continue
              try: text=Path(filename).read_text(encoding='utf-8')
              except (UnicodeDecodeError,OSError): continue
              if pattern.search(text): remaining.append(filename)
          if remaining: raise SystemExit('Retired OS identity remains on live surfaces: '+', '.join(remaining))
          print(
              f'Canonical CrownThrive-OS identity verified; auto-healed {count_total} live reference(s) across {len(changed)} file(s); '
              f'preserved {len(allowed_migrations)} historical migrations and {len(allowed_evidence)} sanitized replay-evidence path(s).'
          )
          PY
          if ! git diff --quiet; then
            git config user.name 'CrownThrive PentaUpdate'
            git config user.email 'contact@crownthrive.com'
            git add -A
            git commit -m 'rebrand(os): auto-heal canonical CrownThrive-OS references'
            git push origin HEAD:main
          fi
  validate-pr:
    if: github.event_name == 'pull_request'
    permissions: {contents: read}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject retired OS identity outside governed history
        shell: python
        run: |
          import json,os,re,subprocess
          from pathlib import Path
          expected='crownthrive1/CrownThrive-OS'; identity=json.loads(Path('.crownthrive/canonical-os.json').read_text(encoding='utf-8'))
          archive_path=Path('config/retired_identity_archive.json')
          if not archive_path.exists(): raise SystemExit('Missing governed retired-identity archive boundary')
          archive=json.loads(archive_path.read_text(encoding='utf-8'))
          assert archive['schema']=='ct.archive.retired-identity-boundary.20260827.v1'
          assert os.environ['GITHUB_REPOSITORY']==expected; assert identity['canonical_control_repository']==expected; assert identity['canonical_url']=='https://github.com/crownthrive1/CrownThrive-OS'
          pattern=re.compile(re.escape('CrownThrive-'+'Support'),re.IGNORECASE); hits=[]
          files=[v for v in subprocess.check_output(['git','ls-files','-z']).decode().split('\0') if v]
          file_set=set(files)
          allowed_migrations=set(map(str,archive.get('allowed_paths') or []))
          allowed_evidence=set(map(str,archive.get('allowed_evidence_paths') or []))
          allowed=allowed_migrations | allowed_evidence
          if not allowed_migrations: raise SystemExit('Retired-identity historical migration allowlist may not be empty')
          def verify_allowed_path(filename,prefix,label):
              path=Path(filename)
              if not filename.startswith(prefix) or filename not in file_set or not path.is_file(): raise SystemExit(f'Invalid retired-identity {label} path: {filename}')
              try: historical=path.read_text(encoding='utf-8')
              except (UnicodeDecodeError,OSError) as exc: raise SystemExit(f'Unreadable retired-identity {label} path: {filename}: {exc}')
              if not pattern.search(historical): raise SystemExit(f'Stale retired-identity {label} path: {filename}')
          for filename in sorted(allowed_migrations):
              verify_allowed_path(filename,'supabase/migrations/','migration')
          for filename in sorted(allowed_evidence):
              verify_allowed_path(filename,'supabase/migration_lineage/replay_diagnostics/','replay-evidence')
          for filename in files:
              if filename=='.github/workflows/crownthrive-os-binding-enforcement.yml' or filename in allowed: continue
              try: text=Path(filename).read_text(encoding='utf-8')
              except (UnicodeDecodeError,OSError): continue
              if pattern.search(text): hits.append(filename)
          if hits: raise SystemExit('Retired OS identity is forbidden on live surfaces: '+', '.join(hits))
          print(
              f'Canonical CrownThrive-OS identity verified; {len(allowed_migrations)} historical migrations and '
              f'{len(allowed_evidence)} sanitized replay-evidence path(s) remain archive-bound.'
          )
