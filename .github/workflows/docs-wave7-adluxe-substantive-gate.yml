name: Wave 7 AdLuxe Substantive Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/qualify_wave7_adluxe_substantive_gate.py'
      - '.github/workflows/docs-wave7-adluxe-substantive-gate.yml'
      - 'developers/manifests/docs-rebuild-quad-lane-batch-001.v1.json'
      - 'developers/manifests/docs-wave7-adluxe-substantive-gate-001.v1.json'
      - 'platforms/adluxe-network-institutional-registry.mdx'
      - 'scripts/build_substantive_rebuild_wave*.py'
      - 'scripts/build_help_center_*crosswalk.py'
  push:
    branches: [main]
    paths:
      - 'scripts/qualify_wave7_adluxe_substantive_gate.py'
      - '.github/workflows/docs-wave7-adluxe-substantive-gate.yml'
      - 'developers/manifests/docs-rebuild-quad-lane-batch-001.v1.json'
      - 'developers/manifests/docs-wave7-adluxe-substantive-gate-001.v1.json'
      - 'platforms/adluxe-network-institutional-registry.mdx'
      - 'scripts/build_substantive_rebuild_wave*.py'
      - 'scripts/build_help_center_*crosswalk.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: docs-wave7-adluxe-substantive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify-adluxe-cohort:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Execute dedicated substantive successor gate
        run: |
          set -o pipefail
          mkdir -p runtime/docs-rebuild
          python scripts/qualify_wave7_adluxe_substantive_gate.py \
            --output runtime/docs-rebuild/wave7-adluxe-substantive-gate-001.json \
            | tee runtime/docs-rebuild/wave7-adluxe-substantive-gate-001.log
      - name: Validate gate invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('runtime/docs-rebuild/wave7-adluxe-substantive-gate-001.json').read_text())
          assert d['qualified_inventory_ids'] == ['HC-0004','HC-0010','HC-0011','HC-0014']
          assert d['records_machine_qualified'] == 4
          assert d['counting']['machine_qualified_before'] == 61
          assert d['counting']['machine_qualified_after'] == 65
          assert d['counting']['pending_p0_before'] == 388
          assert d['counting']['pending_p0_after'] == 384
          assert d['guardrails']['historical_body_recovery_claimed'] is False
          assert d['guardrails']['terminal_disposition_self_authorized'] is False
          for row in d['results']:
              assert row['machine_substantive_qualified'] is True
              assert row['candidate_flags'] == []
              assert row['missing_required_phrases'] == []
              assert row['terminal_disposition_accepted'] is False
          print('PASS_WAVE7_ADLUXE_SUBSTANTIVE_GATE_INVARIANTS')
          PY
      - name: Compare permanent gate receipt when present
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          permanent = Path('developers/manifests/docs-wave7-adluxe-substantive-gate-001.v1.json')
          if not permanent.exists():
              print('NO_PERMANENT_RECEIPT_YET')
              raise SystemExit(0)
          d = json.loads(Path('runtime/docs-rebuild/wave7-adluxe-substantive-gate-001.json').read_text())
          p = json.loads(permanent.read_text())
          assert p['gate_id'] == d['gate_id']
          # Preserve the immutable v1 receipt digest while validating the
          # current PentaDocs v2 execution by identity and count semantics.
          assert p['gate_sha256'] == 'a31c3eec30d2d1e45b3ebfd7890b0f4584b7465e8b44797061d30c31dedfe1a3'
          assert p['qualified_inventory_ids'] == d['qualified_inventory_ids']
          assert p['official_counts_after_gate'] == {
              'machine_qualified_p0': d['counting']['machine_qualified_after'],
              'pending_p0': d['counting']['pending_p0_after'],
          }
          print('PASS_PERMANENT_WAVE7_ADLUXE_GATE_RECEIPT')
          PY
      - name: Upload substantive gate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-wave7-adluxe-substantive-${{ github.run_id }}
          path: runtime/docs-rebuild/
          if-no-files-found: error
          retention-days: 90
