project_id = "tzajnzshmtzjenqulehq"

# Vercel workload identity is verified inside this function against exact
# issuer, audience, owner, project, and production-environment claims. The
# Supabase gateway JWT verifier cannot validate Vercel OIDC tokens, so this
# endpoint must reach the custom verifier instead of being rejected upstream.
[functions.pentafabric-ingest]
verify_jwt = false

# CHLOM authenticated control-plane gateway is fail-closed at the provider
# boundary and must never be deployed without Supabase JWT verification.
[functions.chlom-control-plane-v1]
verify_jwt = true
